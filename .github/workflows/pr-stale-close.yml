name: PR Stale Draft Projection

on:
  schedule:
    - cron: '15 08 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  stale-draft-projection:
    name: stale-draft-projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTONOMY_AUTO_CLOSE_ENABLED: ${{ vars.AUTONOMY_AUTO_CLOSE_ENABLED || 'false' }}
      STALE_DAYS: ${{ vars.AUTONOMY_AUTO_CLOSE_STALE_DAYS || '7' }}
      CLOSE_AFTER_STALE_DAYS: ${{ vars.AUTONOMY_AUTO_CLOSE_CLOSE_DAYS || '3' }}
    steps:
      - name: Project stale draft PRs
        uses: actions/github-script@v7
        with:
          script: |
            const enabled = String(process.env.AUTONOMY_AUTO_CLOSE_ENABLED || "").toLowerCase() === "true";
            if (!enabled) {
              core.notice("Skipping stale draft projection: AUTONOMY_AUTO_CLOSE_ENABLED is not true.");
              return;
            }

            const staleDays = Number.parseInt(process.env.STALE_DAYS || "7", 10);
            const closeAfter = Number.parseInt(process.env.CLOSE_AFTER_STALE_DAYS || "3", 10);
            if (!Number.isFinite(staleDays) || !Number.isFinite(closeAfter)) {
              core.setFailed("Invalid stale/close day configuration.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const staleLabel = "autonomy:stale-draft";
            const reviewLabel = "autonomy:stale-draft-review";
            const advisoryLabels = new Set(["risk:high"]);

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description
                });
                core.info(`Created label: ${name}`);
              }
            }

            await ensureLabel(staleLabel, "C5DEF5", "Draft PR marked stale by automation");
            await ensureLabel(reviewLabel, "D93F0B", "Draft PR needs human review before any abandonment or cleanup action");

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            let markedStale = 0;
            let projectedReview = 0;
            let cleaned = 0;
            const now = Date.now();
            const closeThreshold = staleDays + closeAfter;

            for (const pr of pulls) {
              if (!pr.draft) {
                continue;
              }

              const labels = new Set((pr.labels || []).map((label) => label.name));
              const advisoryLabelList = [...advisoryLabels].filter((name) => labels.has(name));

              const idleDays = (now - Date.parse(pr.updated_at)) / (1000 * 60 * 60 * 24);
              const isStale = idleDays >= staleDays;
              const shouldClose = idleDays >= closeThreshold;
              const hasStaleLabel = labels.has(staleLabel);
              const hasReviewLabel = labels.has(reviewLabel);

              if (shouldClose) {
                if (!hasReviewLabel) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pr.number,
                    labels: [reviewLabel]
                  });
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pr.number,
                    body: [
                      `Draft PR has been idle for ${Math.floor(idleDays)} days and is projected as an abandonment review candidate.`,
                      "This GitHub workflow does not close the PR. Closure or cleanup requires a canonical abandonment or cleanup receipt outside this projection.",
                      advisoryLabelList.length
                        ? `Advisory labels present: ${advisoryLabelList.join(", ")}.`
                        : "No advisory risk labels were present."
                    ].join("\n\n")
                  });
                  projectedReview += 1;
                }
                continue;
              }

              if (isStale && !hasStaleLabel) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: [staleLabel]
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: [
                    `Marking draft PR as stale after ${Math.floor(idleDays)} days without updates.`,
                    `After ${closeAfter} additional idle day(s), this workflow may project the PR as requiring abandonment review. It will not close the PR.`
                  ].join("\n\n")
                });
                markedStale += 1;
                continue;
              }

              if (!isStale && hasStaleLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: staleLabel
                  });
                  cleaned += 1;
                } catch (error) {
                  core.warning(`Could not remove stale label from #${pr.number}: ${error.message}`);
                }
              }

              if (!isStale && hasReviewLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: reviewLabel
                  });
                  cleaned += 1;
                } catch (error) {
                  core.warning(`Could not remove stale review label from #${pr.number}: ${error.message}`);
                }
              }
            }

            core.summary
              .addHeading("Stale Draft PR Projection")
              .addRaw(`- stale threshold: ${staleDays} day(s)\n`)
              .addRaw(`- abandonment-review threshold after stale: ${closeAfter} day(s)\n`)
              .addRaw(`- marked stale: ${markedStale}\n`)
              .addRaw(`- abandonment review projected: ${projectedReview}\n`)
              .addRaw(`- stale/review labels removed: ${cleaned}\n`)
              .write();
