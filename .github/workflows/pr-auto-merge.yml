name: PR Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional single PR number to reconcile.
        required: false
        type: string
      authorization_path:
        description: Optional repo-local canonical Change authorization JSON for the protected merge boundary.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-auto-merge-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  discover-prs:
    name: discover-prs
    runs-on: ubuntu-latest
    outputs:
      pr_numbers: ${{ steps.discover.outputs.pr_numbers }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: discover
        name: Discover PRs to reconcile
        env:
          GH_TOKEN: ${{ secrets.AUTONOMY_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AUTONOMY_PAT || secrets.GITHUB_TOKEN }}
          DISPATCH_PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
        run: |
          set -euo pipefail

          pr_numbers='[]'

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            if [[ "${{ github.event.pull_request.state }}" != "open" ]]; then
              echo "Skipping fast path discovery: PR is not open."
              echo "pr_numbers=[]" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if [[ "${{ github.event.pull_request.base.ref }}" != "main" ]]; then
              echo "Skipping fast path discovery: PR base is not main."
              echo "pr_numbers=[]" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if [[ "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
              echo "Skipping fast path discovery: fork PRs are ineligible."
              echo "pr_numbers=[]" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            pr_numbers="[${{ github.event.pull_request.number }}]"
            echo "Discovered fast-path PR #${{ github.event.pull_request.number }}."
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_PR_NUMBER}" ]]; then
            if [[ ! "${DISPATCH_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "Invalid workflow_dispatch input: pr_number must be numeric."
              exit 1
            fi
            pr_numbers="[${DISPATCH_PR_NUMBER}]"
            echo "Discovered manual PR selection #${DISPATCH_PR_NUMBER}."
          else
            pr_numbers="$({
              gh pr list \
                --repo "${GH_REPO}" \
                --state open \
                --base main \
                --limit 200 \
                --json number
            } | jq -c '[.[].number]')"
            echo "Discovered $(jq -r 'length' <<<"${pr_numbers}") open PR(s) on main for reconciliation scan."
          fi

          echo "pr_numbers=${pr_numbers}" >> "${GITHUB_OUTPUT}"

  auto-merge:
    name: auto-merge-pr-${{ matrix.pr_number }}
    needs:
      - discover-prs
    if: ${{ needs.discover-prs.outputs.pr_numbers != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pr_number: ${{ fromJson(needs.discover-prs.outputs.pr_numbers) }}
    concurrency:
      group: pr-auto-merge-${{ matrix.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTONOMY_AUTO_MERGE_ENABLED: ${{ vars.AUTONOMY_AUTO_MERGE_ENABLED || 'false' }}
      CHANGE_MERGE_AUTHORIZATION_PATH: ${{ github.event.inputs.authorization_path || vars.AUTONOMY_MERGE_AUTHORIZATION_PATH || '' }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ matrix.pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable auto-merge for eligible PRs (race-safe)
        env:
          GH_TOKEN: ${{ secrets.AUTONOMY_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AUTONOMY_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          enabled="$(echo "${AUTONOMY_AUTO_MERGE_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$enabled" != "true" ]]; then
            mkdir -p .octon/generated/.tmp/pr-auto-merge
            jq -n \
              --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg pr_number "${PR_NUMBER}" \
              '{
                schema_version: "github-pr-auto-merge-projection-v1",
                generated_at: $generated_at,
                projection_kind: "branch-pr-merge-readiness",
                pr_number: $pr_number,
                status: "staged",
                reason_code: "PR_AUTONOMY_DISABLED",
                authorization_boundary: "projection-only; does not grant canonical Change authorization"
              }' > ".octon/generated/.tmp/pr-auto-merge/projection-${PR_NUMBER}.json"
            echo "Auto-merge kill switch is OFF (AUTONOMY_AUTO_MERGE_ENABLED=${AUTONOMY_AUTO_MERGE_ENABLED})."
            exit 0
          fi

          pr_view() {
            gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}"
          }

          pr_files() {
            gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100"
          }

          collect_paths_json() {
            local files_json=".octon/generated/.tmp/pr-auto-merge/files-${PR_NUMBER}.json"
            mkdir -p .octon/generated/.tmp/pr-auto-merge
            if [[ ! -f "${files_json}" ]]; then
              pr_files | jq -sc '[.[][] | .filename]' > "${files_json}"
            fi
            cat "${files_json}"
          }

          evaluate_policy() {
            local payload="$1"
            local tmp_dir=".octon/generated/.tmp/pr-auto-merge"
            local pr_json="${tmp_dir}/pr-${PR_NUMBER}.json"
            local files_json="${tmp_dir}/files-${PR_NUMBER}.json"
            local result_json="${tmp_dir}/policy-${PR_NUMBER}.json"

            mkdir -p "${tmp_dir}"
            printf '%s\n' "${payload}" > "${pr_json}"
            collect_paths_json >/dev/null

            chmod +x .octon/framework/assurance/governance/_ops/scripts/evaluate-pr-autonomy-policy.sh
            .octon/framework/assurance/governance/_ops/scripts/evaluate-pr-autonomy-policy.sh \
              --pr-json "${pr_json}" \
              --changed-files-json "${files_json}" \
              --standards-json ".octon/framework/execution-roles/practices/standards/commit-pr-standards.json" \
              --pr-template ".github/PULL_REQUEST_TEMPLATE.md" \
              --output-json "${result_json}" >/dev/null

            printf '%s\n' "${result_json}"
          }

          materialize_merge_projection() {
            local status="$1"
            local reason_code="$2"
            local head_ref="$3"
            local projection_json=".octon/generated/.tmp/pr-auto-merge/projection-${PR_NUMBER}.json"
            mkdir -p .octon/generated/.tmp/pr-auto-merge

            jq -n \
              --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg pr_number "${PR_NUMBER}" \
              --arg status "${status}" \
              --arg reason_code "${reason_code}" \
              --arg head_ref "${head_ref}" \
              '{
                schema_version: "github-pr-auto-merge-projection-v1",
                generated_at: $generated_at,
                projection_kind: "branch-pr-merge-readiness",
                pr_number: $pr_number,
                status: $status,
                reason_code: $reason_code,
                authorization_boundary: "projection-only; merge requires a repo-local canonical Change authorization JSON",
                evidence_refs: [
                  "github://pull/" + $pr_number + "#check:Validate autonomy policy",
                  "github://pull/" + $pr_number + "#check:AI Review Gate / decision"
                ],
                projection_ref: ("github://pull/" + $pr_number + "#head:" + $head_ref)
              }' > "${projection_json}"
          }

          assert_automerge_eligible() {
            local payload="$1"
            local suffix="${2:-}"
            local result_json status reason_code head_ref

            result_json="$(evaluate_policy "${payload}")"
            status="$(jq -r '.status' "${result_json}")"
            reason_code="$(jq -r '.reason_code' "${result_json}")"
            head_ref="$(jq -r '.head_ref' "${result_json}")"
            materialize_merge_projection "${status}" "${reason_code}" "${head_ref}"

            if [[ "$(jq -r '.state' <<<"${payload}")" != "open" ]]; then
              echo "Skipping: PR is no longer open${suffix}."
              exit 0
            fi

            if [[ "$(jq -r '.draft' <<<"${payload}")" == "true" ]]; then
              echo "Skipping: PR is draft${suffix}. Autonomous draft completion must mark the PR ready only after the branch-pr ready preflight passes."
              exit 0
            fi

            if [[ "$(jq -r '.head.repo.fork' <<<"${payload}")" == "true" ]]; then
              echo "Skipping: fork PRs are not eligible${suffix}."
              exit 0
            fi

            if [[ "$(jq -r '.base.ref' <<<"${payload}")" != "main" ]]; then
              echo "Skipping: PR base is not main${suffix}."
              exit 0
            fi

            head_ref="$(jq -r '.head.ref' <<<"${payload}")"
            if [[ "${head_ref}" == exp/* ]]; then
              echo "Skipping: exp/* branches are non-mergeable${suffix}."
              exit 0
            fi

            if [[ "${status}" != "granted" ]]; then
              jq -r '.notices[]?' "${result_json}" | while IFS= read -r notice; do
                [[ -n "${notice}" ]] && echo "Notice: ${notice}"
              done
              echo "Skipping: branch-pr merge-readiness projection is ${status}${suffix} (${reason_code})."
              exit 0
            fi
          }

          assert_canonical_merge_authorization() {
            if [[ -z "${CHANGE_MERGE_AUTHORIZATION_PATH}" ]]; then
              echo "Skipping: no repo-local canonical Change authorization JSON supplied for the protected branch-pr merge boundary."
              exit 0
            fi

            if [[ ! -f "${CHANGE_MERGE_AUTHORIZATION_PATH}" ]]; then
              echo "Configured Change authorization JSON does not exist: ${CHANGE_MERGE_AUTHORIZATION_PATH}."
              exit 1
            fi

            if ! jq -e 'type == "object"' "${CHANGE_MERGE_AUTHORIZATION_PATH}" >/dev/null; then
              echo "Configured Change authorization JSON is not valid JSON: ${CHANGE_MERGE_AUTHORIZATION_PATH}."
              exit 1
            fi
          }

          checkout_pr_head() {
            local payload="$1"
            local head_ref head_sha

            head_ref="$(jq -r '.head.ref // ""' <<<"${payload}")"
            head_sha="$(jq -r '.head.sha // ""' <<<"${payload}")"

            if [[ -z "${head_ref}" || "${head_ref}" == "null" || -z "${head_sha}" || "${head_sha}" == "null" ]]; then
              echo "Unable to resolve PR head ref/sha for PR #${PR_NUMBER}."
              exit 1
            fi

            git fetch --no-tags --depth=1 origin "${head_sha}"
            git checkout --detach "${head_sha}"
            echo "Checked out PR #${PR_NUMBER} head ${head_sha} (${head_ref}) for runtime-protected merge boundary."
          }

          pr_json=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
          # Triage and auto-merge start from the same PR event; wait briefly for state to settle.
            for _ in {1..18}; do
              pr_json="$(pr_view)"

              if [[ "$(jq -r '.state' <<<"${pr_json}")" != "open" ]]; then
                echo "Skipping: PR is no longer open."
                exit 0
              fi

              if jq -e '.labels | type == "array"' <<<"${pr_json}" >/dev/null 2>&1; then
                break
              fi

              sleep 5
            done
          else
            pr_json="$(pr_view)"
          fi

          assert_automerge_eligible "${pr_json}"

          # Revalidate branch-pr policy projection on latest state before merge polling.
          pr_json="$(pr_view)"
          assert_automerge_eligible "${pr_json}" " on latest state"
          assert_canonical_merge_authorization

          if [[ "$(jq -r '.auto_merge != null' <<<"${pr_json}")" == "true" ]]; then
            echo "Auto-merge is already enabled for PR #${PR_NUMBER}."
            exit 0
          fi

          checkout_pr_head "${pr_json}"

          chmod +x .octon/framework/assurance/runtime/_ops/scripts/protected-ci-auto-merge.sh
          .octon/framework/assurance/runtime/_ops/scripts/protected-ci-auto-merge.sh \
            --repo "${GH_REPO}" \
            --pr-number "${PR_NUMBER}" \
            --control-json "${CHANGE_MERGE_AUTHORIZATION_PATH}"

          echo "Merged PR #${PR_NUMBER} through the runtime-protected CI boundary."

      - name: Upload PR auto-merge projection artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-auto-merge-projection-artifacts-${{ matrix.pr_number }}
          path: |
            .octon/generated/.tmp/pr-auto-merge/projection-${{ matrix.pr_number }}.json
            .octon/state/evidence/runs
          if-no-files-found: warn
          retention-days: 7
