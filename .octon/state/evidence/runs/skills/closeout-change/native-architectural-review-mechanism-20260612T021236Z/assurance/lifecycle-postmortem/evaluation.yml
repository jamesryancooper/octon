clean_sheet_lifecycle_reference_design:
  fundamental_accomplishment: "Move a large accepted Octon program to implemented, validated, archived, published, cleaned, and landed state without authority confusion."
  minimal_phases:
    - "Bind parent and child scope."
    - "Review and accept parent and children."
    - "Implement children in dependency order."
    - "Run strict receipts, conformance, drift, and generated freshness checks."
    - "Publish derived state."
    - "Archive parent and children."
    - "Run terminal freshness and current-state proof."
    - "Land through branch-no-pr and clean branch residue."
  minimal_gates:
    - "Child-owned receipts cannot be substituted by parent summaries."
    - "Generated state must validate after final archive/support mutation."
    - "Exact-SHA hosted checks must pass before branch-no-pr landing."
    - "Cleaned outcome requires worktree, ref, branch, temp, and cleanup-classifier proof."
  required_artifacts:
    - "Archived proposal packets."
    - "Generated registries and compact artifacts."
    - "Retained closeout evidence."
    - "Postmortem report and structured evaluation."
  required_evidence:
    - "Strict review receipts."
    - "Conformance and drift reviews."
    - "Publication validators."
    - "Final current-state proof."
  required_authority_surfaces:
    - "Workflow contracts, validators, and branch-no-pr helper receipts."
  required_decision_points:
    - "Patch versus redesign judgment."
    - "Fit-to-reuse judgment."
    - "Follow-up improvement route."
  required_rollback_or_reversal_points:
    - "Rollback handles recorded for landed branch-no-pr commits."
  required_closeout_outputs:
    - "No residue, synced main, branch cleanup, and retained evidence."
  automated:
    - "Schema, receipt, artifact-spine, publication, hosted-check, and hygiene validation."
  human_judgment_required:
    - "Architecture review, postmortem interpretation, and redesign pressure assessment."
  impossible:
    - "Generated output authority, raw input authority, chat authority, or postmortem closeout approval."
  optional:
    - "Review-finding NDJSON if durable finding records are needed."
  removed:
    - "Repeated broad sweeps when scoped terminal validators can prove the same risk."
  comparison:
    - lifecycle_concern: "Terminal generated freshness"
      current_lifecycle: "Achieved after correction loops."
      clean_sheet_reference: "Explicit terminal barrier before final report."
      gap: "Sequencing gap."
      recommendation: "Add terminal freshness barrier."
