schema_version: "octon-extension-lifecycle-contract-v2"
lifecycle_id: "proposal-packet"
owner_extension: "octon-proposal-lifecycle"
version: "1.0.0"
execution_strategy: "route-progression"

target:
  input: "packet_path"
  manifest_path: "proposal.yml"
  status_field: "status"
  allowed_statuses:
    - "draft"
    - "in-review"
    - "accepted"
    - "rejected"
    - "implemented"
    - "archived"

input_bindings:
  target:
    source: "lifecycle.target"
  proposal_path:
    source: "lifecycle.target"
  source:
    source: "run.input.source"
  source_kind:
    source: "run.input.source_kind"
  proposal_kind:
    source: "run.input.proposal_kind"
  proposal_id:
    source: "run.input.proposal_id"
  disposition:
    source: "receipt.proposal-closeout.archive_disposition"
  promotion_evidence:
    source: "receipt.proposal-closeout.promotion_evidence"

lifecycle_interactions:
  emitted_profiles:
    - profile_id: "handoff"
      interaction_kind: "follow_on_work_required"
      receipt_schema: "lifecycle-interaction-request-v1"
      requested_capabilities:
        - "change-closeout"
        - "closeout-worktree"
        - "repo-hygiene-cleanup"
      requested_lifecycle_ids:
        - "change-closeout"
        - "closeout-worktree"
        - "repo-hygiene-cleanup"
      requested_route_surfaces:
        - "closeout-change"
        - "closeout-worktree"
        - "repo-hygiene-cleanup"
      requested_atomic_unit_types:
        - "change"
        - "worktree"
        - "repo-hygiene"
      requested_target_outcomes:
        - "cleaned"
        - "landed"
        - "published-branch"
        - "preserved"
        - "blocked"
      evidence_acceptance_classes:
        - "advisory-context"
        - "validation-evidence"
        - "review-evidence"
        - "rollback-context"
        - "non-authority-only"
      forbidden_transfer:
        - "git-ref-mutation"
        - "hosted-provider-authorization"
        - "branch-cleanup-authorization"
        - "worktree-cleanup-authorization"
        - "repo-hygiene-deletion"
        - "archive-authorization"
        - "promotion-authorization"
        - "scope-expansion"
      return_schema: "lifecycle-interaction-return-v1"
      expected_return_evidence:
        - "change-receipt-v1"
        - "closeout-worktree-report-v1"
        - "repo-hygiene-cleanup-authorization-v1"
      target_gate_policy: "target-owned-independent-validation"
      non_authorizing: true
  accepted_profiles:
    - profile_id: "handoff-return"
      interaction_kind: "follow_on_work_required"
      receipt_schema: "lifecycle-interaction-return-v1"
      evidence_acceptance_classes:
        - "validation-evidence"
        - "non-authority-only"
      forbidden_transfer:
        - "git-ref-mutation"
        - "hosted-provider-authorization"
        - "branch-cleanup-authorization"
        - "worktree-cleanup-authorization"
        - "repo-hygiene-deletion"
        - "archive-authorization"
        - "promotion-authorization"
        - "scope-expansion"
      target_gate_policy: "target-owned-independent-validation"
      non_authorizing: true

states:
  - state_id: "create"
  - state_id: "validate"
  - state_id: "review"
  - state_id: "revise"
  - state_id: "implementation-authorized"
  - state_id: "generate-packet-implementation-prompt"
  - state_id: "run-packet-implementation"
  - state_id: "promote"
  - state_id: "verify"
  - state_id: "closeout"
  - state_id: "archive"

terminal_outcomes:
  - outcome_id: "archived"
    when:
      all:
        - manifest_status: "archived"
  - outcome_id: "rejected"
    when:
      all:
        - manifest_status: "rejected"
        - receipt_verdict:
            receipt_id: "proposal-review"
            value: "rejected"
        - receipt_fresh: "proposal-review"
        - receipt_complete: "proposal-review"

validators:
  - validator_id: "proposal-standard"
    argv:
      - "bash"
      - ".octon/framework/assurance/runtime/_ops/scripts/validate-proposal-standard.sh"
      - "--package"
      - "{{target}}"
  - validator_id: "proposal-readiness"
    argv:
      - "bash"
      - ".octon/framework/assurance/runtime/_ops/scripts/validate-proposal-implementation-readiness.sh"
      - "--package"
      - "{{target}}"
  - validator_id: "proposal-review-baseline"
    argv:
      - "bash"
      - ".octon/framework/assurance/runtime/_ops/scripts/validate-proposal-review-gate.sh"
      - "--package"
      - "{{target}}"
  - validator_id: "proposal-review-strict"
    argv:
      - "bash"
      - ".octon/framework/assurance/runtime/_ops/scripts/validate-proposal-review-gate.sh"
      - "--package"
      - "{{target}}"
      - "--require-implementation-authorization"

gates:
  - gate_id: "implementation-grade-readiness"
    validator_id: "proposal-readiness"
    required_before_routes:
      - "generate-packet-implementation-prompt"
      - "run-packet-implementation"
      - "promote-proposal"
  - gate_id: "implementation-authorization"
    validator_id: "proposal-review-strict"
    required_before_routes:
      - "generate-packet-implementation-prompt"
      - "run-packet-implementation"
      - "promote-proposal"
    on_fail_route_id: "review-packet"

receipts:
  - receipt_id: "proposal-creation"
    path: "support/proposal-creation.md"
    required_fields:
      - "creation_id"
      - "created_at"
      - "creator"
      - "source_context_bound"
      - "packet_path"
      - "verdict"
    verdict_field: "verdict"
  - receipt_id: "proposal-review"
    path: "support/proposal-review.md"
    required_fields:
      - "review_id"
      - "reviewed_at"
      - "reviewer"
      - "verdict"
      - "implementation_prompt_authorized"
      - "reviewed_packet_digest"
      - "open_blocking_findings_count"
    verdict_field: "verdict"
    freshness:
      digest_command:
        - "bash"
        - ".octon/framework/assurance/runtime/_ops/scripts/validate-proposal-review-gate.sh"
        - "--package"
        - "{{target}}"
        - "--print-digest"
      digest_field: "reviewed_packet_digest"
  - receipt_id: "implementation-grade-completeness"
    path: "support/implementation-grade-completeness-review.md"
    required_fields:
      - "verdict"
      - "unresolved_questions_count"
      - "clarification_required"
    verdict_field: "verdict"
  - receipt_id: "implementation-run"
    path: "support/implementation-run.md"
    required_fields:
      - "verdict"
      - "implemented_at"
      - "promotion_evidence_count"
    verdict_field: "verdict"
  - receipt_id: "implementation-conformance"
    path: "support/implementation-conformance-review.md"
    required_fields:
      - "verdict"
      - "unresolved_items_count"
    verdict_field: "verdict"
  - receipt_id: "post-implementation-drift"
    path: "support/post-implementation-drift-churn-review.md"
    required_fields:
      - "verdict"
      - "unresolved_items_count"
    verdict_field: "verdict"
  - receipt_id: "proposal-closeout"
    path: "support/proposal-closeout.md"
    required_fields:
      - "verdict"
      - "closed_at"
      - "archive_authorized"
    verdict_field: "verdict"

loops:
  - loop_id: "proposal-review-revision"
    receipt_id: "proposal-review"
    verdict_field: "verdict"
    repeat_values:
      - "revision-required"
    repeat_route_id: "revise-packet"
    terminal_values:
      - "accepted"
      - "rejected"
    max_iterations: 5

phase_loop:
  model_version: "phase-loop-v1"
  phases:
    - phase_id: "target-binding-and-lifecycle-discovery"
      mode: "gate"
      owner_layer: "substrate-runner"
      route_refs: []
      receipt_refs: []
      gate_refs: []
      validator_refs: []
      loop_refs: []
      terminal_refs: []
      entry_when:
        durable_binding_required: true
      exit_when:
        effective_lifecycle_handle_bound: true
      exit_evidence_refs: []
      re_entry_triggers:
        - "missing-lifecycle-handle"
        - "invalid-run-input"
        - "stale-generated-projection"
      backward_transitions: []
      loop_bounds:
        max_phase_iterations: 1
        max_route_dispatches: 0
      stop_conditions:
        - stop_class: "blocked-missing-authority"
          when:
            authority_envelope_missing: true
      authority_boundaries:
        - "scope-expansion"
        - "stale-evidence-acceptance"
    - phase_id: "packet-creation"
      mode: "route"
      owner_layer: "proposal-extension"
      route_refs:
        - "create-packet"
      receipt_refs:
        - "proposal-creation"
      gate_refs: []
      validator_refs: []
      loop_refs: []
      terminal_refs: []
      entry_when:
        route_refs_authoritative: true
      exit_when:
        receipt_refs_complete: true
      exit_evidence_refs:
        - "proposal-creation"
      re_entry_triggers:
        - "source-context-missing"
        - "proposal-manifest-missing"
      backward_transitions:
        - to_phase_id: "target-binding-and-lifecycle-discovery"
          when:
            source_context_missing: true
      loop_bounds:
        max_phase_iterations: 2
        max_route_dispatches: 2
      stop_conditions:
        - stop_class: "blocked-invalid-input"
          when:
            source_context_missing: true
      authority_boundaries:
        - "scope-expansion"
        - "policy-override"
    - phase_id: "structural-validation"
      mode: "gate"
      owner_layer: "validator-runner"
      route_refs: []
      receipt_refs:
        - "proposal-creation"
      gate_refs: []
      validator_refs:
        - "proposal-standard"
      loop_refs: []
      terminal_refs: []
      entry_when:
        validator_refs_authoritative: true
      exit_when:
        validator_refs_pass: true
      exit_evidence_refs:
        - "proposal-creation"
      re_entry_triggers:
        - "validator-failed"
        - "packet-structure-drift"
      backward_transitions:
        - to_phase_id: "packet-creation"
          when:
            creation_receipt_missing: true
      loop_bounds:
        max_phase_iterations: 3
        max_route_dispatches: 0
      stop_conditions:
        - stop_class: "blocked-validation"
          when:
            validator_refs_fail: true
      authority_boundaries:
        - "scope-expansion"
    - phase_id: "implementation-grade-completeness"
      mode: "gate"
      owner_layer: "proposal-extension"
      route_refs: []
      receipt_refs:
        - "implementation-grade-completeness"
      gate_refs:
        - "implementation-grade-readiness"
      validator_refs:
        - "proposal-readiness"
      loop_refs: []
      terminal_refs: []
      entry_when:
        validator_refs_authoritative: true
      exit_when:
        receipt_refs_complete: true
      exit_evidence_refs:
        - "implementation-grade-completeness"
      re_entry_triggers:
        - "incomplete-packet"
        - "unresolved-question"
      backward_transitions:
        - to_phase_id: "packet-creation"
          when:
            packet_revision_required: true
      loop_bounds:
        max_phase_iterations: 5
        max_route_dispatches: 0
      stop_conditions:
        - stop_class: "blocked-incomplete"
          when:
            unresolved_questions_present: true
      authority_boundaries:
        - "unresolved-risk-acceptance"
        - "stale-evidence-acceptance"
    - phase_id: "review-and-revision"
      mode: "loop"
      owner_layer: "proposal-extension"
      route_refs:
        - "review-packet"
        - "revise-packet"
      receipt_refs:
        - "proposal-review"
      gate_refs: []
      validator_refs:
        - "proposal-review-baseline"
      loop_refs:
        - "proposal-review-revision"
      terminal_refs:
        - "rejected"
      entry_when:
        route_refs_authoritative: true
      exit_when:
        receipt_refs_complete: true
      exit_evidence_refs:
        - "proposal-review"
      re_entry_triggers:
        - "receipt-stale"
        - "revision-required"
      backward_transitions:
        - to_phase_id: "structural-validation"
          when:
            packet_structure_changed: true
      loop_bounds:
        max_phase_iterations: 5
        max_route_dispatches: 5
      stop_conditions:
        - stop_class: "blocked-max-iterations"
          when:
            loop_bound_exhausted: true
        - stop_class: "blocked-human"
          when:
            contradictory_evidence_present: true
      authority_boundaries:
        - "scope-expansion"
        - "stale-evidence-acceptance"
        - "contradictory-evidence-resolution"
    - phase_id: "implementation-authorization"
      mode: "gate"
      owner_layer: "validator-runner"
      route_refs: []
      receipt_refs:
        - "proposal-review"
      gate_refs:
        - "implementation-authorization"
      validator_refs:
        - "proposal-review-strict"
      loop_refs: []
      terminal_refs: []
      entry_when:
        gate_refs_authoritative: true
      exit_when:
        gate_refs_pass: true
      exit_evidence_refs:
        - "proposal-review"
      re_entry_triggers:
        - "review-receipt-stale"
        - "implementation-authorization-missing"
      backward_transitions:
        - to_phase_id: "review-and-revision"
          when:
            review_receipt_stale: true
      loop_bounds:
        max_phase_iterations: 3
        max_route_dispatches: 0
      stop_conditions:
        - stop_class: "blocked-gate"
          when:
            gate_refs_fail: true
      authority_boundaries:
        - "stale-evidence-acceptance"
        - "policy-override"
    - phase_id: "implementation-prompt-generation"
      mode: "route"
      owner_layer: "proposal-extension"
      route_refs:
        - "generate-packet-implementation-prompt"
      receipt_refs:
        - "proposal-review"
        - "implementation-grade-completeness"
      gate_refs:
        - "implementation-grade-readiness"
        - "implementation-authorization"
      validator_refs:
        - "proposal-readiness"
        - "proposal-review-strict"
      loop_refs: []
      terminal_refs: []
      entry_when:
        route_refs_authoritative: true
      exit_when:
        implementation_prompt_ready: true
      exit_evidence_refs:
        - "proposal-review"
        - "implementation-grade-completeness"
      re_entry_triggers:
        - "prompt-readiness-failed"
        - "review-receipt-stale"
      backward_transitions:
        - to_phase_id: "implementation-grade-completeness"
          when:
            completeness_receipt_stale: true
        - to_phase_id: "review-and-revision"
          when:
            review_receipt_stale: true
      loop_bounds:
        max_phase_iterations: 3
        max_route_dispatches: 3
      stop_conditions:
        - stop_class: "blocked-gate"
          when:
            required_gate_missing: true
      authority_boundaries:
        - "scope-expansion"
        - "stale-evidence-acceptance"
    - phase_id: "implementation-execution"
      mode: "loop"
      owner_layer: "executor"
      route_refs:
        - "run-packet-implementation"
      receipt_refs:
        - "implementation-run"
        - "proposal-review"
      gate_refs:
        - "implementation-grade-readiness"
        - "implementation-authorization"
      validator_refs:
        - "proposal-readiness"
        - "proposal-review-strict"
      loop_refs: []
      terminal_refs: []
      entry_when:
        route_refs_authoritative: true
      exit_when:
        receipt_refs_complete: true
      exit_evidence_refs:
        - "implementation-run"
      re_entry_triggers:
        - "implementation-blocked"
        - "post-implementation-conformance-failed"
        - "post-implementation-drift-failed"
      backward_transitions:
        - to_phase_id: "review-and-revision"
          when:
            implementation_scope_change_required: true
      loop_bounds:
        max_phase_iterations: 3
        max_route_dispatches: 3
      stop_conditions:
        - stop_class: "blocked-scope-change"
          when:
            implementation_scope_change_required: true
        - stop_class: "blocked-max-iterations"
          when:
            loop_bound_exhausted: true
      authority_boundaries:
        - "scope-expansion"
        - "policy-override"
        - "governance-mutation"
        - "external-irreversible-effect"
    - phase_id: "promotion"
      mode: "route"
      owner_layer: "workflow-runner"
      route_refs:
        - "promote-proposal"
      receipt_refs:
        - "implementation-run"
        - "implementation-conformance"
        - "post-implementation-drift"
        - "proposal-review"
      gate_refs:
        - "implementation-grade-readiness"
        - "implementation-authorization"
      validator_refs:
        - "proposal-readiness"
        - "proposal-review-strict"
      loop_refs: []
      terminal_refs: []
      entry_when:
        route_refs_authoritative: true
      exit_when:
        implementation_evidence_promoted: true
      exit_evidence_refs:
        - "implementation-run"
      re_entry_triggers:
        - "promotion-evidence-stale"
        - "missing-authority"
      backward_transitions:
        - to_phase_id: "implementation-execution"
          when:
            implementation_receipt_missing: true
      loop_bounds:
        max_phase_iterations: 2
        max_route_dispatches: 2
      stop_conditions:
        - stop_class: "blocked-missing-authority"
          when:
            promotion_authority_missing: true
      authority_boundaries:
        - "scope-expansion"
        - "stale-evidence-acceptance"
        - "governance-mutation"
    - phase_id: "verification-and-correction"
      mode: "loop"
      owner_layer: "proposal-extension"
      route_refs:
        - "run-packet-verification-and-correction-loop"
      receipt_refs:
        - "implementation-run"
        - "implementation-conformance"
        - "post-implementation-drift"
      gate_refs: []
      validator_refs: []
      loop_refs: []
      terminal_refs: []
      entry_when:
        route_refs_authoritative: true
      exit_when:
        receipt_refs_complete: true
      exit_evidence_refs:
        - "implementation-conformance"
        - "post-implementation-drift"
      re_entry_triggers:
        - "correction-required"
        - "drift-detected"
      backward_transitions:
        - to_phase_id: "review-and-revision"
          when:
            packet_error_requires_revision: true
      loop_bounds:
        max_phase_iterations: 5
        max_route_dispatches: 5
      stop_conditions:
        - stop_class: "blocked-max-iterations"
          when:
            correction_bound_exhausted: true
      authority_boundaries:
        - "scope-expansion"
        - "stale-evidence-acceptance"
    - phase_id: "closeout-and-hygiene"
      mode: "route"
      owner_layer: "proposal-extension"
      route_refs:
        - "closeout-packet"
      receipt_refs:
        - "implementation-conformance"
        - "post-implementation-drift"
        - "proposal-closeout"
      gate_refs: []
      validator_refs: []
      loop_refs: []
      terminal_refs: []
      entry_when:
        route_refs_authoritative: true
      exit_when:
        receipt_refs_complete: true
      exit_evidence_refs:
        - "proposal-closeout"
      re_entry_triggers:
        - "hygiene-blocker"
        - "closeout-receipt-missing"
      backward_transitions:
        - to_phase_id: "verification-and-correction"
          when:
            conformance_or_drift_receipt_missing: true
      loop_bounds:
        max_phase_iterations: 3
        max_route_dispatches: 3
      stop_conditions:
        - stop_class: "blocked-hygiene"
          when:
            hygiene_blocker_present: true
      authority_boundaries:
        - "scope-expansion"
        - "stale-evidence-acceptance"
    - phase_id: "archival"
      mode: "route"
      owner_layer: "workflow-runner"
      route_refs:
        - "archive-proposal"
      receipt_refs:
        - "implementation-conformance"
        - "post-implementation-drift"
        - "proposal-closeout"
      gate_refs: []
      validator_refs: []
      loop_refs: []
      terminal_refs:
        - "archived"
      entry_when:
        route_refs_authoritative: true
      exit_when:
        terminal_refs_reached: true
      exit_evidence_refs:
        - "proposal-closeout"
      re_entry_triggers:
        - "archive-receipt-stale"
      backward_transitions:
        - to_phase_id: "closeout-and-hygiene"
          when:
            closeout_receipt_missing: true
      loop_bounds:
        max_phase_iterations: 2
        max_route_dispatches: 2
      stop_conditions:
        - stop_class: "blocked-missing-authority"
          when:
            archive_authority_missing: true
      authority_boundaries:
        - "scope-expansion"
        - "stale-evidence-acceptance"
        - "contradictory-evidence-resolution"
    - phase_id: "terminal-explanation-reporting"
      mode: "terminal"
      owner_layer: "runner"
      route_refs: []
      receipt_refs: []
      gate_refs: []
      validator_refs: []
      loop_refs: []
      terminal_refs:
        - "archived"
        - "rejected"
      entry_when:
        terminal_or_blocked_verdict: true
      exit_when:
        final_report_emitted: true
      exit_evidence_refs: []
      re_entry_triggers: []
      backward_transitions: []
      loop_bounds:
        max_phase_iterations: 1
        max_route_dispatches: 0
      stop_conditions:
        - stop_class: "terminal"
          when:
            terminal_or_blocked_verdict: true
      authority_boundaries:
        - "scope-expansion"
        - "stale-evidence-acceptance"

routes:
  - route_id: "create-packet"
    route_type: "extension"
    delegation_contract:
      decision_class: "delegated-execution"
      safe_delegation: true
      authority_zones_allowed:
        - "workspace-declared"
      declared_write_scope_source: "route-completion-and-target"
      required_evidence_gates: []
      required_receipts_before_dispatch: []
      required_receipts_before_completion:
        - "proposal-creation"
      replay_class: "idempotent"
      automated_recovery_policy: "fail-closed"
      human_only_boundaries:
        - "scope-expansion"
        - "policy-override"
        - "governance-mutation"
        - "external-irreversible-effect"
    command_id: "octon-proposal-create-packet"
    skill_id: "octon-proposal-lifecycle-create-packet"
    prompt_set_id: "octon-proposal-lifecycle-create-packet"
    required_inputs:
      - "source"
    completion:
      expected_receipts:
        - "proposal-creation"
      expected_paths:
        - "proposal.yml"
        - "README.md"
        - "navigation/artifact-catalog.md"
        - "navigation/source-of-truth-map.md"
        - "resources/source-context.md"
        - "support/implementation-grade-completeness-review.md"
      expected_manifest_status: "draft"
      expected_target_change: true
      replan_required: true
    enter_when:
      any:
        - target_missing: true
        - all:
            - target_missing: false
            - file_absent: "proposal.yml"
  - route_id: "review-packet"
    route_type: "extension"
    delegation_contract:
      decision_class: "delegated-execution"
      safe_delegation: true
      authority_zones_allowed:
        - "workspace-declared"
      declared_write_scope_source: "route-completion-and-target"
      required_evidence_gates: []
      required_receipts_before_dispatch: []
      required_receipts_before_completion:
        - "proposal-review"
      replay_class: "idempotent-rerun"
      automated_recovery_policy: "fail-closed"
      human_only_boundaries:
        - "scope-expansion"
