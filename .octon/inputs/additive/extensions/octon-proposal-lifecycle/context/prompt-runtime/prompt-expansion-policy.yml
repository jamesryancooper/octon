schema_version: "octon-prompt-expansion-policy-v1"
artifact_id: "prompt-expansion-policy"
owner_extension: "octon-proposal-lifecycle"
artifact_class: "prompt-runtime-expansion-control"
authority_status: "source-pack policy; runtime requests remain engine-owned"
producer: "octon_lifecycle_executor::prompt_bundle"
default_mode: "compact-capsule"
allowed_modes:
  - "compact"
  - "compact-capsule"
  - "prompt-pack-handle"
  - "full"
  - "full-expansion"
full_expansion_allowed_reason_codes:
  - "digest-drift"
  - "mutation-sensitive-work"
  - "gate-dispute"
  - "authority-conflict"
  - "audit-request"
full_expansion_requirements:
  - "request must carry an explicit reason_code"
  - "reason_code must be one of full_expansion_allowed_reason_codes"
  - "resolved prompt bundle must pass freshness and digest checks before expansion"
  - "rendered full prompt packet must be retained under run evidence"
  - "token-budget ledger must retain the model-visible prompt sha256"
failure_behavior: "fail closed when mode is unsupported, reason_code is missing, or reason_code is not allowed"
