schema_version: "octon-prompt-pack-capsule-contract-v1"
artifact_id: "prompt-pack-capsule"
owner_extension: "octon-proposal-lifecycle"
artifact_class: "compact-model-visible-instruction-handle"
authority_status: "source-pack contract; published projections are derived-only"
producer: "octon_lifecycle_executor::prompt_bundle"
default_visibility: "model-visible-compact"
required_fields:
  - "schema_version"
  - "artifact_class"
  - "prompt_set_id"
  - "manifest_ref"
  - "manifest_sha256"
  - "bundle_sha256"
  - "publication_status"
  - "source_assets"
  - "failure_behavior"
  - "full_prompt_packet_refs_retained"
source_asset_fields:
  - "id"
  - "role"
  - "role_class"
  - "bundle_path"
  - "source_ref"
  - "projection_ref"
  - "sha256"
  - "full_expansion_ref"
freshness_requirements:
  - "catalog path must be the runtime generated effective extension catalog"
  - "bundle publication_status must be published or published_with_quarantine"
  - "alignment_status must be fresh when present"
  - "manifest, required repo anchors, source assets, and projection assets must match their catalog sha256 values"
failure_behavior: "fail closed on missing source, digest mismatch, stale freshness, or authority-boundary violation"
replay_requirements:
  - "retain the rendered prompt packet under route evidence"
  - "record the prompt packet sha256 in the token-budget ledger"
  - "keep full asset refs available for explicit full expansion"
