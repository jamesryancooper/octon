schema_version: "octon-simplification-register-v1"
entries:
  - component: "SQLite/WAL authoritative store"
    classification: "ESSENTIAL_COMPLEXITY"
    risk_reduced: "Double consumption, partial persistence, unknown outcomes, unreserved evidence."
    reuse: "Retain runtime_bus validation and replay_store semantics as projections/logic."
    administration: "Embedded local database; automatic backup/checkpoint."
  - component: "One local broker"
    classification: "ESSENTIAL_COMPLEXITY"
    risk_reduced: "Ambient durable credentials and direct candidate effects."
    reuse: "Typed effects and current exact-ref validation logic."
    administration: "Auto-started, self-diagnosing, Keychain-backed."
  - component: "Native isolated candidate launcher"
    classification: "ESSENTIAL_COMPLEXITY"
    risk_reduced: "Host credential, filesystem, process, network, and Git-state access."
    reuse: "Codex ephemeral/workspace concepts and lifecycle cancellation."
    administration: "No profile selection; one supported macOS policy."
  - component: "Independent exact-SHA verifier"
    classification: "ESSENTIAL_COMPLEXITY"
    risk_reduced: "Same-change self-certification and wrong-check acceptance."
    reuse: "Provider API and required-check observation logic."
    administration: "Versioned/pinned with automatic health."
  - component: "Sanitized Git adapter"
    classification: "ESSENTIAL_COMPLEXITY"
    risk_reduced: "Repository/global executable Git extensions under privilege."
    reuse: "Source/target/ancestry/post-land checks."
    administration: "Internal broker adapter."
  - component: "Signed checkpoints and bounded retention"
    classification: "ESSENTIAL_COMPLEXITY"
    risk_reduced: "Evidence forgery/rollback and disk/inode exhaustion."
    reuse: "Hash-linked journal and compact views."
    administration: "Automatic compaction; operator sees exceptions only."
  - component: "Workspace Project"
    classification: "ESSENTIAL_COMPLEXITY"
    risk_reduced: "Ambiguous multi-project continuity and repeated setup."
    reuse: "Project Profile/locality."
    administration: "Inferred one small record."
  - component: "Harness Factory"
    classification: "ESSENTIAL_COMPLEXITY"
    risk_reduced: "Stale/self-widened inconsistent launch configuration."
    reuse: "Context pack, resolver, task-harness, extension generation."
    administration: "Compiler only; no scheduler or service."
  - component: "Protected GitHub effect worker"
    classification: "USEFUL_OPTIONAL_COMPLEXITY"
    risk_reduced: "Local availability and provider-native exact effects."
    reuse: "GitHub Actions only as dumb worker."
    administration: "Defer until local proof; never second control plane."
  - component: "Private signed extension catalog"
    classification: "USEFUL_OPTIONAL_COMPLEXITY"
    risk_reduced: "Private capability supply-chain tampering."
    reuse: "Existing catalog generations, receipts, quarantine."
    administration: "Simple import/pin/revoke/rollback."
  - component: "Broad federation and trust-domain runtime"
    classification: "DEFERRED_COMPLEXITY"
    risk_reduced: "No current solo-builder load-bearing risk."
    reuse: "Keep non-default research/internal artifacts where cheap."
    administration: "Exclude from supported golden path."
  - component: "Continuous stewardship and certification UX"
    classification: "UNNECESSARY_COMPLEXITY"
    risk_reduced: "Does not materially improve the first solo path."
    reuse: "Internal validation may remain."
    administration: "Hide or retire from default CLI."
  - component: "VM isolation platform"
    classification: "PERMANENTLY_OUT_OF_SCOPE"
    risk_reduced: "Native macOS proof is sufficient target."
    reuse: "None."
    administration: "Do not build."
  - component: "Distributed ledger or second broker"
    classification: "PERMANENTLY_OUT_OF_SCOPE"
    risk_reduced: "Creates more failure/administration than it solves."
    reuse: "One local store and broker."
    administration: "Do not build."
  - component: "Public extension marketplace"
    classification: "PERMANENTLY_OUT_OF_SCOPE"
    risk_reduced: "Not required for private solo reuse."
    reuse: "Private signed catalog."
    administration: "Do not build."

