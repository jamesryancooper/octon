schema_version: "octon-residual-risk-register-v1"
risks:
  - risk_id: "RR-001"
    risk: "Native macOS sandbox or model CLI may expose an unmodeled host escape."
    after_migration: "Residual"
    treatment: "Version-pinned negative probe suite, default-deny profile, rapid disable flag."
    acceptance_owner: "WG-02"
  - risk_id: "RR-002"
    risk: "Git or provider semantics may change after proof."
    after_migration: "Residual"
    treatment: "Pinned/sanitized adapter behavior, provider capability probes, exact fail-closed versioning."
    acceptance_owner: "WG-05/WG-06"
  - risk_id: "RR-003"
    risk: "SQLite corruption or local disk loss can remove recent state/evidence."
    after_migration: "Residual"
    treatment: "WAL integrity, automatic encrypted backups, signed checkpoints, restore drills."
    acceptance_owner: "WG-03/WG-07"
  - risk_id: "RR-004"
    risk: "Solo operator key loss or compromise."
    after_migration: "Residual"
    treatment: "Keychain custody, rotation/revocation, encrypted recovery, narrow provider permissions."
    acceptance_owner: "WG-04/WG-07"
  - risk_id: "RR-005"
    risk: "Verifier bug produces a signed wrong verdict."
    after_migration: "Residual"
    treatment: "Small deterministic verifier, independent negative fixtures, version binding, rollback and claim expiry."
    acceptance_owner: "WG-06"
  - risk_id: "RR-006"
    risk: "Unknown provider outcome requires operator intervention."
    after_migration: "Residual"
    treatment: "Never duplicate automatically; concise inbox item with exact observation and safe choices."
    acceptance_owner: "WG-07/WG-08"
  - risk_id: "RR-007"
    risk: "Bounded retention may compact evidence later needed for diagnosis."
    after_migration: "Residual"
    treatment: "Protected pins, signed terminal checkpoints, measured windows, export before compaction."
    acceptance_owner: "WG-07"
  - risk_id: "RR-008"
    risk: "Trust-root rollback can fail due to host-level corruption."
    after_migration: "Residual"
    treatment: "Immutable previous version, atomic pointer, offline recovery command, periodic rollback drill."
    acceptance_owner: "WG-09"
  - risk_id: "RR-009"
    risk: "Hidden advanced CLI/features continue to impose maintenance."
    after_migration: "Residual"
    treatment: "Supported-envelope registry, feature gating, usage-based retirement."
    acceptance_owner: "WG-12/WG-13"
  - risk_id: "RR-010"
    risk: "Optional remote worker can regress into a second control plane."
    after_migration: "Deferred"
    treatment: "Exclude from minimum proof; require exact-operation-only contract and local reconciliation."
    acceptance_owner: "future worker packet"
