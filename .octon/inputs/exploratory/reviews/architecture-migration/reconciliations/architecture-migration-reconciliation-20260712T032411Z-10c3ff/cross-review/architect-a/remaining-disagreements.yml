schema_version: "octon-cross-review-disagreements-v1"
architect_label: "A"
disagreements:
  - disagreement_id: "A-DIS-001"
    subject: "Harness Factory current status"
    disagreement_class: "FACTUAL_REPOSITORY_DISAGREEMENT"
    architect_a_position: "PARTIALLY_SATISFIED"
    architect_b_position: "SATISFIED"
    architect_a_rationale: "Existing route compilation omits material target inputs and universal launch binding."
    evidence_needed_for_resolution: "Trace the complete task-harness compile and authorization consumption path against the intake input list."
    migration_consequence: "Whether a bounded extension packet remains; no new runtime is warranted either way."
  - disagreement_id: "A-DIS-002"
    subject: "Provider-native delegation current status"
    disagreement_class: "EVIDENCE_STRENGTH_DIFFERENCE"
    architect_a_position: "PARTIALLY_SATISFIED"
    architect_b_position: "SATISFIED"
    architect_a_rationale: "Contracts/manifests do not prove provider replacement or full privileged-path conformance."
    evidence_needed_for_resolution: "Provider replacement/conformance test across authority, evidence, recovery, and publication."
    migration_consequence: "Cross-cutting proof obligation remains."
  - disagreement_id: "A-DIS-003"
    subject: "Evidence signing baseline"
    disagreement_class: "ARCHITECTURAL_INTERPRETATION_DISAGREEMENT"
    architect_a_position: "FD-014 remains accepted and requires signed direct observations."
    architect_b_position: "Git anchoring should be chosen before program authoring and FD-014 reworded."
    architect_a_rationale: "No valid decision-reopen record or infeasibility evidence exists."
    evidence_needed_for_resolution: "Operator decision only if a compliant reopen record is later supplied."
    migration_consequence: "Evidence packet retains signing; mechanism remains small and local."
  - disagreement_id: "A-DIS-004"
    subject: "Minimal Workspace Project timing"
    disagreement_class: "PRODUCT_OR_USABILITY_DISAGREEMENT"
    architect_a_position: "Include the minimal record in the first complete supported vertical."
    architect_b_position: "Defer until a second project is present."
    architect_a_rationale: "Multiple-project operation is an accepted target and the record is intentionally minimal/non-authoritative."
    evidence_needed_for_resolution: "No repository fact is missing; operator would need to reopen FD-019/FD-024."
    migration_consequence: "Retain project packet after trust core."
  - disagreement_id: "A-DIS-005"
    subject: "Safe rollback bridges"
    disagreement_class: "MIGRATION_DESIGN_DISAGREEMENT"
    architect_a_position: "Never restore ambient credentials, dual writers, YAML authority, or log-only privileged guards after cutover."
    architect_b_position: "Several packet rollbacks temporarily permit those states."
    architect_a_rationale: "Those states violate accepted decisions and recreate the retired threat."
    evidence_needed_for_resolution: "Fault-injection proof for safe disabled/PR-only/prior-certified rollback."
    migration_consequence: "Rewrite rollback criteria."
  - disagreement_id: "A-DIS-006"
    subject: "Proposal readiness verdict"
    disagreement_class: "ARCHITECTURAL_INTERPRETATION_DISAGREEMENT"
    architect_a_position: "READY_FOR_PROPOSAL_PROGRAM"
    architect_b_position: "READY_WITH_BLOCKING_DECISIONS"
    architect_a_rationale: "Program design is bounded; unresolved implementation choices can be packet entry gates."
    evidence_needed_for_resolution: "Reconciliation-level decision coverage and packet ownership validation."
    migration_consequence: "Affects timing of formal program authoring, not privileged implementation."
