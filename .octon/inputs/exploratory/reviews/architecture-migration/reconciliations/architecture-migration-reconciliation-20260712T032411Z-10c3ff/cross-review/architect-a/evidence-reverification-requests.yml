schema_version: "octon-cross-review-reverification-v1"
architect_label: "A"
requests:
  - request_id: "A-RV-001"
    question: "Do production launch/deployment paths permit policy, mode, or stale-route overrides from candidate-influenced configuration?"
    why_it_matters: "Determines exploitability and the exact Gate 0 containment, though the production overrides should be retired regardless."
    minimum_command_or_test: "Launch each supported runtime entrypoint with adversarial override variables and verify the candidate cannot select the runner, mode, or stale bundle."
    required_baseline: "Clean normalized commit in production-mode build."
    expected_evidence: "Process environment provenance and fail-closed decision receipts."
    decision_blocked: null
    workgroup_blocked: "WG-00"
  - request_id: "A-RV-002"
    question: "Does any complete current path compile and authorize the full FD-020 target harness envelope?"
    why_it_matters: "Resolves SATISFIED versus PARTIALLY_SATISFIED."
    minimum_command_or_test: "Trace and execute one representative task from project/profile through full manifest compilation, freshness mutation, and launch authorization."
    required_baseline: "Clean normalized commit with generated artifacts rebuilt."
    expected_evidence: "Input/digest manifest, compile receipt, authorization binding, stale/self-widened denial."
    decision_blocked: null
    workgroup_blocked: "WG-10"
  - request_id: "A-RV-003"
    question: "Can a provider adapter be replaced without changing Octon authority, mission, evidence, recovery, and publication semantics?"
    why_it_matters: "Determines the current status of FD-023 and validates provider-native simplification."
    minimum_command_or_test: "Run the same fixture through two conformant fake/provider adapters and compare canonical state and recovery results."
    required_baseline: "Clean normalized commit plus controlled provider fixtures."
    expected_evidence: "Conformance receipts and semantic-equivalence diff."
    decision_blocked: null
    workgroup_blocked: "WG-06"
  - request_id: "A-RV-004"
    question: "What live GitHub protections, App/PAT scopes, environment rules, and workflow identity boundaries are deployed?"
    why_it_matters: "Repository workflows alone cannot prove provider enforcement or credential scope."
    minimum_command_or_test: "Read-only provider configuration export for branch/ruleset, environments, Apps, Actions permissions, and secret consumers."
    required_baseline: "Repository and provider state captured at one timestamp."
    expected_evidence: "Redacted provider-observed configuration receipt."
    decision_blocked: null
    workgroup_blocked: "WG-00"
  - request_id: "A-RV-005"
    question: "Does the proposed native macOS isolation prevent filesystem, credential, network, process, and Git-state escape under hostile candidate code?"
    why_it_matters: "Static design cannot prove FD-008."
    minimum_command_or_test: "Run the intake adversarial isolation suite against a disposable candidate repository with canary credentials and prohibited paths."
    required_baseline: "Pinned macOS version and sandbox profile."
    expected_evidence: "Adversarial test receipts with zero canary exposure."
    decision_blocked: null
    workgroup_blocked: "WG-03"
