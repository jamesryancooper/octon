topics:
  - topic_id: "TOPIC-01"
    subject: "Product and scope alignment"
    architect_a_position: "One serious solo operator, multiple projects, one complete macOS/GitHub/Codex-first vertical."
    architect_b_position: "Same boundary; remove unsupported federation/administration and measure burden."
    disagreement_class: "NO_DISAGREEMENT"
    disposition: "AGREED"
    reconciled_position: "Retain the accepted solo/multi-project boundary and make burden proof a promotion gate."
  - topic_id: "TOPIC-02"
    subject: "Current authorization planes"
    architect_a_position: "Lifecycle-local authorization competes with authority_engine."
    architect_b_position: "Agrees and adds candidate-editable policy runner/data/overrides inside authority_engine."
    disagreement_class: "SCOPE_DIFFERENCE"
    disposition: "SYNTHESIZED_POSITION"
    reconciled_position: "Canonical routing and a candidate-immutable decision function are both required."
  - topic_id: "TOPIC-03"
    subject: "Invocation guards"
    architect_a_position: "Not universal; lifecycle and pipeline bypass exact one-shot consumption."
    architect_b_position: "Same."
    disagreement_class: "NO_DISAGREEMENT"
    disposition: "AGREED"
    reconciled_position: "Every supported spawn consumes one exact typed guard immediately before process creation."
  - topic_id: "TOPIC-04"
    subject: "Agent credentials"
    architect_a_position: "Candidate execution is credential-capable and not isolated."
    architect_b_position: "Same, but narrows claims about which concrete secret was present or used."
    disagreement_class: "EVIDENCE_STRENGTH_DIFFERENCE"
    disposition: "AGREED_WITH_DIFFERENT_RATIONALE"
    reconciled_position: "Credential exposure capability is statically proved; actual secret presence/use is unproved. Target remains useful credentialless execution."
  - topic_id: "TOPIC-05"
    subject: "Candidate isolation"
    architect_a_position: "Fresh candidate environment with native isolation and independent Git."
    architect_b_position: "Agrees; useful provider authentication also needs a non-exportable boundary."
    disagreement_class: "SCOPE_DIFFERENCE"
    disposition: "SYNTHESIZED_POSITION"
    reconciled_position: "Prove both useful execution and denial of host, credential, process, network, filesystem, and Git escape."
  - topic_id: "TOPIC-06"
    subject: "Git-state isolation"
    architect_a_position: "Independent candidate Git state."
    architect_b_position: "Some wording allowed a disposable worktree; cross-review accepts an independent object database."
    disagreement_class: "ARCHITECTURAL_INTERPRETATION_DISAGREEMENT"
    disposition: "ARCHITECT_A_MORE_SUPPORTED"
    reconciled_position: "Use a disposable independent repository/object database, not a linked worktree alone."
  - topic_id: "TOPIC-07"
    subject: "Local broker"
    architect_a_position: "One separate local deterministic broker holds credentials and effects."
    architect_b_position: "Same; adds supervision, authenticated IPC, enrollment, doctor, repair, and crash behavior."
    disagreement_class: "SCOPE_DIFFERENCE"
    disposition: "SYNTHESIZED_POSITION"
    reconciled_position: "One supervised broker process; verifier identity remains separate."
  - topic_id: "TOPIC-08"
    subject: "SQLite/WAL runtime state"
    architect_a_position: "One full authoritative SQLite/WAL store."
    architect_b_position: "Original proposed narrow CAS; substitute withdrew it and accepts full store."
    disagreement_class: "MIGRATION_DESIGN_DISAGREEMENT"
    disposition: "ARCHITECT_A_MORE_SUPPORTED"
    reconciled_position: "Full FD-005 store is required before brokered privileged effects; atomic files may remain read-only projections."
  - topic_id: "TOPIC-09"
    subject: "Sanitized privileged Git"
    architect_a_position: "Broker-owned closed command/config surface."
    architect_b_position: "Agrees and supplies a broader extension-point matrix and attempt attribution."
    disagreement_class: "SCOPE_DIFFERENCE"
    disposition: "SYNTHESIZED_POSITION"
    reconciled_position: "Closed Git allowlist with hostile extension tests, exact attempt identity, and no ambient config."
  - topic_id: "TOPIC-10"
    subject: "Publication routing"
    architect_a_position: "Adaptive verified branch-no-PR for admitted Class B, automatic PR escalation."
    architect_b_position: "Same after containment."
    disagreement_class: "NO_DISAGREEMENT"
    disposition: "AGREED"
    reconciled_position: "Expected-old, fast-forward-only exact-SHA landing through the broker; all other cases escalate."
  - topic_id: "TOPIC-11"
    subject: "Exact-SHA verification"
    architect_a_position: "Candidate-immutable verifier separate from effect identity."
    architect_b_position: "Same; prefer conformant provider-native verifier/App."
    disagreement_class: "WORDING_ONLY"
    disposition: "AGREED_WITH_DIFFERENT_RATIONALE"
    reconciled_position: "Use the smallest provider-native verifier that preserves immutable definition and separate identity."
  - topic_id: "TOPIC-12"
    subject: "PR escalation"
    architect_a_position: "Automatic for uncertainty, consequence, race, or proof failure."
    architect_b_position: "Same; manual/protected PR is the migration fallback."
    disagreement_class: "NO_DISAGREEMENT"
    disposition: "AGREED"
    reconciled_position: "PR is a safe fallback and escalation route, not the sole target publication mode."
  - topic_id: "TOPIC-13"
    subject: "Runtime idempotency"
    architect_a_position: "Reservation, consume, attempt, idempotency, terminal state in one transaction."
    architect_b_position: "Same after withdrawing narrow CAS."
    disagreement_class: "NO_DISAGREEMENT"
    disposition: "AGREED"
    reconciled_position: "One operation state machine and one authoritative writer."
  - topic_id: "TOPIC-14"
    subject: "Crash recovery"
    architect_a_position: "Kill-point proof and forward reconciliation."
    architect_b_position: "Same; adds ENOSPC, backup/restore, and broker supervision."
    disagreement_class: "SCOPE_DIFFERENCE"
    disposition: "SYNTHESIZED_POSITION"
    reconciled_position: "All transaction and effect boundaries must converge after process loss, storage failure, or restart."
  - topic_id: "TOPIC-15"
    subject: "Unknown-outcome reconciliation"
    architect_a_position: "Current system lacks durable unknown-effect state."
    architect_b_position: "Agrees, but notes some shell post-push checking."
    disagreement_class: "SCOPE_DIFFERENCE"
    disposition: "AGREED_WITH_DIFFERENT_RATIONALE"
    reconciled_position: "Preserve useful target checks; add durable attempt-bound unknown reconciliation universally."
  - topic_id: "TOPIC-16"
    subject: "Evidence signing"
    architect_a_position: "FD-014 requires signed direct observations/checkpoints."
    architect_b_position: "Original proposed Git anchoring; substitute withdrew proposal."
    disagreement_class: "ARCHITECTURAL_INTERPRETATION_DISAGREEMENT"
    disposition: "ARCHITECT_A_MORE_SUPPORTED"
    reconciled_position: "Retain signed broker/verifier observations; choose a minimal local signer/key mechanism inside the packet."
  - topic_id: "TOPIC-17"
    subject: "Evidence capacity"
    architect_a_position: "Same-transaction capacity reservation is absent."
    architect_b_position: "Original conflated route lease; substitute accepts absence."
    disagreement_class: "FACTUAL_REPOSITORY_DISAGREEMENT"
    disposition: "ARCHITECT_A_MORE_SUPPORTED"
    reconciled_position: "Implement capacity reservation in the operation transaction; no standalone lease service."
  - topic_id: "TOPIC-18"
    subject: "Retention and bounded completeness"
    architect_a_position: "Hash links exist; authenticity, bounds, compaction proof, and truthful completeness are incomplete."
    architect_b_position: "Same and measures tracked run-state burden."
    disagreement_class: "SCOPE_DIFFERENCE"
    disposition: "SYNTHESIZED_POSITION"
    reconciled_position: "Signed checkpoints, quotas, pins, compaction, external/local raw payloads, and honest completeness claims."
  - topic_id: "TOPIC-19"
    subject: "Degraded operation"
    architect_a_position: "Block only affected consequential transition and preserve candidate/Class A work."
    architect_b_position: "Same."
    disagreement_class: "NO_DISAGREEMENT"
    disposition: "AGREED"
    reconciled_position: "No ambient/unsigned fallback; safe work remains available."
  - topic_id: "TOPIC-20"
    subject: "Safe self-development"
    architect_a_position: "Scaffolding exists but enforced inert trust-root landing is absent."
    architect_b_position: "Original called promotion_blockers unwired; substitute confirms callers but no material activation boundary."
    disagreement_class: "FACTUAL_REPOSITORY_DISAGREEMENT"
    disposition: "SYNTHESIZED_POSITION"
    reconciled_position: "Preserve blockers/readers as scaffolding; decision behavior is contradicted until inert landing and independent certification are enforced."
  - topic_id: "TOPIC-21"
    subject: "Trust-root activation"
    architect_a_position: "Absent; previous-version verification and rollback required."
    architect_b_position: "Same."
    disagreement_class: "NO_DISAGREEMENT"
    disposition: "AGREED"
    reconciled_position: "Exact-version staged activation, old-version rules, health window, automatic rollback, no same-change self-certification."
  - topic_id: "TOPIC-22"
    subject: "Workspace Projects"
    architect_a_position: "Minimal accepted project record required."
    architect_b_position: "Original proposed deferral; substitute withdrew it."
    disagreement_class: "PRODUCT_OR_USABILITY_DISAGREEMENT"
    disposition: "ARCHITECT_A_MORE_SUPPORTED"
    reconciled_position: "Implement the minimal inferred non-authoritative record after trust core and before Harness Factory."
