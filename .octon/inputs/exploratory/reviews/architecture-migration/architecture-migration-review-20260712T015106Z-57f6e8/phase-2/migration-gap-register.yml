note: >-
  One gap per material target property not yet met. severity_gate names the
  readiness class from Phase 3 implementation-readiness gates. Each gap names the
  packet (PP-xx) that owns it in the proposal-program packet map.
gaps:
  - gap_id: GAP-01
    title: 'Agent-launch path bypasses canonical authority'
    current: 'lifecycle_executor self-attests via DelegationProof; no authority_engine dependency'
    target: 'Every agent/child launch consumes a verified canonical grant + one-shot ExecutorLaunch'
    findings: [A-01, A-02, J-01]
    decisions: [FD-003, FD-004]
    owning_packet: 'PP-01'
    severity_gate: 'BLOCKER_BEFORE_PRIVILEGED_IMPLEMENTATION'
    acceptance_test: 'Spawn denied when grant/ExecutorLaunch token missing/expired/revoked/consumed; concurrent consume ≤ once.'
  - gap_id: GAP-02
    title: 'Agents inherit ambient durable credentials'
    current: 'no env_clear/allowlist at any spawn site; child inherits GITHUB_TOKEN/SSH/API keys'
    target: 'credentialless agents; credentials only in local broker'
    findings: [B-01, B-06, J-02, A-03]
    decisions: [FD-006, FD-022]
    owning_packet: 'PP-02, PP-04'
    severity_gate: 'BLOCKER_BEFORE_PRIVILEGED_IMPLEMENTATION'
    acceptance_test: 'Sentinel secret set in parent is absent in child env; `gh auth status` fails in child.'
  - gap_id: GAP-03
    title: 'No OS isolation / candidate runs in canonical repo + Git'
    current: 'no sandbox primitive; --cd repo_root; canonical .git objects/refs'
    target: 'disposable OS-sandboxed env with isolated Git state'
    findings: [B-04, B-05]
    decisions: [FD-008]
    owning_packet: 'PP-02'
    severity_gate: 'REQUIRED_BEFORE_PROOF_OF_ARCHITECTURE'
    acceptance_test: 'Escape test (fs/network/Git-state) denied by runtime-applied sandbox; canonical refs unchanged until brokered promotion.'
  - gap_id: GAP-04
    title: 'No local credential-holding broker'
    current: 'only a policy-grant shell script; no credential custody component'
    target: 'one separate local deterministic broker holds durable credentials'
    findings: [B-02, H-02]
    decisions: [FD-006, FD-024]
    owning_packet: 'PP-04'
    severity_gate: 'REQUIRED_BEFORE_PROOF_OF_ARCHITECTURE'
    acceptance_test: 'Raw push/merge/deploy from candidate fails; brokered effect succeeds without agent holding secret.'
  - gap_id: GAP-05
    title: 'No transactional runtime store'
    current: 'loose YAML/NDJSON; 11 non-atomic fs::write sites; no fsync/rename'
    target: 'one SQLite/WAL authoritative store'
    findings: [D-01, D-03]
    decisions: [FD-005, FD-012]
    owning_packet: 'PP-03'
    severity_gate: 'REQUIRED_BEFORE_PROOF_OF_ARCHITECTURE'
    acceptance_test: 'Kill-point between two writes leaves both-or-neither; all state files always parse.'
  - gap_id: GAP-06
    title: 'Single-use consume is TOCTOU / non-atomic'
    current: 'read-check-write, no lock, plain fs::write'
    target: 'transactional CAS consume; atomic persistence'
    findings: [D-02, J-04]
    decisions: [FD-011, FD-012]
    owning_packet: 'PP-03'
    severity_gate: 'REQUIRED_BEFORE_AUTONOMOUS_CLASS_B_PUBLICATION'
    acceptance_test: 'N concurrent verifies on one single-use token → exactly one success.'
  - gap_id: GAP-07
    title: 'Unsanitized privileged Git; hooks installed'
    current: 'no GIT_CONFIG_NOSYSTEM/hooksPath; managed hooks run git mutations'
