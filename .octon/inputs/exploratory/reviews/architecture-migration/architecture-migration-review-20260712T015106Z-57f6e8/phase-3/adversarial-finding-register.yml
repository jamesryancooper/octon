  classification: medium
  evidence_refs:
  - .octon/inputs/exploratory/reviews/architecture-migration/architecture-migration-review-20260712T015106Z-57f6e8/phase-2/migration-architecture.md:104
  - .octon/framework/engine/runtime/crates/kernel/src/workflow.rs:4853
  - .octon/framework/execution-roles/_ops/scripts/git/git-autonomy-hooks-install.sh:1
  evidence_classification: STATICALLY_INSPECTED
  consequence: A candidate that writes a repo-local .git/config (via include.path) or a .gitattributes
