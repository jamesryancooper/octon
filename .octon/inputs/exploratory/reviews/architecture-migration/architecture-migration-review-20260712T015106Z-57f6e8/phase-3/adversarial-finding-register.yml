- id: L1-08
  lane: Assurance & Bypass Challenger
  category: threat
  subject: PHASE2_PLAN
  claim: 'PP-05''s sanitized-git adapter list (GIT_CONFIG_NOSYSTEM, GIT_CONFIG_GLOBAL=/dev/null, core.hooksPath=/dev/null,
    core.fsmonitor=false, protocol.*.allow=never, --no-verify) omits several git executable-extension
