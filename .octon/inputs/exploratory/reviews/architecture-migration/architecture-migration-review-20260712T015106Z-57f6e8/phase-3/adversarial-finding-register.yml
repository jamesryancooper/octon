- id: L1-09
  lane: Assurance & Bypass Challenger
  category: fault-injection
  subject: PHASE2_PLAN
  claim: PP-07's reconciliation probe (git ls-remote — 'did the ref land?') cannot attribute a landed
    ref to THIS attempt versus a concurrent actor or an earlier retry, and does not cover the target-branch-movement
    race the plan names. ls-remote returns the current remote head, not proof that this attempt's push
    (rather than a duplicate) produced it; the single-use consume it complements is a genuine read-check-write
    TOCTOU (effects.rs:564) with no lock between check and write.
  classification: REQUIRED_BEFORE_AUTONOMOUS_CLASS_B_PUBLICATION
  evidence_refs:
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/effects.rs:564
  - .octon/inputs/exploratory/reviews/architecture-migration/architecture-migration-review-20260712T015106Z-57f6e8/phase-2/migration-architecture.md:122
  evidence_classification: STATICALLY_INSPECTED
  consequence: 'The ''push landed but record lost'' case can be mis-reconciled: if a concurrent/retry
    push moved the ref, ls-remote showing the authorized SHA does not prove this attempt did it, so an
    idempotent retry may either double-apply or wrongly mark success. PP-03''s CAS fixes the token TOCTOU
    but not attempt attribution.'
  recommendation: Reconcile against an attempt-bound marker (e.g. a per-attempt pushed ref namespace refs/octon/attempts/<attempt_id>,
    or the expected exact source SHA + pre-registered target pre-SHA compared atomically at push time),
    not a bare ls-remote of the branch head. Require the broker to refuse when target pre-SHA moved (target-race)
    as the plan states, and record the attempt_id in the same transaction as the consume.
  acceptance_test: 'Crash after push-returns/before-terminal-record, with a concurrent actor advancing
    the ref: reconcile correctly classifies this attempt as landed/not-landed by attempt_id without re-pushing
    or falsely claiming success.'
  affected_decisions:
  - FD-011
  - FD-012
- id: L2-01
  lane: SIMPLIFICATION CRITIC
  category: simplification
  subject: CURRENT_REPO
  claim: 40,366 of 53,070 tracked files are under .octon/state, dominated by 20,939 files across 1,485
    per-run dirs under control/execution/runs and 3,142 under evidence/runs — per-run receipt exhaust
    committed to git. No Phase 2 packet owns run-state exhaust as a first-class simplification; PP-07
    'bounded retention' and PP-12 'trim CI gates' do not touch it.
  classification: UNNECESSARY_COMPLEXITY
  evidence_refs:
  - control/execution/runs=20939 files across 1485 run dirs (git ls-files count)
  - evidence/runs=3142 files (git ls-files count)
  - .octon/state=40366 of 53809 total tracked (git ls-files count)
  - .octon/inputs/exploratory/reviews/architecture-migration/architecture-migration-review-20260712T015106Z-57f6e8/phase-2/proposal-program-packet-map.yml:100-111
  - comprehensive-review.md:26 (~53,070 files, H-07)
  evidence_classification: ''
  consequence: For a solo operator this is the dominant clone/index/diagnose burden and it makes git the
    de-facto authoritative run store — exactly the loose-file substrate FD-005 says to replace. Adding
    SQLite for grants/tokens while leaving 24k run receipts in git creates a split substrate and does
    not reduce the file-count tax.
  recommendation: Add a dedicated packet (or fold into PP-03/PP-12) that moves per-run execution/evidence
    receipts OUT of the tracked tree into the transactional store or an ignored local runs dir with bounded
    retention + compaction, keeping only a hash-anchored index in git. Make 'run exhaust is not committed'
    a promotion gate.
  acceptance_test: After a dogfood mission set, `git ls-files .octon/state/control/execution/runs` and
    `.../evidence/runs` grow by O(index entries), not O(files-per-run); fresh clone tracked-file count
    is bounded and does not scale with historical run count.
  affected_decisions:
  - FD-005
  - FD-024
  - FD-001
- id: L2-02
  lane: SIMPLIFICATION CRITIC
  category: simplification
  subject: PHASE2_PLAN
  claim: The plan splits the credential-custody boundary into three separate components — transactional
    store (PP-03), broker (PP-04), sanitized git adapter (PP-05) — and counts them toward the '≈6 net-new'
    total, even though migration-architecture.md:100 already places the git adapter 'inside the broker'
    and all three share one trust boundary and one single-writer requirement.
  classification: USEFUL_OPTIONAL_COMPLEXITY
  evidence_refs:
  - .octon/inputs/exploratory/reviews/architecture-migration/architecture-migration-review-20260712T015106Z-57f6e8/phase-2/migration-architecture.md:97-105
  - .octon/inputs/exploratory/reviews/architecture-migration/architecture-migration-review-20260712T015106Z-57f6e8/phase-2/migration-architecture.md:65-69
  - .octon/inputs/exploratory/reviews/architecture-migration/architecture-migration-review-20260712T015106Z-57f6e8/phase-2/proposal-program-packet-map.yml:51-86
  evidence_classification: ''
  consequence: Three components/processes where one suffices means cross-process IPC, a second serialization
    boundary, and independent failure/restart modes for the exact path the whole target rests on. It also
    weakens the 'exactly one unavoidable chokepoint' property (line 65) into 'three coordinated processes
    that must all be up'.
  recommendation: Make the broker a single process that owns the rusqlite/WAL connection (sole writer)
    and runs the sanitized git adapter in-process. Keep PP-03/04/05 as ordered work items but state explicitly
    they build ONE component with one trust boundary, and revise the net-new count from ~6 to ~3 (broker+store+git-adapter,
    isolation launcher, activation controller).
  acceptance_test: There is exactly one long-lived process holding credentials, holding the single WAL
    writer handle, and executing all credentialed git; killing it fails all durable effects closed; no
    second process can open the store for write.
  affected_decisions:
  - FD-005
  - FD-006
  - FD-009
  - FD-012
