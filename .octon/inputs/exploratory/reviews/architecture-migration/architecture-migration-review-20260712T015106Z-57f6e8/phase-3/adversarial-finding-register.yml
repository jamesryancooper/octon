  - FD-007
  - FD-011
- id: L1-06
  lane: Assurance & Bypass Challenger
  category: assurance-bypass
  subject: PHASE2_PLAN
  claim: 'PP-08''s ''run gate workflows from base ref, not PR head'' has a structural hole for push-triggered
    guards and in-tree gate parameters. main-change-route-guard.yml runs on: push at github.sha (post-merge,
    so the change is already effective — not inert per S6) and defines its protected-surface list inline
    in the workflow YAML (charter_path/ledger_path at 454-455). GitHub always uses the triggering ref''s
    own workflow definition for push events, so a PR editing the guard workflow or the in-tree route/parameter
    files alters its own gate.'
  classification: REQUIRED_BEFORE_TRUST_ROOT_AUTOMATION
  evidence_refs:
  - .github/workflows/main-change-route-guard.yml:454
  - .github/workflows/main-change-route-guard.yml:515
  - .github/workflows/closure-certification.yml:4
  - .octon/framework/product/contracts/default-work-unit.yml:299
  evidence_classification: STATICALLY_INSPECTED
  consequence: 'The base-ref mitigation covers called scripts but not (a) the workflow''s own trigger/logic
    on push, (b) the inline protected-surface list, or (c) candidate-editable gate parameter files like
    default-work-unit.yml route_selection_order — all of which the candidate can edit to weaken its own
