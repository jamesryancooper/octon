  acceptance_test: With OCTON_ALLOW_STALE_RUNTIME_ROUTE_BUNDLE=1 and no signed exception, RuntimeConfig
    construction denies (CapabilityDenied); with OCTON_POLICY_MODE_OVERRIDE=shadow, enforcement mode is
    unchanged absent a signed operator artifact.
  affected_decisions:
  - FD-016
  - FD-020
- id: L1-05
  lane: Assurance & Bypass Challenger
  category: assurance-bypass
  subject: PHASE2_PLAN
  claim: PP-06 narrows but does not remove the second credentialed CI plane. pr-auto-merge.yml runs pull_request_target
    with AUTONOMY_PAT (contents:write, PR-write), checks out PR head, then cargo-builds the kernel from
    PR-head source (publication-wrapper-common.sh:173) and runs candidate-authored eligibility/merge scripts
    — so the merge ENFORCER (binary + scripts) is candidate-authored. The plan's 'base-ref eligibility'
    fix does not address the cargo-build-from-head enforcer, and omits release-please.yml (contents:write
    + AUTONOMY_PAT on push-to-main) from the second-plane inventory.
  classification: REQUIRED_BEFORE_AUTONOMOUS_CLASS_B_PUBLICATION
  evidence_refs:
  - .github/workflows/pr-auto-merge.yml:119
  - .github/workflows/pr-auto-merge.yml:287
  - .github/workflows/pr-auto-merge.yml:327
  - .octon/framework/assurance/runtime/_ops/scripts/publication-wrapper-common.sh:173
  - .github/workflows/release-please.yml:54
  evidence_classification: STATICALLY_INSPECTED
  consequence: A PR that edits protected-ci auto-merge logic (kernel or scripts) self-certifies its own
    merge using AUTONOMY_PAT credentials; a second credentialed plane (release-please with contents:write
    on main) remains outside PP-06's scope. The single-broker invariant is not achieved.
