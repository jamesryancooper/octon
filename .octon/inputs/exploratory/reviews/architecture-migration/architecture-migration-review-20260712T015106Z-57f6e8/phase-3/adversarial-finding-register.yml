- id: L1-01
  lane: Assurance & Bypass Challenger
  category: assurance-bypass
  subject: PHASE2_PLAN
  claim: 'The plan''s keystone (route the agent-launch through authorize_execution) does not achieve an
    unavoidable boundary because authorize_execution computes its Allow/Deny by executing candidate-editable
    code: compose_policy_receipt (execution.rs:2946) runs `bash <policy_runner> acp-enforce --policy <policy_file>`
    (policy.rs:432) where policy_runner=.octon/framework/engine/runtime/policy and policy_file=.octon/framework/capabilities/governance/policy/deny-by-default.v2.yml,
    both repo-tracked and candidate-editable, run un-sandboxed with inherited credentials in the trusted
    parent process.'
  classification: BLOCKER_BEFORE_PRIVILEGED_IMPLEMENTATION
  evidence_refs:
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/execution.rs:2946
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/policy.rs:432
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/policy.rs:313
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/policy.rs:672
  evidence_classification: STATICALLY_INSPECTED
  consequence: A prompt-injected candidate with repo-write edits deny-by-default.v2.yml (or replaces the
    policy runner script) to emit decision:Allow for its own ExecutorLaunch or any effect; PP-01 then
    issues+verifies a valid one-shot token and the boundary is satisfied while granting attacker-chosen
    authority. The bash <policy_runner> invocation is itself an un-sandboxed credential-inheriting spawn
    of candidate code more privileged than the agent.
  recommendation: 'Treat the ACP policy file and policy runner as trust-root: verify them from the base
    ref / an out-of-tree pin (like PP-06''s verifier), or embed the deny-by-default decision logic in
    the compiled kernel rather than an in-tree bash runner. Route this into PP-01 scope, not just PP-08
    merge gates. Add OCTON_POLICY_RUNNER_OVERRIDE/OCTON_POLICY_MODE_OVERRIDE to a deny/env_clear list
    on the authority process.'
  acceptance_test: A run in which deny-by-default.v2.yml is mutated to Allow-all (and separately, the
    policy runner script is replaced) is denied at authorize_execution because the policy/runner digest
    does not match a base-ref/out-of-tree pinned value.
  affected_decisions:
  - FD-003
  - FD-004
  - FD-015
  - FD-017
