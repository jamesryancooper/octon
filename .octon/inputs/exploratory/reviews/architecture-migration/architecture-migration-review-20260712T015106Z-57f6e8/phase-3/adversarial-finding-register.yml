- id: L1-03
  lane: Assurance & Bypass Challenger
  category: fault-injection
  subject: CURRENT_REPO
  claim: 'OCTON_POLICY_RUNNER_OVERRIDE (policy.rs:309-313) accepts an arbitrary runner executable path
    with NO repo-root restriction in production builds: the filter `!cfg!(test) || override_path.starts_with(&cfg.repo_root)`
    short-circuits to true whenever cfg!(test) is false, so the starts_with check never runs outside tests.'
  classification: high
  evidence_refs:
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/policy.rs:309
  evidence_classification: STATICALLY_INSPECTED
  consequence: Any actor able to set the authority process's environment points the ACP decision runner
    at an arbitrary executable that returns Allow — a complete authority substitution. The Phase 2 plan
    (3.5) hardens only OCTON_ALLOW_STALE_RUNTIME_ROUTE_BUNDLE and never mentions this override.
  recommendation: Remove OCTON_POLICY_RUNNER_OVERRIDE from production entirely (gate behind cfg!(test)),
    or require the override to resolve to a base-ref/out-of-tree pinned digest. Add it to PP-01/PP-02
    env_clear/deny scope.
  acceptance_test: Setting OCTON_POLICY_RUNNER_OVERRIDE=/tmp/allow_all in a release binary is ignored/rejected;
    authorize_execution uses only the pinned runner.
  affected_decisions:
  - FD-003
  - FD-015
- id: L1-04
  lane: Assurance & Bypass Challenger
  category: fault-injection
  subject: CURRENT_REPO
  claim: OCTON_POLICY_MODE_OVERRIDE (policy_engine/src/lib.rs:969-977) lets any env-setter downgrade policy
    mode to `shadow`, and OCTON_ALLOW_STALE_RUNTIME_ROUTE_BUNDLE (core/src/config.rs:215) fails OPEN —
    it replaces verify_runtime_route_bundle with runtime_route_bundle_publication_bypass, disabling the
    FD-020 digest-drift enforcement the plan lists as a strength.
  classification: high
  evidence_refs:
  - .octon/framework/engine/runtime/crates/policy_engine/src/lib.rs:969
  - .octon/framework/engine/runtime/crates/core/src/config.rs:215
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/execution.rs:68
  evidence_classification: STATICALLY_INSPECTED
  consequence: A bare env var (=1/=true) neutralizes either enforcement mode or the digest binding of
    the effective route bundle. Because agents inherit env today (no env_clear) and these are read in
    the parent process, the FD-020 dynamic proof and policy enforcement can be turned off from the run
    environment.
  recommendation: Make the stale path fail CLOSED (deny, require a signed run-scoped exception artifact
    per plan 3.5) and treat OCTON_POLICY_MODE_OVERRIDE as an operator-only signed override; enumerate
    ALL OCTON_* allow/override/bypass vars in the safe-intermediate-states prohibited list, not just the
