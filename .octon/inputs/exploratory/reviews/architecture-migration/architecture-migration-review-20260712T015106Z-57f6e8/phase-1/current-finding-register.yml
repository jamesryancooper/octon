    recursion limits (lifecycle.rs:2531-2542 postmortem file collection; lifecycle_program.rs:6444-6453
    evidence collection; token_budget.rs:225-226 min_depth/max_depth are a budget ladder, not delegation
    depth). max_child_concurrency (lifecycle.rs:181, lifecycle_program.rs) bounds PARALLELISM, not delegation
    nesting depth.
  status: CURRENT_REPOSITORY_FACT
  evidence_classification: STATICALLY_INSPECTED
  confidence: high
  file_refs:
  - .octon/framework/engine/runtime/crates/kernel/src/lifecycle.rs:2531-2542
