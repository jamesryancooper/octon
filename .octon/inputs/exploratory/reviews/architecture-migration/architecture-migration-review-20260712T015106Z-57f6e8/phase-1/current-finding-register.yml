  symbol_refs:
  - build_executor_command
  - execute_agent
  - run_with_timeout
  - configure_process_group
  consequence: Any agent process launched by the lifecycle executor runs with full ambient credentials
    and full canonical-repo write access mediated only by the third-party executor CLI's own sandbox (codex)
    or by nothing at all (claude). A compromised or misbehaving prompt can read GITHUB_TOKEN/SSH keys
