- finding_id: J-04
  subagent: Subagent J
  claim: Effect-token single-use consumption is a non-transactional read-check-then-write with no atomic
    reservation, no cross-process lock, and non-atomic file persistence (plain fs::write, no temp+rename,
    no O_EXCL, no fsync). The 'already consumed' guard is checked at effects.rs:564 but status is only
    flipped and persisted at effects.rs:658 via persist_token_record -> write_json (policy.rs:81-88 plain
    fs::write). The material effect the token authorizes happens in the caller after verify_authorized_effect
    returns.
  status: CURRENT_REPOSITORY_FACT
  evidence_classification: STATICALLY_INSPECTED
  confidence: high
  file_refs:
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/effects.rs:564-666
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/effects.rs:1154-1156
  - .octon/framework/engine/runtime/crates/authority_engine/src/implementation/policy.rs:81-97
  symbol_refs:
  - verify_authorized_effect
  - persist_token_record
  - write_json
  consequence: Idempotency/replay safety is not guaranteed for effect-token single-use. A crash after
    the material durable effect but before persist_token_record leaves status != consumed, so a crash-retry
    re-verifies and re-authorizes the same effect -> duplicated durable effect. Two concurrent verifiers
    can both pass the consumed-check at 564 before either persists at 658 (TOCTOU), double-consuming a
    single-use token. There is no transactional reserve-then-commit and no exactly-once boundary.
  minimum_repair: 'Reserve atomically before the material effect: create a per-token reservation via OpenOptions::new().create_new(true)
    (O_EXCL) or an advisory flock held across verify+consume, mark consumed BEFORE returning the VerifiedEffect
    (reserve-first), and persist records via write-to-temp + atomic rename + fsync. Treat an existing
    reservation as EFFECT_TOKEN_ALREADY_CONSUMED.'
