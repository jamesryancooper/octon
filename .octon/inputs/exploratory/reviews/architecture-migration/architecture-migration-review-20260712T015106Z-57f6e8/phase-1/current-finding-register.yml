    env_clear across lifecycle_executor and the kernel lifecycle/workflow/pipeline spawn paths returns
    none; the only .env() calls set OCTON_* flags additively (e.g. workflow_leaf.rs:438, lifecycle_program.rs:9652,21909-21912).
    The pipeline agent spawn (run_with_stdin, pipeline.rs:1846-1866) likewise never clears env.
