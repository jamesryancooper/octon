- finding_id: A-04-NO-DELEGATION-DEPTH-BOUND
  subagent: SUBAGENT A
  claim: No semantic delegation-depth guard exists anywhere in the runtime. Grep for delegation_depth/invocation_depth/agent_depth/max_delegation/spawn_depth/nesting_depth/child_depth
