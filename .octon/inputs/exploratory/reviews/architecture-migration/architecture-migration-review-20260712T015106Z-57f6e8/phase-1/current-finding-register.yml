findings:
- finding_id: A-01-LIFECYCLE-SECOND-AUTHORITY-PLANE
  subagent: SUBAGENT A
  claim: The lifecycle route executor makes its OWN authorization decision by self-constructing a DelegationProof
    and never consumes a canonical GrantBundle from authority_engine::authorize_execution. lifecycle_executor
    does not even depend on authority_engine (absent from its Cargo.toml). adapter.rs::execute_route calls
    authorization::authorize_before_dispatch (authorization.rs:39), which in build_and_write_proof (authorization.rs:57-151)
    validates a route-supplied delegation_contract and a caller-supplied request.policy.invocation_authority
    map, then writes its own DelegationProof (struct at authorization.rs:16-37, self-constructed invocation_authority
    BTreeMap at 85-96). This is a second, self-attesting authority plane competing with authorize_execution.
  status: CURRENT_REPOSITORY_FACT
  evidence_classification: STATICALLY_INSPECTED
  confidence: high
  file_refs:
  - .octon/framework/engine/runtime/crates/lifecycle_executor/src/authorization.rs:16-151
  - .octon/framework/engine/runtime/crates/lifecycle_executor/src/adapter.rs:94-147
  - .octon/framework/engine/runtime/crates/lifecycle_executor/Cargo.toml
  symbol_refs:
  - authorize_before_dispatch
  - build_and_write_proof
  - DelegationProof
  - authorize_execution
  - GrantBundle
  consequence: There are two divergent sources of execution authority. Agent-route dispatch (the path
    that spawns Claude/Codex) is authorized by a proof the executor writes about itself from caller-supplied
    invocation_authority, not by the canonical authority_engine grant. A caller controlling the LifecycleRouteExecutionRequest
    (route.delegation_contract + policy.invocation_authority) can satisfy the executor's own gate without
    any authority_engine ALLOW decision, defeating FD-003's single-source guarantee for the highest-consequence
    effect (process creation of an autonomous agent).
  minimum_repair: 'Make lifecycle route dispatch consume a canonical grant: have the kernel lifecycle
    driver call authority_engine::authorize_execution for the route and pass the resulting GrantBundle
    (or a verified ExecutorLaunch token) into the adapter; have authorize_before_dispatch verify that
    canonical grant instead of (or in addition to) building its own DelegationProof from caller-supplied
    invocation_authority.'
  acceptance_test: Construct a LifecycleRouteExecutionRequest with a valid delegation_contract and invocation_authority.mode='unattended'
    but with NO corresponding authority_engine grant/ExecutorLaunch token on disk; assert execute_route
    refuses to spawn (returns authorization-proof-failed) rather than proceeding to run_with_timeout/spawn.
  affected_final_decisions:
  - FD-003
  - FD-004
