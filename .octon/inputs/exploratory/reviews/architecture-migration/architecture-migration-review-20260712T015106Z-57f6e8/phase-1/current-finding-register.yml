- finding_id: B-01
  subagent: Subagent B
  claim: The lifecycle executor spawns candidate work (codex/claude/auto) as a direct child process with
    NO OS-level sandbox and NO environment scrubbing. build_executor_command uses Command::new(executor_bin)
    with current_dir(repo_root) (the CANONICAL repo), never calls env_clear/env_remove, and only passes
    flags to the executor CLI itself. For codex it passes the Codex CLI's own '--sandbox workspace-write';
    for claude it passes only '-p --output-format text' with NO sandbox flag whatsoever. The child therefore
    inherits the full parent environment (any GITHUB_TOKEN, GH_TOKEN, SSH_AUTH_SOCK, git credentials)
    and runs against the canonical working tree.
  status: CURRENT_REPOSITORY_FACT
  evidence_classification: STATICALLY_INSPECTED
  confidence: high
  file_refs:
  - .octon/framework/engine/runtime/crates/lifecycle_executor/src/codex.rs:416-452
  - .octon/framework/engine/runtime/crates/lifecycle_executor/src/codex.rs:439-441
  - .octon/framework/engine/runtime/crates/lifecycle_executor/src/codex.rs:449
