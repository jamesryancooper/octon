schema_version: proposal-v1
proposal_id: run-program-clean-delivery-validator-hardening
title: Run Program Clean Delivery Validator Hardening
summary: Harden clean-delivery validators so terminal claims require disclosure validation, no open blockers, delivery evidence, remote/local match, and a clean worktree.
