  - ".octon/framework/assurance/runtime/_ops/scripts/validate-evidence-disclosure-tiers.sh"
  - ".octon/framework/assurance/runtime/_ops/tests/test-run-program-clean-delivery-validator.sh"
  - ".octon/framework/assurance/runtime/_ops/tests/"
status: in-review
change_profile: atomic
lifecycle:
  temporary: true
  exit_expectation: Review this child independently, implement validator hardening after accepted review, and close out with child-owned validator evidence.
related_proposals:
