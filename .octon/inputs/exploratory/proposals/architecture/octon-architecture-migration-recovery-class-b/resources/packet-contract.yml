schema_version: "octon-architecture-migration-child-packet-v1"
proposal_id: "octon-architecture-migration-recovery-class-b"
logical_packet_id: "RP-08"
workgroup_id: "RWG-08"
parent_program: "octon-architecture-migration-program"
title: "Recovery, Reconciliation, and Complete Class B Vertical"
purpose: >-
  Prove that admitted consequential work completes or converges safely without
  routine operator intervention by reconciling every unknown before retry,
  preserving honest attribution and work, and exercising one complete SI-06
  Class B vertical.
problem_statement: >-
  Existing risk routes, effect records, post-effect observations, missions, and
  status projections do not form one crash-safe T1/send/T2 behavior. Remote
  state equality can be mistaken for causal performance, retries can occur
  without complete reconciliation, and provider/broker/verifier/evidence
  outages lack full zero-prompt work-preserving proof.
current_repository_state:
  - "Risk/route and mission-autonomy concepts exist, but explicit immutable A/B/C zero-prompt behavior is not fully proved."
  - "Effect-token and observation paths exist without a complete provider-specific ATTEMPTING/UNKNOWN/reconcile behavior."
  - "Provider desired-state observation cannot by itself attribute an effect to this attempt."
  - "Run-health projections and mission continuation exist but do not expose the complete Class B attempt/degraded model."
  - "No complete scheduled-maintenance plus reversible-effect SI-06 fault proof exists."
current_evidence:
  classification: "STATICALLY_INSPECTED"
  proof_method: "static inspection and reconciled review evidence"
  limitations:
    - "No scratch-provider full transition, race, lost-response, or attribution matrix exists."
    - "No immutable 20-case A/B/C zero-prompt/PR/downgrade matrix has run."
    - "Settled/retired ROD-002 rules are not yet durably encoded and proved; no operator vote remains pending."
accepted_decisions:
  - "FD-002"
  - "FD-012"
  - "FD-016"
target_state:
  - "Every run binds exact RP-03/RP-05/RP-06/RP-07 interface and policy digests."
  - "RP-03 commits T1 ATTEMPTING/outbox before send and T2 result/UNKNOWN/terminal afterward; RP-08 selects only legal transitions."
  - "Every ATTEMPTING/UNKNOWN operation is scanned and reconciled before retry."
  - "Provider evidence yields honest attempt_performed, state_satisfied, not_performed, failed, unknown, or manual_intervention outcomes."
  - "Class A and admitted B are zero-routine-prompt; valid review-required or stable pre-route high-contention B selects protected PR before effect; C/invalid/collided/unknown authority cannot downgrade or switch."
  - "Dependency outages block only affected consequence, preserve candidate/Class A/evidence, automatically restart/reconcile where supported, and expose no credentials."
  - "One fresh non-authoritative status view and bounded scheduled/reversible scratch effect establish SI-06."
scope:
  - "provider-specific result observation, classification, and UNKNOWN reconciliation"
  - "legal consumption of RP-03 T1/outbox/T2 API and restart scan"
  - "attempt_performed/state_satisfied/not_performed/failed/unknown/manual_intervention semantics"
  - "exact immutable RP-06 class and no-PR/protected-PR route consumption and reproduction"
  - "ED-003 expected-old/receipt/attribution targeted proof"
  - "dependency-specific degraded operation and broker restart/reconcile"
  - "run status and continuous-operation policy over existing mission/Run Contract machinery"
  - "scheduled maintenance, one reversible scratch effect, zero-prompt/PR/fault proof, and RP-14 metrics handoff"
non_goals:
  - "universal atomic transaction between SQLite and provider"
  - "universal exactly-once or blind retry"
  - "modification or AI interpretation of the RP-06 class/route predicate"
  - "new store, scheduler, policy engine, credential service, or workflow platform"
  - "trust-root activation, production effect proof, or full UE-014 product acceptance"
  - "PR routing for invalid, stale, revoked, raced, or mismatched authority"
invariants:
  - "No external send occurs without committed RP-03 T1 and exact idempotency/authority/evidence bindings."
  - "No retry occurs while the idempotency scope has ATTEMPTING or UNKNOWN state."
  - "Desired-state equality without attempt-bound provider evidence cannot be labeled attempt_performed."
  - "A retry after proved not_performed is a new attempt requiring fresh authority; no silent reuse."
  - "The exact RP-06 predicate/version/digest remains immutable throughout proof and runtime."
  - "Class C, invalid authority, collision, ATTEMPTING, and UNKNOWN never take Class A/B or switch to PR."
  - "RP-07 signed evidence/current head/completeness is mandatory for dependent success; no unsigned fallback."
  - "Provider/broker/verifier/store/signer/evidence failure preserves candidate work and exposes no ambient credentials."
  - "Status and scheduling are projections/orchestration inputs, not authority or substitutes for Run Contracts."
planned_durable_source_ownership:
  operation_schema_transitions_outbox_and_capacity: "RP-03, frozen and consumed"
  expected_old_effect_and_provider_observation_primitive: "RP-05 under ED-003"
  class_route_predicate_exact_verdict_and_publication_route: "RP-06, immutable and consumed"
  signatures_head_reserve_and_completeness: "RP-07, mandatory and consumed"
  provider_result_classifier_unknown_reconciler_and_attempt_outcomes: "RP-08"
  run_status_continuous_operation_and_si06_fixture: "RP-08"
  trust_root_activation: "RP-09"
  complete_two_project_30_day_product_proof: "RP-14"
proposal_lifecycle_ownership:
  manifests: ["proposal.yml", "architecture-proposal.yml"]
  status: "draft"
  authority: "proposal-local and non-authoritative"
retained_evidence_ownership:
  root: ".octon/state/evidence/validation/proposals/octon-architecture-migration-recovery-class-b/"
  required_records:
    - "exact dependency, predicate, verdict, signer/head, provider adapter, and policy digests"
    - "T1/outbox/send/T2/restart transition and fault traces"
    - "provider receipt/state observations and honest attribution decisions"
    - "20-case A/B/C/no-PR/PR/downgrade/invalid-authority route and prompt matrix"
    - "provider/broker/verifier/store/signer/evidence outage and recovery receipts"
    - "run-status snapshots, scheduled maintenance, reversible scratch effect, rollback, metrics, conformance, and drift/churn"
components_affected:
  - "run lifecycle and effect reconciliation contracts/runtime"
  - "mission autonomy, continuation, runner, ledger, and closeout integration"
  - "run-health/operator read models"
  - "continuous-operation policy over existing missions/runs"
  - "route, effect-recovery, degraded-mode, and SI-06 assurance"
files_expected_to_change:
  - ".octon/framework/engine/runtime/spec/{run-lifecycle-v1.md,effect-reconciliation-v1.md,effect-reconciliation-v1.schema.json,run-health-read-model-v1.schema.json,operator-read-models-v1.md,mission-autonomy-runtime-v2.md,mission-continuation-v1.md,mission-runner-v1.md}"
  - ".octon/framework/constitution/contracts/runtime/{mission-run-ledger-v1.schema.json,mission-continuation-decision-v1.schema.json,mission-closeout-v1.schema.json,family.yml}"
  - ".octon/framework/constitution/contracts/registry.yml"
