  - ".octon/framework/engine/runtime/crates/Cargo.toml"
  - ".octon/framework/engine/runtime/crates/kernel/src/{commands/mission.rs,lifecycle_run_admission.rs}"
  - ".octon/instance/governance/policies/{mission-autonomy.yml,mission-continuation.yml,mission-closeout.yml,continuous-operation.yml}"
  - ".octon/framework/assurance/runtime/_ops/scripts/{validate-effect-reconciliation.sh,validate-run-health-read-model.sh,generate-run-health-read-model.sh,test-mission-autonomy-scenarios.sh,validate-mission-autonomy-runtime-v2.sh}"
  - ".octon/framework/assurance/runtime/_ops/tests/{effect-reconciliation/**,test-run-health-read-model.sh,test-mission-autonomy-runtime-v2.sh}"
contracts_affected:
  - "effect-reconciliation-v1 provider observation/classification/decision/receipt"
  - "run-lifecycle-v1 unknown/reconcile/manual-intervention semantics"
  - "mission run ledger, continuation decision, and closeout attribution/status bindings"
  - "run-health-read-model-v1 fresh non-authoritative operator status"
  - "continuous-operation policy for bounded scheduled governed runs"
schemas_affected:
  - ".octon/framework/engine/runtime/spec/effect-reconciliation-v1.schema.json"
  - ".octon/framework/engine/runtime/spec/run-health-read-model-v1.schema.json"
  - ".octon/framework/constitution/contracts/runtime/mission-run-ledger-v1.schema.json"
  - ".octon/framework/constitution/contracts/runtime/mission-continuation-decision-v1.schema.json"
  - ".octon/framework/constitution/contracts/runtime/mission-closeout-v1.schema.json"
workflows_and_generated_projections_affected:
  - "T1 outbox delivery, external call, T2, startup scan, bounded provider probe, and retry admission"
  - "immutable Class A/B/C and B/no-PR/protected-PR route consumption"
  - "run-health generation/validation and mission maintenance/closeout"
  - "scheduled maintenance and reversible scratch-effect proof"
provider_configuration_observed:
  - "single-repository GitHub App and expected-old provider behavior are observed under ED-003; configuration is evidence/input, not authority"
technical_identities_affected:
  - "operation, attempt, idempotency, outbox, provider request/receipt, repository/ref/expected-old/desired-new"
  - "class predicate, verdict, route decision, policy version/digest, authorization, signer/head/checkpoint"
  - "observation, classification, reconciliation decision, probe, manual-intervention, PR, schedule, maintenance, and reversal"
trust_boundary_changes:
  - "Unknown provider outcomes become a durable no-retry boundary rather than an implicit retry condition."
  - "Provider observations are classified by explicit evidence strength; state equality no longer implies causation."
  - "The immutable class/route predicate is consumed by exact digest, preventing policy tuning during proof."
  - "Degraded operation preserves candidates and credentials remain broker-confined."
migration_preconditions:
  - "RP-06 and RP-07 exit at exact digests; transitive RP-03 T1/T2 and RP-05 ED-003 effect/observation are frozen."
  - "Settled/retired ROD-002 lineage is encoded as the immutable irreducible-ambiguity-only notification/manual-intervention rule."
  - "Current retry/provider/PR/status/scheduling call paths are inventoried."
  - "Accepted proposal, completeness, and strict architecture review pass."
migration_steps:
  - "Freeze exact interfaces/predicate, encode settled ROD-002 lineage, and apply ED-003."
  - "Publish reconciliation/outcome/status/continuous-operation contracts and exact registry entries."
  - "Implement one credentialless effect_reconciler library over frozen RP-03/RP-05/RP-06/RP-07 interfaces."
  - "Bind route digest, classify provider observations, scan ATTEMPTING/UNKNOWN, and prohibit retry until proved not_performed."
  - "Integrate deterministic pre-effect protected PR for valid review/high-contention B and deny invalid/collision/UNKNOWN/C downgrade."
  - "Extend fresh non-authoritative status and dependency-specific degraded behavior."
  - "Run scheduled maintenance/reversible scratch effect plus full route/fault/attribution proof."
  - "Atomically activate SI-06, retire blind/direct retry, and hand evidence to RP-09/RP-14."
safe_intermediate_states:
  - "Contracts validate with reconciler inert."
  - "Shadow classification reads copied scratch observations and cannot transition/provider-call."
  - "Restart scanner reports ATTEMPTING/UNKNOWN with retry disabled."
  - "Scratch T1/send/T2/reconcile runs while production Class B remains disabled."
  - "Status/continuous-operation projections report but do not authorize."
  - "SI-06 activates only after full retained proof."
prohibited_intermediate_states:
  - "Two live retry/classification behaviors or a second operation store."
  - "Changing the RP-06 predicate while measuring it."
  - "Send before T1, blind retry while unknown, or attempt_performed inferred from state equality."
  - "Invalid/stale/revoked/raced authority routed to PR or lower class."
  - "Production/trust-root target, ambient credential, unsigned evidence, or candidate verifier fallback."
  - "Generated status or schedule used as authority."
compatibility_bridges:
  - "Existing post-effect equality checks may feed shadow classification as state observations only; they cannot prove causation or authorize retry."
  - "Existing run-health and mission surfaces may be extended as projections/orchestration, but cannot replace canonical operation/route/evidence records."
  - "Protected PR is a primary valid-work route only when exact RP-06 policy selected it before effect; it is never a recovery fallback."
deprecations_and_retirements:
  - "Retire any direct/blind provider retry and shell-only canonical outcome."
  - "Retire ambiguous success wording that conflates state satisfaction with attempt performance."
  - "Retire every technical-failure route switch and any PR path that accepts invalid authority or changes candidate/verdict/evidence."
  - "Retire duplicate/legacy status sources after fresh canonical projection cutover."
rollback_strategy: >-
  Disable autonomous Class B/no-PR, preserve exact candidate, operation intent,
  unknown state, signed evidence, and frozen route. Any later protected PR
  requires a fresh valid pre-effect RP-06 decision. Restore only a prior certified
  reconciler behind the same authority/store/broker/verifier/signer boundaries.
recovery_strategy: >-
  Restart broker and scanner, reconcile every ATTEMPTING/UNKNOWN through bounded
  authenticated probes, record honest attribution or manual intervention, and
  require fresh authority for any proved-not-performed retry. Never expose
  credentials or restore blind/unsigned/candidate-controlled paths.
validation_plan:
  - "20-case immutable A/B/C/no-PR/PR/downgrade/invalid-authority zero-prompt route matrix"
  - "kill before/during/after T1/outbox/send/provider/T2/checkpoint/status/PR/reversal"
  - "lost/duplicate/timeout/target-race/concurrent-actor/expected-old/provider-outage attribution and retry tests"
  - "provider/broker/verifier/store/signer/head/reserve/evidence/PR outage and restart/reconcile"
  - "status freshness/non-authority, scheduled maintenance, reversible scratch effect, no-production/no-trust-root"
  - "predicate digest immutability, no direct provider/blind retry/ambient credential/universal exactly-once scans"
evidence_to_retain:
  - "exact commit and dependency/predicate/policy digests"
  - "transition/fault traces, provider observations/receipts, attribution/reconciliation decisions, signed checkpoints"
  - "route/prompt/unauthorized-effect/PR matrix and no-policy-mutation result"
  - "degraded/restart/recovery/status/scheduled/reversible-effect/rollback receipts and component metrics"
support_claim_effect: >-
  Produces component proof for one admitted SI-06 Class B tuple but creates no
  new live support claim. RP-14 independently proves the full two-project,
  30-day, speed, recovery, setup, and maintenance envelope.
operator_experience_effect: >-
  Routine eligible A/B work completes without questions; protected PR appears
  only when the immutable pre-effect predicate selected review. One fresh
  status view shows exact outcome, attribution, preserved work, and next
  automatic action; only an irreducibly ambiguous effect state asks one
  actionable question under the settled ROD-002 rule.
setup_and_maintenance_effect: >-
  One reconciler library reuses the store, broker, verifier, signatures,
  missions, and read models. Scheduled maintenance is a bounded governed run,
  not a new scheduler or persistent agent loop.
dependencies:
  - logical_packet_id: "RP-06"
    proposal_id: "octon-architecture-migration-verification-publication"
    required_interface: "frozen immutable A/B/C and B/no-PR/protected-PR predicate, exact verdict, and publication route"
  - logical_packet_id: "RP-07"
    proposal_id: "octon-architecture-migration-signed-evidence"
    required_interface: "verified direct observations/checkpoints, current head, reserve/completeness, and degraded evidence state"
parallelization_constraints:
  - "Design/tests may proceed, but activation/exit waits for RP-06/RP-07 and frozen transitive RP-03/RP-05 interfaces."
  - "RP-08 must not modify the predicate while proving it and exits before RP-09 activation enablement."
  - "Tests use scratch provider targets until RP-14 final dogfood."
  - "Shared registry/Cargo/policy entries are serialized; exact semantic ownership remains with source packets."
must_not_run_concurrently_with:
  - "Any change to frozen RP-03 transition API, RP-05 effect/observation, RP-06 predicate/verdict, or RP-07 evidence semantics during proof."
  - "Any trust-root activation or production effect using the candidate SI-06 implementation."
operator_decisions:
  - operator_decision_id: "ROD-002"
    status: "settled-retired-lineage"
    subject: "Autonomy risk, protected-scope, PR, and ambiguity posture"
    fixed_boundary: "Deterministic policy classifies; AI cannot authorize; invalid/stale/revoked/raced authority denies and requires fresh authorization rather than PR laundering."
    accepted_rule: "Use the frozen intake predicates; eligible Class B publishes through verified no-PR, deterministic protected PR handles review-required valid work, Class C/trust roots remain protected, agents never work directly on main, and one concise action appears only for irreducible ambiguity."
    remaining_work: "Durably encode and prove the accepted rule by RP-08 design exit; do not request another operator vote."
engineering_dispositions:
  - disposition_id: "ED-003"
    relationship: "shared RP-05/RP-08"
    applied_default: "Single-repository GitHub App, atomic expected-old fast-forward provider operation, authenticated receipt when available, explicit state_satisfied versus attempt_performed semantics."
    escalation_condition: "Escalate only if provider capability cannot satisfy atomicity/attribution boundary; targeted proof narrows claims before changing fixed safety."
blocking_findings: ["RF-011", "RF-018", "RF-026", "RF-028"]
unresolved_evidence:
  - evidence_id: "UE-004"
    ownership: "shared RP-03 substrate and RP-08 behavior proof"
  - evidence_id: "UE-007"
    ownership: "RP-08 attribution proof over RP-05 provider primitive"
  - evidence_id: "UE-014"
    ownership: "RP-14 cross-reference; RP-08 contributes SI-06 fixtures and component metrics only"
entry_criteria:
  - "RP-06/RP-07 exit evidence and frozen transitive RP-03/RP-05 interface digests exist."
  - "Settled ROD-002 lineage is durably encoded and ED-003 is recorded without changing the frozen predicate/safety boundary."
  - "Current retries, provider probes, PR routes, status generators, and schedules are inventoried."
  - "Completeness and strict review receipts pass."
exit_criteria:
  - "No external send lacks T1 and no retry occurs before UNKNOWN reconciliation."
  - "Every operation/attempt reaches honest terminal or manual_intervention with correct attribution strength."
  - "A/B routine prompts are zero, valid review-selected PR is deterministic, false A/B-to-PR and invalid/collision/UNKNOWN-to-PR are zero, and predicate digest is unchanged."
  - "Failures preserve work/Class A/evidence, expose no credentials, and broker restart/reconcile meets the admitted recovery target."
  - "Status is concise/fresh/non-authoritative and scheduled maintenance plus reversible scratch effect complete/recover."
  - "PO-FD-002/012/016 and UE-004/007 pass; UE-014 handoff is complete."
proof_produced:
  - proof_obligation: "PO-FD-002"
    promotion_gate: "PG-08-CLASS-ROUTES"
    evidence_target: "ADVERSARIALLY_TESTED"
    required_result: "Representative A/B missions are zero-prompt and C/ambiguity/invalid-authority lower routes deny under an unchanged predicate."
  - proof_obligation: "PO-FD-012"
    promotion_gate: "PG-08-EFFECT-RECOVERY"
    evidence_target: "ADVERSARIALLY_TESTED"
    required_result: "T1/send/T2 fault matrix never repeats while unknown and preserves honest state_satisfied/attempt_performed attribution."
  - proof_obligation: "PO-FD-016"
    promotion_gate: "PG-08-DEGRADED-MODE"
    evidence_target: "ADVERSARIALLY_TESTED"
    required_result: "Provider/broker/verifier/store/signing/evidence outages block only affected consequences, preserve work/Class A, and expose no ambient credentials."
authoritative_promotion_requirements:
  - "accepted proposal, passing completeness, and strict architecture review"
  - "frozen dependency/predicate digests, settled ROD-002 policy encoding, ED-003, and exclusive shared entry ownership"
  - "retained PG-08-CLASS-ROUTES/EFFECT-RECOVERY/DEGRADED-MODE and UE-004/007 results"
  - "passing conformance and drift/churn receipts before closeout"
brokered_no_pr_revision:
  route_freeze: "repository/source/target/O/S/V/grant/policy/history/route freeze at T1; no mutation while ATTEMPTING or UNKNOWN"
  fresh_tuple_rule: "expected-old/base/head mismatch requires fresh O, grant, V, policy decision, and attempt"
  pr_subeffects: ["source-ref-create-update", "PR-create-update", "merge"]
  outcome_vocabulary: ["attempt_performed", "state_satisfied", "not_performed", "failed", "unknown", "manual_intervention"]
  retry_rule: "every UNKNOWN reconciles before retry; route never switches"
  mirror_status: "classify downstream local-main mirror without making it authority"
  cleanup_ownership: "RP-08 exclusively owns eligibility/status/recovery; RP-05 supplies expected-tip primitive"
  cleanup_truth: "closed-unmerged never deletes; failure is landed/cleanup-deferred"
  findings: ["BNP-F-004", "BNP-F-005", "BNP-F-006", "BNP-F-007", "BNP-F-011", "BNP-F-012", "BNP-F-013"]
