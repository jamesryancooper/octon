proposal_id: "octon-architecture-migration-recovery-class-b"
title: "Recovery, Reconciliation, and Complete Class B Vertical"
summary: >-
  Consume the frozen class-route predicate, transactional attempt API, and
  signed-evidence contract to reconcile every unknown provider outcome before
  retry, preserve honest attribution, provide narrow degraded operation and
  concise status, and prove a zero-routine-prompt Class B vertical with
  frozen routes, deterministic policy-selected protected PR, conditional
  cleanup, and no technical-failure fallback.
