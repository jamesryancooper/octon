  - "Signed range/terminal checkpoints plus candidate-inaccessible monotonic head reject old valid snapshot and anchor rollback/fork."
  - "Logical and real physical terminal reserves preserve complete denial/failure/revocation/rollback/closeout under constrained-volume ENOSPC faults."
  - "Quotas/pins bound evidence; crash-safe compaction never deletes before verified checkpoint/head/receipt and never deletes pinned data."
  - "Raw payloads remain local/outside project Git; only minimal verified signed checkpoints/pointers project."
  - "Missing signer/evidence blocks dependent transitions, preserves work, and exposes no unsigned/Git-only fallback."
