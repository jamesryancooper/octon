technical_identities_affected:
  - "broker signer role, stable identity, key id, epoch, algorithm, revocation state"
  - "verifier signer role, stable identity, key id, epoch, algorithm, revocation state"
  - "repository/project/run/operation/attempt/evidence identities"
  - "observation sequence, payload digest, prior signed head, checkpoint range and terminal identity"
  - "monotonic anchor scope/identity/sequence/checkpoint digest"
  - "logical terminal reservation, physical reserve slot/class, pin, compaction, and projection identities"
trust_boundary_changes:
  - "Producer identity becomes cryptographically bound to canonical direct observations rather than inferred from writable local files."
  - "Latest accepted evidence state moves outside the candidate and DB snapshot rollback unit through a narrow compare-and-advance anchor."
  - "Physical terminal headroom becomes an admission precondition in addition to RP-03 logical reservation."
  - "Raw evidence remains local and bounded; project-Git checkpoints/pointers are non-authoritative verified projections."
migration_preconditions:
  - "RP-03 exits with frozen operation/outbox/logical-capacity API and single canonical SQL operation model."
  - "RP-04 exits with frozen direct broker observation input and exact evidence adapter module boundary."
  - "RP-06 exits with frozen direct verifier observation input and exact evidence adapter module boundary."
  - "Accepted ROD-001 fixes bounded local raw evidence outside Git, longer-lived signed recovery references, terminal reserve, no unsigned fallback, and deny/preserve-work behavior; a separate engineering record fixes signer, anchor, reserve, backup mechanisms and provisional values."
  - "Every current evidence/checkpoint writer and cryptographic claim is inventoried at the implementation commit."
migration_steps:
  - "Freeze dependency digests and ROD-001 policy; assign exact shared entries/modules."
  - "Publish strict signed-envelope/checkpoint, retention, checkpoint, capacity, locality, and projection contracts/policies."
  - "Implement one evidence_attestation library over the frozen RP-03 outbox/capacity API with protected signer, head, reserve, pin, and compaction interfaces."
  - "Integrate exact broker/verifier evidence modules that sign only direct observations with distinct identities."
  - "Preallocate/verify terminal headroom and bind logical reservations to bounded physical size classes."
  - "Shadow-sign, produce/reverify checkpoints, advance head, and rehearse compaction with deletion disabled."
  - "Execute UE-008 plus PO-FD-013/014 fault matrices and truthful status/locality/burden checks."
  - "Atomically require verified signatures, current head, reserve, and retention for dependent success/publication; retire unsigned/duplicate live paths."
safe_intermediate_states:
  - "Contracts and policies validate while all new runtime behavior remains inert."
  - "Shadow signatures write isolated non-live evidence while autonomous publication remains disabled."
  - "Signed checkpoints and head advancement run with raw deletion disabled."
  - "Reserve integration runs deny-only in fixtures; failure reduces autonomy and preserves candidate work."
  - "Compaction rehearses against copies/no-delete until all pin/crash/rollback proofs pass."
  - "All four live gates activate atomically after retained proof."
prohibited_intermediate_states:
  - "Unsigned and signed evidence are both accepted for live success/publication."
  - "A DB-local or Git record is treated as the candidate-inaccessible monotonic head."
  - "Logical reservation is claimed sufficient without real allocated terminal capacity."
  - "Compaction deletes before independent checkpoint verification and durable anchor/receipt commit, or deletes an active pin."
  - "Candidate, broker, and verifier can alias/access private identities."
  - "Two canonical journal/checkpoint/signature truth paths remain live."
  - "Missing evidence causes false success, wider authority, or an unsigned/Git-only fallback."
compatibility_bridges:
  - "Current hash-linked records may be read as unsigned historical inputs during isolated shadow comparison; they cannot satisfy the activated signed-evidence gate."
  - "Current checkpoint-v2 fixtures may be migrated to the new strict contract in a bounded no-live-claim conversion; no permissive reader survives activation."
  - "Current compact indexes may be reused only as derived selection aids after their source digests are verified; they never authorize deletion."
deprecations_and_retirements:
  - "Retire unkeyed hash-valued signature/attestation claims or rename them accurately where they remain digest-only."
  - "Retire unsigned success/publication evidence and any candidate-writable latest-head interpretation."
  - "Retire duplicate canonical runtime_bus/replay_store journal truth after RP-03 convergence; RP-07 retains only signed projections over the one model."
  - "Retire raw project-Git evidence payloads by classification/localization after verified signed checkpoints preserve required proof."
rollback_strategy: >-
  Disable new consequential admission and dependent autonomous
  success/publication, preserve candidate work, raw evidence, pins, reserve,
  and last trusted signed head, and restore only a prior certified RP-07
  implementation behind the same producer-signature, monotonic-head, physical
  reserve, and compaction boundaries. Never restore unsigned or Git-only proof.
recovery_strategy: >-
  Recover/rotate signer and anchor only through the ROD-001 posture, reverify
  exact producer/key epochs and last trusted head, drain RP-03 outbox
  idempotently, replenish/verify physical reserve before admission, and resume
  compaction from durable checkpoint/anchor/receipt coverage. Irrecoverable
  ambiguity remains blocked/manual intervention with work preserved.
validation_plan:
  - "strict schema, canonical serialization, role/key epoch/revocation, algorithm downgrade, and independent verification"
  - "wrong/revoked key, producer forgery, payload mutation, rechain, non-canonical bytes, identity alias, and Git-only negative fixtures"
  - "older valid snapshot, equal-sequence fork, lower head, anchor rollback, key rotation/loss, and backup/restore"
  - "same-transaction logical reservation, concurrent double-spend, real allocated reserve, ENOSPC terminal classes, partial-write, and replenish faults"
  - "quota/window/count/byte/inode bounds, active/unknown/rollback/latest/operator pins, compaction crash at every boundary, and coverage mutation"
  - "raw project-Git absence, minimal signed pointer freshness, evidence-not-authority, one-screen status, zero routine prompt, and 30-day burden"
evidence_to_retain:
  - "exact implementation commit and dependency/policy digests"
  - "public signer role/key/epoch/algorithm/revocation metadata and negative fixtures without private material"
  - "canonical observations/checkpoints, verification results, head/anchor receipts, rollback/fork/snapshot results"
  - "reserve allocation, ENOSPC/terminal-class, atomic-write, and replenishment results"
  - "quota/pin/compaction/crash coverage, raw-local/project-Git scans, bounded volume and maintenance metrics"
  - "status/degraded snapshots, cutover receipt, rollback rehearsal, conformance and drift/churn receipts"
support_claim_effect: >-
  Produces component proof needed for authentic bounded local evidence and
  low-space-safe terminal records, but creates no current support claim. Live
  claims remain bounded to separately admitted platform/filesystem/key tuples
  and RP-14 independent integrated promotion proof.
operator_experience_effect: >-
  Healthy evidence signing, checkpointing, reserve maintenance, and compaction
  are automatic and zero-prompt. One status view explains signer/head/reserve/
  quota/pin health, preserved work, and a single safe repair route when blocked.
setup_and_maintenance_effect: >-
  One library and two exact producer adapters reuse the transactional store,
  platform credential protection, and existing retention roots. Automatic
  quotas/compaction prevent raw/tracked growth; ROD-001 and 30-day proof must
  keep recovery and administration inside the solo-builder burden budget.
