    required_interface: "frozen verifier direct-observation payload and exact evidence adapter module without verdict/publication-semantic transfer"
parallelization_constraints:
  - "Contract and test design may proceed while dependencies implement, but RP-07 cannot activate or exit before RP-03, RP-04, and RP-06 exit."
  - "RP-07 cannot redefine RP-03 schema/transitions/runtime_bus, RP-04 effect behavior, or RP-06 verdict/publication behavior."
  - "Broker and verifier private identities remain distinct; compaction cannot delete before checkpoint verification and head commit."
  - "Shared contract-registry/Cargo entries and exact evidence adapter modules are serialized at integration."
must_not_run_concurrently_with:
  - "Any change redefining the frozen RP-03 outbox/logical-capacity or canonical operation model consumed by RP-07."
  - "Any change redefining RP-04/RP-06 direct-observation payloads or the exact evidence adapter modules during activation."
  - "Any key rotation, anchor migration, reserve resize, or retention-policy change while its recovery/fault proof is running."
operator_decisions:
  - operator_decision_id: "ROD-001"
    status: "operator-accepted"
    subject: "Evidence/storage recovery and retention policy"
    fixed_boundary: "One SQLite/WAL source, signed broker/verifier observations, candidate-inaccessible monotonic head, physical terminal reserve, bounded evidence, no unsigned fallback."
    accepted_posture: "Bounded local raw evidence outside project Git; longer-lived signed receipts/checkpoints/rollback references; terminal reserve; no unsigned fallback; deny dependent transitions and preserve work when recovery evidence is not guaranteed."
    recommended_default: "Separate platform Keychain identities; candidate-inaccessible latest head; bounded local raw evidence; preallocated terminal headroom; Git-retained signed checkpoints/pointers; no raw project-Git payloads."
    remaining_work: "Bind accepted invariants and complete engineering mechanism/default records and proof; no operator disposition remains."
engineering_dispositions:
  - "Select signer algorithm/provider, monotonic-anchor mechanism, reserve implementation and provisional size, quota/retention defaults, and backup mechanism/generations through conservative reversible defaults and mechanism-specific proof."
