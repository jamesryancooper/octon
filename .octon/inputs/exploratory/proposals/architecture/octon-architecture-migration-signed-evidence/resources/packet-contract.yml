schema_version: "octon-architecture-migration-child-packet-v1"
proposal_id: "octon-architecture-migration-signed-evidence"
logical_packet_id: "RP-07"
workgroup_id: "RWG-07"
parent_program: "octon-architecture-migration-program"
title: "Signed Bounded Evidence, Capacity, and Retention"
purpose: >-
  Produce authentic, rollback-detecting, bounded proof that remains operable
  under low space, signer/anchor failure, and crash-safe compaction without an
  unsigned fallback or another control plane.
problem_statement: >-
  Octon currently has hash-linked evidence, checkpoint and retention contracts,
  and honest completeness concepts, but unkeyed recomputable hashes do not
  authenticate producer identity, DB-local checkpoints cannot detect restoration
  of an older valid snapshot, logical accounting does not reserve physical
  terminal writes, and raw retention/compaction is not bounded and fault-proven.
current_repository_state:
  - "Hash links and digest checks exist, but no cryptographic producer-signing primitive is active."
  - "checkpoint-v2 lacks a key-bound signature and candidate-inaccessible monotonic latest-head binding."
  - "Evidence-store and retention contracts describe useful completeness/locality concepts without an executable quota/pin/compaction path."
  - "No same-transaction plus physical terminal reserve proves denial, failure, revocation, rollback, and closeout survive ENOSPC."
  - "runtime_bus and replay_store expose journal concepts whose single-store convergence is RP-03-owned."
current_evidence:
  classification: "STATICALLY_INSPECTED"
  proof_method: "static inspection and reconciled review evidence"
  limitations:
    - "No RP-07 signing, monotonic anchor, physical reserve, or compaction implementation exists."
    - "No wrong-key, producer-forgery, rechain, old-snapshot, anchor-rollback, ENOSPC, or compaction fault matrix has run."
    - "ROD-001 is operator-accepted; invariant binding and the separate reversible engineering-default/proof record remain pending at design exit."
accepted_decisions:
  - "FD-013"
  - "FD-014"
  - "FD-016, evidence availability and dependency-specific degraded behavior only"
target_state:
  - "Broker and verifier use distinct candidate-inaccessible role-bound identities to sign canonical direct observations."
  - "Signed range and terminal checkpoints bind ordered observations, prior head, key epochs, pins, completeness, reserve state, and terminal outcome."
  - "A candidate-inaccessible compare-and-advance latest head outside the RP-03 DB rollback unit rejects older snapshots, forks, and head rollback."
  - "RP-03 T1 reserves a logical RP-07 terminal size class while RP-07 maintains fault-proven real allocated physical terminal headroom."
  - "Quotas, age/count/byte/inode bounds, pins, and verify-checkpoint-anchor-delete compaction bound raw local evidence."
  - "Raw provider/model payloads remain local/outside project Git; only classified minimal signed checkpoints/pointers are project-Git eligible."
  - "Missing signer, anchor, reserve, evidence, or compaction proof blocks the dependent transition, preserves candidate/raw work, and never falls back unsigned."
scope:
  - "canonical signed-evidence envelope and independent verifier"
  - "producer-direct broker/verifier observation adapters and role/key-epoch binding"
  - "signed range and terminal checkpoints with completeness, pins, and prior-head binding"
  - "candidate-inaccessible monotonic latest-head compare-and-advance interface and receipts"
  - "logical terminal capacity policy over RP-03 frozen API and real physical terminal reserve"
  - "evidence quotas, retention windows, pins, compaction state machine, and raw locality"
  - "minimal signed projection/publishability rules and truthful claim vocabulary"
  - "signer/storage/anchor/compaction degraded behavior, recovery, operator status, and retained adversarial proof"
non_goals:
  - "signing every event or informational log line"
  - "distributed transparency, federation, multi-operator quorum, or remote key-management service"
  - "standalone capacity lease, evidence daemon, scheduler, runtime store, or second control plane"
  - "plain Git anchoring, an unkeyed digest, or a hash-valued signature field as substitute for cryptographic verification"
  - "RP-03 SQL schema, operation transition, runtime_bus, replay_store, or writer-authority ownership"
  - "RP-04 broker effect semantics or RP-06 verdict/publication semantics"
  - "automatic proof recovery after irretrievable key and monotonic-anchor loss"
invariants:
  - "A signature binds canonical bytes, admitted producer role, stable identity, key id/epoch, algorithm, scope, sequence, prior head, and exact direct observation."
  - "Broker and verifier private identities are distinct and inaccessible to the candidate; verification does not require the producer private key."
  - "No signer may claim facts outside its direct observation, and signature presence cannot upgrade unknown causation or incomplete evidence."
  - "The monotonic latest head lives outside the candidate and outside the rollback unit of the RP-03 database."
  - "Logical reservation and real allocated physical headroom both pass before consequential admission; terminal reserve is not consumed by discretionary diagnostics."
  - "Compaction cannot delete before producer/checkpoint verification, independent re-verification, head advance, and durable receipt, and cannot delete active pins."
  - "Raw operational payloads are bounded local data outside project Git without exception; signed projections remain evidence, never authority."
  - "Missing or unverifiable evidence blocks success/publication honestly, preserves work, and has no unsigned, Git-only, or stale-head fallback."
planned_durable_source_ownership:
  signed_envelope_checkpoint_and_verification: "RP-07"
  signer_role_key_epoch_and_revocation_policy: "RP-07 after accepted ROD-001 invariant binding and engineering mechanism proof"
  monotonic_latest_head_interface_receipts_and_policy: "RP-07 after accepted ROD-001 invariant binding and engineering mechanism proof"
  terminal_size_classes_physical_reserve_and_admission_threshold: "RP-07; RP-03 owns transactional reservation implementation"
  retention_quotas_pins_compaction_and_locality: "RP-07"
  broker_direct_observation_adapter: "RP-07 exact local_broker/src/evidence.rs; RP-04 owns all effect semantics"
  verifier_direct_observation_adapter: "RP-07 exact verification_publication/src/evidence.rs; RP-06 owns all verdict/publication semantics"
  sqlite_schema_operation_transitions_outbox_and_runtime_bus: "RP-03, frozen and consumed by RP-07"
  unknown_outcome_reconciliation_and_class_b_behavior: "RP-08"
  final_integrated_burden_and_claim_reverification: "RP-14"
