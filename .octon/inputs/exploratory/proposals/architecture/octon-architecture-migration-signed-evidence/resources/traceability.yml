proof_coverage:
  - proof_id: "PO-FD-013"
    ownership: "direct with RP-03 interface dependency"
    promotion_gate: "PG-07-EVIDENCE-CAPACITY"
    required_result: >-
      Bounded terminal records plus preallocated non-sparse headroom or a proven
      equivalent retain complete denial, failure, revocation, rollback, and
      closeout under near-full and ENOSPC faults without a lease service.
    evidence_classification: "ADVERSARIALLY_TESTED"
    proof_method: "transaction/concurrency and constrained-volume crash-fault matrix"
  - proof_id: "PO-FD-014"
    ownership: "direct"
    promotion_gate: "PG-07-SIGNED-EVIDENCE"
    required_result: >-
      Wrong/revoked key, producer forgery, payload mutation, rechain, older
      valid snapshot, monotonic-head rollback/fork, unsafe compaction, pin
      deletion, Git-only substitution, and missing terminal evidence all deny.
    evidence_classification: "ADVERSARIALLY_TESTED"
    proof_method: "independent signature verification, rollback, compaction, pin, and completeness fault matrix"
unresolved_evidence:
  - evidence_id: "UE-008"
    status: "unresolved"
    relationship: >-
      RP-07 closes producer forgery, full rechain, old-valid-snapshot rollback,
      candidate-inaccessible head, pin-safe compaction, and low-space terminal
      evidence only after implementation and retained adversarial proof.
operator_decisions:
  - operator_decision_id: "ROD-001"
    status: "operator-accepted"
    fixed_boundary: >-
      One SQLite/WAL source, signed broker/verifier observations,
      candidate-inaccessible monotonic head, physical terminal reserve, bounded
      evidence, and no unsigned fallback.
    accepted_posture: >-
      Bounded local raw evidence outside project Git; longer-lived signed
      receipts/checkpoints/rollback references; terminal reserve; no unsigned
      fallback; deny dependent transitions and preserve work when recovery
      evidence is not guaranteed.
    remaining_work: "Bind accepted invariants and prove/tune engineering defaults; no operator disposition remains."
engineering_dispositions:
  - disposition_id: "RP07-ENGINEERING-DEFAULTS"
    status: "design-and-proof-owned"
    scope: >-
      Select signer algorithm/provider, candidate-inaccessible monotonic-anchor
      mechanism, reserve implementation, quota/retention/backup mechanisms, and
      provisional measurement-adjusted values within narrowed ROD-001 risk
      tolerances.
    acceptance: >-
      Design/Dependency Receipts plus mechanism-specific adversarial, recovery,
      compaction, key-loss/rotation, and constrained-storage proof.
dependency_coverage:
  - logical_packet_id: "RP-03"
    proposal_id: "octon-architecture-migration-transactional-runtime-store"
    required_interface: "frozen one-store operation/outbox/logical terminal-capacity API"
    forbidden_redefinition: "SQL schema, transitions, runtime_bus/replay_store convergence, or writer authority"
  - logical_packet_id: "RP-04"
    proposal_id: "octon-architecture-migration-local-broker"
    required_interface: "frozen broker direct-observation payload and exact evidence adapter module"
    forbidden_redefinition: "effect authorization, execution, provider request, or outcome semantics"
  - logical_packet_id: "RP-06"
    proposal_id: "octon-architecture-migration-verification-publication"
    required_interface: "frozen verifier direct-observation payload and exact evidence adapter module"
    forbidden_redefinition: "verdict predicate, identity separation, or publication route semantics"
downstream_coverage:
  - logical_packet_id: "RP-08"
    consumed_interface: "verified producer observations, signed terminal checkpoint, current head, reserve/completeness state, and degraded reason"
    boundary: "RP-08 owns unknown reconciliation and operation terminal/manual-intervention semantics; it cannot weaken evidence gates."
  - logical_packet_id: "RP-14"
    consumed_interface: "PO-FD-013/014 results and bounded evidence volume/maintenance reports for independent integrated promotion proof"
claim_boundary:
  current_claim: "none"
  future_claim: >-
    authentic bounded local evidence and low-space-safe terminal recording only
    for separately admitted platform/filesystem/key tuples after RP-07 proof and
    RP-14 independent integrated promotion
  exclusions:
    - "universal tamper-proof or non-repudiation"
    - "distributed/public transparency"
    - "raw payload durability beyond selected retention policy"
    - "Git history as producer authentication"
    - "authority or causation inferred from signature presence"
