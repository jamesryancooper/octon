title: "Minimal Workspace Projects"
summary: >-
  Introduce strict, durable multi-project identity and continuity records,
  operator-correctable inference, frozen per-run project snapshots, and a
  non-authoritative cross-project mission inbox without creating project-level
  authorization or portfolio administration.
