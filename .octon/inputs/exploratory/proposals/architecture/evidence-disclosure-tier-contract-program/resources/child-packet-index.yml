schema_version: "octon-proposal-program-child-registry-v2"
execution_mode: "gated-parallel"
default_child_lifecycle_id: "proposal-packet"
children:
  - child_id: "evidence-disclosure-tier-contracts"
    path: ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contracts"
    required: true
    deferred: false
    dependencies: []
    dependency_gate: "verification"
    phase_id: "phase-1"
    group_id: "contracts"
    rollback_posture: "manual"
    required_metadata:
      - "change_profile"
    source_lineage_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/resources/source-context.md"
    parent_contract_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/architecture/child-packet-contract.md"
    readiness_requirements:
      - requirement_id: "tier-contract-completeness"
        summary: "Child review must define the four evidence tiers, allowed roots, Git posture, promotion rule, and authority role."
        review_must_mention:
          - "private raw evidence"
          - "repo-publishable"
          - "generated is never authority"
    write_scopes:
      - ".octon/framework/constitution/contracts/retention/"
      - ".octon/framework/engine/runtime/spec/evidence-disclosure-tiers-v1.md"
      - ".octon/framework/engine/runtime/spec/evidence-store-v1.md"
      - ".octon/framework/constitution/obligations/evidence.yml"
    seed_role: "first-child"
  - child_id: "local-evidence-store-boundary"
    path: ".octon/inputs/exploratory/proposals/architecture/local-evidence-store-boundary"
    required: true
    deferred: false
    dependencies:
      - "evidence-disclosure-tier-contracts"
    dependency_gate: "verification"
    phase_id: "phase-2"
    group_id: "local-store"
    rollback_posture: "manual"
    required_metadata:
      - "change_profile"
    source_lineage_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/resources/source-context.md"
    parent_contract_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/architecture/child-packet-contract.md"
    readiness_requirements:
      - requirement_id: "local-only-boundary"
        summary: "Child review must prove local raw evidence is ignored by default and cannot become hosted closeout evidence by path copy."
        review_must_mention:
          - ".octon/state/evidence/local"
          - ".octon/state/evidence/.gitignore"
          - "local-only"
    predecessor_constraints:
      - predecessor_child_id: "evidence-disclosure-tier-contracts"
        constraint: "Local evidence root semantics must follow the disclosure-tier contract."
    write_scopes:
      - ".octon/state/evidence/local/"
      - ".octon/state/evidence/.gitignore"
      - ".octon/instance/governance/policies/repo-hygiene.yml"
    seed_role: "follow-on"
  - child_id: "publishable-evidence-receipts"
    path: ".octon/inputs/exploratory/proposals/architecture/publishable-evidence-receipts"
    required: true
    deferred: false
    dependencies:
      - "evidence-disclosure-tier-contracts"
    dependency_gate: "verification"
    phase_id: "phase-3"
    group_id: "publishable-receipts"
    rollback_posture: "manual"
    required_metadata:
      - "change_profile"
    source_lineage_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/resources/source-context.md"
    parent_contract_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/architecture/child-packet-contract.md"
    readiness_requirements:
      - requirement_id: "claim-sufficient-receipt"
        summary: "Child review must define concise publishable receipt fields, redaction declarations, limitations, validation summary, and local evidence references."
        review_must_mention:
          - "claim_scope"
          - "disclosure_tier"
          - "redactions"
    predecessor_constraints:
      - predecessor_child_id: "evidence-disclosure-tier-contracts"
        constraint: "Publishable receipt schema must use the tier names and promotion rule from the tier contract."
    write_scopes:
      - ".octon/framework/constitution/contracts/retention/"
      - ".octon/framework/product/contracts/"
      - ".octon/state/evidence/runs/"
    seed_role: "follow-on"
  - child_id: "disclosure-and-read-model-alignment"
    path: ".octon/inputs/exploratory/proposals/architecture/disclosure-and-read-model-alignment"
    required: true
    deferred: false
    dependencies:
      - "evidence-disclosure-tier-contracts"
      - "publishable-evidence-receipts"
    dependency_gate: "verification"
    phase_id: "phase-3"
    group_id: "disclosure"
    rollback_posture: "manual"
    required_metadata:
      - "change_profile"
    source_lineage_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/resources/source-context.md"
    parent_contract_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/architecture/child-packet-contract.md"
    readiness_requirements:
      - requirement_id: "disclosure-read-model-boundary"
        summary: "Child review must keep disclosure derived from publishable evidence and generated read models derived-only."
        review_must_mention:
          - ".octon/state/evidence/disclosure"
          - ".octon/generated"
          - "non-authority"
    predecessor_constraints:
      - predecessor_child_id: "publishable-evidence-receipts"
        constraint: "Disclosure surfaces must cite publishable receipts rather than local raw evidence."
    write_scopes:
      - ".octon/framework/constitution/contracts/disclosure/"
      - ".octon/framework/engine/runtime/spec/operator-read-models-v1.md"
      - ".octon/state/evidence/disclosure/"
      - ".octon/generated/"
    seed_role: "follow-on"
  - child_id: "evidence-tier-validator-gates"
    path: ".octon/inputs/exploratory/proposals/architecture/evidence-tier-validator-gates"
    required: true
    deferred: false
    dependencies:
      - "evidence-disclosure-tier-contracts"
      - "local-evidence-store-boundary"
      - "publishable-evidence-receipts"
      - "disclosure-and-read-model-alignment"
    dependency_gate: "verification"
    phase_id: "phase-4"
    group_id: "validation"
    rollback_posture: "manual"
    required_metadata:
      - "change_profile"
    source_lineage_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/resources/source-context.md"
    parent_contract_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/architecture/child-packet-contract.md"
    readiness_requirements:
      - requirement_id: "tier-validator-coverage"
        summary: "Child review must cover local-only tracking denials, disclosure_tier metadata, publishable receipt size/concision, and hosted-closeout local evidence denial."
        review_must_mention:
          - "tracked local evidence"
          - "oversized publishable evidence"
          - "hosted closeout"
    predecessor_constraints:
      - predecessor_child_id: "disclosure-and-read-model-alignment"
        constraint: "Validator gates must enforce both disclosure and generated read-model boundaries."
    write_scopes:
      - ".octon/framework/assurance/runtime/_ops/scripts/"
      - ".octon/framework/assurance/runtime/_ops/tests/"
      - ".octon/framework/constitution/contracts/retention/"
    seed_role: "follow-on"
  - child_id: "closeout-repo-hygiene-evidence-flow"
    path: ".octon/inputs/exploratory/proposals/architecture/closeout-repo-hygiene-evidence-flow"
    required: true
    deferred: false
    dependencies:
      - "local-evidence-store-boundary"
      - "publishable-evidence-receipts"
      - "evidence-tier-validator-gates"
    dependency_gate: "verification"
    phase_id: "phase-5"
    group_id: "closeout"
    rollback_posture: "manual"
    required_metadata:
      - "change_profile"
    source_lineage_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/resources/source-context.md"
    parent_contract_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/architecture/child-packet-contract.md"
    readiness_requirements:
      - requirement_id: "closeout-publishable-only"
        summary: "Child review must route raw cleanup logs to local evidence and publish only claim-sufficient receipts for hosted/shared closeout."
        review_must_mention:
          - "repo-hygiene-cleanup"
          - "closeout-change"
          - "publishable receipt"
    predecessor_constraints:
      - predecessor_child_id: "evidence-tier-validator-gates"
        constraint: "Closeout and repo-hygiene behavior must be guarded by validators before hosted closeout claims change."
    write_scopes:
      - ".octon/framework/capabilities/runtime/skills/remediation/closeout-change/SKILL.md"
      - ".octon/framework/capabilities/runtime/skills/remediation/repo-hygiene-cleanup/SKILL.md"
      - ".octon/framework/product/contracts/default-work-unit.yml"
      - ".octon/instance/governance/policies/repo-hygiene.yml"
      - ".octon/framework/assurance/runtime/_ops/scripts/"
    seed_role: "follow-on"
  - child_id: "evidence-residue-migration-closeout"
    path: ".octon/inputs/exploratory/proposals/architecture/evidence-residue-migration-closeout"
    required: true
    deferred: false
    dependencies:
      - "closeout-repo-hygiene-evidence-flow"
      - "evidence-tier-validator-gates"
    dependency_gate: "verification"
    phase_id: "phase-6"
    group_id: "migration"
    rollback_posture: "rollback-route"
    required_metadata:
      - "change_profile"
    source_lineage_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/resources/source-context.md"
    parent_contract_refs:
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/architecture/child-packet-contract.md"
      - ".octon/inputs/exploratory/proposals/architecture/evidence-disclosure-tier-contract-program/architecture/program-closeout-plan.md"
    readiness_requirements:
      - requirement_id: "residue-migration-safety"
        summary: "Child review must inventory existing raw cleanup evidence, decide migrate/archive/delete routing, and prove publishable replacements where needed."
        review_must_mention:
          - "existing evidence"
          - "local archive"
          - "publishable receipt"
    predecessor_constraints:
      - predecessor_child_id: "closeout-repo-hygiene-evidence-flow"
        constraint: "Existing residue must not migrate until the new closeout and repo-hygiene flow is implemented and verified."
    cutover_constraints:
      compatibility_retirement_requires_predecessor_evidence: true
      required_predecessor_child_ids:
        - "evidence-disclosure-tier-contracts"
        - "local-evidence-store-boundary"
        - "publishable-evidence-receipts"
        - "disclosure-and-read-model-alignment"
        - "evidence-tier-validator-gates"
        - "closeout-repo-hygiene-evidence-flow"
      forbidden_claims_until_ready:
        - "compatibility-retired"
        - "canonical-runtime-support"
    write_scopes:
      - ".octon/state/evidence/local/"
      - ".octon/state/evidence/runs/"
      - ".octon/state/evidence/disclosure/"
      - ".octon/framework/assurance/runtime/_ops/scripts/"
    seed_role: "follow-on"
