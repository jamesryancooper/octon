title: "Autonomous Lifecycle Blocker Recovery"
summary: >-
  Coordinated proposal program to improve proposal-program lifecycle blocker
  recovery so routine and soft blockers are repaired, validated, retried, or
  routed through cleanup autonomously while hard blockers remain the only
  operator escalation path.
