implementation_grade_summary: >-
  Future implementation must use existing lifecycle runner, validator,
  publication, cleanup, and evidence surfaces where possible; add only bounded
  recovery contracts, diagnostics, receipts, or tests required to prove
  autonomous handling without weakening hard-blocker fail-closed behavior.
