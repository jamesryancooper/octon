schema_version: "octon-architecture-migration-child-packet-v1"
proposal_id: "octon-architecture-migration-extension-supply-chain"
logical_packet_id: "RP-12"
workgroup_id: "RWG-12"
parent_program: "octon-architecture-migration-program"
title: "Private Signed Extension Supply Chain"
purpose: >-
  Make private reusable extensions authentic, pinned, revocable, recoverable,
  and explicitly non-authoritative by extending the current publication,
  quarantine, catalog, and generation-lock machinery.
problem_statement: >-
  Octon already tracks provenance digests, desired trust decisions,
  compatibility, active/quarantine state, generated catalogs, and publication
  locks, but a digest field is not signer authentication. External/private
  import, trusted signer/revocation policy, exact release availability, and
  revalidated prior-generation restoration are incomplete.
current_repository_state:
  - "Raw normalized extension packs live under inputs/additive/extensions and runtime consumes only generated/effective/extensions projections."
  - "Desired selection/source/trust posture lives in instance/extensions.yml; active and quarantine truth live in state/control/extensions."
  - "Extension pack provenance carries source locators, digest_sha256, and attestation_refs, but no mandatory canonical signed envelope is verified for private import."
  - "The publisher validates compatibility, resolves dependencies, quarantines failures, and emits a generated catalog, artifact map, generation lock, and receipts."
  - "Runtime resolver code binds the generated catalog/lock to active state, but retained signed release restore and revocation-aware rollback are not complete."
current_evidence:
  classification: "STATICALLY_INSPECTED"
  proof_method: "static inspection"
  limitations:
    - "No unsigned/wrong-key/forged/tampered/revoked import matrix has run."
    - "No exact prior-generation restore has been revalidated under a changed trust set."
    - "UE-012 remains unresolved until adversarial implementation proof exists."
accepted_decisions:
  - "FD-021"
target_state:
  - "A strict canonical signed envelope binds pack/version, immutable source ref, manifest/payload digests, dependencies, capability declarations, compatibility requirements, signer identity, and signature."
  - "The accepted ROD-004 baseline uses one operator-controlled signer family, immutable refs/digests, explicit capability grants, and an initially empty deny-by-default source allowlist; unknown, unsigned, revoked, incompatible, mutable, or capability-mismatched sources deny."
  - "One explicit import verifies source, signature, payload, safe extraction, schema, dependencies, compatibility, and capability declarations before recording exact availability."
  - "Import never changes desired selection, capability grants, active state, generated runtime projections, or the Harness."
  - "Desired source/trust/pin/selection, actual availability/active/quarantine state, and generated publisher outputs keep distinct owners and writers."
  - "Publication selects only an exact desired pin that is currently available, unrevoked, compatible, capability-admissible, and fully dependency-closed."
  - "The RP-11 Harness binds the exact published extension generation ref and digest for a run."
  - "Revocation quarantines affected releases and blocks new publication/launch; prior restore revalidates every current rule before atomic activation."
scope:
  - "strict signed private extension envelope and canonical verification input"
  - "governed allowed-source, trusted-signer/key, rotation/recovery, revocation, pin, and admission configuration under the accepted ROD-004 baseline"
  - "safe explicit local/private Git release or immutable artifact import"
  - "immutable source ref, manifest digest, canonical payload-tree digest, signature, and dependency closure verification"
  - "compatibility and requested-capability admission before availability/publication"
  - "verified availability catalog, exact pins, active/quarantine state, generated catalog/lock projection binding"
  - "revoke, quarantine, and exact retained prior-generation restore with current revalidation and receipt"
  - "one-command operator UX for import, status, revoke/repair, and governed restore"
non_goals:
  - "public marketplace, public catalog, discovery/search, ratings, payments, or arbitrary-source browsing"
  - "extension-derived authorization, automatic selection, automatic capability grant, or install-and-run"
  - "automatic unpinned updates or dependency fetching from unapproved sources"
  - "new publication service, daemon, scheduler, runtime store, authority source, or control plane"
  - "general software package manager or language dependency manager"
  - "child-agent, provider-adapter, Harness compiler, verifier/publication, or effect-recovery ownership"
invariants:
  - "Authenticity, availability, selection, publication, Harness binding, and execution authorization are separate gates."
  - "Import only makes an exact release available; it never selects, activates, grants, routes, or executes."
  - "Every external/private release and dependency is identified by immutable source ref plus manifest and payload digests and verifies against the current operator trust set."
  - "Unknown, unsigned, untrusted, revoked, mutable, tampered, incompatible, or capability-mismatched material fails closed."
  - "Runtime never reads incoming, archived, or normalized raw pack paths directly."
  - "Generated catalogs and receipts cannot override desired or actual state."
  - "Rollback never bypasses current source, signer, revocation, compatibility, capability, dependency, or pin checks."
planned_durable_source_ownership:
  signed_envelope_contract: "RP-12"
  allowed_sources_and_trusted_signers: "governed desired config extended by RP-12 under the accepted ROD-004 baseline"
  verified_availability_state_and_import_receipt: "RP-12 import verifier"
  desired_selection_and_pins: "existing instance/extensions.yml owner, contract extended by RP-12"
  actual_active_and_quarantine_state: "existing extension publisher/control-state owner, extended by RP-12"
  generated_catalog_artifact_map_generation_lock: "existing extension publisher, extended by RP-12"
  evidence_signer_and_retention_mechanism: "RP-07, consumed not owned"
  harness_generation_binding: "RP-11, consumes RP-12 published exact ref/digest"
  capability_authority_and_execution: "existing authority/capability owners, not RP-12"
proposal_lifecycle_ownership:
  manifests:
    - "proposal.yml"
    - "architecture-proposal.yml"
  status: "in-review"
  authority: "proposal-local and non-authoritative"
retained_evidence_ownership:
  root: ".octon/state/evidence/validation/proposals/octon-architecture-migration-extension-supply-chain/"
  required_records:
    - "accepted ROD-004 configuration and nonsecret trust-policy digest"
    - "signed envelope and canonical payload-tree verification fixtures"
    - "complete invalid import/quarantine matrix"
    - "availability, desired pin, active/quarantine, generated catalog/lock, and Harness binding comparison"
    - "revocation propagation and exact prior-generation restore receipts"
    - "import-does-not-authorize/select/execute state-digest proof"
components_affected:
  - "extension governance and raw pack/envelope contracts"
  - "instance desired extension source/trust/selection/pin configuration"
  - "actual availability, active, and quarantine control state"
  - "generated effective catalog, artifact map, generation lock, and published views"
  - "extension import, publication, resolution, export, and runtime handle verification"
  - "extension schema, supply-chain, quarantine, publication, and rollback assurance"
files_expected_to_change:
  - ".octon/framework/engine/governance/extensions/{README,boundary-contract,trust-and-compatibility}.md"
  - ".octon/framework/cognition/_meta/architecture/inputs/additive/extensions/README.md"
  - ".octon/framework/cognition/_meta/architecture/inputs/additive/extensions/schemas/{extension-pack,extension-signed-envelope,extension-compatibility-profile}.schema.json"
