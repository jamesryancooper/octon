  - ".octon/framework/cognition/_meta/architecture/generated/effective/extensions/**"
  - ".octon/framework/cognition/_meta/architecture/state/control/schemas/extension-{availability,active,quarantine}-state.schema.json"
  - ".octon/framework/cognition/_meta/architecture/state/evidence/validation/{compatibility,publication}/schemas/extension-*.schema.json"
  - ".octon/framework/engine/runtime/spec/extension-publication-handle-v1.md"
  - ".octon/instance/extensions.yml"
  - ".octon/instance/governance/contracts/extension-publication-policy.yml"
  - ".octon/framework/scaffolding/runtime/templates/octon/{instance/extensions.yml,state/control/extensions/**,generated/effective/extensions/**,state/evidence/validation/**/extensions/README.md}"
  - ".octon/framework/orchestration/runtime/_ops/scripts/{extensions-common,import-signed-extension-pack,publish-extension-state,resolve-extension-route,resolve-extension-prompt-bundle,export-harness}.sh"
  - ".octon/framework/engine/runtime/crates/runtime_resolver/src/{handles,lib}.rs"
