schema_version: "proposal-v1"
proposal_id: "octon-architecture-migration-extension-supply-chain"
title: "Private Signed Extension Supply Chain"
summary: >-
  Extend Octon's existing private extension publication and quarantine
  machinery with signed immutable release envelopes, an operator-owned trust
  set, exact availability and generation pins, revocation, and revalidated
  prior-generation restoration while keeping import non-authoritative.
