problem_statement: Completed proposal-program lifecycle evidence shows repeated replay of full prompts, raw logs, full program
  plans, broad generated/read-model listings, repeated policy text, child dependency state, validation output, closeout/archive
  language, and generated summaries. Octon needs token efficiency through digest-bound, evidence-preserving indirection rather
  than reduced governance.
