schema_version: octon-child-artifact-schema-sketch-v1
child_id: token-efficiency-evidence-index-raw-log-summaries
artifacts:
- name: evidence-index.yml
  purpose: Inventory retained evidence with roles, byte sizes, digests, token estimates, default visibility, and raw-read
    escalation hints.
  authority_status: non-authoritative evidence/read-model unless implemented as durable spec/template; never replaces source
    of truth
  required_fields:
  - schema_version
  - source_refs
  - source_digests
  - producer
  - consumer
  - validation
  - evidence_refs
  - failure_behavior
  failure_behavior: fail closed on missing source, digest mismatch, stale freshness, or authority-boundary violation
- name: raw-log-summary.yml
  purpose: Compact deterministic summary of raw stdout/stderr logs with prompt echo detection and byte ranges.
  authority_status: non-authoritative evidence/read-model unless implemented as durable spec/template; never replaces source
    of truth
  required_fields:
  - schema_version
  - source_refs
  - source_digests
  - producer
  - consumer
  - validation
  - evidence_refs
  - failure_behavior
  failure_behavior: fail closed on missing source, digest mismatch, stale freshness, or authority-boundary violation
- name: failing-slice-manifest.yml
  purpose: Machine-readable failing slices extracted from raw logs and validator output.
  authority_status: non-authoritative evidence/read-model unless implemented as durable spec/template; never replaces source
    of truth
  required_fields:
  - schema_version
  - source_refs
  - source_digests
  - producer
  - consumer
  - validation
  - evidence_refs
  - failure_behavior
  failure_behavior: fail closed on missing source, digest mismatch, stale freshness, or authority-boundary violation
