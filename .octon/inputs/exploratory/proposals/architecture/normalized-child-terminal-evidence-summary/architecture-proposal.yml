schema_version: architecture-proposal-v1
architecture_scope: terminal-evidence
decision_type: boundary-change
status: draft
owner: Octon lifecycle child-packet architect
created_date: 2026-06-20
summary: Add or compute a normalized terminal evidence summary for child packets and archived children.
architecture_drivers:
  - Planner and validators disagreed about terminal child evidence, causing receipt repair loops.
  - Preserve Octon fail-closed governance and child-owned evidence.
  - Reduce repeated operator intervention only where deterministic governed recovery is safe.
constraints:
  - Do not implement durable behavior in this proposal creation route.
  - Do not widen promotion targets silently.
  - Do not weaken validators or generated-output non-authority.
  - Preserve explicit authorization for material side effects.
