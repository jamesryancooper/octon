proposal_id: "octon-architecture-migration-transactional-runtime-store"
title: "Transactional Runtime Store and State Migration"
summary: >-
  Replace split file and journal concurrency authority with one local
  SQLite/WAL schema and writer, explicit T1/external/T2 operation and attempt
  transitions, generic UNKNOWN/outbox state, read-only legacy projections,
  and crash-consistent migration, capacity, backup, restore, and corruption
  handling without owning provider-specific outcome classification.
