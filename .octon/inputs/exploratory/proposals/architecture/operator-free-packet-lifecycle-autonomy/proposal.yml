schema_version: "proposal-v1"
proposal_id: "operator-free-packet-lifecycle-autonomy"
title: "Operator-Free Packet Lifecycle Autonomy Program"
summary: >-
  Parent proposal program coordinating packet-lifecycle autonomy improvements
  distilled from the instruction-envelope closeout postmortem. The program
  reduces operator decisions in packet delivery, closeout, generated freshness,
  worktree hygiene, terminal proof, and git mutation preflight while preserving
  fail-closed gates, route ownership, retained evidence, receipt truthfulness,
  generated-output non-authority, and protected-evidence cleanup safety.
