scope_statement: >-
  Proposal-program coordination only. This parent decomposes and sequences
  future sibling child packets. It does not implement durable lifecycle
  behavior, mutate generated outputs, modify the instruction-envelope run
  receipts, authorize branch cleanup, or satisfy any child-owned receipt.
program_execution_mode: "sequenced-gated"
