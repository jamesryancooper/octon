schema_version: "proposal-v1"
proposal_id: "octon-architecture-migration-candidate-isolation"
title: "Credentialless Native Candidate Isolation"
summary: >-
  Establish a useful primary-provider candidate execution boundary on macOS
  with a fresh allowed environment and HOME, closed inherited file
  descriptors, an independent disposable repository and object database,
  candidate-unreadable durable credentials, bounded filesystem, network, and
  process access, and non-executing export of the exact candidate commit.
