schema_version: "proposal-v1"
proposal_id: "product-doc-boundary-crosslinks"
title: "Product Doc Boundary Crosslinks"
summary: >-
  Link product documentation and product feature entries to the governed
  cross-surface mechanisms architecture index while preserving the product
  feature catalog as navigation-only.
proposal_kind: "architecture"
promotion_scope: "octon-internal"
change_profile: "atomic"
promotion_targets:
  - ".octon/framework/product/README.md"
  - ".octon/framework/product/features/"
  - ".octon/framework/product/contracts/"
status: "accepted"
lifecycle:
  temporary: true
  exit_expectation: >-
    Promote only after child-owned implementation authorization, validation,
    conformance, post-implementation drift/churn review, and durable promotion
    evidence exist outside proposal-local inputs. Otherwise revise, reject,
    supersede, or archive this child packet.
related_proposals:
  - "governed-cross-surface-mechanisms-documentation-architecture"
  - "mechanism-index-foundation"
program_parent: "governed-cross-surface-mechanisms-documentation-architecture"
program_phase: "phase-3"
program_group: "product-docs"
