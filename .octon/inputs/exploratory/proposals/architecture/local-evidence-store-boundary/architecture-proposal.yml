schema_version: "architecture-proposal-v1"
architecture_scope: "repo-architecture"
decision_type: "boundary-change"
title: "Local Evidence Store Boundary"
target_state: >-
  Establish the local-only raw evidence store under `.octon/state/evidence/local/**` with an Octon-scoped ignore rule and clear non-publishable authority posture.
boundary_change: >-
  Proposal packet only. Durable boundary changes must be promoted into the
  listed targets after accepted review, implementation authorization, validators,
  retained evidence, and post-implementation receipts.
authoritative_targets_after_promotion:
  - ".octon/state/evidence/local/README.md"
  - ".octon/state/evidence/.gitignore"
  - ".octon/instance/governance/policies/repo-hygiene.yml"
proposal_local_authority:
  - "proposal.yml"
  - "architecture-proposal.yml"
  - "architecture/target-architecture.md"
  - "architecture/implementation-plan.md"
  - "architecture/acceptance-criteria.md"
non_authoritative_supporting_artifacts:
  - "README.md"
  - "navigation/**"
  - "resources/**"
  - "support/**"
  - "validation-plan.md"
