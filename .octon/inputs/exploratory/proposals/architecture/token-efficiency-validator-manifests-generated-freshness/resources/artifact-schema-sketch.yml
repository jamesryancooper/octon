schema_version: octon-child-artifact-schema-sketch-v1
child_id: token-efficiency-validator-manifests-generated-freshness
artifacts:
- name: validator-result-manifest.yml
  purpose: Pass/fail counts, failing slices, contract refs, negative controls, stdout/stderr refs, and evidence digests.
  authority_status: non-authoritative evidence/read-model unless implemented as durable spec/template; never replaces source
    of truth
  required_fields:
  - schema_version
  - source_refs
  - source_digests
  - producer
  - consumer
  - validation
  - evidence_refs
  - failure_behavior
  failure_behavior: fail closed on missing source, digest mismatch, stale freshness, or authority-boundary violation
- name: publication-freshness-manifest.yml
