proposal_local_lifecycle_note: >-
  These files are proposal-local lifecycle sources for evaluating this packet.
  They are not durable closeout authority and must not be referenced by promoted
  runtime, policy, workflow, validator, generated/effective, host-projection, or
  retained-evidence surfaces as authority.
