schema_version: proposal-v1
proposal_id: proposal-governance-efficiency-operator-surface
title: Governance Efficiency Operator Surface
summary: Add an optional command or skill surface for running advisory governance efficiency evaluation without making it a required lifecycle gate.
proposal_kind: architecture
promotion_scope: octon-internal
promotion_targets:
  - ".octon/framework/capabilities/runtime/commands/"
  - ".octon/framework/capabilities/runtime/skills/"
  - ".octon/inputs/additive/extensions/octon-proposal-lifecycle/commands/"
  - ".octon/inputs/additive/extensions/octon-proposal-lifecycle/skills/"
  - ".octon/inputs/additive/extensions/octon-proposal-lifecycle/context/"
status: draft
change_profile: atomic
lifecycle:
  temporary: true
  exit_expectation: Review this child independently, then implement only optional operator access after report, collector, and scoring children reach terminal outcomes.
related_proposals:
  - proposal-program-governance-efficiency-evaluation
  - proposal-governance-efficiency-report-contract
  - proposal-governance-efficiency-evidence-collector
  - proposal-governance-efficiency-scoring-and-classification
selected_implementation_target: Optional governance efficiency evaluator command or skill surface.
scope_statement: This child owns operator-facing access and documentation for running the evaluator. It does not change scoring rules, collect evidence independently, or make evaluation mandatory.
explicit_runtime_non_implementation_statement: This proposal does not change runtime behavior until a later accepted implementation route promotes durable command or skill changes.
generated_input_authority_impact: Operator output remains advisory. Host or extension projections cannot authorize lifecycle transitions.
authority_class_impact:
  framework: May add command and skill surfaces for evaluator access.
  instance: No instance authority change.
  state_control: No state-control mutation.
  state_evidence: May write advisory report output only when explicitly invoked.
  generated: Generated outputs remain derived-only.
  inputs: Temporary proposal lineage only.
evidence_requirements:
  - Command or skill validation proving optional invocation.
  - Negative controls proving the evaluator is not required by delivery, closeout, archive, cleanup, or terminal routes.
  - Documentation of report interpretation and authority boundaries.
validation_gates:
  - "validate-proposal-standard.sh"
  - "validate-architecture-proposal.sh"
  - "validate-proposal-implementation-readiness.sh"
  - "operator surface validation"
  - "advisory-only negative controls"
acceptance_criteria_summary: The operator surface is acceptable when users can run the evaluator intentionally, understand its advisory status, and no lifecycle path treats evaluator output as required or authoritative.
risk_posture: Medium. A convenient surface could accidentally become a de facto gate if boundaries are unclear.
rollback_summary: Revert or supersede only command, skill, and extension projection changes owned by this child.
owner:
  role: Octon governance efficiency operator surface architect
  accountable_role: human operator / repository owner
created_date: 2026-07-01
source_lineage:
  - ".octon/framework/capabilities/runtime/commands/"
  - ".octon/framework/capabilities/runtime/skills/"
  - ".octon/inputs/additive/extensions/octon-proposal-lifecycle/"
