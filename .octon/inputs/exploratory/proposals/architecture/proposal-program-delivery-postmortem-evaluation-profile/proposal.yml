proposal_id: proposal-program-delivery-postmortem-evaluation-profile
title: Proposal Program Delivery Postmortem Evaluation Profile
summary: Extend the generic lifecycle postmortem mechanism with a proposal-program delivery evaluation profile that can run for any completed proposal-program lifecycle and produce structured blocker, autonomy, efficiency, delivery proof-chain, and recommendation backlog evidence.
proposal_kind: architecture
promotion_scope: octon-internal
