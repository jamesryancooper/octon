selected_implementation_target: Add a generic proposal-program delivery evaluation profile to lifecycle postmortem without making postmortem outputs authoritative.
scope_statement: The built-in lifecycle postmortem command prepares generic retained evidence, but the completed delivery run exposed a need for proposal-program-specific evaluation of blocker chains, autonomy gaps, efficiency losses, delivery proof chains, and recommendation backlogs. This child owns only the listed promotion targets and proposal-local evidence.
explicit_runtime_non_implementation_statement: This child packet does not implement durable behavior until a later accepted implementation route.
generated_input_authority_impact: Generated outputs, proposal paths, prompts, chat history, dashboards, and local-only evidence remain non-authoritative. Lifecycle postmortem outputs remain retained evidence and discovery aids only.
authority_class_impact:
  framework: Future implementation may update the lifecycle postmortem command, validator, fixtures, tests, runtime docs, and proposal-program lifecycle contract surfaces listed in promotion targets.
  instance: No instance authority changes planned unless a later accepted child revision adds them.
  state_control: No state-control mutation from this proposal packet.
  state_evidence: Future implementation may define retained postmortem profile evidence shapes under the existing lifecycle postmortem evidence roots.
  generated: Generated outputs remain derived-only and must not be hand-edited.
  inputs: This child packet is non-authoritative proposal lineage.
evidence_requirements:
  - Accepted proposal review and implementation authorization before durable edits.
  - Strict pre-integration architecture review before implementation.
  - Regression fixtures for completed proposal-program lifecycles with delivery evidence, child terminal evidence, blocker history, and recommendation backlogs.
  - Negative controls proving postmortem reports cannot authorize lifecycle transitions, implementation, promotion, closeout, archive, delivery, cleanup, PR fallback, or cleaned claims.
validation_gates:
- "validate-proposal-standard.sh"
- "validate-architecture-proposal.sh"
- "validate-proposal-implementation-readiness.sh"
- "octon lifecycle postmortem --run-id <completed-proposal-program-run-id>"
- "validate-lifecycle-postmortem.sh --run-id <completed-proposal-program-run-id>"
- "validate-lifecycle-postmortem.sh --structured-output <evaluation.yml> --report <report.md> --review-findings <review-findings.ndjson>"
- "test-lifecycle-postmortem.sh"
acceptance_criteria_summary: Completed proposal-program lifecycle postmortems can opt into a generic proposal-program delivery evaluation profile with structured evidence binding, blocker taxonomy, autonomy and efficiency diagnostics, delivery proof-chain audit, recommendation schema, and proposal-program handoff evidence while preserving non-authority boundaries.
risk_posture: Medium-high. The profile improves post-run analysis for proposal programs but must not turn one historical run into a bespoke mechanism or allow postmortem outputs to authorize future changes.
rollback_summary: Revert or supersede only this child packet's durable promotion targets through its own rollback and correction route.
