status: in-review
change_profile: atomic
lifecycle:
  temporary: true
  exit_expectation: Review this child independently, align the delivery input contract through accepted implementation, and close out with child-owned validation evidence before parent closeout.
related_proposals:
  - proposal-program-lifecycle-surface-coherence
selected_implementation_target: Required input coherence for proposal delivery wrappers.
scope_statement: This child owns canonical input contract alignment only. It does not publish host projections, add the operator alias, document program review asymmetry, or implement the final cross-surface validation suite.
explicit_runtime_non_implementation_statement: This packet does not change runtime behavior until a later accepted implementation route promotes durable changes.
generated_input_authority_impact: Proposal paths, generated outputs, prompts, chat history, and host UI state remain non-authoritative. Generated outputs cannot resolve input contract conflicts.
authority_class_impact:
  framework: Future implementation may update workflow metadata, runtime commands and skills, product contracts, validators, tests, and lifecycle extension surfaces listed in promotion targets.
  instance: No direct instance authority changes planned.
  state_control: No state-control mutation from this proposal packet.
  state_evidence: Future implementation must retain validation evidence for required input coherence and stale profile negative controls.
  generated: Generated outputs remain derived-only and require publication evidence if refreshed.
  inputs: This child packet is temporary proposal lineage only.
evidence_requirements:
  - Accepted child proposal review and strict pre-integration architecture review before durable edits.
  - Validator evidence proving `profile_path`, `delivery_run_id`, and related delivery inputs are consistently required or optional across canonical surfaces.
  - Negative controls where a missing required input blocks delivery before mutation.
  - Regression evidence covering packet and program delivery wrapper differences without forcing false symmetry.
validation_gates:
  - "validate-proposal-standard.sh"
  - "validate-architecture-proposal.sh"
  - "validate-proposal-implementation-readiness.sh"
  - "validate-proposal-program-delivery-workflow.sh"
  - "validate-proposal-program-delivery-profile.sh --profile <fixture>"
  - "validate-proposal-program-delivery-receipt.sh --receipt <fixture>"
  - "proposal lifecycle extension validation tests for delivery input coherence"
acceptance_criteria_summary: Delivery input requirements are stated consistently across canonical workflow, command, skill, profile, receipt, manifest, validator, and lifecycle documentation surfaces, with negative controls blocking missing required inputs.
risk_posture: Medium. Tightening input requirements must avoid breaking valid resume or discovery paths that intentionally derive optional context.
rollback_summary: Revert or supersede only this child packet's durable promotion targets through its own rollback and correction route.
