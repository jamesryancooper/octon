status: implemented
lifecycle:
  temporary: true
  exit_expectation: >-
    Promote only after strict proposal review, passing pre-integration
    architecture review, implementation-grade completeness, durable updates to
    the declared Octon-internal targets, refreshed generated projections through
    canonical publication scripts, and passing implementation conformance plus
    post-implementation drift/churn receipts. Archive only after generated
    proposal projection and capability publication freshness are current.
related_proposals:
  - "architectural-review-governed-mechanism-integration"
  - "architectural-review-native-doctrine-and-naming"
  - "architectural-review-native-skills-commands"
  - "architectural-review-native-workflows"
  - "architectural-review-proposal-lifecycle-integration"
