  state_evidence: Future implementation must retain alias delegation and no-authority-widening validation evidence.
  generated: Generated outputs remain derived-only and must not authorize alias behavior.
  inputs: This child packet is temporary proposal lineage only.
evidence_requirements:
  - Accepted child proposal review and strict pre-integration architecture review before durable edits.
  - Evidence that the alias delegates to `proposal-program-delivery` and has no independent workflow, lifecycle, or closeout semantics.
  - Negative controls proving alias invocation cannot bypass required delivery profile, review, verification, correction, closeout, archive, cleanup, or terminal proof gates.
  - Documentation evidence that the alias is optional convenience, not a replacement for the canonical wrapper.
validation_gates:
