schema_version: octon-child-artifact-schema-sketch-v1
child_id: token-efficiency-proposal-artifact-index-spine
artifacts:
- name: proposal-artifact-index.yml
  purpose: Per proposal/program artifact index with role, digest, bytes, estimated tokens, inclusion mode, and stage relevance.
  authority_status: non-authoritative evidence/read-model unless implemented as durable spec/template; never replaces source
    of truth
  required_fields:
  - schema_version
  - source_refs
  - source_digests
  - producer
  - consumer
  - validation
  - evidence_refs
  - failure_behavior
  failure_behavior: fail closed on missing source, digest mismatch, stale freshness, or authority-boundary violation
- name: proposal-program-spine.yml
  purpose: Compact generated/read-model proposal/program state with child status, gate states, blockers, receipts, and evidence
    refs.
  authority_status: non-authoritative evidence/read-model unless implemented as durable spec/template; never replaces source
    of truth
  required_fields:
  - schema_version
  - source_refs
  - source_digests
  - producer
  - consumer
  - validation
  - evidence_refs
  - failure_behavior
  failure_behavior: fail closed on missing source, digest mismatch, stale freshness, or authority-boundary violation
- name: child-handoff-capsule.yml
  purpose: Compact parent-to-child capsule for scope, dependency vector, write-scope map, validator matrix, evidence refs,
    and context hash.
  authority_status: non-authoritative evidence/read-model unless implemented as durable spec/template; never replaces source
    of truth
  required_fields:
  - schema_version
  - source_refs
  - source_digests
  - producer
  - consumer
  - validation
  - evidence_refs
  - failure_behavior
  failure_behavior: fail closed on missing source, digest mismatch, stale freshness, or authority-boundary violation
