schema_version: proposal-v1
proposal_id: run-program-clean-delivery-architecture-review-freshness
title: Run Program Clean Delivery Architecture Review Freshness
summary: Require current accepted architecture-review receipts before parent or child proposal lifecycle routes can advance past review-sensitive gates.
proposal_kind: architecture
promotion_scope: octon-internal
promotion_targets:
  - ".octon/framework/assurance/runtime/_ops/scripts/validate-architectural-review-receipts.sh"
  - ".octon/framework/assurance/runtime/_ops/scripts/validate-proposal-review-gate.sh"
  - ".octon/framework/engine/runtime/crates/kernel/src/lifecycle_program.rs"
  - ".octon/framework/assurance/runtime/_ops/tests/"
status: in-review
change_profile: atomic
lifecycle:
  temporary: true
  exit_expectation: Review this child independently, refresh architecture review only through the owning review route, implement freshness enforcement after accepted review, and close out with child-owned evidence.
related_proposals:
  - run-program-clean-delivery-postmortem-hardening
selected_implementation_target: Architecture-review freshness gates for proposal-program clean delivery.
scope_statement: This child owns stale architecture-review evidence prevention only. It does not implement delivery receipt completion, Change closeout reconciliation, cleanup disposition, validator hardening, or test hermeticity.
explicit_runtime_non_implementation_statement: This packet does not change runtime behavior until a later accepted implementation route promotes durable changes.
generated_input_authority_impact: Proposal paths, generated outputs, chat history, prompts, and local generated projections remain non-authoritative.
authority_class_impact:
  framework: Future implementation may update architecture-review validators, review-gate validators, lifecycle planner checks, and tests listed in promotion targets.
  instance: No direct instance authority changes planned.
  state_control: No state-control mutation from this proposal packet.
  state_evidence: Future implementation must retain freshness validation evidence and stale-receipt negative controls for this child only.
  generated: Generated outputs remain derived-only and must not authorize review acceptance.
  inputs: This child packet is temporary proposal lineage only.
evidence_requirements:
  - Accepted child proposal review and strict pre-integration architecture review before durable edits.
  - Fixture evidence where packet_digest matches current proposal content and passes.
  - Fixture evidence where packet_digest is stale and blocks review-sensitive advancement.
  - Negative controls proving parent summaries cannot replace child-owned review receipts.
validation_gates:
  - "validate-proposal-standard.sh"
  - "validate-architecture-proposal.sh"
  - "validate-proposal-implementation-readiness.sh"
  - "validate-architectural-review-receipts.sh --receipt <receipt> --package <packet> --require-pass"
  - "validate-proposal-review-gate.sh --package <packet> --require-accepted"
  - "cargo test -p octon_kernel review_packet_completion_requires_fresh_accepted_architecture_review_receipt"
acceptance_criteria_summary: Review-sensitive lifecycle routes cannot advance on stale architecture-review receipts, and fresh accepted receipts continue to pass without manual evidence substitution.
risk_posture: High. Freshness enforcement must block stale evidence without creating review loops when the correct owning review route can refresh the receipt.
rollback_summary: Revert or supersede only this child packet's durable promotion targets through its own rollback and correction route.
owner:
  role: Octon proposal-program architecture-review freshness architect
  accountable_role: human operator / repository owner
