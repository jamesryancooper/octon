schema_version: "proposal-v1"
proposal_id: "octon-architecture-migration-bounded-child-agents"
title: "Bounded Mission Child Agents"
summary: >-
  Reuse Octon's existing lifecycle scheduling, locks, retries, cancellation,
  process supervision, evidence, and generic provider adapter to run temporary
  credentialless depth-one mission children under an exact guard, narrower
  Harness, enforceable limits, unknown-outcome reconciliation, and irreversible
  terminal retirement.
