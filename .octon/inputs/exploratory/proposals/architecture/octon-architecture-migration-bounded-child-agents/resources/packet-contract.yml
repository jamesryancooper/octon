schema_version: "octon-architecture-migration-child-packet-v1"
proposal_id: "octon-architecture-migration-bounded-child-agents"
logical_packet_id: "RP-13"
workgroup_id: "RWG-12"
parent_program: "octon-architecture-migration-program"
title: "Bounded Mission Child Agents"
purpose: >-
  Reuse existing lifecycle scheduling and RP-11/RP-08 execution/recovery seams
  to run temporary credentialless depth-one mission children with strict scope,
  limits, evidence, cancellation, reconciliation, and irreversible retirement.
problem_statement: >-
  Octon has proposal-program child scheduling, locks, concurrency, retries,
  timeouts, cancellation tokens, process-group termination, token measurement,
  and terminal evidence. Those useful primitives do not establish a temporary
  credentialless MissionChildRun with exact authority/Harness/isolation
  binding, depth, enforceable budgets, provider-child mapping, or permanent
  terminal identity retirement.
current_repository_state:
  - "Kernel lifecycle-program code schedules ProgramChild work with dependency batches, locks, concurrency, retry/recovery, cancellation, and terminal evidence."
  - "Lifecycle executor requests carry child_id/cancellation context; the primary provider implementation supports timeout and process-group termination."
  - "Token Budget Ledger records child/stage/source/model estimates and provider usage when supplied, but explicitly remains measurement evidence rather than enforcement."
  - "Agent Node and Task-Specific Harness contracts provide bounded model activity and fail-closed authority boundaries."
  - "ProgramChild identity represents proposal/program work, not a mission-scoped provider child, credentialless session, depth bound, or retired agent identity."
current_evidence:
  classification: "STATICALLY_INSPECTED"
  proof_method: "static inspection"
  limitations:
    - "No credential/canonical-Git/sibling denial matrix exists for mission children."
    - "No guard/scope/depth/budget/cancel/unknown/retirement/id-reuse matrix has run."
    - "UE-013 remains unresolved until adversarial implementation proof exists."
accepted_decisions:
  - "FD-022"
  - "FD-023, child provider-mapping specialization only"
target_state:
  - "Every child is a new temporary MissionChildRun with exact parent, mission, project, run, Harness, provider mapping, candidate/session, budget, and guard identity."
  - "Effective child scope and budget are the strict intersection of parent/mission/project/Harness/isolation/role and remaining limits."
  - "Initial depth is exactly one and the child has no spawn/recruit/delegate API."
  - "The child is credentialless, cannot access canonical Git or sibling areas, and uses an independent disposable candidate repository/session."
  - "One one-shot guard is consumed only for the exact child binding and can never be reused."
  - "Existing scheduler primitives enforce declared concurrency, steps, attempts/retries, and timeout without a new scheduler."
  - "Token/cost/evidence limits are classified hard, measured, or unsupported; every declared hard limit is enforced or admission denies."
  - "A child-specific provider mapping consumes RP-11 generic adapter operations and proves its specialization without redefining the generic trait."
  - "Cancel, provider/process termination, unknown reconciliation, output preservation, and terminal retirement complete before identity/session/guard reuse is impossible."
scope:
  - "temporary MissionChildRun, budget, provider-mapping, and terminal-retirement contracts"
  - "exact parent/mission/Workspace Project/Harness/role/isolation scope intersection"
  - "one-shot child launch guard and exact launch binding through RP-11"
  - "fresh independent credentialless candidate repository and short-lived/non-exportable provider session premise"
  - "fixed initial depth one and no child spawn surface"
  - "declared concurrency, step, timeout, attempt/retry, token, cost, and evidence ceilings with enforcement classification"
  - "reuse of lifecycle scheduler, locks, cancellation, process supervision, terminal observations, and RP-08 reconciliation"
  - "child-specific provider-native mapping and conformance contribution to FD-023"
  - "terminal output/evidence reconciliation, guard/session/task/candidate revocation, identity tombstone, and no reuse"
non_goals:
  - "persistent agents, accounts, organizations, teams, swarms, or standing workers"
  - "self-recruitment, grandchildren, recursive delegation, or dynamic role creation"
  - "credentialed children, canonical Git access, direct publication, durable external effects, or sibling access"
  - "new scheduler, queue, runtime, store, authority source, policy engine, broker, or recovery controller"
  - "generic provider adapter/interface changes owned by RP-11"
  - "changing RP-08 recovery semantics or treating proposal ProgramChild records as permanent agents"
invariants:
  - "A child is temporary, mission-bound, depth one, credentialless, strictly narrower, and candidate-only."
  - "Child scope is an intersection; missing, incomparable, ambiguous, or widening inputs deny."
  - "No child can mint authority, grants, effect tokens, credentials, policy, mission transitions, or another child."
  - "Every child launch consumes one exact one-shot guard and isolated session/repository binding."
  - "Every declared hard limit is mechanically enforced; measurement-only evidence is never described as hard enforcement."
  - "Unknown provider/process outcome remains unknown until RP-08 reconciliation; no blind retry or identity reuse."
  - "Terminal status is not retirement until guard/session/provider task/candidate ownership are revoked/released and the identity is tombstoned."
  - "Child output/evidence can inform parent reconciliation but cannot mutate parent authority or canonical state directly."
planned_durable_source_ownership:
  mission_child_contract_identity_and_tombstone: "RP-13"
  scope_depth_budget_derivation_and_admission: "RP-13"
  role_templates_and_child_policy: "RP-13 contract; engineering binds accepted ROD-005 resource limits and later tuning is governed configuration"
  scheduler_locks_retries_timeout: "existing lifecycle-program scheduler, reused not replaced"
  authority_and_one_shot_guard_semantics: "existing/RP-11 dependency interface, consumed not owned"
  candidate_isolation_and_provider_session: "dependency premise from RP-11/RP-08 chain and ED-001/RP-02, consumed not owned"
  generic_executor_adapter: "RP-11"
  child_provider_mapping_and_specialization_conformance: "RP-13"
  unknown_outcome_recovery_and_store_truth: "RP-08"
  integrated_provider_promotion_proof: "RP-14"
proposal_lifecycle_ownership:
  manifests:
    - "proposal.yml"
    - "architecture-proposal.yml"
  status: "in-review"
  authority: "proposal-local and non-authoritative"
retained_evidence_ownership:
