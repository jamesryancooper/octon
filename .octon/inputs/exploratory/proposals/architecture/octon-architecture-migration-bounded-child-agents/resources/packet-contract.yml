  required_records:
    - "accepted ROD-005 provisional configuration, child policy digest, and supported enforcement matrix"
    - "child contract/parent/mission/project/Harness/guard/isolation/provider/budget digests"
    - "credential/canonical-Git/sibling/scope/depth/recruitment denial matrix"
    - "concurrency/step/timeout/retry/token/cost/evidence enforcement-or-denial matrix"
    - "provider child prepare/launch/observe/cancel/usage/retire specialization conformance"
    - "cancel/process-group/lost-response/unknown reconciliation and replacement-child evidence"
    - "terminal retirement/revocation/tombstone and identity/session/guard reuse denial"
