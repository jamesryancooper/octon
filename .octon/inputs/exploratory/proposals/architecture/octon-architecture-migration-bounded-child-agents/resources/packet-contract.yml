  - "lifecycle-program scheduler mapping and mission child orchestration"
  - "lifecycle executor child mapping, primary-provider child specialization, and token posture"
  - "mission child policy and existing mission status/cancel UX"
  - "runtime/adapter contract registries"
  - "child scope, credential, budget, cancel, unknown, retirement, and reuse assurance"
