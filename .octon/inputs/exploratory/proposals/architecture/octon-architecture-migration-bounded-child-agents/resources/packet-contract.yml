  - "temporary child candidate repository/session launch and lifecycle"
  - "mission status/inbox child summary and cancel propagation"
  - "child token/usage and terminal retirement evidence"
  - "generated mission/run status views"
provider_configuration_observed: []
technical_identities_affected:
  - "parent mission/run/project and child run/attempt/role identity"
  - "child Harness/source manifest, guard, candidate repository, session, provider task/mapping, and cancellation identity"
  - "concurrency/step/attempt/retry/timeout/token/cost/evidence budget identity"
  - "terminal observation, reconciliation, retirement, revocation, and tombstone identity"
trust_boundary_changes:
  - "A provider-native child can be launched only through RP-11 generic adapter after strict child scope/budget/guard/isolation admission."
  - "Child output crosses back only as candidate/evidence for parent reconciliation, never direct canonical mutation."
  - "Terminal child resources become irreversibly non-reusable after reconciliation."
migration_preconditions:
  - "Accepted RP-02, RP-08, and RP-11 packet digests and the selected RP-13 mechanism receipt are frozen now; their exact implemented interfaces verify before RP-13 source edits."
  - "The selected ROD-005 limits remain launch-disabled until local and provider hard-limit enforcement, useful credentialless ED-001 isolation, and mapping conformance pass against the exact implementation."
  - "Existing ProgramChild scheduler, mission-child integration, launch, cancellation, state, and token/evidence symbols and writers are inventoried at the implementation commit."
migration_steps:
  - "Encode the accepted ROD-005 baseline with enforceable provisional values and publish strict MissionChildRun/budget/provider-mapping/retirement contracts and policy."
  - "Expose only the existing scheduler primitives required for temporary mission child jobs without altering ProgramChild semantics."
  - "Implement strict parent/mission/project/Harness/role/isolation scope and remaining-budget intersection; deny empty/incomparable/widening results."
  - "Bind child identity, exact guard, isolated candidate repository/session, provider mapping, budgets, and cancellation to one RP-11 Harness/launch."
  - "Implement a separate child mapping over RP-11 prepare/launch/observe/cancel/usage/retire; conditionally admit the primary provider only while current conformance and the existing proof and promotion gates pass."
  - "Enforce depth one and remove every spawn/recruit/delegate/grandchild path."
  - "Map scheduler concurrency/steps/retries/timeout and hard/measurement/unsupported token-cost-evidence posture; deny unsupported declared hard limits."
  - "Propagate cancel/revoke/timeout/budget triggers, supervise process group, reconcile unknown outcome through RP-08, preserve output/evidence, and retire/tombstone all child resources."
  - "Integrate concise child summary/cancel state into existing mission UX and execute the full UE-013 matrix."
safe_intermediate_states:
  - "Contracts and accepted ROD-005 provisional configuration exist while all mission child launch remains disabled."
  - "Scope/budget derivation runs in dry mode and produces denial/admission evidence without guard or provider task."
  - "One-shot guard and isolated candidate/session bindings stage but cannot launch."
  - "Fake child mappings pass scheduler/cancel/retirement proof while live primary mapping remains disabled."
  - "Primary child mapping activates only after credential, scope, depth, budget, cancel, unknown, and retirement proof."
prohibited_intermediate_states:
  - "MissionChildRun is represented as a persistent agent/account or proposal ProgramChild."
  - "A child receives credentials, canonical Git, sibling control/evidence/candidate access, or direct durable external effect capability."
  - "Scope/budget defaults widen parent, mission, project, Harness, or remaining limits."
  - "Depth exceeds one or any child spawn/recruit/delegate API exists."
  - "Measured token/cost/evidence usage is claimed as a hard enforced ceiling."
  - "Unknown/cancelled provider outcome is retried or identity reused before RP-08 reconciliation."
  - "Terminal process exit is treated as retirement before guard/session/task/candidate revocation/tombstone."
  - "A new scheduler, queue, runtime/store, authority, broker, or generic adapter is introduced."
compatibility_bridges:
  - "Existing proposal ProgramChild scheduling remains unchanged and supplies only reusable batch/lock/retry/cancel primitives; it never becomes MissionChildRun identity."
  - "Single-agent RP-11 execution remains the supported fallback while mission child launch is disabled or unsupported."
deprecations_and_retirements:
  - "Retire any claim that current ProgramChild scheduling alone satisfies FD-022."
  - "Retire measurement-only token/cost language that implies hard enforcement."
  - "Retire child identity/session/guard reuse and process-exit-only retirement assumptions."
rollback_strategy: >-
  Disable new child admission/launch, propagate cancellation to active children,
  reconcile provider/process outcomes through RP-08, preserve parent and child
  candidate output plus terminal evidence, retire/tombstone each child identity,
  and continue the parent via the single-agent RP-11 path. Never restore
  credentials, depth, reuse, or a second scheduler.
recovery_strategy: >-
  Reconstruct child status from parent control, exact guard/Harness/provider
  observations, process/session state, and retained evidence. Unknown remains
  blocked until RP-08 reconciliation. A replacement child receives a new
  identity, guard, session, candidate area, and budgets only after the prior
  child is terminally reconciled and retired.
validation_plan:
  - "strict child/budget/provider-mapping/retirement schemas and mirror/registry validation"
  - "parent/mission/project/Harness/role/isolation scope intersection and widening denial"
  - "credential, environment/HOME/Keychain, canonical Git, sibling area, and direct effect denial"
  - "guard expired/revoked/reused/wrong-child/wrong-Harness/wrong-session denial"
  - "depth, spawn/recruit/delegate/grandchild denial"
  - "concurrency, step, timeout, attempt/retry, token, cost, and evidence enforce-or-deny matrix"
  - "provider mapping, cancel/process-group, lost response, unknown reconciliation, retirement, and identity reuse denial"
adversarial_tests:
  - "parent/project/Harness scope widening, sibling traversal/symlink/alias, canonical repository remote/config access, and credential probes"
  - "forged/stale/expired/revoked/replayed guard, changed child identity/session/candidate root/provider mapping, and double launch"
  - "self-recruitment prompt/tool/provider API, nested/grandchild launch, role-template authority injection, and persistent-agent record creation"
  - "concurrency race, step/attempt overflow, retry amplification, timeout/cancel race, unsupported hard token/cost limit, and forged usage"
  - "lost launch/cancel/terminal response, orphan process group, late output, duplicate terminal receipt, failed retirement, and tombstoned ID reuse"
fault_injection:
  - "interruption before/after guard consumption, candidate/session creation, provider prepare/launch, and scheduler lock acquisition"
  - "parent/mission revoke, timeout, budget exhaustion, and operator cancel at every child state"
  - "provider cancel failure, process-group kill failure, lost response, machine restart, and unknown task observation"
  - "interruption while preserving output/evidence, revoking session/guard/task, deleting candidate area, or writing tombstone"
evidence_to_retain:
  - "accepted ROD-005 configuration and enforcement capability matrix"
  - "exact scope/budget derivation and child/parent/mission/project/Harness/guard/isolation/provider digests"
  - "credential/Git/sibling/depth/recruitment negative results"
  - "limit enforcement/unsupported denials and provider usage provenance"
  - "cancel/process-group/unknown/reconcile/replacement traces"
  - "terminal output preservation, revocation, retirement/tombstone, and reuse denial"
support_claim_effect: >-
  Enables a later optional bounded-child support claim after PO-FD-022, RP-13's
  child-mapping component contribution to PO-FD-023, and integrated dogfood. It
  creates no current multi-agent, provider, or autonomy claim.
operator_experience_effect: >-
  After engineering binds the accepted ROD-005 baseline and proof-driven
  admission is current, Octon may schedule admitted parallel child work invisibly within a mission.
  Normal operation has zero routine prompts; mission status shows concise child
  progress/blocker/cancel/retirement facts and preserves the single-agent route
  when child work is unsupported.
setup_and_maintenance_effect: >-
  No agent organization, account, queue, or worker fleet is administered.
  Maintenance is bounded to one policy, provider-child conformance, compact
  status/evidence, and safe disable/reconcile/retire behavior.
dependencies:
  - logical_packet_id: "RP-08"
    proposal_id: "octon-architecture-migration-recovery-class-b"
    required_interface: "frozen cancellation, unknown-outcome reconciliation, candidate preservation, and terminal recovery semantics"
  - logical_packet_id: "RP-11"
    proposal_id: "octon-architecture-migration-harness-factory"
    required_interface: "frozen exact Harness/one-shot launch binding and generic prepare/launch/observe/cancel/usage/retire adapter"
parallelization_constraints:
  - "May implement alongside RP-12 after RP-08 and RP-11 exits."
  - "RP-13 owns no extension, core authority/store, recovery, candidate-isolation, or generic-adapter source."
  - "Shared scheduler, registry, Harness, mission, and lifecycle-executor files are integrated by exact symbol/entry ownership."
must_not_run_concurrently_with:
  - "Any change redefining RP-08 recovery/store truth or RP-11 guard/Harness/generic-adapter semantics."
  - "Any isolation/session change that invalidates the ED-001 credential-negative premise."
accepted_configuration:
  - operator_decision_id: "ROD-005"
    status: "accepted-baseline"
    subject: "Child-agent resource and concurrency limits"
    fixed_boundary: "Temporary credentialless depth-one children, exact guard, narrower scope, terminal retirement; no persistent organization or self-recruitment."
    baseline: "Lowest useful concurrency and conservative adjustable wall-clock, step/attempt/retry, token, cost, and evidence ceilings."
    adjustment_rule: "Measure dogfood and widen one dimension only when retained evidence proves benefit."
    numeric_values: "The mission-child design receipt selects one active child globally/project/parent, depth one, eight steps, one attempt, zero retry, 900 seconds, 12,000 input/8,000 generated/20,000 combined tokens, 250,000 micro-USD, and 64 MiB/1,024-file evidence bounds with exact enforcement-or-disabled rules."
    future_updates: "Governed configuration, including any additional operator spending or interruption cap."
engineering_dispositions:
  - disposition_id: "ROD-005-ENGINEERING"
    role: "configuration and proof"
    owner: "RP-13"
    required_result: "implement and prove the selected exact values and their hard, measured, provider-hard-required, or unsupported enforcement posture before launch"
  - disposition_id: "ED-001"
    role: "dependency premise only"
    premise: "useful non-exportable/short-lived primary-provider session, native sandbox, and independent disposable repository"
    owner: "RP-02/dependency chain, not RP-13"
blocking_findings:
  - "RF-031"
cross_referenced_findings:
  - "RF-004, credential and shared candidate context is closed by the isolation/session dependency premise"
  - "RF-016, RP-13 closes bounded-child specialization only"
  - "RF-025, useful credentialless provider session must be proved before child admission"
  - "RF-027, the accepted ROD-005 baseline requires engineering-bound provisional limits at RP-13 design exit; provider admission is proof-driven"
unresolved_evidence:
  - "UE-013"
entry_criteria:
  - "Accepted RP-02, RP-08, and RP-11 packet digests and the exact RP-13 design are frozen for proposal authorization."
  - "Before source edits, exact dependency implementation interfaces and current shared symbols/writers verify."
  - "Before live mapping completion or use, ED-001 useful credentialless isolation and every local/provider hard-limit mechanism pass against the exact implementation."
  - "Before completion or promotion, single-agent Harness, shared reconciler, UE-013, and mapping-conformance proof is current."
exit_criteria:
  - "Children are credentialless, depth one, strictly narrower, and cannot access canonical Git, siblings, persistent identity, or direct effects."
  - "Every launch consumes an exact one-shot child guard/Harness/isolation/provider/budget binding."
  - "No child spawn/recruit/delegate/grandchild path exists."
  - "Every declared hard concurrency/step/attempt/retry/timeout/token/cost/evidence limit is enforced or admission denies unsupported."
  - "Cancel/process termination and unknown outcomes reconcile through RP-08 without blind retry."
  - "Terminal output/evidence is preserved and identity/session/guard/task/candidate area cannot be reused."
  - "No new scheduler, runtime/store, authority source, or generic adapter exists."
