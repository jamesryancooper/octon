unsupported_rule: "if generated-token or cost prevention is absent, the mapping is unsupported and launch denies; estimates/after-the-fact usage are measurement only"
tuning_rule: "one dimension at a time through a fresh reviewed governed configuration receipt backed by dogfood; never silently widen authority/support or reuse evidence from another identity"
guard_and_launch:
  preparation: "create and commit exact candidate/session identities without guard consumption"
  issue: "RP-01/RP-11 issues exact child guard only after preparation identity commit"
  launch: "child.rs invokes the single RP-11 final-guard seam immediately before exactly one adapter launch"
  atomicity: "guard consumption and prepared-to-running state use the same expected-old state revision; mismatch/crash cannot create a second launch route"
state_and_recovery:
  storage: "existing transactional run store through frozen dependency interfaces; state contains bounded status and exact refs/digests only"
  transition: "expected-old revision CAS plus same-transaction evidence/outbox record"
  idempotency: "same transition digest is no-op; different digest at the same revision denies"
  unknown: "only RP-08 may reconcile unknown; no retry, replacement, deletion, reuse, or success inference while unknown"
retirement:
  order: ["freeze terminal/reconciled observation", "commit bounded output/evidence disposition", "revoke guard and cancellation token", "retire provider task/session", "prove process group absent", "release locks and candidate ownership", "write compact permanent tombstone and terminal retirement outbox record last"]
  failure: "resume the first unproved step and remain retirement_blocked; never delete required output or write a premature terminal claim"
  tombstone: "immutable hash/lineage/resource identities only, retained for repository lifetime and never recycled"
role_templates: ["planner", "researcher", "implementer", "tester", "adversarial-reviewer", "integrator"]
role_rule: "templates may only narrow prompt/output/context/tools/budget; they cannot grant authority, credentials, capabilities, depth, persistence, or effects"
