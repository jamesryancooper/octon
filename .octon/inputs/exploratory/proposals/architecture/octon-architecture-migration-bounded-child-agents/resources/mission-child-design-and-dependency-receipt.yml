dependency_drift_rule: "packet or implemented-interface drift denies RP-13 source entry and routes to the owner; RP-13 never repairs foreign semantics"
canonical_identity:
  contract_bytes: "RFC 8785 JCS JSON, UTF-8 NFC, strict schema"
  contract_digest: "SHA-256 over ASCII octon:rp13:mission-child-run:v1 followed by NUL and exact contract JCS bytes"
  ordinal: "monotonic child_ordinal allocated by expected-old revision CAS in the existing transactional run store"
  child_id: "mch- plus lowercase hex SHA-256 over ASCII octon:rp13:child-id:v1 NUL plus JCS array [repository_id,project_id,mission_id,parent_run_id,child_ordinal,contract_digest]"
  attempt_id: "mca- plus lowercase hex SHA-256 over ASCII octon:rp13:attempt-id:v1 NUL plus JCS array [child_id,1,budget_digest]"
  reuse: "ordinal, child_id, and attempt_id are never reissued; initial policy permits only attempt ordinal 1"
scope_intersection:
  paths: "repository-relative UTF-8 NFC POSIX component-aware containment intersection; absolute/dot/dot-dot/NUL/symlink/hardlink/case-fold alias/root escape deny"
  sets: "exact intersection for read, write, tool, capability, provider, and output sets"
  budgets: "minimum remaining numeric value; Boolean permission is logical AND"
  semantic_refs: "objective and output schema must be exact parent-approved digest references"
  deny: "missing, stale, ambiguous, incomparable, empty, or widening result; no parent default inheritance"
