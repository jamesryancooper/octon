schema_version: "proposal-v1"
proposal_id: "octon-architecture-migration-harness-factory"
title: "Deterministic Harness Factory and Generic Executor Adapter"
summary: >-
  Extend Octon's existing route, context, and task-harness primitives into one
  canonical deterministic per-run compiler, bind its complete source digest to
  authorization and immediate spawn, and replace provider-name dispatch with a
  strict non-authoritative executor-adapter interface and component conformance
  suite.
