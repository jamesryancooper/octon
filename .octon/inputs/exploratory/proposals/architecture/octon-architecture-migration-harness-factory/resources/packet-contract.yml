schema_version: "octon-architecture-migration-child-packet-v1"
proposal_id: "octon-architecture-migration-harness-factory"
logical_packet_id: "RP-11"
workgroup_id: "RWG-11"
parent_program: "octon-architecture-migration-program"
title: "Deterministic Harness Factory and Generic Executor Adapter"
purpose: >-
  Compile the complete approved per-run envelope deterministically, bind its
  exact sources and effective digest to canonical authorization and immediate
  spawn, and dispatch only through one strict provider-neutral executor seam.
problem_statement: >-
  Octon has useful task-harness, route-bundle, resolver, context, adapter, and
  lifecycle-executor primitives, but the current global route bundle does not
  compile the full run envelope and `request.executor` still selects hardcoded
  provider branches. Structural manifests therefore do not yet prove
  deterministic launch binding or semantics-preserving provider replacement.
current_repository_state:
  - "Task-specific Harness and compile-receipt runtime/constitutional contracts already exist."
  - "Generated route bundles, runtime handles, context packs, and lifecycle execution requests/results already provide reusable compilation and observation primitives."
  - "LifecycleRouteExecutor exists, but adapter dispatch still matches executor strings such as mock, codex, claude, and auto."
  - "Live adapter manifests declare non-authority and replacement intent, but strict schema drift and runtime identity consumption are not fully closed."
current_evidence:
  classification: "STATICALLY_INSPECTED"
  proof_method: "static inspection"
  limitations:
    - "No complete each-input byte-determinism or launch-denial matrix has run."
    - "No real-primary plus fake-adapter lifecycle conformance report exists."
    - "UE-010 and UE-011 remain unresolved until implementation and integrated dynamic proof."
accepted_decisions:
  - "FD-020"
  - "FD-023, generic implementation and component-conformance portion only"
target_state:
  - "One canonical Harness Factory compiles every approved project, mission, run, policy, extension, context, model, tool, validation, evidence, and rollback input."
  - "Canonical schema-validated serialization produces identical bytes and digest for identical complete inputs."
  - "Every direct and transitive input has a stable identity, version/ref, digest, precedence class, and required/optional disposition in one ordered source manifest."
  - "A strict compile receipt binds compiler identity, source-manifest digest, effective-manifest digest, schema result, and authorization binding."
  - "Canonical authorization and the one-shot launch path revalidate the exact source/effective digests immediately before spawn."
  - "One generic adapter identity and prepare/launch/observe/cancel/usage/retire interface is the only provider dispatch seam."
  - "One real primary-provider adapter and fake conformance adapters prove the RP-11 component contract."
  - "Generated route, manifest, and receipt instances remain projections/evidence rather than authority."
scope:
  - "canonical Harness Factory compiler and complete authority-first input precedence"
  - "schema validation, path/ref normalization, canonical serialization, full source enumeration, and invalidation"
  - "effective per-run manifest, ordered input-source manifest, and compile receipt contracts"
  - "exact manifest/source digest binding into RP-01 authorization consumption and immediate one-shot spawn"
  - "generic model/host executor adapter identity, registry, lifecycle interface, typed outcomes, and bypass prevention"
  - "strict live adapter schemas/manifests and reusable component conformance suite"
  - "one real primary-provider implementation plus fake positive, negative, timeout, cancel, usage, and retire adapters"
non_goals:
  - "new scheduler, runtime, durable execution store, or control plane"
  - "new policy engine, authority source, capability grant, or support admission"
  - "provider-specific verifier, publication, effect, or recovery semantics"
  - "child-agent identity, delegation, scope, budget, depth, or provider mapping"
  - "live secondary-provider support without a separate support claim and admission receipt"
  - "manual provider or internal route selection in the normal operator path"
invariants:
  - "Compilation is pure with respect to authority and side effects: it validates and narrows approved inputs but never approves, grants, launches, or mutates them."
  - "No input may be omitted merely because its value is inherited, defaulted, generated, or transitively referenced."
  - "A source-manifest or effective-manifest digest mismatch denies authorization consumption and spawn."
  - "Generated route/manifests/receipts are projections and cannot be fed back as canonical authority."
  - "Every live provider launch passes through the same generic adapter registry and lifecycle contract."
  - "Adapter results are observations; canonical mission, authority, evidence, recovery, and effect owners interpret them."
  - "An unclaimed live secondary remains unavailable even if provider-specific code or a manifest exists."
