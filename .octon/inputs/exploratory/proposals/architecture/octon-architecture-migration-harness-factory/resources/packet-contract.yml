  - "ED-006 is reflected in the serialization and conformance design."
  - "Current Harness, route, resolver, adapter, authorization-consumer, and provider call paths are inventoried at the implementation commit."
exit_criteria:
  - "Identical complete inputs yield byte-identical effective manifests and equal digests."
  - "Changing any direct or transitive input changes the source/effective digest and invalidates prior authorization."
  - "The exact source/effective digest is revalidated immediately before one-shot spawn."
  - "Stale, self-widened, wrong-project, wrong-run, wrong-adapter, and changed-source launch attempts deny."
  - "Every live adapter manifest validates strictly and no provider bypasses the generic lifecycle interface."
  - "One real primary provider plus fake adapters pass prepare/launch/observe/cancel/usage/retire component conformance."
  - "No new scheduler, runtime, store, policy engine, authority source, or control plane exists."
