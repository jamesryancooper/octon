technical_identities_affected:
  - "Harness compiler implementation/version identity"
  - "Workspace Project, Project Profile, mission, Run Contract, policy, extension generation, context, model, tool, validation, evidence, and rollback input identities"
  - "effective Harness manifest and ordered source-manifest digests"
  - "generic adapter identity, version, schema digest, and conformance profile"
  - "primary-provider operation and observation identities"
trust_boundary_changes:
  - "The exact compiled source/effective digests become mandatory inputs to existing authorization and one-shot spawn boundaries."
  - "Provider selection moves from hardcoded executor-name branching to strict adapter identity and registry resolution."
  - "Compiler and adapter outputs remain non-authoritative observations/projections."
migration_preconditions:
  - "RP-01 canonical authority and launch-guard interface has exited and is frozen."
  - "RP-02 candidate-isolation and disposable execution interface has exited and is frozen."
  - "RP-10 Workspace Project and Project Profile exact-ref/digest interface has exited and is frozen."
  - "ED-006 canonical serialization, complete digesting, and provider-breadth default is retained."
  - "Every current Harness, route, resolver, adapter, and lifecycle dispatch consumer is inventoried at the implementation commit."
migration_steps:
  - "Publish strict complete Harness/source/compile-receipt contract changes and exact registry entries."
  - "Define the authority-first precedence table and enumerate every direct/transitive source before serialization."
  - "Implement one pure canonical compiler over existing route, context, project, mission, Run Contract, policy, extension, model, tool, validation, evidence, and rollback sources."
  - "Emit canonical effective bytes, ordered source manifest, digests, and compile receipt; reject missing, extra, ambiguous, stale, or unvalidated sources."
  - "Bind source/effective digests into existing authority consumption and revalidate immediately at one-shot spawn without changing authority semantics."
  - "Replace executor string and hardcoded provider branches with strict adapter identity, registry lookup, and the generic lifecycle interface."
  - "Convert one real primary provider and fake fixtures to the interface; keep all unclaimed secondary providers inactive."
  - "Validate live manifests, every input invalidation, launch negatives, lifecycle conformance, bypass absence, and no-new-runtime posture."
safe_intermediate_states:
  - "Existing route and Harness primitives remain read-only compatibility inputs while the new compiler is inert."
  - "The compiler emits and validates complete manifests/receipts but no launch consumes them."
  - "Canonical authorization records the expected digest while launch remains on the legacy path and autonomous use stays disabled."
  - "One primary adapter and fake adapters pass conformance while direct dispatch remains disabled."
  - "The new compiler and generic adapter launch path activates atomically after digest binding, bypass, and rollback tests pass."
prohibited_intermediate_states:
  - "A second scheduler, runtime store, policy evaluator, or authority source is introduced."
  - "A compile succeeds without every relevant direct/transitive source and digest."
  - "Authorization checks one digest while spawn uses or re-resolves another."
  - "Generated route/manifests/receipts become authority or writable source truth."
  - "Provider-specific code bypasses the adapter registry or generic lifecycle interface."
  - "A live secondary provider is admitted because code or a manifest exists rather than a separate support claim and proof."
  - "RP-11 implements verifier/publication, recovery/effect, or child specialization."
compatibility_bridges:
  - "Legacy route-bundle and executor-name inputs may be read only to compile/compare fixtures during the bounded cutover; they never authorize or directly dispatch once the new path activates."
  - "Existing provider modules may be wrapped temporarily behind the generic trait, but direct call sites are removed before activation."
deprecations_and_retirements:
  - "Retire executor-name match dispatch and any direct provider launch call outside the generic registry."
  - "Retire the global route bundle as a sufficient per-run Harness claim; keep it only as a generated/narrowing compiler input where still required."
  - "Retire permissive or drifted live adapter-manifest fields that do not validate against the strict contract."
rollback_strategy: >-
  Disable the Factory/generic-adapter launch path, preserve legacy route inputs
  as non-authoritative read-only data, retain candidate work and complete
  manifests/receipts for diagnosis, and require protected/manual recovery
  through existing canonical routes; never restore direct provider dispatch or
  create a fallback runtime.
recovery_strategy: >-
  Recompute from retained immutable sources, compare the ordered source
  manifest and compiler identity, revalidate strict adapter identity and
  schema, and retry only through a fresh authorization/one-shot spawn binding.
  Missing or changed sources, unknown provider outcome, or retirement failure
  remains blocked for the owning recovery semantics in RP-08.
validation_plan:
  - "canonical byte determinism and compiler-version binding"
  - "complete one-at-a-time input invalidation matrix"
  - "stale, self-widened, wrong-project, wrong-run, wrong-adapter, and changed-source launch denial"
  - "immediate authorization/spawn digest and time-of-check binding"
  - "strict adapter schema and live-manifest negatives"
  - "primary-provider and fake-adapter prepare/launch/observe/cancel/usage/retire conformance"
  - "direct-provider bypass and no-second-runtime scan"
adversarial_tests:
  - "reordered maps/lists, path aliases, symlinks, traversal, locale, timezone, line endings, and nondeterministic timestamps"
  - "omitted transitive source, duplicate identity, digest substitution, stale ref, and self-widened generated manifest"
  - "wrong project, mission, Run Contract, policy, extension generation, context, model, tool, validation, evidence, or rollback binding"
  - "unknown adapter identity, schema/version drift, undeclared lifecycle capability, provider-name injection, and direct module call"
  - "provider lost response, cancel race, malformed usage, duplicate terminal observation, and failed retire"
fault_injection:
  - "source changes between compile, authorization, and immediate spawn"
  - "compiler interruption before and after receipt publication"
  - "adapter prepare succeeds then launch fails"
  - "launch response is lost before observation"
  - "cancel and terminal observation race"
  - "usage or retirement observation is missing or malformed"
evidence_to_retain:
  - "compiler version, exact source identities/refs/digests, canonical bytes, effective digest, and compile receipt"
  - "complete invalidation and launch-denial matrices"
  - "strict schema/live-manifest validation"
  - "primary/fake lifecycle conformance and bypass scan"
  - "cutover, rollback rehearsal, and generated-projection freshness receipts"
support_claim_effect: >-
  Produces component evidence required for deterministic single-agent launch and
  provider replacement, but creates no current support claim. A live secondary
  requires a separately proposed support tuple, and integrated FD-023/FD-024
  promotion remains RP-14-owned.
operator_experience_effect: >-
  Compilation and provider adaptation are invisible on the normal path. The
  operator states intent, sees a concise deterministic block/repair reason when
  required, and never chooses an internal route, adapter, or provider.
setup_and_maintenance_effect: >-
  One compiler and adapter contract replace provider branches and implicit
  input inheritance. Normal maintenance regenerates projections through their
  owners and reports drift without creating another service or control plane.
dependencies:
  - logical_packet_id: "RP-01"
    proposal_id: "octon-architecture-migration-canonical-authority"
    required_interface: "frozen canonical authority and exact one-shot launch-guard semantics"
  - logical_packet_id: "RP-02"
    proposal_id: "octon-architecture-migration-candidate-isolation"
    required_interface: "frozen isolated execution boundary and guarded spawn interface"
  - logical_packet_id: "RP-10"
    proposal_id: "octon-architecture-migration-workspace-projects"
    required_interface: "exact Workspace Project and Project Profile refs and digests"
parallelization_constraints:
  - "Compiler design may proceed while dependencies implement, but RP-11 cannot activate or exit before RP-01, RP-02, and RP-10 exit."
  - "RP-11 consumes RP-01 authority but cannot redefine it."
  - "RP-06, RP-08, and RP-13 retain their provider specializations; shared-file integration is serialized by exact symbol/entry ownership."
must_not_run_concurrently_with:
  - "Any change redefining the frozen RP-01 authority/guard semantics consumed by digest binding."
  - "Any change redefining the RP-02 isolation/spawn interface or RP-10 project/Profile binding during activation."
