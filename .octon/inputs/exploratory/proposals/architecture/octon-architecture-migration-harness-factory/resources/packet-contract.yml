  harness_factory_compiler: "RP-11"
  input_precedence_and_normalization: "RP-11"
  effective_manifest_and_compile_receipt_contracts: "RP-11"
  authorization_and_spawn_digest_binding: "RP-11 owns the binding fields/revalidation integration; RP-01 owns authority semantics and decisions"
  generic_executor_adapter_interface_and_registry: "RP-11"
  generic_component_conformance_suite: "RP-11"
  primary_provider_adapter: "RP-11, one real primary implementation only"
  fake_conformance_adapters: "RP-11"
  verifier_and_publication_specialization: "RP-06"
  recovery_and_effect_specialization: "RP-08"
  child_semantics_and_provider_mapping: "RP-13"
  integrated_provider_equivalence_and_support_claim: "RP-14"
