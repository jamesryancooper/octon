  - "validate-proposal-program-child-readiness.sh --package <fixture-program>"
  - "validate-proposal-program-readiness-projection.sh --package <fixture-program>"
acceptance_criteria_summary: A proposal-program run records baseline state, grants route write leases only for declared scopes, uses an isolated worktree gate when required, and fails closed before mutating foreign, protected, manual, or ambiguous paths.
risk_posture: High. Ownership control must narrow authority and must not become a broad write grant.
rollback_summary: Revert or supersede only this child packet's durable promotion targets through its own rollback and correction route.
