  inputs: This child packet is non-authoritative proposal lineage.
evidence_requirements:
  - Accepted proposal review and strict pre-integration architecture review before durable edits.
  - Start-of-run baseline evidence with HEAD, branch, tracked status, untracked status, generated freshness, and relevant run refs.
  - Route write lease evidence binding route id, child id when present, owned path set, excluded path set, and lease expiry.
  - Classifier evidence distinguishing owned, leased, foreign, manual, protected, generated, and child-owned receipt surfaces.
  - Negative controls proving ambiguous ownership blocks mutation.
validation_gates:
  - "validate-proposal-standard.sh"
  - "validate-architecture-proposal.sh"
  - "validate-proposal-implementation-readiness.sh"
  - "cargo test -p kernel lifecycle_program::tests::route_write_lease_blocks_foreign_path_mutation"
