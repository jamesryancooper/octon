schema_version: "architecture-proposal-v1"
architecture_scope: "cross-domain-architecture"
decision_type: "boundary-change"
title: "Proposal Packet Phase-Loop Model"
target_state: >-
  Proposal packet lifecycles are represented as explicit phase-loop plans:
  each phase has entry evidence, allowed routes, loop policy, exit evidence,
  stop classes, checkpoint expectations, and event-log obligations. Generic
  substrate owns phase-loop mechanics; the proposal lifecycle extension owns
  proposal route semantics and packet-specific receipts. Neither layer can
  self-authorize durable mutation.
boundary_change: >-
  Introduce a layered boundary between generic lifecycle phase-loop substrate
  semantics and proposal-extension route semantics. The generic runner may
  orchestrate phases, loops, gates, checkpoints, resume, and event logs, while
  proposal-specific contracts continue to declare statuses, routes, receipts,
  review loops, implementation gates, closeout, and archival behavior.
