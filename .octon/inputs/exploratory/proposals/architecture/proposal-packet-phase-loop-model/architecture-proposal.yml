placement_decision: "layered-both"
placement_rationale: >-
  A purely extension-only design would leave checkpoint, event-log, stop-class,
  resume, and loop-bound semantics duplicated across lifecycle contracts. A
  purely substrate-only design would incorrectly move proposal route meaning
  into the generic runner. The target is layered: substrate owns common
  phase-loop mechanics; the proposal extension owns proposal packet semantics.
