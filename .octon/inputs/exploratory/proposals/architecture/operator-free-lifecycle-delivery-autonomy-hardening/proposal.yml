acceptance_criteria_summary: The program is acceptable when every postmortem recommendation has a child-owned packet with clear scope, promotion targets, validators, acceptance criteria, dependency gates, and safety boundaries preserving child authority, generated-output non-authority, and branch-no-PR proof requirements.
program_execution_mode: gated-parallel
selected_implementation_target: proposal program lifecycle and branch-no-PR delivery autonomy
scope_statement: Proposal-program coordination only. This parent creates a review-ready plan and sibling child packets. It does not implement durable lifecycle, planner, validator, delivery, git, generated, or evidence behavior.
explicit_runtime_non_implementation_statement: This parent program does not modify runtime behavior. Durable changes require accepted child packets, implementation prompts, retained child evidence, conformance, drift, validation, closeout, and archive routes.
generated_input_authority_impact: Proposal paths, prompts, chat history, dashboards, generated outputs, and local-only evidence remain non-authoritative. Generated outputs remain derived-only and must be refreshed only through canonical generators.
authority_class_impact:
  framework: Coordinates future lifecycle planner, validator, workflow, delivery, contract, and git-helper changes.
  instance: No direct instance authority changes from this parent packet.
  state_control: No state-control mutation from this parent packet.
  state_evidence: Future children may define retained evidence indexes and receipts, but this parent creates none beyond proposal-local planning evidence.
  generated: No generated output edits. Generated outputs remain derived-only and non-authoritative.
  inputs: Parent and child packets are proposal lineage only.
evidence_requirements:
  - Child-owned review, readiness, implementation, conformance, drift, validation, closeout, and archive evidence for each implemented child.
  - Regression tests for planner blocker vectors, terminal evidence summaries, targeted freshness, runtime resolver, execution-mode normalization, branch-no-PR receipt building, and bounded authorization envelopes.
  - Negative controls proving PR fallback remains forbidden and parent summaries cannot satisfy child-owned evidence.
validation_gates:
  - validate-proposal-standard.sh for parent and children
  - validate-architecture-proposal.sh for parent and children
  - validate-proposal-program-structure.sh for parent
  - validate-proposal-implementation-readiness.sh for children
  - generate-proposal-registry.sh --check
rollback_summary: If review rejects this program, supersede or remove this parent and child proposal lineage. If child work begins, rollback or supersede through each child packet's own route and promotion targets.
