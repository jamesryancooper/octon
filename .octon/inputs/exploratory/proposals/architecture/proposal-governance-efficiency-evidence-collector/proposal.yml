schema_version: proposal-v1
proposal_id: proposal-governance-efficiency-evidence-collector
title: Governance Efficiency Evidence Collector
summary: Implement read-only collection of retained lifecycle and proposal evidence needed for governance efficiency reports, including timing, retry, blocker, validation, freshness, and handoff signals.
proposal_kind: architecture
promotion_scope: octon-internal
promotion_targets:
  - ".octon/framework/assurance/runtime/_ops/scripts/"
  - ".octon/framework/assurance/runtime/_ops/tests/"
status: draft
change_profile: atomic
lifecycle:
  temporary: true
  exit_expectation: Review this child independently, then implement only read-only retained evidence collection after the report contract child reaches terminal outcome.
related_proposals:
  - proposal-program-governance-efficiency-evaluation
  - proposal-governance-efficiency-report-contract
selected_implementation_target: Read-only governance efficiency evidence collection.
scope_statement: This child owns evidence discovery and normalization inputs for advisory reports. It does not score controls, emit recommendations, expose operator commands, or mutate lifecycle state.
explicit_runtime_non_implementation_statement: This proposal does not change runtime behavior until a later accepted implementation route promotes durable collector changes.
generated_input_authority_impact: Collector outputs cite retained evidence by reference and remain advisory inputs. They cannot authorize lifecycle transitions.
authority_class_impact:
  framework: May add read-only collector scripts and tests.
  instance: No instance authority change.
  state_control: No state-control mutation.
  state_evidence: Reads retained evidence and may emit advisory collector output when invoked.
  generated: No generated output authority change.
  inputs: Temporary proposal lineage only.
evidence_requirements:
  - Tests proving collector operation is read-only.
  - Fixture coverage for missing, partial, stale, and contradictory evidence.
  - Source reference proof that collected facts cite retained evidence paths.
validation_gates:
  - "validate-proposal-standard.sh"
  - "validate-architecture-proposal.sh"
  - "validate-proposal-implementation-readiness.sh"
  - "read-only collector fixture tests"
acceptance_criteria_summary: The collector is acceptable when it extracts governance timing, retry, blocker, validation, freshness, and handoff signals without mutating state or overstating missing evidence.
risk_posture: Medium. A collector that writes or overstates evidence could undermine authority boundaries.
rollback_summary: Revert or supersede only collector scripts and tests owned by this child.
owner:
  role: Octon governance efficiency evidence collector architect
  accountable_role: human operator / repository owner
created_date: 2026-07-01
source_lineage:
  - ".octon/state/evidence/runs/workflows/"
  - ".octon/state/control/execution/runs/"
  - ".octon/framework/assurance/runtime/_ops/scripts/"
  - ".octon/framework/assurance/runtime/_ops/tests/"
