schema_version: "proposal-v1"
proposal_id: "octon-architecture-migration-verification-publication"
title: "Immutable Verification and Adaptive Publication"
summary: >-
  Define a candidate-immutable exact-SHA verifier and one deterministic
  publication policy that sends eligible Class B work through the broker's
  expected-old fast-forward primitive, routes valid review-required work to
  protected PR, and denies invalid authority without prompt or PR laundering.
