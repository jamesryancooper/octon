schema_version: "proposal-v1"
proposal_id: "octon-architecture-migration-verification-publication"
title: "Immutable Verification and Adaptive Publication"
summary: >-
  Define a candidate-immutable exact-SHA verifier and one deterministic
  publication policy that defaults eligible Class B to
  brokered-class-b-no-pr, selects protected PR only for valid review-required
  or stable pre-route high-contention work, proves history and S-to-Q results,
  and denies invalid, collided, or unknown authority without PR laundering.
