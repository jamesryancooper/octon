  Class A/B/C and Class-B/PR predicate, deterministic route selector,
  provider verification/publication specialization, authenticated check
  binding, and zero-prompt route status.
scope_statement: >-
  RP-06 owns verification and publication policy, not generic provider
  execution, the runtime store, broker credentials, Git effect execution,
  recovery policy, trust activation, support admission, or .github workflow
  files. Provider projections may change only after an authored .octon source
  or generator resolves the target-family boundary.
authority_class_impact:
  framework: >-
    Adds exact verdict and route contracts, a protected provider adapter
    specialization, runtime request/side-effect integration, provider
    projection-source ownership, and validation suites.
  instance: >-
    Adds the immutable publication policy and narrows the Git capability-pack
    posture without widening live support.
  state_control: >-
    No control truth is created by this proposal. Later runtime operations
    consume RP-01 authority and RP-03 attempt state.
  state_evidence: >-
    Later implementation retains child-owned verifier, route, provider, drift,
    rollback, conformance, and projection evidence under the declared root.
  generated: >-
    No generated/effective or .github host projection is a promotion target;
    projection refresh requires an owning source/generator and receipt.
  inputs: >-
    This packet is non-authoritative proposal input and cannot verify, route,
    publish, or admit support by itself.
runtime_behavior_impact: >-
  None at draft. After governed implementation, an authenticated exact-SHA
  verdict and immutable predicate route eligible Class B through RP-05, valid
  review-required work through protected PR, and invalid authority to denial.
generated_input_authority_impact: >-
