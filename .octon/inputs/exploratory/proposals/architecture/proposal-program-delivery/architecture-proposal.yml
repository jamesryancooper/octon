schema_version: "architecture-proposal-v1"
architecture_scope: "cross-domain-architecture"
decision_type: "new-surface"
title: "Governed Proposal Delivery: Proposal Program Delivery"
target_state: >-
  Governed Proposal Delivery exists as a native cross-lifecycle delivery
  process. Its first mode, Proposal Program Delivery, uses a schema-backed
  profile and strict delivery receipt to run a parent proposal program through
  child execution, program closeout/archive, generated freshness, Change
  closeout, repo hygiene, branch-no-pr landing, branch cleanup, local main sync,
  and final cleaned proof by delegating authority to existing target-owned
  lifecycles.
boundary_change: >-
  Adds a coordinating delivery layer above existing proposal and closeout
  surfaces. The delivery layer may select the next target-owned lifecycle, pass
  scoped non-authorizing context, validate returned receipts, replan from
  current repo state, and aggregate evidence. It may not authorize proposal
  transitions, Git mutation, branch landing, branch deletion, cleanup,
  publication, archive, or closeout by itself.
authoritative_targets_after_promotion:
