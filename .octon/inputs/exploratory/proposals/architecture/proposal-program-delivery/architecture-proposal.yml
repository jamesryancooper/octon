implementation_grade_summary: >-
  Implementation must add one native delivery workflow, two schema contracts,
  strict profile and receipt validators with tests, thin operator entrypoints,
  product feature documentation, workflow registry entries, proposal lifecycle
  hooks, terminal proof integration, and lifecycle residue validation without
  duplicating existing proposal-program, proposal-packet, conformance, drift,
  publication, mechanism-integration, closeout, repo-hygiene, branch
  authorization, or terminal-proof responsibilities.
