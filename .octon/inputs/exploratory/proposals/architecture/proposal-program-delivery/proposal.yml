schema_version: proposal-v1
proposal_id: proposal-program-delivery
title: 'Governed Proposal Delivery: Proposal Program Delivery'
summary: Add a native Governed Proposal Delivery process with the first concrete mode, Proposal Program Delivery. The delivery runner sequences existing proposal-program, proposal-packet, conformance, drift, publication, mechanism-integration, closeout, repo-hygiene, branch cleanup, sync, and terminal-proof lifecycles while validating their target-owned receipts.
