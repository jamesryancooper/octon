- governed mechanism integration validation when applicable
- lifecycle residue cleanup validation
- Change closeout receipt validation
- branch landing authorization validation before hosted mutation
- branch cleanup authorization validation before branch deletion
- terminal current-state proof validation
- worktree hygiene validation
- git diff --check
