schema_version: octon-child-repo-placement-v1
child_id: token-efficiency-lifecycle-context-pack-integration
parent_program: token-efficient-proposal-program-controller
promotion_targets:
- .octon/framework/engine/runtime/spec/context-pack-builder-v1.md
- .octon/framework/engine/runtime/crates/lifecycle_executor/src/
- .octon/framework/engine/runtime/crates/kernel/src/lifecycle_program.rs
- .octon/instance/governance/policies/context-packing.yml
produced_artifacts:
- context-pack-policy.yml
- source-manifest.json
- omissions.json
- model-visible-context.sha256
default_model_route: deterministic policy enforcement; high-reasoning only on context authority conflict
token_ceiling: stage-specific; default proposal-program child dispatch ≤12k before target file excerpts
