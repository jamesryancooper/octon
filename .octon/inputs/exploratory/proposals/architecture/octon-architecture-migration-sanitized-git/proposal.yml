program_child_id: "RP-05"
program_workgroup_id: "RWG-05"
sequence:
  priority: "P0"
  order: 5
  dependency_gate: "verified-child-exit"
  dependencies:
    - "octon-architecture-migration-local-broker"
logical_dependencies:
  - "RP-04"
selected_implementation_target: >-
  Broker-owned sanitized Git request/result, non-executing candidate-object
  transfer, closed Git configuration and transport policy, sealed conditional
  ref operations, and atomic expected-old fast-forward execution.
scope_statement: >-
  RP-05 owns the Git effect primitive inside the RP-04 broker boundary. It does
  not own broker authority, credentials, the runtime store, provider verdicts,
  route classification, history shape, PR semantics, cleanup eligibility,
  support admission, GitHub workflow projections, or provider-specific outcome
  classification.
authority_class_impact:
  framework: >-
    Adds a broker Git adapter and typed effect contract, updates current
    hosted-no-PR helper boundaries and authorization inventories, and adds
    hostile-Git validation fixtures.
  instance: >-
    No instance authority or support-target admission is changed by this
    packet.
  state_control: >-
    No control truth is created by this proposal. Later implementation
    consumes RP-03/RP-04 operation state through frozen interfaces.
  state_evidence: >-
    Later implementation retains child-owned proof under the declared
    proposal validation evidence root.
  generated: >-
    No generated/effective or GitHub host projection is a promotion target.
  inputs: >-
    This packet remains non-authoritative proposal input and cannot authorize
    an effect.
runtime_behavior_impact: >-
  None at draft. After governed implementation, the broker can perform one
  exact fast-forward ref effect without evaluating candidate-controlled Git
  behavior; unavailable, collided, denied, or unknown execution preserves
  candidate work and the frozen route. Any later PR requires a fresh valid
  pre-effect RP-06 route decision.
generated_input_authority_impact: >-
  No input, generated output, host check, provider observation, or proposal
  artifact becomes authority.
evidence_requirements:
  - "PO-FD-009 and PG-05-SANITIZED-GIT proof bundle."
  - "UE-005 hostile extension and scratch-provider expected-old proof."
  - "Cross-reference evidence for the FD-010 Git primitive consumed by RP-06."
  - "Atomic change profile and rollback receipts."
  - "Implementation conformance and post-implementation drift/churn receipts."
validation_gates:
