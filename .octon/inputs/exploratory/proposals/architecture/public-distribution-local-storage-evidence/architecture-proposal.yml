schema_version: "architecture-proposal-v1"
architecture_scope: "local-private evidence semantics, Git posture, retention, backup, generated outputs, host projections, and heterogeneous inputs"
decision_type: "boundary-change"
decision_summary: "Make operational evidence, runtime state, generated outputs, caches, logs, and host projections local by default; retain only classified compact receipts or pointers when collaboration, release, governance, or recovery requires hosting; and use truthful content hashes and local-private semantics."
affected_surfaces:
  - "root Git-posture policy"
  - "evidence storage classes"
  - "retention and replay schemas"
  - "shell and Rust evidence producers and consumers"
  - "run evidence writer and tests"
  - "retention and backup policy"
  - "input subtype classification"
  - "generated and host locality"
  - "publishable compact receipts"
non_authority_statement: "This packet defines a proposed implementation boundary only. It does not authorize implementation, external effects, publication, legal conclusions, or risk acceptance."
