schema_version: proposal-v1
proposal_id: closeout-worktree-autonomous-partition-evidence
title: Closeout Worktree Autonomous Partition Evidence
summary: Strengthen closeout-worktree to return non-mutating partition reports when ownership is provable, preserving foreign/manual residue and child-owned evidence boundaries.
proposal_kind: architecture
promotion_scope: octon-internal
promotion_targets:
  - ".octon/framework/capabilities/runtime/skills/remediation/closeout-worktree/"
  - ".octon/framework/assurance/runtime/_ops/scripts/classify-proposal-worktree-hygiene.sh"
  - ".octon/framework/assurance/runtime/_ops/scripts/validate-closeout-worktree-wrapper.sh"
  - ".octon/framework/assurance/runtime/_ops/tests/test-closeout-worktree-wrapper.sh"
  - ".octon/framework/product/contracts/lifecycle-interaction-return-v1.schema.json"
  - ".octon/framework/product/contracts/change-closeout-state-machine.yml"
status: in-review
change_profile: atomic
lifecycle:
  temporary: true
  exit_expectation: Review this child packet independently, authorize implementation only after accepted review and strict architecture review, retain child-owned evidence, and close out only after validators prove closeout-worktree partition reports are non-mutating and do not replace child-owned receipts.
related_proposals:
  - proposal-program-execution-resilience-and-supersession
selected_implementation_target: Add non-mutating autonomous partition reports to closeout-worktree for provable ownership handoffs.
scope_statement: This child owns closeout-worktree partition evidence only. Proposal-program loop control, ownership baseline, and supersession remain separate child packets.
explicit_runtime_non_implementation_statement: This child packet does not implement durable behavior until a later accepted implementation route.
generated_input_authority_impact: Generated outputs, proposal paths, prompts, chat history, dashboards, and local-only evidence remain non-authoritative.
authority_class_impact:
  framework: Future implementation may update closeout-worktree skill docs, wrapper validation, classifier behavior, product contracts, state machine docs, and tests listed in promotion targets.
  instance: No instance authority changes planned.
  state_control: No state-control mutation from this proposal packet.
  state_evidence: Future implementation may define retained closeout-worktree report evidence and lifecycle interaction return evidence for this child only.
  generated: Generated outputs remain derived-only and must not be hand-edited.
  inputs: This child packet is non-authoritative proposal lineage.
evidence_requirements:
  - Accepted proposal review and strict pre-integration architecture review before durable edits.
  - Partition report evidence with include paths, exclude paths, ownership basis, classifier digest, and non-mutating disposition.
  - Lifecycle interaction return evidence that cites partition reports without transferring authority.
  - Negative controls proving reports cannot authorize deletion, staging, commit, push, archive, publication, branch cleanup, child closeout, or terminal delivery claims.
validation_gates:
  - "validate-proposal-standard.sh"
  - "validate-architecture-proposal.sh"
  - "validate-proposal-implementation-readiness.sh"
  - "validate-closeout-worktree-wrapper.sh"
  - "validate-closeout-worktree-wrapper.sh --report <partition-report>"
  - "test-closeout-worktree-wrapper.sh"
  - "classify-proposal-worktree-hygiene.sh --target <fixture-program> --lifecycle proposal-program"
acceptance_criteria_summary: closeout-worktree can autonomously partition provably owned and foreign/manual residue into non-mutating reports, return those reports to a proposal-program lifecycle, and preserve child-owned evidence without authorizing cleanup or terminal delivery claims.
risk_posture: High. Partition evidence must not become cleanup authority or a replacement Change receipt.
rollback_summary: Revert or supersede only this child packet's durable promotion targets through its own rollback and correction route.
owner:
