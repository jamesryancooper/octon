  - ".octon/inputs/additive/extensions/octon-proposal-lifecycle/context/bundle-matrix.md"
  - ".octon/framework/product/features/catalog.yml"
status: in-review
change_profile: atomic
lifecycle:
  temporary: true
  exit_expectation: Review this child independently, implement regression validation for the accepted lifecycle surface set, and close out with child-owned validation evidence.
