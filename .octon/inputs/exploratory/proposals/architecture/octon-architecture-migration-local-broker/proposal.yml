schema_version: "proposal-v1"
proposal_id: "octon-architecture-migration-local-broker"
title: "Supervised Local Broker and Credential Custody"
summary: >-
  Introduce one supervised macOS-local broker that validates existing
  authority, authenticates clients more strongly than same UID, holds durable
  credentials in Keychain, consumes one-shot store-bound operation handles,
  is the sole deployed runtime-store writer and effect-adapter host, restarts
  and repairs unattended, and never mints authority or verifier verdicts.
