fitness:
  - "static census rejects new broker-named CLI/workflow/script or credentialed effect entrypoint without a disposition"
  - "CLI parser exposes exactly one top-level broker concept and no generic raw-effect command"
  - "call graph rejects policy-grant-broker repurposing, generated-publication calls, authority minting, verifier verdicts, and ambient/direct fallbacks"
