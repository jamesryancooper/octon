  - "before source changes, RP-01/RP-02/RP-03 implementation verification and ED-001 pass"
  - "exact ED-002 Cargo/SDK/signing/install/Keychain/fixture preflight passes"
  - "ED-007 static surface census is fresh"
exit_criteria:
  - "only broker holds durable credentials and the normal DB write connection"
  - "forged/replayed/same-UID/wrong-identity requests deny"
  - "broker auto-starts, restarts, scans state, and repairs unattended"
  - "one-command setup/status/doctor/repair lifecycle passes"
  - "exact disposable scratch effect completes or reconciles without repeat"
