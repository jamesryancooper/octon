schema_version: proposal-v1
proposal_id: proposal-architecture-review-route-visibility
title: Architecture Review Route Visibility
summary: Make required strict pre-integration architecture review visible as a route graph dependency and status edge for architecture proposal packets.
proposal_kind: architecture
promotion_scope: octon-internal
promotion_targets:
  - ".octon/framework/engine/runtime/"
  - ".octon/framework/orchestration/runtime/workflows/audit/pre-integration-architecture-review/"
  - ".octon/framework/assurance/runtime/_ops/tests/"
status: draft
change_profile: atomic
lifecycle:
  temporary: true
  exit_expectation: Review this child independently, then implement only architecture-review visibility after explicit implementation authorization.
related_proposals:
  - proposal-program-clean-delivery-operator-surface
  - proposal-program-route-graph-preview
selected_implementation_target: Architecture-review status visibility in proposal-program route graphs.
scope_statement: This child owns visibility of architecture-review dependencies only. It does not change architecture-review verdict semantics, proposal acceptance rules, or delivery authority.
explicit_runtime_non_implementation_statement: This proposal does not change runtime behavior until a later accepted implementation route promotes durable runtime and test changes.
generated_input_authority_impact: Architecture-review status output is diagnostic. Only the schema-backed receipt and validator result can satisfy the architecture-review gate.
authority_class_impact:
  framework: May update lifecycle route graph/status output and architecture-review documentation references.
  instance: No instance authority change.
  state_control: No state-control mutation.
  state_evidence: Future evidence may record diagnostic route graph status only.
  generated: No generated output authority change.
  inputs: Temporary proposal lineage only.
evidence_requirements:
  - Fixtures for missing, stale, failing, and passing pre-integration architecture review receipts.
  - Proof that accepted architecture proposal review requires a passing fresh receipt where current gates require it.
  - Negative controls proving diagnostic status does not substitute for the receipt.
validation_gates:
  - "validate-proposal-standard.sh"
  - "validate-architecture-proposal.sh"
  - "validate-proposal-implementation-readiness.sh"
  - "architecture-review receipt freshness fixtures"
acceptance_criteria_summary: Architecture-review visibility is acceptable when operators can see the requirement before it blocks delivery and the receipt remains the only satisfying evidence.
risk_posture: Medium. Visibility must not imply automatic review authorization or receipt substitution.
rollback_summary: Revert or supersede route graph/status output changes owned by this child.
owner:
  role: Octon architecture-review visibility architect
  accountable_role: human operator / repository owner
created_date: 2026-07-06
source_lineage:
  - ".octon/framework/orchestration/runtime/workflows/audit/pre-integration-architecture-review/workflow.yml"
  - ".octon/framework/orchestration/runtime/workflows/meta/promote-proposal/"
  - ".octon/framework/engine/runtime/crates/kernel/src/lifecycle_program.rs"
