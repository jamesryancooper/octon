schema_version: octon-child-repo-placement-v1
child_id: token-efficiency-token-measurement-ledger
parent_program: token-efficient-proposal-program-controller
promotion_targets:
- .octon/framework/engine/runtime/spec/
- .octon/framework/engine/runtime/crates/kernel/src/lifecycle_program.rs
- .octon/framework/engine/runtime/crates/lifecycle_executor/src/
- .octon/framework/assurance/runtime/_ops/scripts/
- .octon/framework/assurance/runtime/_ops/tests/
produced_artifacts:
