authority_class_impact:
  framework: Would add or amend runtime spec contracts, one candidate fail-closed rule, and one negative-control validator after acceptance through the governed route.
  instance: No instance mutation.
  state_control: No control-truth mutation by this packet.
  state_evidence: Cites retained review evidence; implementation later retains its own receipts.
  generated: No generated/effective publication; registry regeneration deliberately skipped at creation.
  inputs: This packet is proposal-local candidate lineage only and cannot authorize anything.
runtime_behavior_impact: None until accepted and implemented; accepted target
  removes or contracts ambient overrides without weakening deny-by-default.
generated_input_authority_impact: No generated, input, host, or environment
  surface gains authority under any option in this packet.
evidence_requirements:
