selected_implementation_target: Governance of authority-affecting runtime environment inputs
scope_statement: Governs the authority-affecting OCTON_* ambient environment
  overrides and the stage_only_behavior policy configuration field. It defines
  disposition, receipts, protected-mode behavior, documentation surfaces, and
  negative controls. It excludes implementation patches, unrelated runtime
  refactors, support widening, generated/effective publication, proposal
  program creation, and constitutional amendment drafting.
