schema_version: proposal-v1
proposal_id: runtime-environment-override-governance
title: Runtime Environment-Override Governance
summary: Decide the architecture disposition for ambient OCTON_* environment
  variables that affect authority decisions (route-bundle freshness bypass,
  policy mode, execution role, execution intent). Recommended option removes
  ambient authority-affecting overrides and replaces the one evidenced
  legitimate use (route-bundle publication bootstrap) with an explicit
  receipted runtime input on the narrow publication path; break-glass remains
  the existing human-issued constitutional rank-1 route, not process
  environment. Attaches documentation of the undocumented stage_only_behavior
  policy configuration field.
proposal_kind: architecture
promotion_scope: octon-internal
change_profile: atomic
release_state: pre-1.0
status: draft
selected_direction: option-b-removal-replacement (operator governance direction recorded in support/governance-decision-context.md; formal acceptance pending through the proposal lifecycle)
governance_decision_context: support/governance-decision-context.md
pre_implementation_gate: targeted Prompt 4 Architecture Readiness Audit after acceptance, before implementation planning (not yet run); gate definition in architecture/implementation-plan.md precondition 3, and its result must be dispositioned per the "Prompt 4 Gate Result Handling" section there (proceed / revise / defer / escalate / rerun) before planning proceeds
operational_flexibility_note: maximum self-governance is preserved through a three-tier hierarchy — normal operations system-governed, exceptional-but-anticipated operations (publication bootstrap) system-governed with machine-checked preconditions and auto-denial, and human break-glass reserved for true exceptional override; no routine operation gains a human-in-the-loop step; see architecture/operational-flexibility-and-migration.md
owner: octon-maintainers
decision_authority: human governance per .octon/framework/constitution/ownership/roles.yml (governance_owner); final option selection requires human acceptance
