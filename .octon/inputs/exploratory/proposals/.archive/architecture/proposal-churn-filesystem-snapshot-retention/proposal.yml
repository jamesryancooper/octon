  - "reference-integrity checks"
acceptance_criteria_summary: Filesystem snapshot retention is acceptable when unchanged snapshots do not churn, stale generated snapshots are pruned only by producer-owned authority, and referenced evidence remains intact.
risk_posture: Medium. Snapshot pruning without reference proof could lose diagnostic context.
rollback_summary: Revert or supersede only filesystem snapshot service and test changes owned by this child.
