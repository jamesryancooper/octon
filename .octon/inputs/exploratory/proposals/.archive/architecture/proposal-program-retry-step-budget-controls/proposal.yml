evidence_requirements:
- Accepted proposal review and strict pre-integration architecture review before durable edits.
- Evidence that `lifecycle program retry` accepts bounded `--max-steps` without requiring a new run id.
- Evidence that omitted retry options preserve current behavior.
- Evidence that retry-time overrides cannot change lifecycle id, target, run inputs, child ownership, authority boundaries, or gate outcomes.
- Evidence that documentation names the operational workaround and the durable retry controls.
