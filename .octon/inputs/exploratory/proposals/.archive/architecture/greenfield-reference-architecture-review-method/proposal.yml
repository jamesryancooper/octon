runtime_behavior_impact: At implementation, a reviewer who selects the greenfield-reference-architecture-review-method (already routable via routing v2 method_selection) gains an authored output contract to conduct the review against. Balanced remains the default method; no route, gate, or evidence root changes; selecting the greenfield method still grants its outputs no authority - they remain reference architecture that is evidence or proposal input only.
scope_statement: Author exactly the Greenfield Reference Architecture Review method doc and wire it into the existing mechanism. In scope - the new method doc with the five required output sections, initial-build sequencing, minimum viable architecture, what-not-to-build-yet list, required inputs, non-goals, clean-sheet complementarity with Balanced, escalation rules, the lens-profile reference bound to lens-bank.yml, and the reference-architecture-only output boundary stated fail-closed; the additive doc reference on the existing naming.yml greenfield catalog entry; and a README references link. Out of scope and left untouched - the four companion method docs (companion-methods child, phase-2); the report and routing-decision schema v2 additions (schema-extensions child, phase-2); the naming methods list, routing method_selection, and mechanism README canonical-names table authored by phase-1 (consumed as verified dependencies, only the greenfield catalog entry gains a doc reference); the phase-0 lens bank (consumed as a verified dependency, not modified); Balanced doctrine; review workflow method-recording and generated projection refresh (suite-integration child, phase-3); and architecture-readiness and surface-architecture audit doctrine.
