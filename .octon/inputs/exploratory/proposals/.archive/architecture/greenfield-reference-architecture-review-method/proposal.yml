title: Greenfield Reference Architecture Review Method
summary: Phase-2 child of the Architecture Review Method Suite Program. Authors the Greenfield Reference Architecture Review method doc (greenfield-reference-architecture-review-method.md) inside the existing Architectural Review Mechanism, per method-taxonomy.md section 2. The doc answers one question - "if this system or subsystem did not exist, what should we build first?" - and specifies five required output sections (domain/job model; reference architecture; quality/security/ops model; authority/evidence model; evolution plan), plus initial-build sequencing, a minimum viable architecture, and an explicit what-not-to-build-yet list. It records the method's required inputs, non-goals, the clean-sheet complementarity with the Balanced method, its escalation rules, its binding to the verified lens-bank.yml greenfield profile, and the reference-architecture-only output boundary stated fail-closed. It wires the doc into naming.yml by adding the doc reference to the existing greenfield catalog entry and adds a README references link, both additive and navigation only. It creates no new mechanism, gate, routed workflow mode, evidence root, or command facade, changes no companion or Balanced doctrine, and grants no review output any authority.
