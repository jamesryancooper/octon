schema_version: "architecture-proposal-v1"
proposal_id: "autonomous-blocker-taxonomy"
title: "Autonomous Blocker Taxonomy"
architecture_scope: "cross-domain-architecture"
decision_type: "boundary-change"
status: "draft"
release_state: "pre-1.0"
change_profile: "atomic"
problem_statement: >-
  Lifecycle runs have treated recoverable validation drift, stale evidence, and
  bounded continuation states too much like operator blockers. A durable,
  validator-readable taxonomy is needed so safe recovery can proceed
  autonomously while hard blockers remain fail-closed.
