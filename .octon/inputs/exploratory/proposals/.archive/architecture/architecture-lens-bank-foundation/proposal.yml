evidence_requirements:
- Cited non-authoritative intake unit architecture-review-method-suite and the parent program design docs (lineage only, never authority).
- Lens-reference validator evidence including at least one negative control per fail-closed rule (undefined lens id in a method reference; defined method missing a lens profile).
- Doc/registry consistency evidence that architecture-lens-bank.md and lens-bank.yml agree on the 18 lens ids and the six method profiles.
- Proof that Balanced's required lens set equals its existing required sequence expressed as lens ids, with Balanced doctrine text unchanged.
- Child lifecycle evidence retained under .octon/state/evidence/validation/proposals/architecture-lens-bank-foundation/ before closeout.
generated_input_authority_impact: No generated, input, host, chat, dashboard, or model-memory surface gains authority. The lens bank is analysis tooling selected by methods; it grants no review output authority and widens no support claim.
