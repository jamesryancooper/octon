schema_version: proposal-v1
proposal_id: architecture-lens-bank-foundation
title: Architecture Lens Bank Foundation
summary: Phase-0 seed-reference child of the Architecture Review Method Suite Program. Authors the shared architecture lens bank as two durable methodology artifacts — architecture-lens-bank.md (lens doctrine) and lens-bank.yml (machine-readable lens ids plus per-method lens profiles for all six suite methods) — under the existing Architectural Review Mechanism, plus a lens-reference validator and fixtures that fail closed when a method doc references an undefined lens id or a defined method lacks a profile. The bank expresses Balanced Architecture Review's existing required sequence as lens ids without changing Balanced doctrine. It creates no new mechanism, gate, routed workflow mode, or command facade, and grants no review output any authority.
