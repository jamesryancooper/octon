scope_statement: Author exactly the lens-bank foundation surface — one lens doctrine doc, one machine-readable lens/profile registry, one lens-reference validator, and its fixtures (including at least one negative control). Express Balanced's existing required sequence as lens ids without altering Balanced doctrine. Encode the 18-lens catalog (12 core, 6 extended) and the six per-method lens profiles exactly as fixed by the parent program's lens-bank-design.md, re-grounded against the live mechanism. Out of scope and left untouched — naming.yml method-list refactor, review-routing.yml method-selection semantics, method docs (Greenfield and companions), contract schemas, review workflow contracts, command/skill facades, and architecture-readiness or surface-architecture audit doctrine. This child owns only the lens bank the later children depend on.
