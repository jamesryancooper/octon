  - "validate-no-raw-generated-effective-runtime-reads.sh"
acceptance_criteria_summary: Effective publication idempotency is acceptable when unchanged semantic inputs do not rewrite runtime-facing generated/effective outputs and all freshness, lock, receipt, resolver, and negative-control guarantees remain intact.
risk_posture: High. Runtime-facing generated/effective outputs are non-authoritative but freshness-critical.
rollback_summary: Revert or supersede only effective publisher, validator, and test changes owned by this child.
