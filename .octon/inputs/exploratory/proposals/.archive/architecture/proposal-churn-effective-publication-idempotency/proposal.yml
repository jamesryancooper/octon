selected_implementation_target: Runtime-facing generated/effective publication idempotency.
scope_statement: This child owns effective publication no-op stability for runtime, capability, governance, locality, and related lock/receipt surfaces. It does not remove required freshness or receipt obligations.
explicit_runtime_non_implementation_statement: This proposal does not change runtime behavior until a later accepted implementation route promotes durable publisher or validator changes.
generated_input_authority_impact: Runtime-facing generated/effective outputs remain derived-only and must be consumed through freshness-checked handles.
authority_class_impact:
  framework: May update effective publishers, validators, and tests.
  instance: No direct instance authority change.
  state_control: No state-control mutation.
  state_evidence: Publication receipts remain retained evidence.
  generated: Future implementation may reduce rewrites through publisher-owned generation only.
  inputs: Temporary proposal lineage only.
evidence_requirements:
  - No-op effective publication proof with zero tracked diffs.
  - Freshness, lock, receipt, resolver, and raw-path negative-control evidence.
  - Proof that changed-file count scales with changed effective inputs.
validation_gates:
