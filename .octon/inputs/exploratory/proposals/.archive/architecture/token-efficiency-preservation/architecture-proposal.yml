decision_type: "surface-refactor"
status: "draft"
release_state: "pre-1.0"
change_profile: "atomic"
problem_statement: >-
  Autonomous recovery can reduce manual friction but may increase token usage if
  every retry emits verbose logs or broad summaries. Recovery design needs
  explicit compactness constraints.
