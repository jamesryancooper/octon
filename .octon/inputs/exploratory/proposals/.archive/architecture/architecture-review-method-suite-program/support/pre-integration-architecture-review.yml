mode_specific_coverage:
  review_charter: "Pre-integration architecture review of the parent coordination program before acceptance. Decision under review: adopt the Architecture Review Method Suite as the method layer of the existing Architectural Review Mechanism, coordinated as seven gated-parallel child packets. Scope is coordination structure and suite design direction only; no child content, no implementation."
  system_job: "The program's job is to convert the non-authoritative architecture-review-method-suite intake into governed, child-owned work units that add five companion review methods and one shared lens bank while keeping Balanced Architecture Review the default and preserving every existing authority boundary."
  current_reality: "The live mechanism has one method (balanced-architecture-review-method) in a single-method naming model, occasion-shaped routes in review-routing.yml, v1 report/routing-decision/support-receipt schemas, seven validators, three audit doctrines (readiness, domain, surface), and no lens catalog. The packet's disposition matrix was verified against these surfaces at HEAD."
  steelman_and_chestertons_fence: "The single-method model is deliberate simplicity, not neglect; the program preserves it as default and refactors only the naming shape that hard-codes the single-method assumption. Readiness and surface-audit doctrine are fenced: composed with, never modified. Existing routes, slugs, aliases, evidence roots, and the pre-integration gate are preserved unchanged."
  clean_sheet_comparison: "A clean-sheet design would build the same method/lens split (methods own question and output contract; lenses reusable) but might merge taxonomy and lens bank into one surface; the packet keeps them as two children because the lens bank is the verification-gated foundation other children cite, which the clean-sheet comparison confirmed as the lower-drift shape."
  target_architecture_fit: "The target state extends the existing mechanism in place: naming v2 methods list, routing v2 additive method-selection with fail-closed unknown_method, five sibling method docs, one lens bank with machine-readable profiles, additive v2 report/routing-decision schemas, method-id recording in existing workflows. No new mechanism, no new routed mode, no new gate, no new command facade in required children."
  authority_boundaries: "Review outputs remain evidence or proposal input; the pre-integration support receipt remains the only lifecycle-gating review artifact; generated outputs stay derived-only behind canonical publishers; the intake unit stays non-authoritative lineage; children never nest under the parent and parent evidence never satisfies child receipts; write scopes are registry-declared per child."
  failure_modes_and_second_order_effects: "Reviewed: methodology sprawl (bounded by lens admission rule and no-private-catalog rule with validator backing); routing regression (v2 is additive; negative controls required); schema drift (v1 coexistence declared; support receipt untouched); program stall on the conditional child (explicit no-action closure route); foundation-child rejection (declared program-supersession disposition, not silent scope narrowing)."
  evidence_and_validation_plan: "Per-child validation floors are bound in the child contract: negative controls on every enforcement-touching child, doc-consistency checks on doc-only children, full architectural-review validator sweep plus feature-catalog validator at integration, projection refresh only through canonical publishers with retained refresh evidence, aggregate program evidence outside proposal paths before closeout."
  rollback_and_closeout: "Parent rollback is archival with rationale; child rollback posture is declared per child before implementation (registry rollback_posture manual); schema and naming children must declare v1 coexistence/rollback posture; closeout requires every registry child at an allowed terminal outcome, two recorded standing deferrals (command-facades no-action default; boundary-authority generic mode), and intake-unit routing through governed incoming-intake rules."
  verdict_basis: "Structural validators pass at this digest (proposal standard errors=0; architecture subtype errors=0; program structure errors=0 warnings=0); the coordination structure satisfies the program acceptance criteria; no unresolved blockers remain at review time."
  digest_refresh: "This receipt refresh re-stamps the current packet digest after the program-review-revision loop added support/implementation-grade-completeness-review.md (verdict pass, zero unresolved questions); review substance and verdict are unchanged and no promotion target or authority expansion is introduced."
