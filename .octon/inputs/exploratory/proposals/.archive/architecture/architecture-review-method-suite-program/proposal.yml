authority_class_impact:
  framework: Children (not the parent) would extend methodology docs, naming and routing models, contract schemas, workflow contract fields, product feature notes, and validators under framework/**; the parent changes nothing.
  instance: No instance surface changes are planned by parent or children.
  state_control: No control-truth mutation by the parent or by any planned child.
  state_evidence: Child lifecycles retain their own evidence; review runs using the suite retain reports as evidence only; aggregate program evidence lands under the declared program evidence root at closeout.
  generated: No generated/effective publication by the parent; children refresh projections only through canonical publication scripts.
  inputs: The intake unit remains non-authoritative raw input; parent and children are proposal-local candidate lineage only.
