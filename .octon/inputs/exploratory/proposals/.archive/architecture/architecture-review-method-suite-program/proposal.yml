title: Architecture Review Method Suite Program
summary: Parent proposal program that finalizes the Architecture Review Method Suite as the method layer of the existing Architectural Review Mechanism. Balanced Architecture Review remains the default general method; five focused companion methods (Greenfield Reference, Tradeoff, Failure-Mode, Evolution/Fitness, Boundary/Authority) are added as first-class methodology surfaces; a single shared architecture lens bank with per-method lens profiles prevents duplicated or unbounded review logic. The parent coordinates seven child-owned work units with gated-parallel sequencing; children own their work, receipts, and promotion targets.
