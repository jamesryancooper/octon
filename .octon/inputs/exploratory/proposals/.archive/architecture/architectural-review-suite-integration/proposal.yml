title: Architectural Review Suite Integration
summary: Phase-3 integration child of the Architecture Review Method Suite Program. Records the selected review method id in existing architectural-review workflow run evidence through the v2 routing-decision/report artifacts (support receipt v1 unchanged), extends the product feature note and the governed cross-surface mechanism entry and index with navigation-only method-layer descriptions and per-occasion method advisory text, refreshes affected generated projections only through canonical publishers, and runs the full architectural-review validator suite plus proposal and feature-catalog validators as the closing sweep. No new mechanism, workflow mode, lifecycle gate, evidence root, or review-output authority is created.
