authority_class_impact:
  framework: Extends existing architectural-review workflow contracts (method-id recording in run evidence), the product feature note, the governed cross-surface mechanism entry and index, and one assurance validator under framework/**. No new mechanism, workflow mode, lifecycle gate, evidence root, or review-output authority.
  instance: No instance surface changes.
  state_control: No control-truth mutation. Method selection is recorded as run evidence, not control state.
  state_evidence: Review runs record the selected method id in existing run-evidence artifacts (architectural-review-routing-decision-v2 / architectural-review-report-v2) under the existing architectural-review run-evidence root; the pre-integration support receipt (v1) is unchanged and never carries the method field. Child lifecycle evidence lands under the declared child evidence root.
  generated: Affected generated projections are refreshed only through canonical publication scripts after the change lands; no generated path is a direct write target and no generated output becomes authority.
  inputs: This packet is non-authoritative proposal lineage until separately accepted, implemented, validated, and promoted. The intake unit and parent program docs are cited as lineage only.
