mode_specific_coverage:
  review_charter: "Pre-integration review of the phase-3 integration child that records the selected review method id in existing architectural-review workflow run evidence (via the v2 routing-decision/report artifacts inside the existing run-evidence root), extends the product feature note and the governed cross-surface mechanism entry and index with navigation-only method-layer descriptions and per-occasion advisory text, extends one assurance validator to assert method-id recording, and refreshes affected generated projections only through canonical publishers. Non-goal: any new mechanism, workflow mode, lifecycle gate, evidence root, review-output authority, command facade, or support-receipt schema change."
  system_job: "The fundamental job of this seam is to make the method a review run actually used, and the lens profile it applied, observable in run evidence, so that routing v2's method_selection has a concrete evidence expression, without changing how a review is invoked or what gates it. Method selection stays advisory; the support receipt stays the sole lifecycle-gating review artifact."
  current_reality: "Re-grounded at HEAD: naming.yml is architectural-review-naming-v2 with a six-method catalog (balanced default, greenfield, tradeoff, failure-mode, evolution-fitness, boundary-authority); review-routing.yml is architectural-review-routing-v2 with method_selection (default_method, allowed_methods_by_route, escalation_map) and constitutional_conflict_routes_to; lens-bank.yml declares 18 lenses (12 core + 6 extended) and architecture-lens-bank.md is present; the v2 report and routing-decision schemas require method (bound to the naming catalog) and lenses_applied (bound to the lens bank); the support-receipt v1 schema is method-free with additionalProperties:false. All four review-occasion workflow directories, the product feature note, the governed mechanism entry, index.yml, the workflows validator, and the lens-references validator exist. The packet's current-state gap map (G-01..G-06) matches this live state with no stale claim."
  target_architecture_fit: "All durable edits stay inside the four registry-declared write scopes (orchestration/runtime/workflows/audit, product/features, cognition/_meta/architecture/governed-cross-surface-mechanisms, assurance/runtime/_ops/scripts), which match the parent program child-packet-index write_scopes for this child exactly, plus the declared child evidence root. Method evidence flows only through the existing v2 artifacts in the existing run-evidence root; no new stage, gate, artifact family, or evidence root is introduced. The support receipt stays v1 and method-free."
  dependency_alignment: "The three hard, verification-gated dependencies (greenfield-reference-architecture-review-method, companion-architecture-review-methods, architectural-review-schema-extensions) are archived with disposition implemented, so the dependency_gate: verification declared in the parent child-packet-index is satisfied; their promoted surfaces are the live suite this child integrates. Implementation start re-confirms delivery and re-grounds the live surfaces before editing."
  authority_boundaries: "Framework surfaces remain the authored authority after promotion. The recorded method id and lens profile are descriptive run evidence, never authority; navigation additions carry no gate, mode, or review-output authority; generated projections are derived-only and refreshed only through canonical publishers. Raw inputs, generated views, run evidence, and parent-program design docs are treated as non-authority. Where a program design doc disagrees with the live repository, the repository wins and the child triggers a program registry/design revision."
  failure_modes_and_second_order_effects: "Reviewed via the failure-and-recovery and contracts-compatibility lenses: a workflow that omits method-id recording is caught by the extended workflows validator (missing_method_record); a support receipt carrying method/lenses_applied is caught by the existing receipt drift guard (receipt_schema_drift), which the integration does not weaken; a method id outside the naming catalog is fail-closed (unknown_method) and an undefined lens id is fail-closed (undefined_lens) per routing/schema v2, re-confirmed not relaxed; a direct generated write is caught by publisher --check. Rollback is a git revert of the per-family promotion commit plus a publisher re-refresh, and reverting this child leaves routing v2 method_selection simply without a run-evidence expression again, a coherent prior state."
  evidence_and_validation_plan: "The implementation validation floor is the full architectural-review validator suite (naming, routing, receipts, workflows, lifecycle-gates, extension-split, skills-commands, lens-references) plus proposal-standard, architecture-subtype, product-feature-catalog, and feature-catalog-drift-closeout, with the workflows validator extended to assert method-id recording and receipt method-freeness and shipping a missing-method-record negative control, and canonical-publisher --check confirming projection freshness, all retained under the child evidence root with two consecutive clean sweeps required before closeout."
  open_item_disposition: "The lifecycle-advisory-placement item is a recorded design decision, not an open architecture question: the advisory is authored in in-scope surfaces (feature note, mechanism entry, workflow configure stages) that lifecycle prompts consult by reference, no proposal-lifecycle prompt source is edited, and any strictly required prompt-source edit is escalated as a parent registry revision rather than an in-place write-scope expansion. AC-05 encodes exactly this boundary, so it does not gate acceptance."
  rollback_and_closeout: "Rollback posture is manual and low-risk because every surface is an existing file being extended; each promotion target family lands as one revertible commit. Closeout requires child-owned implementation, verification, and archive evidence; parent program evidence never substitutes for this child's receipts."
  verdict_basis: "The packet is bounded, internally coherent, additive, dependency-satisfied, live-state-grounded with no stale claim, and complete at this digest, and it carries no unresolved architecture blocker. Verdict pass; zero unresolved items; zero blockers."
