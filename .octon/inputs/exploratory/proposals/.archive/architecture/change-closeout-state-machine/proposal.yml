acceptance_criteria_summary: The proposal is acceptable only when it defines a canonical state-machine contract, preserves existing route distinctions, specifies loop and escalation semantics, identifies receipt and validator changes, and keeps generated/effective outputs and inputs/** non-authoritative.
authority_class_impact:
  framework: May propose durable framework product, workflow, skill, standard, validator, and test changes after review and promotion.
  instance: No repo-specific authority change is required by this packet.
  state_control: No live control truth changes from this draft proposal packet.
  state_evidence: Implementation and closeout evidence must be retained outside proposal-local inputs.
  generated: Only the generated proposal registry may change during packet scaffolding; generated/effective runtime outputs remain derived-only.
  inputs: This packet remains non-authoritative proposal input until promoted through durable repository changes.
change_profile: atomic
created_date: 2026-05-20
evidence_requirements:
- State machine contract review evidence.
- Receipt schema delta and example receipts for stateful closeout evidence.
- Validator receipts for route/outcome/cleanup/final-sync claims.
- Hosted no-PR landing evidence for pushed source branch, exact source-SHA checks, provider permission, fast-forward/update proof, origin/main equality, rollback handle, and final local sync when landed or cleaned is claimed.
- Branch cleanup evidence for origin/main containment, no-open-PR status, rollback/discard posture, and local/remote cleanup status when cleaned is claimed.
- Worktree residue classifier evidence for staged, unstaged, untracked, ignored, generated, host-projection, evidence, release, and input-surface residue.
- Closeout Worktree wrapper evidence for multi-candidate partitioning, explicit candidate boundaries, delegated closeout-change refs, retained residue, blockers, and next-route condition.
- Negative-control evidence that published-branch, published, or ready states are not accepted as completed closeout outcomes.
- Implementation conformance and post-implementation drift/churn reviews.
explicit_runtime_non_implementation_statement: This packet does not create closeout authority. It only proposes how durable stateful closeout contracts and validators should be promoted.
generated_input_authority_impact: Reinforces that proposal-local material, raw inputs, generated projections, host UI state, GitHub state, chat, model memory, and tool availability never become closeout authority.
owner:
  role: Octon architecture proposal author
  accountable_role: human operator / repository owner
rollback_summary: Remove the proposal packet and generated proposal registry entry if rejected. For later durable implementation, rollback by reverting the state-machine contract, workflow/skill/schema/validator edits, and associated examples as one atomic Change.
runtime_behavior_impact: None from this draft packet. Durable behavior changes require accepted review, implementation authorization, validator coverage, receipt evidence, and promoted contract edits outside inputs/**.
scope_statement: Architecture for stateful Change closeout only. The packet may propose product contracts, workflow references, skill procedure updates, the Closeout Worktree wrapper, validators, receipt schema additions, examples, and worktree residue classification. It does not implement the durable state machine, publish generated/effective outputs, change extension activation, open a PR, or authorize destructive cleanup by itself.
