  review_charter: "Pre-integration review of the phase-2 child that adds the method-aware v2 contract layer (architectural-review-report-v2 and architectural-review-routing-decision-v2 as strict additive supersets of v1) plus receipts-validator v2 awareness, while leaving the v1 schemas, the support-receipt schema, and every existing route, gate, and evidence root unchanged."
  system_job: "Make the method the review used and the lens profile actually applied machine-recordable and machine-checkable at the report and routing-decision schema level, completing the schema-level enforcement that phase-1's missing_method_record fail-closed condition anticipated, without granting review outputs any authority."
  current_reality: "Verified at HEAD: the v1 report, routing-decision, and support-receipt schemas exist with additionalProperties:false; naming.yml declares the six canonical -method slugs with balanced-architecture-review-method as default; lens-bank.yml declares 18 lens ids; and validate-architectural-review-receipts.sh currently validates only the support receipt (hard-asserts schema_version == architectural-review-support-receipt-v1). The packet's gap map and coexistence decision match this live state."
  target_architecture_fit: "All durable changes stay inside the two registry-declared write scopes (constitution/contracts/assurance and assurance/runtime/_ops/scripts, plus the assurance test fixture tree). v2 schemas are strict additive supersets (only $id, title, schema_version const, and the two additive required fields method/lenses_applied differ from v1). Phase-0 lens bank, phase-1 naming/routing, the support-receipt schema, phase-2 sibling method docs, and phase-3 workflow method-id recording remain excluded and untouched."
  authority_boundaries: "Framework contracts remain the authored authority after promotion; the method and lenses_applied fields are descriptive records; review outputs remain evidence or proposal input; the pre-integration support receipt remains the only lifecycle-gating review artifact. No new mechanism, gate, routed workflow mode, evidence root, or command facade is created; no generated, input, host, chat, dashboard, or model-memory surface gains authority."
  failure_modes_and_second_order_effects: "Reviewed accidental v1-field mutation (guarded by the additive-superset diff), unknown method values, undefined lens ids, and support-receipt drift. The three mandatory negative controls (unknown_method, undefined_lens, receipt_schema_drift) each fail closed with retained evidence, and v1 producers remain valid so no existing artifact is invalidated."
  evidence_and_validation_plan: "The implementation validation floor covers v2 schema well-formedness, the additive-superset diffs against v1, method-enum-to-naming binding, lenses_applied-to-lens-bank binding, positive plus three negative-control receipts-validator runs, the v1 coexistence proof, the byte-for-byte support-receipt-unchanged git diff, and the remaining validate-architectural-review-*.sh no-regression suite, all retained under the child promotion evidence root."
  rollback_and_closeout: "Rollback is manual and low-risk: delete the two new v2 schema files, revert the additive README and receipts-validator edits, and delete the fixtures, returning the contract surface to its exact prior state. Closeout requires child-owned implementation, verification, and archive evidence; parent program evidence never substitutes for this child's receipts."
  verdict_basis: "The packet is bounded, internally coherent, additive, dependency-aligned with the verified phase-0 lens bank and phase-1 naming/routing catalog, complete at this digest, and carries no unresolved architecture blockers."
