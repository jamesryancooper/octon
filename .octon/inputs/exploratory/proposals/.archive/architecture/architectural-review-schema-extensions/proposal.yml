runtime_behavior_impact: At implementation, architectural review report and routing-decision artifacts may be emitted at v2, which requires a recorded method (one of the six canonical suite method slugs) and a non-empty lenses_applied list of declared lens ids; the receipts validator fails closed on an unknown method (unknown_method), an undefined lens id (undefined_lens), and a support receipt that drifts from schema v1 (receipt_schema_drift). v1 report and routing-decision artifacts remain valid and method-agnostic (Balanced default applies), so existing producers are unaffected. No existing route, gate, or evidence root changes.
scope_statement: Author exactly the method-aware schema layer for the Architectural Review Mechanism. In scope - architectural-review-report-v2 and architectural-review-routing-decision-v2 JSON schemas as strict additive supersets of v1 with required additive method (enum of the six canonical suite method slugs) and lenses_applied (array of lens ids) fields; retention of the v1 report and routing-decision schemas for method-agnostic producers; the contracts/assurance README extension listing the two v2 schemas; validate-architectural-review-receipts.sh v2 awareness that binds method to the live naming.yml method catalog and lenses_applied to lens-bank.yml lens ids and asserts the support receipt stays v1, with at least one negative control per new fail-closed rule; and an explicit v1 to v2 coexistence posture. Out of scope and left untouched - the naming.yml methods list and review-routing.yml method_selection block (phase-1, consumed as a verified dependency), the lens bank (phase-0, consumed as a verified dependency), architectural-review-support-receipt-v1.schema.json (never gains method or lens fields), the Greenfield and companion method docs (phase-2 siblings), review workflow method-id recording and generated projection refresh (phase-3), the existing v1 schemas' fields, the existing evidence roots, and the pre-integration gate; and architecture-readiness and surface-architecture audit doctrine.
selected_implementation_target: Add the v2 report and routing-decision contract schemas of the existing Architectural Review Mechanism under .octon/framework/constitution/contracts/assurance/ and extend the receipts validator at .octon/framework/assurance/runtime/_ops/scripts/.
