evidence_requirements:
- Cited non-authoritative intake unit architecture-review-method-suite and the parent program design docs (lineage only, never authority).
- Schema validity evidence proving both v2 schemas are well-formed JSON Schema, are strict additive supersets of their v1 schemas (same required v1 fields plus the two new required fields), and pin method to the six canonical suite method slugs.
- Receipts validator evidence proving v2 report and routing-decision artifacts validate, including a negative control for an unknown method (unknown_method), an undefined lens id (undefined_lens), and a support receipt that drifts from schema v1 (receipt_schema_drift), each failing closed.
- Dependency-binding evidence that the v2 method enum equals the naming.yml methods catalog slugs verified by architecture-review-method-taxonomy-and-routing and that every lens id referenced in the pass fixture is declared in lens-bank.yml (phase-0).
- Coexistence evidence that v1 report and routing-decision artifacts still validate against the retained v1 schemas and that architectural-review-support-receipt-v1.schema.json is byte-for-byte unchanged.
- Regression evidence that the remaining validate-architectural-review-*.sh suite still passes and no existing evidence root or the pre-integration gate changed.
- Child lifecycle evidence retained under .octon/state/evidence/validation/proposals/architectural-review-schema-extensions/ before closeout.
