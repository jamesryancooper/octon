schema_version: proposal-v1
proposal_id: architectural-review-schema-extensions
title: Architectural Review Schema Extensions
summary: Phase-2 child of the Architecture Review Method Suite Program. Adds the method-aware v2 contract schemas for architectural review artifacts - architectural-review-report-v2.schema.json and architectural-review-routing-decision-v2.schema.json, each a strict additive superset of its v1 schema that also carries the two new required fields method (one of the six canonical suite method slugs) and lenses_applied (the lens profile actually applied, drawn from lens-bank.yml). The v1 report and routing-decision schemas are retained unchanged for method-agnostic producers, and architectural-review-support-receipt-v1.schema.json is left untouched (the support receipt never gains method or lens fields). The receipts validator validate-architectural-review-receipts.sh gains v2 awareness - it validates the additive method and lenses_applied fields fail-closed against the live naming.yml method catalog and lens-bank.yml lens ids - with negative controls for an unknown method, an undefined lens id, and support-receipt schema drift. The v1 to v2 coexistence posture is declared explicitly. This child completes the schema-level enforcement that the phase-1 missing_method_record fail-closed condition anticipated. It creates no new mechanism, gate, routed workflow mode, evidence root, or command facade, and grants no review output any authority.
