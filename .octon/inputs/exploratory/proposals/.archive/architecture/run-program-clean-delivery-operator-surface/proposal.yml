rollback_summary: Remove command, skill, and feature docs atomically if rejected.
runtime_behavior_impact: Operators request clean delivery through `/proposal-program-delivery`; the route reports the highest evidence-backed outcome and next owning lifecycle without itself authorizing implementation, closeout, archive, cleanup, Git mutation, terminal proof, or a `cleaned` claim.
scope_statement: Bind the existing `/proposal-program-delivery` operator surface, product feature documentation, and lifecycle-runner clean-delivery handoff wording. Do not introduce a duplicate `/run-program-to-clean-delivery` command.
