  framework: Promotes command, skill, feature documentation, and lifecycle handoff surfaces.
  instance: No instance authority change.
  state_control: No control mutation from planning.
  state_evidence: Future command runs retain route-owned evidence.
  generated: Generated command/skill projections remain derived-only.
  inputs: This packet remains non-authority.
change_profile: atomic
created_date: 2026-06-28
evidence_requirements:
- Command usage documentation for `/proposal-program-delivery`.
- Skill boundaries for Proposal Program Delivery.
- Product feature catalog entry and feature note.
- Lifecycle-runner handoff wording for `target_outcome=cleaned`.
explicit_runtime_non_implementation_statement: This packet binds operator surfaces only; it does not run delivery, mutate Git, archive packets, delete residue, synthesize terminal proof, or claim a final `cleaned` state.
generated_input_authority_impact: Operator surface must not rely on chat, host UI, or generated outputs as authority.
