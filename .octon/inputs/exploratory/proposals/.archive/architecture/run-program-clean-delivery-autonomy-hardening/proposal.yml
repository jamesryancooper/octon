risk_posture: High. The corrective work changes lifecycle continuation, cleanup authority, hosted landing execution, and terminal reporting semantics; weak fixes could either over-delete residue or overclaim autonomous safety.
rollback_summary: |
  Reject or supersede this parent before implementation if the decomposition is
  wrong. After child implementation begins, rollback must happen through each
  child packet's own promotion targets and retained evidence.
scope_statement: |
  Parent coordination only. This program decomposes the postmortem corrective
  work into sibling child packets. The parent does not implement runtime
  behavior, run delivery, mutate Git refs, clean residue, update generated
  outputs, archive proposals, or claim terminal repository hygiene.
