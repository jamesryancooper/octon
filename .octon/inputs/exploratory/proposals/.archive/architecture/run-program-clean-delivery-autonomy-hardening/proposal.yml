summary: |
  Create a corrective proposal program that addresses the clean-delivery
  postmortem audit findings by converting recoverable hygiene, stale-branch,
  artifact-budget, run-health, hosted-landing, and final-reporting ambiguity
  into autonomous governed continuation paths with compact receipts and
  explicit human-review exceptions.
