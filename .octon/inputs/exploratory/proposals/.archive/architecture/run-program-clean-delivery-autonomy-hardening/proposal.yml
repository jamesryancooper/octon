acceptance_criteria_summary: |
  The program is acceptable when all seven child packets define complete target
  surfaces, route-owned receipts, validators, negative controls, disposition
  boundaries, and closeout criteria that make recoverable clean-delivery blockers
  continue autonomously under governed evidence while keeping human review for
  unsafe, destructive, external, protected, or unresolved cases.
authority_class_impact:
  framework: Coordinates future lifecycle, workflow, closeout, product-contract, validator, generated-output, and test changes through child packets.
  instance: No direct instance authority changes from this parent.
  state_control: No state-control mutation from this parent.
  state_evidence: Future children may define retained evidence requirements, but this parent creates only proposal-local planning evidence.
  generated: No generated output edits are authorized by this parent.
  inputs: Parent and child packets are temporary proposal lineage only.
change_profile: atomic
created_date: 2026-07-03
evidence_requirements:
- Child-owned review, pre-integration architecture review, implementation, conformance, drift/churn, validation, closeout, and archive evidence for each implemented child.
- Compact blocker-remediation receipts binding blocker class, fingerprint, budget state, input freshness, and next governed route.
- Artifact-budget evidence covering repeated fingerprints, file count, and total bytes with throttling behavior rather than passive human pauses.
- Worktree-hygiene and stale-local-branch retirement receipts proving classification, no unique commits, upstream/PR state, protected-name checks, and safe switch/delete authority.
- Run-health projection receipts distinguishing diagnostic read models, local-private retained diagnostics, and route-promoted durable evidence by path and digest.
- Hosted no-PR landing authorization receipts proving current refs, exact SHA, ruleset state, no-PR status, checks or empty-check-set rationale, rollback handle, and final sync plan.
- Execution-environment approval-lane evidence proving any autonomous hosted mutation uses pre-approved command prefixes or equivalent sandbox authority in addition to Octon authorization.
- Final report evidence that separately names delivered branches, retained branches, retained worktrees, retained evidence, deleted residue, and manual-review residue.
explicit_runtime_non_implementation_statement: |
  This parent creates planning artifacts only. Durable changes require accepted
  child packets, child-owned implementation routes, conformance review,
  drift/churn review, validation, closeout, and archive handling.
generated_input_authority_impact: |
  Proposal files, generated outputs, generated read models, prompts, chat
  history, dashboards, local-only evidence, and host UI state remain
  non-authoritative. Generated outputs must be refreshed only through canonical
  generators and promoted only by route-owned receipt when required.
