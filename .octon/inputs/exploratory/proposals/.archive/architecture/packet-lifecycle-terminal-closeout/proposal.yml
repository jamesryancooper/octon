summary: Add a canonical packet terminal closeout workflow that moves an implemented proposal packet to a verified archive-ready or blocked verdict by aggregating packet-owned receipts, publication freshness, hygiene, Git/GitHub route evidence, and evidence-only review hooks without replacing the authority of the underlying lifecycle routes.
