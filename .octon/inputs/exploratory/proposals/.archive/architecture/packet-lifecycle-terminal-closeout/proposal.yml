acceptance_criteria_summary: The proposal is acceptable when it defines a packet terminal workflow that aggregates target-owned evidence into one terminal receipt, prevents evidence-generation loops, blocks on exact missing evidence, preserves authority boundaries, and explains why the function belongs in packet lifecycle rather than closeout-worktree, closeout-change, archive-proposal, or lifecycle-postmortem.
authority_class_impact:
  framework: Proposes durable workflow, schema, validator, evaluator, feature, command, and skill changes after promotion.
  instance: No instance authority change is required.
  state_control: Future terminal closeout runs may bind run-control state through existing runtime contracts; this proposal changes none.
  state_evidence: Future runs retain terminal receipts, evaluator output, and cited evidence under state/evidence roots.
  generated: Generated outputs stay derived-only and are refreshed only through canonical publishers.
  inputs: This packet and all proposal-local support files are non-authoritative exploratory input.
change_profile: atomic
created_date: 2026-06-12
evidence_requirements:
- Packet terminal closeout profile validation receipt.
- Packet terminal aggregate receipt validation receipt.
- Durable implementation state verification.
- Implementation conformance review and validator pass.
- Post-implementation drift/churn review and validator pass.
- Publication freshness receipts or canonical publisher refresh receipts.
- Generated/input non-authority validation.
- Run-health and capability/extension publication validation.
- Repo-hygiene classification and authorized cleanup evidence when applicable.
- Worktree hygiene classification.
- Post-integration architecture review support receipt as evidence-only.
- Packet terminal evaluator or lifecycle-postmortem hook evidence when required.
- Change closeout route evidence and Change receipt when Git mutation is needed.
- Exact source-SHA hosted check evidence when branch-no-pr or direct-main hosted publication requires it.
- Branch landing and branch cleanup authorization evidence when branch-no-pr is used.
- Final archive-ready or blocked packet terminal receipt.
explicit_runtime_non_implementation_statement: This packet does not implement the packet terminal closeout workflow or authorize terminalization. Existing proposal lifecycle, conformance, drift/churn, publication, generated projection, run-health, closeout, repo-hygiene, Git/GitHub, postmortem, architecture review, and archive-proposal contracts remain canonical until durable implementation lands.
generated_input_authority_impact: Reinforces that proposal-local inputs, generated outputs, generated prompts, host projections, dashboards, chat state, model memory, and tool availability may inform evidence review but cannot authorize terminalization, archive, closeout, publication, cleanup, branch landing, branch deletion, promotion, or a cleaned claim.
non_goals:
- No implementation of the workflow in this packet.
- No archive relocation; archive-proposal remains the archive movement owner.
- No new Git, branch, PR, hosted-provider, cleanup, publication, promotion, or closeout authority.
- No weakening of existing proposal validators or post-implementation gates.
- No lifecycle-postmortem or architecture review authority.
- No generated output, proposal input, host state, dashboard, chat, tool, or model-memory authority.
owner:
  role: Octon architecture proposal author
  accountable_role: human operator / repository owner
rollback_summary: Remove the future workflow, profile schema, receipt schema, validators, tests, evaluator docs, feature documentation, command, skill, and lifecycle hook updates as one atomic rollback. Retain emitted validation and terminal run evidence under state/evidence for auditability.
runtime_behavior_impact: None from this proposal packet. Runtime behavior changes only after durable workflow, schema, validator, evaluator, entrypoint, and lifecycle hook implementation lands under framework and published capability surfaces.
scope_statement: Define one packet-local terminalization workflow for implemented proposal packets. The workflow verifies durable implementation state, conformance, drift/churn, publication freshness, non-authority boundaries, run health, capability and extension publication, repo hygiene, worktree hygiene, evidence-only architecture and postmortem hooks, Git/GitHub route evidence, exact-SHA hosted checks when required, and emits a terminal packet aggregate receipt with an archive-ready or blocked verdict.
