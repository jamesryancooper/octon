implementation_grade_summary: >-
  Implementation must add one terminal workflow, one profile schema, one
  aggregate receipt schema, validators, tests, evaluator guidance, feature
  documentation, thin command and skill entrypoints, proposal lifecycle hooks,
  and publication/hygiene/GitHub integration points without duplicating
  existing implementation conformance, drift/churn, publisher, closeout,
  repo-hygiene, Git/GitHub, architecture review, lifecycle-postmortem, or
  archive-proposal authority.
