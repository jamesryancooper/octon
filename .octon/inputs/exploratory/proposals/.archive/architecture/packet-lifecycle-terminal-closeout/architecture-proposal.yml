schema_version: "architecture-proposal-v1"
architecture_scope: "cross-domain-architecture"
decision_type: "new-surface"
title: "Proposal Packet Lifecycle Terminal Closeout"
target_state: >-
  Implemented proposal packets have a canonical terminal closeout workflow
  that verifies implementation state, validates post-implementation gates,
  repairs publication freshness only through owning publishers, classifies
  hygiene, routes Git/GitHub exact-SHA evidence through existing closeout
  mechanics, runs evidence-only review hooks, and emits a packet-local
  aggregate terminal receipt with archive-ready or blocked outcome.
boundary_change: >-
  Adds a packet lifecycle terminalization layer above existing validators,
  publishers, hygiene classifiers, closeout routes, hosted check helpers,
  postmortem evaluators, and archive-proposal. The new layer may sequence,
  validate, cite, aggregate, and authorize an archive-readiness verdict. It
  may not archive, publish generated outputs directly, mutate Git refs, delete
  residue, land branches, delete branches, replace Change receipts, or make
  evidence-only reviews authoritative.
