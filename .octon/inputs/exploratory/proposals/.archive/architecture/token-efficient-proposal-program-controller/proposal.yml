summary: Coordinated architecture proposal program to reduce Octon proposal lifecycle token consumption by introducing digest-bound prompt capsules, compact lifecycle state, structured evidence indexes, context-pack-backed lifecycle prompts, token ledgers, model routing, and cache invalidation while preserving Octon governance, replay, rollback, evidence, and authorization invariants.
