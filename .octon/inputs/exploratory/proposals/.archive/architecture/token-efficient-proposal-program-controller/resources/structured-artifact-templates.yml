schema_version: octon-structured-artifact-template-catalog-v1
artifacts:
  evidence-index.yml:
    purpose: Inventory retained evidence with roles, byte sizes, digests, token estimates, default visibility, and raw-read
      escalation hints.
    authority_status: non-authoritative retained evidence or generated/read-model projection; never source of truth
    source_of_truth: canonical manifests, runtime control journals, retained evidence, durable validators, or authored framework/instance
      authority as applicable
    schema_fields:
    - schema_version
    - run_id_or_proposal_id
    - source_refs
    - source_digests
    - producer
    - consumer
    - validation
    - freshness
    - evidence_refs
    - failure_behavior
    path_placement:
      runtime_evidence: .octon/state/evidence/runs/<run-id>/**
      control_pointer_when_needed: .octon/state/control/execution/runs/<run-id>/**
      generated_projection_when_needed: .octon/generated/**
      proposal_spec_or_template: durable spec/template under declared promotion targets
    producer: lifecycle controller, context pack builder, validator wrapper, evidence indexer, prompt compiler, or generated-read-model
      publisher
    consumer: planner, recovery loop, lifecycle executor, closeout skill, validator, reviewer, or disclosure generator
    validation: schema validation, digest verification, source-class checks, freshness checks, replay reconstruction, negative
      controls
    replay_use: points to retained raw evidence or model-visible context hash required to reconstruct decision context
    rollback_use: identifies changed targets, evidence refs, revert/compensation refs, and stale generated/read-model invalidation
    token_saving_mechanism: default compact model-visible fields with raw/full material retained by handle and expanded only
      on escalation
    failure_behavior: fail closed when source refs are missing, digest mismatch occurs, freshness is stale, authority class
      is invalid, or replay hash cannot be reconstructed
