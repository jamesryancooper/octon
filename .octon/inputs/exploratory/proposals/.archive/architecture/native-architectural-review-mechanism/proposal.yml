authority_class_impact:
  framework: Coordinates future framework methodology, workflow, schema, validator, skill, command, mechanism index, and lifecycle-gate
    changes.
  instance: No direct instance mutation from this parent. Future child packets may add instance assurance registration only
    through their own promotion evidence.
  state_control: No state-control mutation from this parent. Future lifecycle hooks must preserve canonical control truth
    and fail closed.
  state_evidence: Requires architectural review outputs and receipts to be retained evidence under mode-specific evidence
    roots.
  generated: Generated registries and projections remain derived-only and are produced by publication scripts.
  inputs: This parent, child packets, extension prompt bundles, raw concept sources, and proposal-local reports remain non-authoritative
    inputs.
runtime_behavior_impact: None from this parent packet.
generated_input_authority_impact: The program explicitly preserves that raw inputs, proposal packets, generated outputs, review
  reports, support artifacts, host state, chat, dashboards, tool availability, and model memory cannot authorize mutation,
  promotion, closeout, redesign, or constitutional amendment unless a durable lifecycle contract gates on a schema-backed
  receipt.
evidence_requirements:
- Profile Selection Receipt selecting release_state pre-1.0 and change_profile atomic.
- Child-owned scaffold receipts for every child packet.
- Strict support receipt schema plan before lifecycle gate wiring.
- Mode-specific evidence roots for pre-integration, post-integration, current-state mechanism, and architecture-readiness
  reviews.
- Validator and negative-control plan proving missing, stale, placeholder, non-passing, and omitted-validator receipts fail
  closed.
- Mechanism index evidence preserving authority, product, workflow, mutable control, retained evidence, generated, raw input,
  validator, ownership, and non-authority boundaries.
validation_gates:
- validate-proposal-standard.sh
- validate-architecture-proposal.sh
- validate-proposal-implementation-readiness.sh
- validate-proposal-program-structure.sh
- validate-proposal-program-child-readiness.sh
- generate-proposal-registry.sh --write
- generate-proposal-artifact-index.sh --write
