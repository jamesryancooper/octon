- future validate-architectural-review-routing.sh
- future validate-architectural-review-workflows.sh
- future validate-architecture-readiness-audit-canonical-slug.sh
acceptance_criteria_summary: The program is acceptable when it creates child-owned implementation packets that can promote
  a native Architectural Review Mechanism without wholesale extension promotion, without a second control plane, with mandatory
  pre-integration architecture review for architecture proposals, with strict receipts before lifecycle gate wiring, and with
  canonical naming.
rollback_summary: Reject or supersede this parent before implementation if the child scope is wrong. After implementation
  begins, rollback must be child-specific and must remove or revert only the child promotion targets proven by retained implementation,
  conformance, and drift/churn evidence.
