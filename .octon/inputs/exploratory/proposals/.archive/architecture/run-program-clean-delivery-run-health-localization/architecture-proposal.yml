authority_boundary: This child may define diagnostic and promotion rules for run-health projections but may not make generated read models authoritative.
architecture_drivers:
  - Validators should not dirty tracked generated projections during ordinary checks.
  - Run-health projections should support debugging without becoming durable authority by default.
  - Promotion requires route-owned path, digest, source refs, and freshness.
constraints:
  - Do not treat generated run-health projections as policy, runtime, support, or closure authority.
  - Preserve required evidence in compact receipts, validation summaries, terminal proofs, and evidence indexes.
