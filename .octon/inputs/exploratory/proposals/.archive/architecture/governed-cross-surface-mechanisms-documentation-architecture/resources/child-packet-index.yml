    deferred: false
    child_packet_status: "accepted"
    canonical_child_packet_exists: true
    program_required_for_implementation: true
    dependencies: []
    dependency_gate: "verification"
    phase_id: "phase-1"
    group_id: "foundation"
    rollback_posture: "manual"
    required_metadata:
      - "change_profile"
    source_lineage_refs:
