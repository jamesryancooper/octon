  child_paths_are_canonical_after_manifest_exists: true
  required_children_have_accepted_reviews_before_implementation_prompt: true
  required_children_have_accepted_reviews_before_closeout: true
  optional_children_may_remain_deferred_after_creation: true
  parent_revision_receipts_do_not_satisfy_child_receipts: true
  parent_review_receipts_do_not_satisfy_child_receipts: true
children:
