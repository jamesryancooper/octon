  Parent program is acceptable when it coordinates the required child packets,
  keeps product features as navigation-only, establishes governed
  cross-surface mechanisms as the architecture/governance term, preserves all
  surface authority boundaries, and prevents parent evidence from satisfying
  child-owned receipts.
rollback_summary: >-
