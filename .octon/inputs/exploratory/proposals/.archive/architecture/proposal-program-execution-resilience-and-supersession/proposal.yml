title: Proposal-Program Execution Resilience And Supersession
summary: |
  Create a staged proposal program that makes proposal-program runs either execute inside provably owned or leased surfaces, make recovery progress only when blocker evidence changes, or safely supersede a polluted run into a clean delivery path without losing child-owned evidence.
