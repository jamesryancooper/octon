lifecycle:
  temporary: true
  exit_expectation: Review this parent program, review and authorize the four child packets independently, implement the staged PRs through their child-owned routes, and close out this parent only after child-owned lifecycle evidence proves loop control, ownership control, supersession, and partition evidence without weakening governance.
