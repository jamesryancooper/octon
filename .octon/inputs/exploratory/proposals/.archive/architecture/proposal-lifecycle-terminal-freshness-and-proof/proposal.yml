selected_implementation_target: "Proposal lifecycle terminal freshness and proof hardening"
scope_statement: >-
  Add terminal lifecycle barriers and evidence contracts for large proposal
  programs and branch-no-pr correction runs. The change strengthens closeout,
  proposal-program, generated-freshness, child-validation, and validator-log
  practices without changing Octon's default work unit, creating a second
  control plane, or making generated outputs authoritative.
non_goals:
  - "No redesign of the proposal lifecycle or Change closeout model."
  - "No new default work unit and no competing closeout workflow."
  - "No broad global proposal validation requirement in every terminal child sweep."
  - "No authority from generated artifacts, proposal-local summaries, validator logs, chat, host state, model memory, or tool availability."
  - "No cleanup or mutation authority from terminal proof bundles or aggregate correction receipts."
  - "No weakening of child-owned receipts, implementation conformance, post-implementation drift/churn, or branch-no-pr hosted checks."
authority_class_impact:
  framework: "Adds durable schemas, validators, workflow gates, skill guidance, tests, and lifecycle standards after promotion."
  instance: "No direct instance authority mutation is proposed."
  state_control: "No state/control truth changes from this packet. Future implementation may retain run evidence but must not mutate control truth without the existing route."
  state_evidence: "Future runs retain terminal proof bundles, correction-branch aggregate receipts, validator-log summaries, and freshness evidence under state/evidence roots."
  generated: "Generated proposal registry, proposal artifact indexes, spines, handoff capsules, extension/capability projections, and host projections remain derived-only."
  inputs: "This packet and its resources are proposal-local, temporary, and non-authoritative."
runtime_behavior_impact: >-
  None from this proposal packet. Runtime or lifecycle behavior changes only
  after durable promotion into the listed targets and passing validation.
generated_input_authority_impact: >-
  The proposed end state reinforces that generated outputs, proposal-local
  analysis, raw inputs, host state, chat, model memory, dashboards, and tool
  availability cannot authorize closeout, promotion, archive, publication,
  cleanup, mutation, or acceptance.
evidence_requirements:
  - "Terminal generated-freshness receipt after archive, support receipt, and generated publication mutations."
  - "Aggregate correction-branch receipt for post-primary branch-no-pr correction landings."
  - "Terminal current-state proof bundle for cleaned outcomes."
  - "Scoped terminal child validation evidence for declared child sets."
  - "Compact validator-log evidence that records command, cwd, runtime, exit code, digest, and bounded log excerpts."
validation_gates:
  - "proposal standard validation"
  - "architecture proposal validation"
  - "implementation-readiness validation"
  - "pre-integration architecture review before acceptance"
  - "terminal freshness validator with stale compact artifact negative controls"
  - "correction-branch aggregate receipt schema validator"
  - "terminal current-state proof schema validator"
  - "scoped terminal child validation mode"
  - "change closeout lifecycle alignment validation"
  - "closeout worktree wrapper validation"
  - "generated proposal registry and artifact-spine validation"
acceptance_criteria_summary: >-
  Future large proposal-program closeouts fail closed unless terminal
  freshness, correction-branch aggregation, current-state proof, and scoped
  child validation are present, fresh, schema-valid, and retained as evidence.
rollback_summary: >-
  Revert the new schemas, validators, workflow gate wording, skill guidance,
  tests, and lifecycle standards. Retain any already emitted terminal proof or
  correction receipts as historical evidence only.
owner:
  role: "Octon architecture proposal author"
  accountable_role: "human operator / repository owner"
created_date: "2026-06-12"
profile_selection_receipt_ref: "support/profile-selection-receipt.md"
explicit_runtime_non_implementation_statement: >-
  This packet does not implement terminal freshness barriers, correction-branch
  receipt aggregation, current-state proof bundles, or scoped terminal child
  validation. Existing closeout, proposal, registry, publication, and artifact
  validation surfaces remain canonical until durable implementation lands.
