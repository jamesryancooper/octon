  - .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-packet-delivery-receipt.sh
lifecycle:
  temporary: true
  exit_expectation: Implement only after child-owned review acceptance and implementation authorization. Promotion must update the receipt schema and validator so explicit blocked outcomes validate structurally, while cleaned outcomes still require all success evidence and target-owned receipts.
related_proposals:
