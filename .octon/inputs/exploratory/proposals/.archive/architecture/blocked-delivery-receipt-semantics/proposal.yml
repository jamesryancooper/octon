proposal_id: blocked-delivery-receipt-semantics
title: Blocked Delivery Receipt Semantics
summary: Child architecture packet for making proposal-packet delivery receipts structurally truthful when delivery is blocked, while keeping cleaned outcomes strict. The packet preserves target-owned receipt requirements and prevents blocked aggregate receipts from being converted into successful delivery claims.
