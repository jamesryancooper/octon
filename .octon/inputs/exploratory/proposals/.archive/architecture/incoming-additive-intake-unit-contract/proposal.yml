schema_version: "proposal-v1"
proposal_id: "incoming-additive-intake-unit-contract"
title: "Incoming Additive Intake Unit Contract"
summary: >-
  Define the smallest validator-backed, non-authoritative envelope for raw
  additive incoming intake units while preserving the boundary between raw
  intake, route classification, normalization, activation, publication, and
  retained evidence.
proposal_kind: "architecture"
promotion_scope: "octon-internal"
change_profile: "atomic"
