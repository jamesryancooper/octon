title: "Runner Recovery Behavior"
architecture_scope: "cross-domain-architecture"
decision_type: "boundary-change"
status: "draft"
release_state: "pre-1.0"
change_profile: "atomic"
problem_statement: >-
  Proposal-program lifecycle runs should not pause for routine validation,
  freshness, cleanup, or continuation issues when safe bounded recovery exists.
  Runner behavior needs explicit recovery, retry, refresh, gate rerun, and
  hard-stop semantics.
