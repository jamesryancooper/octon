title: "Validator Affordances"
architecture_scope: "cross-domain-architecture"
decision_type: "surface-refactor"
status: "draft"
release_state: "pre-1.0"
change_profile: "atomic"
problem_statement: >-
  Lifecycle runners cannot reliably recover autonomously when validators report
  only generic failure text. Validators need compact structured diagnostics
  that identify repairability, failing paths, accepted values, stale evidence
  causes, and gate rerun instructions.
