evidence_requirements:
- Child-owned review, pre-integration architecture review, implementation, conformance, drift/churn, validation, closeout, and archive evidence for each implemented child.
- Fresh parent architecture-review receipt validation evidence before any parent review or delivery claim.
- Concrete Proposal Program Delivery receipt and evidence-index validation before any clean-delivery claim.
- Change closeout evidence that reconciles hosted landing, local main sync, source branch cleanup, and terminal proof after the final Git mutation.
- Cleanup and worktree disposition evidence that separates classification from deletion authority.
- Validator negative controls covering dirty worktree, final sync false, open blockers, stale receipt digests, and missing delivery evidence.
- Hermetic test evidence proving validation tests do not dirty tracked generated read models.
explicit_runtime_non_implementation_statement: |
  This parent creates planning artifacts only. Durable changes require accepted child packets, child-owned implementation routes, conformance review, drift/churn review, validation, closeout, and archive handling.
generated_input_authority_impact: |
  Proposal files, generated outputs, generated read models, prompts, chat history, dashboards, local-only evidence, and host UI state remain non-authoritative. Generated outputs must be refreshed only through canonical generators.
