  framework: Coordinates future lifecycle, workflow, closeout, product-contract, validator, and test changes through child packets.
  instance: No direct instance authority changes from this parent.
  state_control: No state-control mutation from this parent.
  state_evidence: Future children may define retained evidence requirements, but this parent creates only proposal-local planning evidence.
  generated: No generated output edits are authorized by this parent.
  inputs: Parent and child packets are temporary proposal lineage only.
