proposal_id: companion-architecture-review-methods
title: Companion Architecture Review Methods
summary: 'Author the four remaining companion architecture-review method docs of the Architecture Review Method Suite as first-class methodology surfaces under the existing Architectural Review Mechanism method layer: Architecture Tradeoff Review (tradeoff-review-method), Failure-Mode Architecture Review (failure-mode-review-method), Evolution/Fitness Architecture Review (evolution-fitness-review-method), and Boundary/Authority Architecture Review (boundary-authority-review-method). Each doc follows one shared contract shape (method question, use cases, non-goals, required inputs, outputs, shared-lens profile reference, escalation rules, non-authority output boundary) and draws every lens from the shared lens bank; no method invents a private lens catalog. The packet also wires each new doc into naming.yml (additive `doc:` pointer) and the mechanism README references, and adds the two mandated boundary statements: Failure-Mode Review versus the readiness audit''s failure-mode assessment, and Boundary/Authority Review versus the surface-architecture audit''s single-unit classification. Boundary/Authority ships Octon-only in v1 (generic mode deferred). Balanced Architecture Review remains the default method; no new mechanism, routed workflow mode, lifecycle gate, evidence root, schema, or command facade is created.'
