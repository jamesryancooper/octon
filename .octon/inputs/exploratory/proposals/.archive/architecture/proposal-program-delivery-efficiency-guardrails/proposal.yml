acceptance_criteria_summary: >
  Proposal-program delivery rejects inefficient order changes without explicit
  override evidence, runs a consolidated readiness preflight before expensive
  work, routes stale or dirty sources through classified clean worktrees, shares
  child validation receipt pass semantics, and requires validated postmortem
  artifacts for long, repeatedly blocked, or recovered program runs.
selected_implementation_target: proposal-program delivery wrapper, validators, workflow stages, product contracts, and lifecycle postmortem gates
scope_statement: >
  Delivery-route governance only. This packet does not rerun any existing proposal
  program, child implementation, child closeout, child archive, publication
  refresh, branch landing, or cleanup. It defines durable route and validator
  changes for future proposal-program delivery runs.
explicit_runtime_non_implementation_statement: >
  Creating this packet does not change runtime behavior. Durable behavior changes
  require accepted proposal review, implementation, validation, conformance,
  drift/churn review, closeout, and archive evidence.
generated_input_authority_impact: >
  Generated projections remain derived-only and non-authoritative. The delivery
  readiness preflight may check generated publication freshness posture, but it
  must not treat generated output as source authority.
authority_class_impact:
  framework: Adds or revises proposal-program delivery contracts, validators, workflow stages, command/skill instructions, shared validator helpers, Git preflight integration, and lifecycle postmortem requirements.
  instance: No instance authority changes are proposed.
  state_control: Future runs may emit order-override, delivery-preflight, clean-worktree-route, and postmortem-required control evidence through owning routes.
  state_evidence: Future runs must retain preflight, override, route-selection, blocker, validation, closeout, and postmortem receipts before making terminal claims.
  generated: Generated publication and registry outputs remain derived-only and must be refreshed only through owning generators.
  inputs: This proposal packet is temporary planning input only and must not be cited as durable runtime authority after implementation.
evidence_requirements:
  - Delivery profile validation rejects non-canonical requested order when no explicit override receipt exists.
  - Delivery profile validation accepts non-canonical requested order only when a retained override receipt is schema-valid and bound to the target run.
  - Delivery wrapper emits a stage-01 warning and stops before execution when order differs from canonical and no override exists.
  - Delivery readiness preflight proves Git metadata write access, source branch/worktree cleanliness or clean-worktree route selection, parent review freshness, child receipt compatibility, required shell/Python/YAML tooling, selected route legality, and generated publication freshness posture before lifecycle continuation.
  - Stale or dirty source branch fixtures default to a clean route-owned worktree path and require include-path classification before commit.
  - Readiness projection and child readiness validators share the same child validation receipt pass semantics through a reusable helper or library.
  - Long, repeatedly blocked, or recovered proposal-program runs require validated lifecycle postmortem artifacts before the run can be considered learned-from.
  - Negative controls prove prompt-level instruction alone cannot authorize alternative order, stale evidence, broad stage-all, stale generated projection publication, or missing postmortem closeout.
