schema_version: proposal-v1
proposal_id: proposal-program-delivery-efficiency-guardrails
title: Proposal Program Delivery Efficiency Guardrails
summary: >
  Enforce efficient proposal-program delivery as a machine-checked route: canonical
  child-before-parent order unless an explicit override receipt exists, one early
  delivery readiness preflight, clean route-owned worktree defaulting for stale or
  dirty sources, shared child validation receipt semantics, and formal postmortem
  closeout requirements for long or recovered runs.
