- Naming validator evidence proving the six-method methods list, Balanced default, no slug renames, and no alias retirements, including a negative control (method declared without a lens-bank profile fails closed).
- Routing validator evidence proving the method_selection block, per-route allowed methods, escalation map, and both fail-closed conditions (unknown_method; missing_method_record), each with a negative control.
- Dependency-binding evidence that the naming v2 method slugs equal the lens-bank.yml suite_methods slugs verified by architecture-lens-bank-foundation (no unknown method; no method without a lens profile).
