schema_version: proposal-v1
proposal_id: architecture-review-method-taxonomy-and-routing
title: Architecture Review Method Taxonomy And Routing
summary: Phase-1 child of the Architecture Review Method Suite Program. Refactors the Architectural Review Mechanism naming model to architectural-review-naming-v2 by adding an explicit methods list (Balanced plus the five companion methods) with Balanced Architecture Review as the declared default, and extends review-routing.yml to architectural-review-routing-v2 with a method_selection block (default method, per-route allowed methods, escalation map) and fail-closed conditions unknown_method and missing_method_record. It extends the mechanism README canonical-names table with the method rows, adds minimal cross-references to the Balanced method doc, and updates the naming and routing validators with negative controls. Existing canonical modes, routes, evidence roots, aliases, and the pre-integration gate are untouched; no slug renames and no alias retirements. This child also fixes the canonical companion method slugs and reconciles them with the provisional slugs seeded in lens-bank.yml by architecture-lens-bank-foundation. It creates no new mechanism, gate, routed workflow mode, or command facade, and grants no review output any authority.
