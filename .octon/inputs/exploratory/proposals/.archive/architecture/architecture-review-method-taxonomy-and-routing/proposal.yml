runtime_behavior_impact: At implementation, review routing gains method-selection semantics that fail closed on an unknown method (unknown_method) and on a routing decision that omits a required method record (missing_method_record). Balanced Architecture Review remains the default method when no selection is made, so existing default behavior is preserved. No existing route, gate, or evidence root changes.
scope_statement: Author exactly the naming-and-routing method layer for the Architecture Review Method Suite. In scope - naming.yml v2 methods list with the six canonical method slugs and Balanced default; review-routing.yml v2 method_selection block (default method, per-route allowed methods, escalation map) and fail-closed unknown_method and missing_method_record; mechanism README canonical-names table extension; minimal navigation cross-references in the Balanced doc; naming and routing validator updates with at least one negative control per new fail-closed rule; and the canonical companion method slug decision reconciled with the lens-bank.yml provisional slugs. Out of scope and left untouched - the Greenfield and companion method docs (phase-2), the report and routing-decision schema v2 additions (phase-2), review workflow method-recording and generated projection refresh (phase-3), the lens bank authored by phase-0 (consumed as a verified dependency, not modified beyond binding to its slugs), the existing canonical modes, routes, aliases, evidence roots, and the pre-integration gate, and architecture-readiness and surface-architecture audit doctrine.
selected_implementation_target: Extend the naming model and review routing of the existing Architectural Review Mechanism at .octon/framework/cognition/practices/methodology/architectural-review/ and its validators at .octon/framework/assurance/runtime/_ops/scripts/.
