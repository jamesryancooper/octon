evidence_requirements:
  - Baseline receipt fanout count for representative validation/publication runs.
  - Dedupe or content-addressing proof for equivalent receipts.
  - Retrieval proof from compact index/latest pointer to retained full evidence.
validation_gates:
  - "validate-proposal-standard.sh"
  - "validate-architecture-proposal.sh"
  - "validate-proposal-implementation-readiness.sh"
  - "receipt schema validation"
  - "retained evidence retrieval tests"
  - "digest integrity checks"
acceptance_criteria_summary: Receipt fanout compaction is acceptable when repeated equivalent validations create bounded receipt changes and full retained proof remains discoverable and digest-verified.
risk_posture: High. Receipt compaction must not weaken evidence obligations or publication proof.
rollback_summary: Revert or supersede only receipt writer, validator, contract, and test changes owned by this child.
