selected_implementation_target: Timestamped validation and publication receipt fanout compaction.
scope_statement: This child owns receipt fanout compaction under retained validation evidence. It does not delete retained evidence without owning cleanup authority.
explicit_runtime_non_implementation_statement: This proposal does not change runtime behavior until a later accepted implementation route promotes durable validator, publisher, or contract changes.
generated_input_authority_impact: Receipts are retained evidence, not generated source. Compact indexes or latest pointers cannot replace required full proof retrieval.
authority_class_impact:
  framework: May update receipt writers, validators, tests, and evidence contracts.
  instance: No direct instance authority change.
  state_control: No state-control mutation.
  state_evidence: Retained validation evidence remains durable unless exact files are classified stale or unreferenced by an owning route.
  generated: No generated output authority change.
  inputs: Temporary proposal lineage only.
external_dependencies:
