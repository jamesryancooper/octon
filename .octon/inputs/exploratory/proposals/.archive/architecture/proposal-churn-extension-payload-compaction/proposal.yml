  - "validate-proposal-implementation-readiness.sh"
  - "validate-extension-publication-state.sh"
  - "validate-extension-active-state-compactness.sh"
  - "extension payload digest reuse tests"
acceptance_criteria_summary: Extension payload compaction is acceptable when unchanged extension payloads are not recopied or rewritten and changed extensions still publish with complete receipt and compatibility evidence.
risk_posture: High. Extension publication is runtime-facing and must retain freshness, compatibility, and receipt semantics.
rollback_summary: Revert or supersede only extension publisher, validator, and test changes owned by this child.
