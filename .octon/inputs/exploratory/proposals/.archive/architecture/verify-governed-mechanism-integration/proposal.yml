  exit_expectation: >-
    Promote only after proposal review accepts the packet, strict
    pre-integration architecture review passes, durable workflow/schema/profile
    validator changes land outside proposal-local paths, generated projections
    are refreshed through canonical publication scripts, and implementation
    conformance plus post-implementation drift/churn receipts pass. Archive only
    after the governed mechanism integration receipt is current, passing, and
    tied to the implemented packet digest.
