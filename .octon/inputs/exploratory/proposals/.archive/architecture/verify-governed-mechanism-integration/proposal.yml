title: "Verify Governed Mechanism Integration"
summary: >-
  Add a workflow-backed proposal closeout gate and validator suite for proposals
  that add or materially change governed cross-surface mechanisms. The gate
  composes existing conformance, drift, publication, architecture-review, and
  lifecycle evidence instead of creating a new mechanism control plane.
