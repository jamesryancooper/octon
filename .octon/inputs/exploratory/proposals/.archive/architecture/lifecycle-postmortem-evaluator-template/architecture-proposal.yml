schema_version: "architecture-proposal-v1"
architecture_scope: "repo-architecture"
decision_type: "new-surface"
title: "Lifecycle Postmortem Evaluator Template"
target_state: >-
  A reusable lifecycle-postmortem evaluator template and structured output
  schema exist under assurance roots. The template implements the rigorous
  postmortem frame and can be invoked by the meta workflow against retained run
  evidence.
boundary_change: >-
  Adds an evaluator template and schema only. It does not grant approval,
  closeout, or redesign authority.
authoritative_targets_after_promotion:
  - ".octon/framework/assurance/evaluators/lifecycle-postmortem/"
  - ".octon/framework/assurance/evaluators/templates/lifecycle-postmortem-template.md"
  - ".octon/framework/assurance/evaluators/review-routing.yml"
  - ".octon/framework/constitution/contracts/assurance/lifecycle-postmortem-evaluation-v1.schema.json"
proposal_local_authority:
  - "proposal.yml"
  - "architecture-proposal.yml"
  - "architecture/target-architecture.md"
  - "architecture/implementation-plan.md"
  - "architecture/acceptance-criteria.md"
non_authoritative_supporting_artifacts:
  - "README.md"
  - "navigation/**"
  - "resources/**"
  - "RISK-REGISTER.md"
  - "validation-plan.md"
  - "support/**"
