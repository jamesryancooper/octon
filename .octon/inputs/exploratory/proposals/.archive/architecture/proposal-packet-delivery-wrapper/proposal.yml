  temporary: true
  exit_expectation: Promote only after proposal review, strict pre-integration architecture review, implementation authorization, durable workflow/command/skill/schema validator/test updates, publication of capability command and skill projections through owning scripts, passing implementation conformance plus post-implementation drift/churn receipts, and `promote-proposal` promotion to implemented status plus closeout-packet archive authorization before terminal closeout and archive.
