---
schema_version: workflow-contract-v2
name: pre-integration-architecture-review
description: Run mandatory schema-backed architectural review before architecture proposal acceptance or implementation authorization.
version: 1.0.0
entry_mode: human
execution_profile: core
side_effect_class: read_only
execution_controls:
  cancel_safe: true
coordination_key_strategy:
  kind: workflow-target
  source_fields:
    - workflow_group
    - workflow_id
  format: workflow:{workflow_group}/{workflow_id}
executor_interface_version: workflow-executor-v1
inputs:
  - name: proposal_path
    type: folder
    required: true
    description: Architecture proposal packet to review before acceptance or implementation authorization
stages:
  - id: configure
    asset: stages/01-configure.md
    kind: analysis
    consumes: []
    produces:
      - stage:configure
    mutation_scope: []
    authorization:
      action_type: execute_stage
      requested_capabilities:
        - workflow.stage.execute
        - evidence.write
      side_effects:
        write_repo: false
        write_evidence: true
        shell: true
        network: false
        model_invoke: true
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: low
      scope:
        read:
          - workflow-scope
        write:
          - workflow-evidence
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: false
      allowed_executor_profiles:
        - read_only_analysis
  - id: balanced-review
    asset: stages/02-balanced-review.md
    kind: verification
    consumes:
      - stage:configure
    produces:
      - stage:balanced-review
    mutation_scope: []
    authorization:
      action_type: execute_stage
      requested_capabilities:
        - workflow.stage.execute
        - evidence.write
      side_effects:
        write_repo: false
        write_evidence: true
        shell: true
        network: false
        model_invoke: true
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: low
      scope:
        read:
          - workflow-scope
        write:
          - workflow-evidence
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: false
      allowed_executor_profiles:
        - read_only_analysis
  - id: receipt
    asset: stages/03-receipt.md
    kind: verification
    consumes:
      - stage:balanced-review
    produces:
      - stage:receipt
    mutation_scope: []
    authorization:
      action_type: execute_stage
      requested_capabilities:
        - workflow.stage.execute
        - evidence.write
      side_effects:
        write_repo: false
        write_evidence: true
        shell: true
        network: false
        model_invoke: false
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: low
      scope:
        read:
          - workflow-scope
        write:
          - workflow-evidence
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: false
      allowed_executor_profiles:
        - read_only_analysis
artifacts:
  - name: pre_integration_architecture_review_receipt
    path: "/.octon/state/evidence/runs/workflows/{{run_id}}/architectural-review/pre-integration-architecture-review/support-receipt.yml"
    kind: file
    format: yaml
    determinism: unique
    description: Schema-backed support receipt for architecture proposal acceptance and implementation authorization
done_gate:
  checks:
    - "validate-architectural-review-receipts.sh passes with --mode pre-integration-architecture-review --require-pass"
    - "Receipt records evidence refs, validator refs, unresolved count, blockers, non-authority classification, and mode-specific coverage"
    - "Receipt packet_digest matches the reviewed architecture proposal packet"
constraints:
  fail_closed: true
  require_relative_local_assets: true
