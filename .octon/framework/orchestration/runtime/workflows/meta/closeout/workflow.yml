---
schema_version: workflow-contract-v2
name: closeout
description: Resolve SI-00 Change closeout to preservation or a stable pre-effect denial.
version: 2.1.0
entry_mode: human
execution_profile: core
side_effect_class: read_only
execution_controls:
  cancel_safe: true
coordination_key_strategy:
  kind: workflow-target
  source_fields: [workflow_group, workflow_id]
  format: workflow:{workflow_group}/{workflow_id}
executor_interface_version: workflow-executor-v1
policy_refs:
  default_work_unit_policy_ref: ".octon/framework/product/contracts/default-work-unit.yml"
  state_machine_ref: ".octon/framework/product/contracts/change-closeout-state-machine.yml"
  workflow_contract_ref: ".octon/framework/execution-roles/practices/standards/git-worktree-autonomy-contract.yml"
  owner_surface_ref: ".octon/framework/capabilities/runtime/skills/remediation/closeout-change/SKILL.md"
inputs: []
stages:
  - id: evaluate-context
    asset: stages/01-evaluate-context.md
    kind: analysis
    consumes: []
    produces: [stage:evaluate-context]
    mutation_scope: []
    authorization:
      action_type: execute_stage
      requested_capabilities: [workflow.stage.execute, evidence.write]
      side_effects:
        write_repo: false
        write_evidence: true
        shell: true
        network: false
        model_invoke: true
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: low
      scope:
        read: [default-work-unit-policy, worktree-state]
        write: [workflow-evidence]
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: false
      allowed_executor_profiles: [read_only_analysis]
  - id: request-or-report
    asset: stages/02-request-or-report.md
    kind: projection
    consumes: [stage:evaluate-context]
    produces: [stage:request-or-report]
    mutation_scope: []
    authorization:
      action_type: execute_stage
      requested_capabilities: [workflow.stage.execute, evidence.write]
      side_effects:
        write_repo: false
        write_evidence: true
        shell: true
        network: false
        model_invoke: true
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: low
      scope:
        read: [default-work-unit-policy, workflow-evidence]
        write: [workflow-evidence]
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: false
      allowed_executor_profiles: [read_only_analysis]
artifacts:
  - name: closeout_workflow_summary
    path: "/.octon/state/evidence/validation/analysis/{{date}}-change-closeout-workflow.md"
    kind: file
    format: markdown
    determinism: unique
    description: SI-00 Change preservation and denial summary.
done_gate:
  checks:
    - "active route is branch-no-pr, branch-pr, or stage-only-escalate"
    - "direct-main is denied"
    - "generic target resolves to preserved"
    - "candidate and unrelated work are preserved"
    - "landing/publication requests record RP00_CONTAINMENT_PUBLICATION_DISABLED before mutation"
    - "cleanup requests record RP00_CONTAINMENT_CLEANUP_DISABLED before mutation"
    - "no cleaned, synced, or autonomous publication success is reported"
constraints:
  fail_closed: true
  forbid_design_packages: true
  require_relative_local_assets: true
  forbidden_effects: [push-main, no-pr-land, merge, cleanup, delete-ref, remove-worktree, sync-main]
