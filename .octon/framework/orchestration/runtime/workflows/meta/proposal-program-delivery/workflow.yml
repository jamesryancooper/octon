schema_version: workflow-contract-v2
name: proposal-program-delivery
description: Coordinate an accepted proposal program through child packet implementation, publication freshness, packet closeout, archive handoff, Change closeout, hosted landing, final sync, branch cleanup, terminal proof, and final hygiene.
version: 1.0.0
entry_mode: human
execution_profile: core
side_effect_class: mutating
execution_controls:
  cancel_safe: true
coordination_key_strategy:
  kind: workflow-target
  source_fields:
    - target_program_path
    - target_outcome
  format: proposal-program-delivery:{target_program_path}:{target_outcome}
executor_interface_version: workflow-executor-v1
inputs:
  - name: profile_path
    type: file
    required: true
    description: Profile conforming to proposal-program-delivery-profile-v1.
  - name: target_program_path
    type: folder
    required: true
    description: Accepted proposal program path supplied by the caller.
  - name: target_outcome
    type: text
    required: true
    description: Requested outcome; downstream claims require fresh owning evidence.
  - name: delivery_run_id
    type: text
    required: true
    description: Stable evidence and receipt run identifier.
stages:
  - id: bind-profile
    asset: stages/01-bind-profile.md
    kind: verification
    consumes: []
    produces:
      - stage:bind-profile
    mutation_scope: []
    authorization: &read_evidence_authorization
      action_type: execute_stage
      requested_capabilities:
        - workflow.stage.execute
        - evidence.write
      side_effects:
        write_repo: false
        write_evidence: true
        shell: true
        network: false
        model_invoke: false
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: low
      scope:
        read:
          - workflow-scope
        write:
          - workflow-evidence
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: false
      allowed_executor_profiles:
        - read_only_analysis
  - id: delivery-readiness-preflight
    asset: stages/02-delivery-readiness-preflight.md
    kind: verification
    consumes:
      - stage:bind-profile
    produces:
      - stage:delivery-readiness-preflight
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: validate-program-state
    asset: stages/03-validate-program-state.md
    kind: verification
    consumes:
      - stage:delivery-readiness-preflight
    produces:
      - stage:validate-program-state
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: run-or-resume-child-lifecycles
    asset: stages/04-run-or-resume-child-lifecycles.md
    kind: mutation
    consumes:
      - stage:validate-program-state
    produces:
      - stage:run-or-resume-child-lifecycles
    mutation_scope:
      - workflow-scope
    authorization: &repo_mutation_authorization
      action_type: execute_stage
      requested_capabilities:
        - workflow.stage.execute
        - repo.write
        - evidence.write
      side_effects:
        write_repo: true
        write_evidence: true
        shell: true
        network: false
        model_invoke: true
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: medium
      scope:
        read:
          - workflow-scope
        write:
          - workflow-scope
          - workflow-evidence
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: true
      allowed_executor_profiles:
        - scoped_repo_mutation
  - id: validate-child-receipts
    asset: stages/05-validate-child-receipts.md
    kind: verification
    consumes:
      - stage:run-or-resume-child-lifecycles
    produces:
      - stage:validate-child-receipts
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: validate-feature-catalog-drift
    asset: stages/06-validate-feature-catalog-drift.md
    kind: verification
    consumes:
      - stage:validate-child-receipts
    produces:
      - stage:validate-feature-catalog-drift
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: route-closeout-and-archive
    asset: stages/06-route-closeout-and-archive.md
    kind: mutation
    consumes:
      - stage:validate-feature-catalog-drift
    produces:
      - stage:route-closeout-and-archive
    mutation_scope:
      - workflow-scope
    authorization: *repo_mutation_authorization
  - id: route-change-closeout
    asset: stages/07-route-change-closeout.md
    kind: mutation
    consumes:
      - stage:route-closeout-and-archive
    produces:
      - stage:route-change-closeout
    mutation_scope:
      - workflow-scope
    authorization: *repo_mutation_authorization
  - id: validate-cleanup-sync-proof
    asset: stages/08-validate-cleanup-sync-proof.md
    kind: verification
    consumes:
      - stage:route-change-closeout
    produces:
      - stage:validate-cleanup-sync-proof
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: emit-delivery-receipt
    asset: stages/09-emit-delivery-receipt.md
    kind: projection
    consumes:
      - stage:validate-cleanup-sync-proof
    produces:
      - stage:emit-delivery-receipt
    mutation_scope: []
    authorization: *read_evidence_authorization
artifacts:
  - name: delivery_summary
    path: "/.octon/state/evidence/validation/analysis/{{date}}-proposal-program-delivery.md"
    kind: file
    format: markdown
    determinism: unique
    description: Top-level proposal program delivery summary.
  - name: delivery_bundle
    path: "/.octon/state/evidence/runs/workflows/{{date}}-proposal-program-delivery-{{slug}}/"
    kind: directory
    format: mixed
    determinism: unique
    description: Workflow bundle containing delivery profile, state evidence, inventory, and receipt.
  - name: delivery_receipt
    path: "/.octon/state/evidence/runs/workflows/{{date}}-proposal-program-delivery-{{slug}}/proposal-program-delivery-receipt.yml"
    kind: file
    format: yaml
    determinism: unique
    description: Aggregate proposal-program-delivery-receipt output validated by validate-proposal-program-delivery-receipt.sh.
  - name: delivery_evidence_index
    path: "/.octon/state/evidence/runs/workflows/{{date}}-proposal-program-delivery-{{slug}}/proposal-program-delivery-evidence-index.yml"
    kind: file
    format: yaml
    determinism: unique
    description: Compact retained delivery evidence index validated by validate-proposal-program-delivery-evidence-index.sh; evidence-only and non-authorizing.
  - name: feature_catalog_drift_receipt
    path: "/.octon/state/evidence/runs/workflows/{{date}}-proposal-program-delivery-{{slug}}/feature-catalog-drift-receipt.yml"
    kind: file
    format: yaml
    determinism: unique
    description: Evidence-only feature-catalog-drift-receipt-v1 output validated by validate-feature-catalog-drift-closeout.sh.
done_gate:
  checks:
    - "profile validates with validate-proposal-program-delivery-profile.sh before any delivery claim"
    - "profile and workflow evidence record target_outcome, release state, order policy, PR policy, stash policy, runner handoff refs when supplied, include-path classification state, and retained preflight refs"
    - "execution_order_policy enforces child-before-parent-delivery unless a valid target-bound order override receipt is retained"
    - "delivery-readiness-preflight passes before expensive child lifecycle continuation or parent delivery"
    - "child packet receipts remain target-owned and parent summary evidence does not replace them"
    - "feature catalog drift validates with validate-feature-catalog-drift-closeout.sh before parent closeout, delivery, or cleaned claims"
    - "unresolved child or parent feature-catalog drift blocks completed delivery and records next owning documentation routes without replacing child receipts"
    - "closeout-change or closeout-worktree owns Change closeout and any hosted mutation"
    - "git mutation preflight passes before branch-local commit, push, hosted no-PR landing, sync, cleanup, or branch deletion"
    - "dirty or stale source posture selects a route-owned clean worktree with include-path classification before reconstruction, broad stage-all, staging, or commit"
    - "branch landing authorization exists before landed, synced, or cleaned claims"
    - "branch cleanup authorization exists before source branch cleanup claims"
    - "repo-hygiene-cleanup owns any local residue deletion"
    - "terminal current-state proof shows local main, origin/main, and landed ref equality"
    - "delivery receipt validates with validate-proposal-program-delivery-receipt.sh"
    - "lifecycle postmortem threshold status is recorded when repeated blocker or recovery thresholds apply"
    - "delivery evidence index validates with validate-proposal-program-delivery-evidence-index.sh and remains evidence-only"
    - "stop_condition_taxonomy maps blockers to owning routes or validators and prevents aggregate evidence from authorizing missing target-owned receipts"
constraints:
  fail_closed: true
  require_relative_local_assets: true
  aggregate_receipt_only: true
  child_receipts_remain_target_owned: true
  generated_outputs_are_non_authority: true
  runner_handoff_evidence_is_delivery_input_only: true
  canonical_execution_order_ref: child-before-parent-delivery
  retained_readiness_preflight_required: true
  stop_condition_taxonomy_ref: stop_condition_taxonomy
stop_condition_taxonomy:
  - stop_id: SC-001-authority-gap
    machine_condition: target_owned_receipt_missing_for_claimed_transition
    owning_route_or_validator: target-transition-owner
    required_evidence: receipt_ref_and_digest_or_not_applicable_receipt
    blocked_outcome: blocked:authority-gap
    next_route: owning_route_or_packet_revision
  - stop_id: SC-002-ownership-conflict
    machine_condition: multiple_routes_claim_same_mutation_or_evidence_authority
    owning_route_or_validator: lifecycle-runner-and-proposal-review
    required_evidence: blocker_ledger_entry_with_conflicting_owners
    blocked_outcome: blocked:ownership-conflict
    next_route: operator_escalation_or_architecture_revision
  - stop_id: SC-003-unsafe-mutation
    machine_condition: git_write_preflight_failed_or_dirty_stale_source_without_include_path_classification
    owning_route_or_validator: delivery-readiness-preflight-and-closeout-worktree
    required_evidence: retained_preflight_receipt_and_worktree_classifier
    blocked_outcome: blocked:unsafe-mutation
    next_route: closeout-worktree_or_change_closeout_preflight
  - stop_id: SC-004-approval-required
    machine_condition: required_human_hosted_branch_exception_or_landing_approval_missing
    owning_route_or_validator: closeout-change-or-authority-engine
    required_evidence: approval_exception_landing_or_branch_authorization_receipt
    blocked_outcome: blocked:approval-required
    next_route: closeout-change_or_human_approval_route
  - stop_id: SC-005-stale-evidence
    machine_condition: stored_digest_event_head_review_digest_or_receipt_freshness_mismatch
    owning_route_or_validator: proposal-review-gate-or-targeted-freshness-validator
    required_evidence: freshness_diagnostic_with_current_and_stored_digest
    blocked_outcome: blocked:stale-evidence
    next_route: review_child_route_rerun_or_freshness_refresh
  - stop_id: SC-006-generated-freshness-drift
    machine_condition: generated_effective_extension_capability_proposal_or_runtime_route_output_stale_or_direct_edited
    owning_route_or_validator: owning-publisher-and-freshness-validators
    required_evidence: publication_receipt_generation_lock_and_validator_pass
    blocked_outcome: blocked:generated-freshness-drift
    next_route: owning_publisher_script
  - stop_id: SC-007-publishable-evidence-gap
    machine_condition: hosted_or_shared_closeout_proof_cites_local_private_only_evidence_as_authority
    owning_route_or_validator: evidence-disclosure-and-terminal-proof-validators
    required_evidence: disclosure_tier_validation_failure_or_terminal_proof_diagnostic
    blocked_outcome: blocked:publishable-evidence-gap
    next_route: evidence_metadata_or_change_closeout_route
  - stop_id: SC-008-validation-failure
    machine_condition: required_validator_exits_nonzero
    owning_route_or_validator: validator-owner
    required_evidence: compact_validator_log_with_command_cwd_exit_code_and_evidence_ref
    blocked_outcome: blocked:validation-failure
    next_route: correction_route_or_packet_revision
  - stop_id: SC-009-parent-summary-substitution
    machine_condition: parent_summary_delivery_receipt_readiness_projection_or_evidence_index_used_as_child_owned_evidence
    owning_route_or_validator: child-receipt-validator-and-delivery-receipt-validator
    required_evidence: negative_control_validator_result
    blocked_outcome: blocked:parent-summary-substitution
    next_route: child_proposal_packet_route
  - stop_id: SC-010-cleaned-proof-gap
    machine_condition: cleaned_requested_but_terminal_proof_final_sync_branch_cleanup_or_worktree_hygiene_missing_or_stale
    owning_route_or_validator: terminal-proof-and-closeout-validators
    required_evidence: terminal_current_state_proof_and_cleanup_sync_receipts
    blocked_outcome: blocked:cleaned-proof-gap
    next_route: terminal_proof_repo_hygiene_or_change_closeout
workflow:
  id: proposal-program-delivery
  name: Proposal Program Delivery
  lifecycle_type: meta
  owner: framework-orchestration
  status: active
  purpose: >
    Coordinate an accepted proposal program through child packet implementation,
    publication freshness, packet closeout, archive handoff, Change closeout,
    hosted landing, final sync, branch cleanup, terminal proof, and final hygiene.
  authority:
    aggregate_receipt_only: true
    child_receipts_remain_target_owned: true
    generated_outputs_are_non_authority: true
    runner_handoff_evidence_is_delivery_input_only: true
    git_mutation_owner: closeout-change
    archive_owner: proposal-archive-lifecycle
    hygiene_cleanup_owner: repo-hygiene-cleanup
  inputs:
    - name: profile_path
      required: true
      description: Profile conforming to proposal-program-delivery-profile-v1.
    - name: target_program_path
      required: true
      description: Accepted proposal program path supplied by the caller.
    - name: target_outcome
      required: true
      description: Requested outcome; downstream claims require fresh owning evidence.
    - name: delivery_run_id
      required: true
      description: Stable evidence and receipt run identifier.
  outputs:
    - name: delivery_receipt
      schema_ref: .octon/framework/product/contracts/proposal-program-delivery-receipt-v1.schema.json
      description: Aggregate receipt that records source receipts without replacing them.
    - name: delivery_evidence_index
      schema_ref: .octon/framework/product/contracts/proposal-program-delivery-evidence-index-v1.schema.json
      description: Compact retained refs/digests/classification index that never replaces source evidence or authorizes outcomes.
  validators:
    profile: .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-program-delivery-profile.sh
    receipt: .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-program-delivery-receipt.sh
    evidence_index: .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-program-delivery-evidence-index.sh
    feature_catalog_drift: .octon/framework/assurance/runtime/_ops/scripts/validate-feature-catalog-drift-closeout.sh
    workflow: .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-program-delivery-workflow.sh
  stages:
    - id: bind-profile
      title: Bind delivery profile
      asset: stages/01-bind-profile.md
      required: true
      fail_closed_on:
        - missing_profile
        - malformed_profile
        - non_canonical_order_without_valid_override_receipt
        - pr_fallback_when_forbidden
        - stash_policy_widening
        - runner_handoff_used_as_target_owned_receipt
    - id: delivery-readiness-preflight
      title: Run retained delivery readiness preflight
      asset: stages/02-delivery-readiness-preflight.md
      required: true
      fail_closed_on:
        - git_write_preflight_blocked
        - dirty_source_without_route_owned_clean_worktree
        - stale_source_without_route_owned_clean_worktree
        - missing_include_path_classification
        - stale_review_or_child_receipt_compatibility_gap
        - generated_freshness_gap
    - id: validate-program-state
      title: Validate current program state
      asset: stages/03-validate-program-state.md
      required: true
      fail_closed_on:
        - stale_review_digest
        - unaccepted_program
        - ambiguous_child_scope
        - proposal_local_file_used_as_authority
    - id: run-or-resume-child-lifecycles
      title: Run or resume child packet lifecycles
      asset: stages/04-run-or-resume-child-lifecycles.md
      required: true
      fail_closed_on:
        - missing_child_receipt
        - stale_child_receipt
        - parent_summary_substituted_for_child_receipts
    - id: validate-child-receipts
      title: Validate target-owned child receipts
      asset: stages/05-validate-child-receipts.md
      required: true
      fail_closed_on:
        - missing_implementation_conformance
        - missing_post_implementation_drift_churn
        - stale_generated_publication_evidence
        - missing_governed_mechanism_integration_receipt
    - id: validate-feature-catalog-drift
      title: Validate product feature catalog drift
      asset: stages/06-validate-feature-catalog-drift.md
      required: true
      fail_closed_on:
        - missing_feature_catalog_drift_receipt
        - feature_catalog_drift_receipt_invalid
        - missing_catalog_entry
        - missing_feature_note
        - under_documented_feature
        - status_mismatch
        - stale_catalog_ref
        - unresolved_child_feature_catalog_drift
        - unresolved_parent_feature_catalog_drift
    - id: route-closeout-and-archive
      title: Route packet closeout and archive handoff
      asset: stages/06-route-closeout-and-archive.md
      required: true
      fail_closed_on:
        - packet_closeout_blocker
        - archive_blocker
        - fresh_unvalidated_archive_mutation
    - id: route-change-closeout
      title: Route Change closeout
      asset: stages/07-route-change-closeout.md
      required: true
      fail_closed_on:
        - git_index_write_denied
        - git_ref_write_denied
        - branch_no_pr_landing_without_authorization
        - pr_fallback_when_profile_forbids_pr
        - unsupported_hosted_mutation
        - dirty_or_stale_source_without_include_path_classification
    - id: validate-cleanup-sync-proof
      title: Validate cleanup, final sync, and terminal proof
      asset: stages/08-validate-cleanup-sync-proof.md
      required: true
      fail_closed_on:
        - branch_cleanup_without_authorization
        - repo_hygiene_deletion_without_cleanup_authorization
        - missing_terminal_current_state_proof
        - main_origin_landed_ref_mismatch
        - dirty_worktree_cleaned_overclaim
    - id: emit-delivery-receipt
      title: Emit delivery receipt
      asset: stages/09-emit-delivery-receipt.md
      required: true
      fail_closed_on:
        - aggregate_receipt_replaces_target_receipts
        - aggregate_receipt_omits_source_receipt_digest
        - aggregate_receipt_omits_stop_condition_owner_or_next_route
        - generated_prompt_used_as_authority
        - delivery_evidence_index_claims_authority
        - delivery_evidence_index_digest_drift
        - unresolved_blocker
  terminal_claim_rules:
    implemented:
      requires:
        - target_owned_implementation_run
        - implementation_conformance_pass
        - post_implementation_drift_churn_pass
        - feature_catalog_drift_pass
    archive-ready:
      requires:
        - packet_closeout_pass
        - archive_authorized_yes
    landed:
      requires:
        - change_closeout_pass
        - hosted_landing_evidence
    synced:
      requires:
        - local_main_equals_origin_main
        - origin_main_equals_landed_ref
    cleaned:
      requires:
        - branch_cleanup_authorized_and_done
        - repo_hygiene_cleanup_authorized_and_done_or_not_needed
        - terminal_current_state_proof_pass
        - worktree_hygiene_pass
