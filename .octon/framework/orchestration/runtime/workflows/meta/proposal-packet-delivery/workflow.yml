schema_version: workflow-contract-v2
name: proposal-packet-delivery
description: Coordinate an accepted proposal packet through implementation, promotion, packet closeout, terminal closeout, archive handoff, Change closeout, hosted landing, final sync, branch cleanup, terminal proof, and final hygiene.
version: 1.0.0
entry_mode: human
execution_profile: core
side_effect_class: mutating
execution_controls:
  cancel_safe: true
coordination_key_strategy:
  kind: workflow-target
  source_fields:
    - target_packet_path
    - target_outcome
  format: proposal-packet-delivery:{target_packet_path}:{target_outcome}
executor_interface_version: workflow-executor-v1
inputs:
  - name: profile_path
    type: file
    required: true
    description: Profile conforming to proposal-packet-delivery-profile-v1.
  - name: target_packet_path
    type: folder
    required: true
    description: Accepted proposal packet path supplied by the caller.
  - name: target_outcome
    type: text
    required: true
    description: Requested outcome; downstream claims require fresh owning evidence.
  - name: delivery_run_id
    type: text
    required: true
    description: Stable evidence and receipt run identifier.
stages:
  - id: bind-profile
    asset: stages/01-bind-profile.md
    kind: verification
    consumes: []
    produces:
      - stage:bind-profile
    mutation_scope: []
    authorization: &read_evidence_authorization
      action_type: execute_stage
      requested_capabilities:
        - workflow.stage.execute
        - evidence.write
      side_effects:
        write_repo: false
        write_evidence: true
        shell: true
        network: false
        model_invoke: false
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: low
      scope:
        read:
          - workflow-scope
        write:
          - workflow-evidence
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: false
      allowed_executor_profiles:
        - read_only_analysis
  - id: validate-packet-state
    asset: stages/02-validate-packet-state.md
    kind: verification
    consumes:
      - stage:bind-profile
    produces:
      - stage:validate-packet-state
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: run-or-resume-packet-implementation
    asset: stages/03-run-or-resume-packet-implementation.md
    kind: mutation
    consumes:
      - stage:validate-packet-state
    produces:
      - stage:run-or-resume-packet-implementation
    mutation_scope:
      - workflow-scope
    authorization: &repo_mutation_authorization
      action_type: execute_stage
      requested_capabilities:
        - workflow.stage.execute
        - repo.write
        - evidence.write
      side_effects:
        write_repo: true
        write_evidence: true
        shell: true
        network: false
        model_invoke: true
        state_mutation: false
        publication: false
        branch_mutation: false
      risk_tier: medium
      scope:
        read:
          - workflow-scope
        write:
          - workflow-scope
          - workflow-evidence
      review_requirements:
        human_approval: false
        quorum: false
        rollback_metadata: true
      allowed_executor_profiles:
        - scoped_repo_mutation
  - id: validate-implementation-receipts
    asset: stages/04-validate-implementation-receipts.md
    kind: verification
    consumes:
      - stage:run-or-resume-packet-implementation
    produces:
      - stage:validate-implementation-receipts
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: validate-feature-catalog-drift
    asset: stages/05-validate-feature-catalog-drift.md
    kind: verification
    consumes:
      - stage:validate-implementation-receipts
    produces:
      - stage:validate-feature-catalog-drift
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: promote-proposal
    asset: stages/05-promote-proposal.md
    kind: mutation
    consumes:
      - stage:validate-feature-catalog-drift
    produces:
      - stage:promote-proposal
    mutation_scope:
      - workflow-scope
    authorization: *repo_mutation_authorization
  - id: route-packet-closeout
    asset: stages/06-route-packet-closeout.md
    kind: mutation
    consumes:
      - stage:promote-proposal
    produces:
      - stage:route-packet-closeout
    mutation_scope:
      - workflow-scope
    authorization: *repo_mutation_authorization
  - id: route-terminal-closeout-and-archive
    asset: stages/07-route-terminal-closeout-and-archive.md
    kind: mutation
    consumes:
      - stage:route-packet-closeout
    produces:
      - stage:route-terminal-closeout-and-archive
    mutation_scope:
      - workflow-scope
    authorization: *repo_mutation_authorization
  - id: route-change-closeout
    asset: stages/08-route-change-closeout.md
    kind: mutation
    consumes:
      - stage:route-terminal-closeout-and-archive
    produces:
      - stage:route-change-closeout
    mutation_scope:
      - workflow-scope
    authorization: *repo_mutation_authorization
  - id: validate-cleanup-sync-proof
    asset: stages/09-validate-cleanup-sync-proof.md
    kind: verification
    consumes:
      - stage:route-change-closeout
    produces:
      - stage:validate-cleanup-sync-proof
    mutation_scope: []
    authorization: *read_evidence_authorization
  - id: emit-delivery-receipt
    asset: stages/10-emit-delivery-receipt.md
    kind: projection
    consumes:
      - stage:validate-cleanup-sync-proof
    produces:
      - stage:emit-delivery-receipt
    mutation_scope: []
    authorization: *read_evidence_authorization
artifacts:
  - name: delivery_summary
    path: "/.octon/state/evidence/validation/analysis/{{date}}-proposal-packet-delivery.md"
    kind: file
    format: markdown
    determinism: unique
    description: Top-level proposal packet delivery summary.
  - name: delivery_bundle
    path: "/.octon/state/evidence/runs/workflows/{{date}}-proposal-packet-delivery-{{slug}}/"
    kind: directory
    format: mixed
    determinism: unique
    description: Workflow bundle containing delivery profile, state evidence, inventory, and receipt.
  - name: delivery_receipt
    path: "/.octon/state/evidence/runs/workflows/{{date}}-proposal-packet-delivery-{{slug}}/proposal-packet-delivery-receipt.yml"
    kind: file
    format: yaml
    determinism: unique
    description: Aggregate proposal-packet-delivery-receipt output validated by validate-proposal-packet-delivery-receipt.sh.
  - name: partition_clean_order_override_receipt
    path: "/.octon/state/evidence/runs/workflows/{{date}}-proposal-packet-delivery-{{slug}}/proposal-packet-delivery-order-override-receipt.yml"
    kind: file
    format: yaml
    determinism: optional
    description: Optional partition-clean archive readiness order override validated by validate-proposal-packet-delivery-order-override-receipt.sh.
  - name: feature_catalog_drift_receipt
    path: "/.octon/state/evidence/runs/workflows/{{date}}-proposal-packet-delivery-{{slug}}/feature-catalog-drift-receipt.yml"
    kind: file
    format: yaml
    determinism: unique
    description: Evidence-only feature-catalog-drift-receipt-v1 output validated by validate-feature-catalog-drift-closeout.sh.
done_gate:
  checks:
    - "/proposal-packet-delivery outcome=cleaned route=branch-no-pr is the outer orchestrator and PR fallback forbidden"
    - "profile validates with validate-proposal-packet-delivery-profile.sh before any delivery claim"
    - "profile records pre-archive and already-archived packet state routing"
    - "proposal review/readiness gates and implementation authorization are fresh before implementation"
    - "run-packet-implementation owns implementation execution and target-owned receipts remain authoritative"
    - "implementation conformance and post-implementation drift/churn pass before promotion"
    - "feature catalog drift validates with validate-feature-catalog-drift-closeout.sh before promotion, closeout, delivery, or cleaned claims"
    - "unresolved feature-catalog drift blocks completed delivery and records the next owning documentation route without authorizing catalog mutation"
    - "promote-proposal owns implemented status and promotion receipt evidence"
    - "closeout-packet owns proposal-closeout.md and archive authorization"
    - "partition-clean archive readiness requires a validating proposal-packet-delivery-order-override receipt, closeout-worktree report, and lifecycle-interaction-return"
    - "partition-clean archive readiness may unblock packet closeout, terminal closeout, and archive routing but does not authorize archive relocation, Git mutation, hosted landing, branch cleanup, repo hygiene cleanup, or cleaned claims"
    - "proposal-packet-terminal-closeout owns proposal-terminal-closeout.yml"
    - "archive-proposal owns archive relocation"
    - "pre-archive packet state routes through closeout-packet, proposal-packet-terminal-closeout, and archive-proposal"
    - "already-archived packet state skips archive relocation and routes to closeout-change for landing, sync, cleanup, and terminal proof"
    - "generated publication remains owner-routed through owning publisher scripts"
    - "generated-input freshness scope is classified before terminal closeout/archive routing"
    - "generated freshness outcomes record not-in-scope, owner-routed, refresh-needed-not-authorized, stale, or fresh-non-authoritative"
    - "closeout-change or closeout-worktree owns Change closeout and any hosted mutation"
    - "branch landing authorization exists before landed, synced, or cleaned claims"
    - "branch cleanup authorization exists before source branch cleanup claims"
    - "repo-hygiene-cleanup owns any local residue deletion"
    - "terminal current-state proof shows local main, origin/main, and landed ref equality"
    - "terminal proof is emitted only after landing evidence, final sync proof, cleanup authorization, cleanup disposition, rollback posture, and validation proof exist"
    - "terminal proof distinguishes landed ref from proof sink or receipt path and performs no source-branch, local main, origin/main, or landed-ref mutation"
    - "aggregate receipt summarizes target-owned receipts, requires explicit blockers for blocked outcomes, and records next owning lifecycle"
    - "aggregate receipt may summarize terminal proof but cannot replace target-owned terminal proof, cleanup, sync, validation, or closeout receipts"
    - "delivery receipt validates with validate-proposal-packet-delivery-receipt.sh"
constraints:
  fail_closed: true
  require_relative_local_assets: true
  outer_orchestrator_command: "/proposal-packet-delivery"
  required_target_outcome: cleaned
  required_route: branch-no-pr
  pr_fallback_allowed: false
  aggregate_receipt_only: true
  target_receipts_remain_target_owned: true
  generated_outputs_are_non_authority: true
  partition_clean_archive_readiness_allowed: true
  partition_clean_cleaned_claim_allowed: false
  terminal_proof_source_branch_commit_required_after_landing: false
  terminal_proof_mutates_landed_or_source_refs: false
  generated_freshness_classification_required_before_terminal: true
  generated_freshness_outcomes:
    - generated_freshness_not_in_scope
    - generated_input_scope_detected_and_owner_routed
    - generated_refresh_needed_but_not_authorized
    - generated_output_present_but_stale
    - generated_output_fresh_but_non_authoritative
workflow:
  id: proposal-packet-delivery
  name: Proposal Packet Delivery
  lifecycle_type: meta
  owner: framework-orchestration
  status: active
  purpose: >
    Coordinate an accepted proposal packet through implementation, promotion,
    packet closeout, terminal closeout, archive handoff, Change closeout,
    hosted landing, final sync, branch cleanup, terminal proof, and final hygiene.
  authority:
    aggregate_receipt_only: true
    target_receipts_remain_target_owned: true
    generated_outputs_are_non_authority: true
    implementation_owner: run-packet-implementation
    promotion_owner: promote-proposal
    packet_closeout_owner: closeout-packet
    terminal_closeout_owner: proposal-packet-terminal-closeout
    archive_owner: archive-proposal
    git_mutation_owner: closeout-change
    final_sync_owner: closeout-change
    branch_cleanup_owner: closeout-change
    terminal_current_state_proof_owner: closeout-change
    terminal_evidence_sink_owner: closeout-change
    worktree_hygiene_owner: closeout-change
    partition_clean_archive_readiness_owner: proposal-packet-delivery-order-override
    hygiene_cleanup_owner: repo-hygiene-cleanup
    generated_publication_owner: owning-publisher-scripts
    generated_freshness_owner: owning-generator-scripts
  inputs:
    - name: profile_path
      required: true
      description: Profile conforming to proposal-packet-delivery-profile-v1.
    - name: target_packet_path
      required: true
      description: Accepted proposal packet path supplied by the caller.
    - name: target_outcome
      required: true
      description: Requested outcome; downstream claims require fresh owning evidence.
    - name: delivery_run_id
      required: true
      description: Stable evidence and receipt run identifier.
  outputs:
    - name: delivery_receipt
      schema_ref: .octon/framework/product/contracts/proposal-packet-delivery-receipt-v1.schema.json
      description: Aggregate receipt that records source receipts without replacing them.
  validators:
    profile: .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-packet-delivery-profile.sh
    receipt: .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-packet-delivery-receipt.sh
    order_override: .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-packet-delivery-order-override-receipt.sh
    feature_catalog_drift: .octon/framework/assurance/runtime/_ops/scripts/validate-feature-catalog-drift-closeout.sh
    workflow: .octon/framework/assurance/runtime/_ops/scripts/validate-proposal-packet-delivery-workflow.sh
  packet_state_routes:
    pre-archive:
      description: Packet has implementation or closeout evidence but has not completed archive relocation.
      owner_sequence:
        - closeout-packet
        - proposal-packet-terminal-closeout
        - archive-proposal
      blocked_when_missing_evidence: true
      blocked_next_owning_lifecycle: closeout-packet
    already-archived:
      description: Packet archive evidence exists and archive relocation must not be rerun by the wrapper.
      owner_sequence:
        - archive-proposal
        - closeout-change
        - repo-hygiene-cleanup
      skip_archive_relocation: true
      blocked_when_missing_archive_receipt: true
      blocked_next_owning_lifecycle: archive-proposal
  aggregate_receipt_policy:
    summarizes_target_owned_receipts: true
    replaces_target_owned_receipts: false
    blocked_outcome_requires_explicit_blockers: true
    blocked_outcome_requires_next_owning_lifecycle: true
    generated_outputs_can_authorize_closeout: false
    summarizes_route_owned_terminal_proof: true
    replaces_route_owned_terminal_proof: false
    replaces_cleanup_sync_validation_or_closeout_receipts: false
  terminal_evidence_sink_policy:
    owner: closeout-change
    classification: retained-evidence-only
    emitted_after:
      - landing_evidence
      - final_sync_proof
      - cleanup_authorization
      - cleanup_disposition
      - rollback_posture
      - validation_proof
    distinguishes:
      - landed_ref
      - terminal_current_state_proof_ref
      - terminal_proof_sink_or_receipt_path
    source_branch_commit_required_after_landing: false
    mutates_origin_main_local_main_landed_ref_or_source_branch: false
    replaces_closeout_change_or_worktree_receipts: false
    missing_prerequisite_effect: downgrade_actual_outcome_and_block_terminal_success
  generated_freshness_scope_detection:
    required_before:
      - route-terminal-closeout-and-archive
      - emit-delivery-receipt
    owner_generators:
      support_envelope_reconciliation: .octon/framework/assurance/runtime/_ops/scripts/generate-support-envelope-reconciliation.sh
      run_health_read_model: .octon/framework/assurance/runtime/_ops/scripts/generate-run-health-read-model.sh
    validators:
      support_envelope_reconciliation: .octon/framework/assurance/runtime/_ops/scripts/validate-support-envelope-reconciliation.sh
      run_health_read_model: .octon/framework/assurance/runtime/_ops/scripts/validate-run-health-read-model.sh
      generated_non_authority: .octon/framework/assurance/runtime/_ops/scripts/validate-generated-non-authority.sh
    receipt_rule:
      aggregate_delivery_receipt_summarizes_generated_freshness: true
      aggregate_delivery_receipt_replaces_generated_freshness_evidence: false
      proposal_local_or_parent_evidence_satisfies_generated_freshness: false
      stale_generated_output_blocks_terminal_delivery_claim: true
      generated_output_authorizes_closeout_or_archive: false
    outcomes:
      generated_freshness_not_in_scope:
        terminal_effect: continue
      generated_input_scope_detected_and_owner_routed:
        terminal_effect: require_owning_validator_pass
      generated_refresh_needed_but_not_authorized:
        terminal_effect: blocked
        next_owning_lifecycle: owning-generator-authorization
      generated_output_present_but_stale:
        terminal_effect: blocked
        next_owning_lifecycle: owning-generator-refresh
      generated_output_fresh_but_non_authoritative:
        terminal_effect: continue_with_non_authority_notice
  stages:
    - id: bind-profile
      title: Bind delivery profile
      asset: stages/01-bind-profile.md
      required: true
      fail_closed_on:
        - missing_profile
        - malformed_profile
        - pr_fallback_when_forbidden
        - stash_policy_widening
    - id: validate-packet-state
      title: Validate current packet state
      asset: stages/02-validate-packet-state.md
      required: true
      fail_closed_on:
        - stale_review_digest
        - unaccepted_packet
        - missing_implementation_authorization
        - proposal_local_file_used_as_authority
    - id: run-or-resume-packet-implementation
      title: Run or resume packet implementation
      asset: stages/03-run-or-resume-packet-implementation.md
      required: true
      fail_closed_on:
        - missing_implementation_run_receipt
        - stale_implementation_run_receipt
        - widened_promotion_targets
        - self_authorization_attempt
    - id: validate-implementation-receipts
      title: Validate implementation receipts
      asset: stages/04-validate-implementation-receipts.md
      required: true
      fail_closed_on:
        - missing_implementation_conformance
        - missing_post_implementation_drift_churn
        - stale_generated_publication_evidence
        - generated_input_scope_unclassified
        - generated_refresh_needed_but_not_authorized
        - generated_output_used_as_closeout_authority
        - missing_governed_mechanism_integration_receipt
    - id: validate-feature-catalog-drift
      title: Validate product feature catalog drift
      asset: stages/05-validate-feature-catalog-drift.md
      required: true
      fail_closed_on:
        - missing_feature_catalog_drift_receipt
        - feature_catalog_drift_receipt_invalid
        - missing_catalog_entry
        - missing_feature_note
        - under_documented_feature
        - status_mismatch
        - stale_catalog_ref
        - unresolved_feature_catalog_drift
    - id: promote-proposal
      title: Promote through promote-proposal
      asset: stages/05-promote-proposal.md
      required: true
      fail_closed_on:
        - missing_promotion_receipt
        - manifest_status_not_implemented
        - promotion_target_drift
    - id: route-packet-closeout
      title: Route closeout-packet
      asset: stages/06-route-packet-closeout.md
      required: true
      fail_closed_on:
        - packet_closeout_blocker
        - archive_authorization_missing
        - closeout_receipt_stale
        - partition_clean_override_invalid
    - id: route-terminal-closeout-and-archive
      title: Route terminal closeout and archive handoff
      asset: stages/07-route-terminal-closeout-and-archive.md
      required: true
      fail_closed_on:
        - terminal_closeout_blocker
        - archive_blocker
        - fresh_unvalidated_archive_mutation
        - partition_clean_override_invalid
        - partition_clean_used_for_git_clean_or_cleaned_claim
        - generated_output_present_but_stale
        - generated_freshness_required_without_owner_validator
    - id: route-change-closeout
      title: Route Change closeout
      asset: stages/08-route-change-closeout.md
      required: true
      fail_closed_on:
        - branch_no_pr_landing_without_authorization
        - pr_fallback_when_profile_forbids_pr
        - unsupported_hosted_mutation
    - id: validate-cleanup-sync-proof
      title: Validate cleanup, final sync, and terminal proof
      asset: stages/09-validate-cleanup-sync-proof.md
      required: true
      fail_closed_on:
        - branch_cleanup_without_authorization
        - repo_hygiene_deletion_without_cleanup_authorization
        - missing_terminal_current_state_proof
        - terminal_proof_missing_landing_final_sync_cleanup_rollback_or_validation
        - terminal_proof_conflates_landed_ref_with_sink_ref
        - terminal_proof_requires_source_branch_commit_after_landing
        - terminal_proof_mutates_landed_or_source_refs
        - main_origin_landed_ref_mismatch
        - dirty_worktree_cleaned_overclaim
    - id: emit-delivery-receipt
      title: Emit delivery receipt
      asset: stages/10-emit-delivery-receipt.md
      required: true
      fail_closed_on:
        - aggregate_receipt_replaces_target_receipts
        - aggregate_receipt_replaces_terminal_proof
        - aggregate_receipt_replaces_cleanup_sync_validation_or_closeout_receipts
        - generated_prompt_used_as_authority
        - generated_read_model_used_as_authority
        - proposal_local_evidence_used_for_generated_freshness
        - unresolved_blocker
  terminal_claim_rules:
    implemented:
      requires:
        - implementation_run_pass
        - implementation_conformance_pass
        - post_implementation_drift_churn_pass
        - feature_catalog_drift_pass
        - promote_proposal_receipt_pass
        - manifest_status_implemented
    archive-ready:
      requires:
        - closeout_packet_pass
        - archive_authorized_yes
        - terminal_closeout_pass
        - worktree_hygiene_pass_or_partition_clean_order_override_pass
        - partition_clean_does_not_authorize_archive_or_cleaned_claim
    landed:
      requires:
        - archive_proposal_pass
        - change_closeout_pass
        - hosted_landing_evidence
    synced:
      requires:
        - local_main_equals_origin_main
        - origin_main_equals_landed_ref
        - final_sync_proof_pass
    cleaned:
      requires:
        - branch_cleanup_authorized_and_done
        - cleanup_disposition_recorded
        - rollback_posture_retained
        - validation_proof_current
        - repo_hygiene_cleanup_authorized_and_done_or_not_needed
        - terminal_current_state_proof_pass
        - terminal_proof_sink_distinct_from_landed_ref
        - terminal_proof_non_mutating_after_landing
        - worktree_hygiene_pass
        - partition_clean_not_substituted_for_worktree_hygiene
