schema_version: "architectural-review-routing-v1"
default_route: "pre-integration-architecture-review"
routes:
  - route_id: "pre-integration-architecture-review"
    display_name: "Pre-Integration Architecture Review"
    use_when:
      - "An architecture proposal is being reviewed before acceptance."
      - "Implementation authorization is requested for an architecture proposal."
    lifecycle_authority: "required-gate-for-architecture-proposals"
    closeout_authority: "none"
    required_receipt: "architectural-review-support-receipt-v1"
  - route_id: "architecture-revision-packet"
    display_name: "Architecture Revision Packet"
    use_when:
      - "Concept intake identifies architectural pressure that needs packetization."
    lifecycle_authority: "extension-helper-only"
    closeout_authority: "none"
    owner: "octon-concept-integration"
  - route_id: "post-integration-architecture-review"
    display_name: "Post-Integration Architecture Review"
    use_when:
      - "A landed implementation needs architecture evidence after integration."
    lifecycle_authority: "evidence-only"
    closeout_authority: "none"
  - route_id: "current-state-mechanism-architecture-review"
    display_name: "Current-State Mechanism Architecture Review"
    use_when:
      - "A current governed mechanism needs cross-surface architecture review."
    lifecycle_authority: "evidence-only"
    closeout_authority: "none"
  - route_id: "architecture-readiness-audit"
    display_name: "Architecture Readiness Audit"
    command_facades:
      - "architecture-readiness-audit"
    use_when:
      - "Whole-harness or bounded-domain implementation readiness is being evaluated."
    lifecycle_authority: "audit-evidence"
    closeout_authority: "none"
  - route_id: "domain-architecture-audit"
    display_name: "Domain Architecture Audit"
    invocation_aliases:
      - "audit-domain-architecture"
    command_facades:
      - "audit-domain-architecture"
    use_when:
      - "A bounded domain needs architecture critique."
    lifecycle_authority: "audit-evidence"
    closeout_authority: "none"
  - route_id: "surface-architecture-audit"
    display_name: "Surface Architecture Audit"
    invocation_aliases:
      - "audit-surface-architecture"
    command_facades:
      - "audit-surface-architecture"
    use_when:
      - "A single durable surface needs architecture critique."
    lifecycle_authority: "audit-evidence"
    closeout_authority: "none"
  - route_id: "lifecycle-postmortem-evaluator"
    display_name: "Lifecycle Postmortem Evaluator"
    use_when:
      - "A lifecycle run needs postmortem evidence."
    lifecycle_authority: "evidence-only"
    closeout_authority: "none"
  - route_id: "constitutional-challenge"
    display_name: "Constitutional Challenge"
    use_when:
      - "A proposed architecture conflicts with constitutional, precedence, authority, fail-closed, or evidence obligations."
    lifecycle_authority: "separate-governance-route"
    closeout_authority: "none"
fail_closed_conditions:
  - "unknown_review_mode"
  - "missing_pre_integration_receipt_for_architecture_proposal_acceptance"
  - "missing_pre_integration_receipt_for_architecture_proposal_implementation_authorization"
  - "schema_invalid_support_receipt"
  - "stale_packet_digest"
  - "placeholder_receipt_text"
  - "omitted_validator_refs"
  - "passing_receipt_with_unresolved_blockers"
