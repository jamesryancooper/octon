    - "inactive or quarantined additive pack with exact selection-state proof"
    - "state, evidence, and control artifacts"
    - "generated and host projections with generator and parity proof"
    - "test, fixture, example, and golden surfaces"
    - "vendored and build outputs"
    - "lock and binary artifacts"
    - "non-runtime prose and schema artifacts"
  exclusion_override: >-
    An excluded file reached by selected-active or effective routing blocks.
    Executable or runtime-command exclusions require a declared
    sandbox/disposable-root harness and no runtime consumer. Every other
    executable or runtime-command exclusion blocks.
  grammar_families:
    - "shell-filesystem-git-provider-writers-and-process-launchers"
    - "rust-filesystem-database-provider-writers-and-process-thread-task-launchers"
    - "python-filesystem-database-http-writers-and-subprocess-exec-multiprocessing-launchers"
    - "github-runs-uses-write-permissions-secrets-and-credential-bearing-actions"
    - "octon-workflow-side-effect-and-execution-fields"
    - "skill-command-service-tool-command-and-entrypoint-fields"
  ambiguous_policy: >-
    Constructed, dynamic, unsupported, or parse-failed candidates block unless
    the exact normalized key has one owner, bounded disposition, and expiry.
  normalized_key: "kind|repo-relative-posix-path|stable-anchor|grammar-id"
  ordering: "LC_ALL=C sorted, unique, canonical LF"
  material_sets:
    writers:
      count: 535
      sha256: "sha256:e5e6b6ce0a0829cfa7e5503424805c5c3b0aee69973f212274cf7af35ebbd263"
    launchers:
      count: 920
      sha256: "sha256:1ab6d0af7ddf92c60105cbba0df697782e4e24d71c166b95f4d073116c792190"
  equality:
    writers: "D_w = M_w"
    launchers: "D_l = M_l = A_l"
