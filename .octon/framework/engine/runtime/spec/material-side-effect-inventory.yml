    inactive_or_quarantined:
      count: 5
      sha256: "sha256:9b675ab63aebd3104ae77557b78a545a5291e2545b2791cf2ee38d73e431896d"
      disposition: "excluded only with exact same-tree selection proof and no active consumer"
  exclusion_classes:
