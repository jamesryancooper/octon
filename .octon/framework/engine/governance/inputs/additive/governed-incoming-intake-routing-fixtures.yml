    fixture_type: "real-observed"
    observed_intake_id: "octon-rust-skill-pack-rust-source-authority"
    preclassification_validation: "expected-fail"
    expected_validation_error_substrings:
      - ".DS_Store"
      - "intake-status.yml"
    expected_route: null
    expected_result: "block-before-route-classification"
    expected_terminal_disposition: "blocked-rejected-deferred"
    mutation_allowed: false
    target_dispatch_allowed: false
    rejected_routes: []
    classification_signals:
      coherent_work_unit: false
      target_surfaces: []
      child_sequencing_required: false
      migration_or_cutover: false
      cross_surface_dependency: false
      governance_and_runtime: false
      ambiguous_packet_vs_program: false
      unsafe_provenance_or_license: false
      contains_secret_or_private_data: false
      malicious_authority_confusion: false
      direct_target_requested: false
      target_owned_intake_contract: "absent"
    evidence_requirements:
      - "incoming-envelope-validation-failure"
      - "classification-not-run"
      - "denial-rationale"

