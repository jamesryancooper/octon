schema_version: "governed-incoming-intake-routing-fixtures-v1"
summary: "Static fixture expectations for non-mutating Governed Incoming Intake Routing evaluation."

routes:
  - route_id: "single-work-unit-handoff"
    enabled: true
    dispatch_allowed: false
    target_owner: "proposal-packet-lifecycle"
    description: "One coherent candidate addition becomes advisory proposal packet handoff context."
  - route_id: "coordinated-program-handoff"
    enabled: true
    dispatch_allowed: false
    target_owner: "proposal-program-lifecycle"
    description: "Multi-surface, staged, dependent, or complex intake becomes advisory proposal program handoff context."
  - route_id: "target-owned-direct-handoff"
    enabled: false
    dispatch_allowed: false
    target_owner: "future-target-owned-intake-admission-contract"
    disabled_reason: "No target-owned intake admission contract exists in the current implementation."
  - route_id: "blocked-rejected-deferred"
    enabled: true
    dispatch_allowed: false
    target_owner: "intake-routing-denial-evidence"
    description: "Malformed, unsafe, ambiguous, unsupported, unverifiable, deferred, or authority-confused intake."

required_negative_controls:
  - "autonomous-incoming-scan"
  - "raw-intake-as-authority"
  - "generated-output-as-authority"
  - "host-state-as-authority"
  - "chat-history-as-authority"
  - "model-memory-as-authority"
  - "tool-availability-as-authority"
  - "lifecycle-interaction-as-authorization"
  - "parent-program-evidence-as-child-receipt"
  - "proposal-handoff-authorizes-git"
  - "proposal-handoff-authorizes-cleanup"
  - "proposal-handoff-authorizes-worktree-cleanup"
  - "proposal-handoff-authorizes-repo-hygiene-deletion"

forbidden_handoff_authorizations:
  - "git-ref-mutation"
  - "hosted-provider-authorization"
  - "branch-cleanup-authorization"
  - "worktree-cleanup-authorization"
  - "repo-hygiene-deletion"
  - "promotion-authorization"
  - "archive-authorization"
  - "scope-expansion"

contracts:
  route_decision_schema: ".octon/framework/product/contracts/governed-incoming-intake-route-decision-v1.schema.json"
  handoff_schema: ".octon/framework/product/contracts/governed-incoming-intake-handoff-v1.schema.json"
  target_owned_intake_admission_schema: ".octon/framework/product/contracts/target-owned-intake-admission-contract-v1.schema.json"
  lifecycle_interaction_request_schema: ".octon/framework/product/contracts/lifecycle-interaction-request-v1.schema.json"
  lifecycle_interaction_return_schema: ".octon/framework/product/contracts/lifecycle-interaction-return-v1.schema.json"
  proposal_packet_admission_contract: ".octon/inputs/additive/extensions/octon-proposal-lifecycle/context/intake-admission/proposal-packet-intake-admission.contract.yml"
  proposal_program_admission_contract: ".octon/inputs/additive/extensions/octon-proposal-lifecycle/context/intake-admission/proposal-program-intake-admission.contract.yml"

target_return_requirements:
  completed_targets_require_return_evidence: true
  target_return_evidence_must_be_fresh: true
  target_return_evidence_authorizes_intake_completion_claim: false
  lifecycle_interaction_receipts_authorize_target_action: false
  parent_program_evidence_satisfies_child_receipts: false

