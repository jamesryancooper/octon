# Positive control for validate-architectural-review-workflows.sh --root <this
# fixture root>. A review-occasion workflow that records the selected method id in
# run evidence through a v2 routing-decision artifact while the v1 support receipt
# stays method-free. Exercised methods-only via the --root fixture override.
schema_version: workflow-contract-v2
name: pre-integration-architecture-review
stages:
  - id: configure
    asset: stages/01-configure.md
  - id: balanced-review
    asset: stages/02-balanced-review.md
artifacts:
  - name: pre_integration_architecture_review_receipt
    path: "/.octon/state/evidence/runs/workflows/{{run_id}}/architectural-review/pre-integration-architecture-review/support-receipt.yml"
    kind: file
    format: yaml
    determinism: unique
    description: Schema-backed support receipt for architecture proposal acceptance and implementation authorization
  - name: pre_integration_architecture_review_method_selection_record
    path: "/.octon/state/evidence/runs/workflows/{{run_id}}/architectural-review/pre-integration-architecture-review/routing-decision.yml"
    kind: file
    format: yaml
    determinism: unique
    description: Records the selected review method id (field method bound to naming.yml methods.catalog) and the applied lens profile (field lenses_applied bound to lens-bank.yml) through the architectural-review-routing-decision-v2 artifact in the existing architectural-review run-evidence root; descriptive run evidence only, granting no lifecycle authority while the v1 support receipt stays method-free.
