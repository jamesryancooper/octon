schema_version: lifecycle-postmortem-evaluation-v1
subject:
  run_id: fixture-run
  lifecycle_kind: proposal-program
  octon_subject: true
evidence_refs:
  - fixture://retained-run-control
known_limits: []
section_order:
  invariant_compliance_before_quality_scoring: true
  invariant_validity_after_redesign_pressure_before_recommendations: true
  patch_vs_redesign_present: true
invariant_compliance:
  - invariant: Generated artifacts are not authority
    applicability: applicable
    rating: Pass
    enforcement_mechanism: generated outputs are classified non-authority
    evidence_refs:
      - fixture://generated-non-authority-proof
    evidence_gap: ""
    blocking: false
    required_correction: ""
    material: true
    counts_as_pass: true
  - invariant: Raw inputs are not authority
    applicability: applicable
    rating: Pass
    enforcement_mechanism: raw inputs require canonical admission before authority
    evidence_refs:
      - fixture://raw-input-denial-proof
    evidence_gap: ""
    blocking: false
    required_correction: ""
    material: true
    counts_as_pass: true
invariant_validity_evolution:
  - invariant: Generated artifacts are not authority
    protected_property: source-of-truth clarity
    current_validity: still valid
    enforcement_quality: enforceable by validators and runtime handles
    evidence_quality: evidenceable through retained refs
    scope_quality: clear with promotion-path clarification
    conflict_duplication: no conflict detected
    hack_pressure: low
    recommendation: Clarify
    required_change: define explicit promotion and materialization exceptions
    change_control_bar: medium
    authority_status: proposed-evidence-only
  - invariant: No second control plane
    protected_property: runtime authority centralization
    current_validity: still valid
    enforcement_quality: enforceable through control-root checks
    evidence_quality: evidenceable through retained control roots
    scope_quality: clear
    conflict_duplication: no conflict detected
    hack_pressure: low
    recommendation: Keep
    required_change: ""
    change_control_bar: low
    authority_status: proposed-evidence-only
final_judgment: Fit to reuse with targeted improvements
major_findings:
  - finding_id: fixture-finding-1
    summary: Retained evidence is sufficient for the fixture lifecycle.
    severity: note
    evidence_refs:
      - fixture://retained-run-control
authority_boundary:
  generated_outputs_authority: false
  raw_inputs_authority: false
  postmortem_approves_lifecycle_transition: false
  postmortem_approves_invariant_change: false
  non_authority_assertion: true
follow_up_recommendations:
  - recommendation: Clarify generated artifact promotion paths.
    authority_status: proposed-evidence-only
