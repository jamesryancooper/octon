root_cause_analysis:
  - problem: Lifecycle postmortem discoverability lagged evaluator implementation.
    proximate_cause: Registry and operator docs were incomplete.
    root_cause: Maintenance routing was not yet connected to the new evaluator.
    corrective_action: Register workflow surfaces and validate the full v2 contract.
    root_cause_classification: local
    evidence_refs:
      - fixture://retained-run-control
improvement_plan:
  - improvement: Keep lifecycle-postmortem registered in workflow and operator discovery surfaces.
    problem_addressed: Operators could miss the evaluator.
    type: Add validation/evidence.
    priority: high
    effort: low
    reversibility: high
    expected_benefit: Improves discoverability without changing evaluator authority.
    validation: Run lifecycle-postmortem workflow and runtime validator tests.
    evidence_refs:
      - fixture://retained-run-control
updated_lifecycle_recommendation:
  recommendation: Improve with targeted changes
  why_strongest: The evaluator model is sound and the fixture weakness is routing and validation coverage.
  preserve:
    - Non-authority boundary.
    - Retained evidence requirements.
