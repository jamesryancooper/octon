schema_version: "git-worktree-autonomy-contract-v2"
workflow_id: "octon-change-git-github-routing"
status: "active"
owner: "Octon governance"
purpose: >-
  Bind Git, worktree, branch, and GitHub mechanics to the canonical
  Change-first default work unit policy without making branches or Pull
  Requests the default work unit.
policy_refs:
  default_work_unit_policy_ref: ".octon/framework/product/contracts/default-work-unit.yml"
  change_closeout_state_machine_ref: ".octon/framework/product/contracts/change-closeout-state-machine.yml"
  change_receipt_schema_ref: ".octon/framework/product/contracts/change-receipt-v1.schema.json"
  worktree_wrapper_skill_ref: ".octon/framework/capabilities/runtime/skills/remediation/closeout-worktree/SKILL.md"
  pr_subflow_skill_ref: ".octon/framework/capabilities/runtime/skills/remediation/closeout-pr/SKILL.md"
environment:
  supported_operator_lanes:
    - "plain-git"
    - "plain-git-gh"
    - "helper-lane"
  host_apps_non_authoritative: true
operating_model:
  default_work_unit: "Change"
  internal_execution_bundle: "Change Package"
  route_selection_required_before_git_mutation: true
  route_ids:
    - "direct-main"
    - "branch-no-pr"
    - "branch-pr"
    - "stage-only-escalate"
  primary_integration_anchor: "one clean current main worktree or clone"
  stale_or_dirty_source_default: "select a route-owned clean worktree from current origin/main before reconstruction, staging, commit, push, landing, sync, cleanup, or branch deletion"
  include_path_classification_required_before_broad_stage_all: true
  branch_role: "isolation mechanism selected by Change route"
  branch_role_labels:
    source-dirty-anchor: "dirty or stale source branch used only as an anchor until residue is classified and dispositioned"
    route-owned-delivery-branch: "selected Change route branch that owns delivery, landing, cleanup, and sync evidence"
    correction: "post-primary correction branch with route-owned aggregate receipt evidence"
    cleanup: "branch used only for authorized cleanup or hygiene delivery"
    retained-protected: "local branch retained because protected name/status or equivalent blocker makes deletion unsafe"
    retired-stale: "local branch deleted only after current no-unique-commit proof, ownership blocker checks, authorization, verification, and rollback evidence"
  pr_role: "optional publication and review output selected by Change route"
  github_authority: "projection-only"
  route_requirements:
    direct-main:
      required:
        - "clean current main"
        - "no unrelated working tree changes"
        - "local validation at selected floor"
        - "landed commit on main"
        - "Change receipt"
        - "rollback handle"
        - "push to origin/main"
        - "post-push fetch and local main sync"
      forbidden:
        - "protected-branch mutation without admitted safety route"
        - "claiming completion with only an unstaged patch"
        - "bypassing required validation"
    branch-no-pr:
      required:
        - "branch or worktree identity"
        - "route-owned clean worktree and include-path classification when source posture is dirty or stale"
        - "explicit reason no PR is required"
        - "target lifecycle outcome"
        - "local validation or recorded blocker"
        - "commit, patch, or checkpoint durable enough to resume"
        - "lifecycle outcome"
        - "integration status"
        - "publication status"
        - "cleanup status"
        - "Change receipt or continuation receipt"
        - "rollback or discard plan"
        - "provider route-neutral ruleset evidence when claiming hosted landing"
        - "pushed source branch, exact source SHA checks, and origin/main equality when claiming hosted landing"
        - "safe branch cleanup completed or deferred after hosted landing"
        - "post-cleanup fetch and local main sync after hosted landing"
      forbidden:
        - "opening a PR only because a branch exists"
        - "claiming PR-backed publication"
        - "claiming landed from patch, checkpoint, or branch-local commit evidence alone"
        - "claiming hosted landing from a pushed-only branch"
        - "claiming hosted landing while provider ruleset requires PR"
        - "claiming pushed-branch handoff as completed closeout"
        - "downgrading landed or cleaned target without landing evaluation and blocker reason"
        - "claiming full closeout while branch cleanup is pending"
        - "PR URL, PR number, or PR metadata"
    branch-pr:
      required:
        - "branch identity"
        - "route-owned clean worktree and include-path classification when source posture is dirty or stale"
        - "PR URL or number"
        - "PR body references Change intent, validation, risk, and rollback"
        - "hosted checks required by the selected lane"
        - "review or solo-maintainer exception evidence when policy requires it"
        - "Change receipt that treats PR metadata as output"
        - "lifecycle outcome distinguishing published, ready, landed, and cleaned"
        - "safe branch cleanup completed or deferred after merge"
        - "post-cleanup fetch and local main sync after merge"
      final_merge_authority:
        system: "GitHub"
        requirements:
          - "rulesets"
          - "required_checks"
          - "reviewer_or_maintainer_confirmation_or_documented_solo_maintainer_exception"
    stage-only-escalate:
      required:
        - "preserved patch, checkpoint, or branch state"
        - "blocker reason"
        - "missing decision, validation, rollback, auth, review, or ownership item"
        - "next route condition"
closeout:
  owner_surface: "/closeout-change"
  worktree_wrapper: "/closeout-worktree"
  worktree_wrapper_rule: "decompose dirty worktree residue into singular closeout-change runs without replacing the Change default work unit"
  pr_backed_subflow: "/closeout-pr"
  state_machine: "change-closeout-state-machine-v1"
  trigger_terms:
    - "finish"
    - "ship"
    - "closeout"
  prompt_contexts:
    direct_main_eligible: "Validate, commit on main, write a Change receipt, and record rollback."
    branch_no_pr: "Preserve, commit, push, land, or clean up the branch without opening a PR only when lifecycle evidence supports the claimed outcome."
    branch_pr: "Invoke PR-backed publication/review mechanics through closeout-pr after Change routing selects branch-pr, and distinguish published, ready, landed, and cleaned outcomes."
    stage_only_escalate: "Preserve state and report blockers without claiming completion."
  suppressions:
    - "active_implementation_continues"
    - "user_reports_work_in_progress"
    - "blocked_by_red_required_checks"
    - "blocked_by_unaddressed_author_action_items"
    - "blocked_waiting_on_reviewer_confirmation"
    - "blocked_waiting_on_solo_maintainer_exception_evidence"
  post_landing_cleanup:
    applies_to_routes:
      - "branch-no-pr"
      - "branch-pr"
    required_before_completed_closeout:
      - "origin/main contains landed commit or merge ref"
      - "required post-landing checks and closeout evidence are complete"
      - "obsolete local and remote source branches are safely deleted or cleanup is explicitly deferred"
      - "protected, active, unmerged, open-PR, and unretained-rollback branches are not deleted"
      - "stale local branches with no unique commits are retired only after upstream, local remote-ref, PR, protected, worktree, dirty-residue, authorization, verification, and rollback proof"
      - "cleanup reports label every retained or retired local branch as source-dirty-anchor, route-owned-delivery-branch, correction, cleanup, retained-protected, or retired-stale"
      - "origin is fetched after cleanup"
      - "local main is fast-forwarded to origin/main"
      - "local main, origin/main, and landed_ref are aligned"
    direct_main_requirement: "fetch origin after push and post-push checks, sync local main to origin/main, and verify local main, origin/main, and landed_ref are aligned"
  residue_classification:
    read_only: true
    detection_is_deletion_authority: false
    classes:
      - "staged"
      - "unstaged-tracked"
      - "untracked"
      - "ignored"
      - "local-branch"
      - "remote-branch"
      - "generated-effective-output"
      - "host-projection"
      - "retained-evidence"
      - "state-control"
      - "release-version"
      - "input-surface"
      - "local-branch-retirement"
    cleanup_requires:
      - "origin-main-containment"
      - "patch-equivalence"
      - "tracked-replacement"
      - "explicit-ignored-local-residue"
      - "validator-proof"
      - "branch-retirement-authorization"
      - "post-delete-verification"
helpers:
  git_wt_new:
    route_guard: "branch-no-pr or branch-pr only"
    posture: "branch-isolation helper"
  git_pr_open:
    route_guard: "branch-pr only"
    posture: "PR-backed publication helper"
    draft_only: true
    later_updates: "push follow-up commits to the same branch"
  git_pr_ship:
    route_guard: "branch-pr only"
    default_mode: "status"
    explicit_request_flags:
      - "--request-ready"
      - "--request-automerge"
    request_only: true
  git_pr_cleanup:
    route_guard: "PR-backed cleanup unless branch-only cleanup is explicitly selected"
  git_branch_commit:
    route_guard: "branch-no-pr or branch-pr only"
    posture: "branch-local commit helper"
    preflight:
      - "git-branch-mutation-preflight.sh --require-clean-route-classification before commit when source posture may be dirty or stale"
      - "include-path classification is required before reconstruction, broad stage-all, staging, or commit"
  git_branch_push:
    route_guard: "branch-no-pr or branch-pr only"
    posture: "branch publication or backup helper without opening a PR"
    preflight:
      - "git-branch-mutation-preflight.sh records Git write access, source posture, clean-worktree route selection, and include-path classification"
  git_required_checks_at_ref:
    route_guard: "branch-no-pr or branch-pr"
    posture: "exact-SHA hosted check evidence helper"
  git_branch_hosted_preflight:
    route_guard: "branch-no-pr only"
    posture: "hosted no-PR landing preflight helper"
  git_branch_authorize_hosted_no_pr:
    route_guard: "branch-no-pr only"
    posture: "governed hosted no-PR landing authorization helper"
  git_branch_land:
    route_guard: "branch-no-pr only"
    posture: "local no-PR branch landing helper"
  git_branch_land_hosted_no_pr:
    route_guard: "branch-no-pr only"
    posture: "fast-forward-only hosted no-PR landing helper requiring governed authorization"
  git_branch_authorize_cleanup:
    route_guard: "branch-no-pr or branch-pr only"
    posture: "governed branch cleanup authorization helper"
    safety:
      - "performs no cleanup mutation"
      - "requires source branch changes integrated into origin/main"
      - "requires local main synchronized to origin/main"
      - "requires landed ref containment in local main and origin/main"
      - "requires no protected source branch and no open PR"
      - "requires retained rollback posture"
      - "requires no unique commits and no unresolved upstream, local remote-ref, PR, protected, active-worktree, or dirty-residue blocker before stale local branch retirement"
  git_branch_cleanup:
    route_guard: "branch-no-pr or branch-pr only"
    posture: "branch and worktree cleanup helper requiring governed branch-cleanup authorization"
    safety:
      - "refuses protected branch names"
      - "requires retained rollback posture for mutating cleanup"
      - "requires branch-cleanup-authorization-v1 before mutating cleanup"
      - "requires origin/main containment before deleting local or remote refs"
      - "blocks cleanup when no-open-PR proof cannot be completed or an open PR exists"
      - "requires branch-retirement authorization and post-delete verification before reporting any local branch as retired-stale"
      - "refuses remote branch deletion for stale-retirement unless a separate current remote-mutation receipt authorizes the exact ref"
      - "syncs local main to origin/main after cleanup unless explicitly skipped"
validation:
  drift_classes:
    - "PR, branch, GitHub, or Change Package described as product default work unit"
    - "branch helper invoked before Change route selection"
    - "PR helper invoked for direct-main or branch-no-pr route"
    - "closeout-pr discoverable as the route-neutral default"
    - "Change receipt missing for completed route"
    - "direct-main route lacking validation or rollback evidence"
    - "checkpoint, patch, or branch-local commit reported as landed"
    - "branch-no-pr receipt containing PR metadata"
    - "branch-no-pr hosted landing claim without provider route-neutral ruleset evidence"
    - "branch-no-pr hosted landing claim without exact source SHA checks"
    - "branch-no-pr hosted landing mutation without governed landing authorization"
    - "branch cleanup mutation without governed branch cleanup authorization"
    - "branch-no-pr hosted landing claim without origin/main equality"
    - "published-branch reported as completed closeout"
    - "target landed or cleaned outcome missing landing evaluation or blocker reason"
    - "stale remote branch ref recorded as current branch publication evidence"
    - "branch-pr draft/open/ready state reported as full closeout"
    - "cleanup claim lacking local, remote, or worktree cleanup evidence or deferred-cleanup record"
    - "landed branch closeout reported complete while branch cleanup is pending"
    - "post-landing closeout reported complete without local main synced to origin/main"
    - "branch cleanup deletes protected, active, unmerged, open-PR, or unretained-rollback branches"
    - "branch cleanup reports retired-stale without current no-unique-commit proof, blocker checks, authorization, post-delete verification, and rollback notes"
    - "dirty checked-out stale branch is deleted before local-worktree retirement records residue disposition and safe switch evidence"
    - "remote stale branch deletion is performed from local branch-retirement evidence without a separate current receipt"
    - "dirty or stale source branch proceeds without route-owned clean worktree selection"
    - "broad stage-all, reconstruction, staging, or commit occurs without include-path classification"
  scenario_lanes:
    - "direct-main"
    - "branch-no-pr"
    - "branch-pr"
    - "stage-only-escalate"
remediation:
  allowed_git_subset:
    - "git status"
    - "git diff"
    - "git add"
    - "git commit"
    - "git push"
  forbidden_operations:
    - "git commit --amend"
    - "git rebase"
    - "git push --force"
    - "git push --force-with-lease"
    - "unauthorized programmatic review-thread resolution"
    - "merge main into branch as remediation shortcut"
pr_backed_review_policy:
  autonomous_draft_completion:
    status: "allowed"
    route_guard: "branch-pr only"
    scope: "draft-to-ready transition plus protected-main merge request"
    allowed_transitions:
      - "mark_draft_pr_ready_for_review"
      - "request_or_execute_protected_main_merge"
    high_impact_posture:
      classification: "risk:high"
      autonomy_model: "elevated-autonomy"
      manual_default: false
      required_extra_evidence:
        - "explicit_diff_self_review"
        - "policy_impact_self_review"
        - "rollback_path_self_review"
        - "post_merge_origin_main_verification"
      escalation_rule: "escalate only for concrete unresolved blockers; high-impact alone is not a blocker"
    eligibility:
      - "PR is open and draft"
      - "PR belongs to the autonomous branch-pr lane"
      - "high-impact PRs include explicit self-review of diff, policy impact, evidence, and rollback path"
      - "all required GitHub checks are passing"
      - "AI Review Gate / decision is passing when required"
      - "PR Quality Standards is passing"
      - "Validate branch naming is passing"
      - "PR Clean State Enforcer is passing"
      - "Validate autonomy policy is passing"
      - "no unresolved author-action review threads remain"
      - "no blocking labels remain"
      - "no requested changes remain"
      - "no merge conflicts remain"
      - "no stale head state remains"
      - "Change receipt or PR closeout evidence is present"
      - "current live GitHub rulesets allow the merge path"
    merge_determination:
      - "repo-local autonomy policy returns granted for the PR"
      - "GitHub reports the PR mergeable under the current protected-main rules"
      - "the merge request uses the currently valid protected-main route"
      - "GitHub required checks and rulesets remain authoritative at merge time"
    protected_main_bypass_allowed: false
    forbidden_uses:
      - "mark ready when any eligibility item is missing"
      - "request auto-merge for manual-lane PRs"
      - "merge by pushing directly to protected main"
      - "treat labels, comments, or helper output as authority"
      - "bypass required checks, rulesets, review policy, or GitHub mergeability"
    escalation_requires:
      - "exact blocker"
      - "evidence gathered"
      - "remediation attempted"
      - "smallest human decision needed"
  reviewer_owned_thread_resolution:
    default: "reviewer-or-maintainer"
    solo_maintainer_exception:
      status: "allowed"
      actor_requirement: "author is also repository owner or maintainer"
      scope: "review-thread resolution only"
      required_sequence:
        - "fix"
        - "commit"
        - "push"
        - "reply"
        - "required_checks_green"
        - "maintainer_override_evidence"
      forbidden_uses:
        - "substitute for required review approval"
        - "resolve unresolved human objection without explicit maintainer override"
        - "bypass required checks, rulesets, or GitHub mergeability"
