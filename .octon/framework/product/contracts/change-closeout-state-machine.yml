schema_version: "change-closeout-state-machine-v1"
state_machine_id: "change-closeout-state-machine"
version: "1.1.0"
status: "active"
owner: "Octon governance"
default_work_unit: "change"
purpose: >-
  Bind SI-00 Change closeout classification, preservation, validation,
  evidence, rollback posture, and stable effect denial without widening route
  or provider authority.
policy_refs:
  default_work_unit_policy_ref: ".octon/framework/product/contracts/default-work-unit.yml"
  receipt_schema_ref: ".octon/framework/product/contracts/change-receipt-v1.schema.json"
  branch_cleanup_authorization_schema_ref: ".octon/framework/product/contracts/branch-cleanup-authorization-v1.schema.json"
  closeout_workflow_ref: ".octon/framework/orchestration/runtime/workflows/meta/closeout/workflow.yml"
  closeout_change_skill_ref: ".octon/framework/capabilities/runtime/skills/remediation/closeout-change/SKILL.md"
  closeout_worktree_wrapper_ref: ".octon/framework/capabilities/runtime/skills/remediation/closeout-worktree/SKILL.md"
  closeout_pr_subflow_ref: ".octon/framework/capabilities/runtime/skills/remediation/closeout-pr/SKILL.md"
  git_worktree_autonomy_ref: ".octon/framework/execution-roles/practices/standards/git-worktree-autonomy-contract.yml"
relationship_to_default_work_unit:
  route_authority: ".octon/framework/product/contracts/default-work-unit.yml"
  posture: "operationalizes SI-00 preservation and denial semantics"
  dirty_worktree_wrapper:
    canonical_name: "Closeout Worktree"
    default_work_unit_replacement: false
    posture: "read-only partitioning and preservation wrapper"
    forbidden_effects: [stage, commit, push, open-pr, land, merge, delete, prune, remove-worktree, sync-main]
  forbidden_competing_routes:
    - "direct-main"
    - "branch-land-no-pr"
    - "Closeout Changes"
routes:
  - "branch-no-pr"
  - "branch-pr"
  - "stage-only-escalate"
containment:
  state: "SI-00"
  direct_main_admission: "denied"
  branch_no_pr_landing: "denied"
  cleanup_effects: "denied"
  publication_denial_reason: "RP00_CONTAINMENT_PUBLICATION_DISABLED"
  cleanup_denial_reason: "RP00_CONTAINMENT_CLEANUP_DISABLED"
  historical_receipt_parsing: "evidence-only"
lifecycle_outcomes:
  - "preserved"
  - "branch-local-complete"
  - "published-branch"
  - "published"
  - "ready"
  - "landed"
  - "deferred"
  - "blocked"
  - "escalated"
  - "denied"
separation_rules:
  selected_route: "Chosen active SI-00 classification route."
  target_lifecycle_outcome: "Requested or intended lifecycle target."
  lifecycle_outcome: "Actual evidence-backed outcome."
  rule: >-
    A route, checkpoint, branch commit, push, PR, generated projection, or
    historical receipt never proves landing, cleanup, sync, or publication.
target_lifecycle_defaults:
  unspecified_closeout_request: "preserved"
  rule: >-
    A generic closeout request preserves exact candidate state and stops before
    landing, cleanup, sync, or provider mutation.
  explicit_targets:
    - "preserved"
    - "branch-local-complete"
    - "published-branch"
    - "published"
    - "ready"
    - "blocked"
    - "escalated"
phases:
  - phase_id: "read-in-and-constraints"
    mode: "single-pass"
    route_applicability: ["branch-no-pr", "branch-pr", "stage-only-escalate"]
    exit_evidence: ["SI-00 contracts and authority boundaries bound"]
    stop_or_escalation_conditions: ["governing source missing", "route conflict"]
  - phase_id: "inventory"
    mode: "loop"
    route_applicability: ["branch-no-pr", "branch-pr", "stage-only-escalate"]
    exit_evidence: ["branch, refs, worktrees, staged, unstaged, and untracked state captured read-only"]
    stop_or_escalation_conditions: ["repository state cannot be inspected safely"]
  - phase_id: "residue-classification"
    mode: "loop"
    route_applicability: ["branch-no-pr", "branch-pr", "stage-only-escalate"]
    exit_evidence: ["every candidate and unrelated item has one preservation disposition"]
    stop_or_escalation_conditions: ["ownership ambiguous", "user work would be overwritten"]
  - phase_id: "route-and-target-resolution"
    mode: "loop"
    route_applicability: ["branch-no-pr", "branch-pr", "stage-only-escalate"]
    exit_evidence: ["one active route and target preserved or explicit narrower target recorded"]
    stop_or_escalation_conditions: ["direct-main requested", "effect authority requested"]
  - phase_id: "validation"
    mode: "loop"
    route_applicability: ["branch-no-pr", "branch-pr"]
    exit_evidence: ["non-mutating validation passes or blocker evidence is recorded"]
    stop_or_escalation_conditions: ["validation requires an out-of-scope effect"]
  - phase_id: "effect-denial"
    mode: "single-pass"
    route_applicability: ["branch-no-pr", "branch-pr", "stage-only-escalate"]
    exit_evidence: ["requested landing/publication or cleanup effect denied before mutation"]
    stop_or_escalation_conditions: []
  - phase_id: "receipt-and-final-report"
    mode: "single-pass"
    route_applicability: ["branch-no-pr", "branch-pr", "stage-only-escalate"]
    exit_evidence: ["exact candidate, rollback, denial, blockers, and next owner reported"]
    stop_or_escalation_conditions: []
evidence_gates:
  preserved:
    required: ["exact candidate state", "rollback or discard plan", "unrelated work preserved"]
  landed:
    observation_only: true
    required:
      - "landing independently established outside closeout"
      - "exact landed ref observed read-only"
      - "cleanup_status deferred"
      - "RP00_CONTAINMENT_CLEANUP_DISABLED"
      - "rollback handle"
  blocked:
    required: ["preserved state", "exact missing condition"]
  escalated:
    required: ["preserved state", "specific authority or decision owner"]
forbidden_actions:
  - "select direct-main"
  - "authorize or perform local or hosted no-PR landing"
  - "remove a worktree"
  - "delete or prune a local or remote ref"
  - "authorize cleanup"
  - "sync main as a closeout effect"
  - "claim cleaned, synced, or autonomous publication success"
non_authority_boundaries:
  - ".octon/inputs/**"
  - "proposal-local files"
  - "generated outputs"
  - "host or provider state"
  - "chat or model memory"
  - "tool availability"
