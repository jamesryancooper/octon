schema_version: "octon-default-work-unit-policy-v1"
policy_id: "default-work-unit"
owner: "Octon governance"
status: "active"
default_work_unit: "change"
internal_execution_bundle: "change-package"
run_authority_unit: "run-contract"
closeout_evidence_boundaries:
  local_private_raw_evidence: >-
    Raw cleanup logs and sensitive local path details under
    .octon/state/evidence/local/** are local debugging material, not runtime
    policy, retained publishable evidence, hosted/shared closeout proof, or
    closeout truth.
  publishable_closeout_evidence: >-
    Hosted or shared closeout claims require concise
    publishable_evidence_receipt_refs under .octon/state/evidence/runs/skills/**
    and may cite local-private raw evidence only through digest-backed
    local_evidence_refs inside those receipts.
  branch_no_pr_cleaned_rule: >-
    Hosted branch-no-pr cleaned claims must not require or publish
    local-private raw evidence; they require stateful_closeout plus publishable
    receipt refs when cleanup evidence is hosted or shared.
  terminal_current_state_proof: >-
    Cleaned claims for proposal-program or multi-branch correction closeout
    must retain lifecycle-terminal-current-state-proof-v1 evidence after the
    last landing, cleanup, generated publication, proposal artifact, and
    residue-classification mutation. The proof is evidence-only.
  terminal_local_evidence_sink: >-
    Final post-mutation terminal proof snapshots may be retained under
    .octon/state/evidence/local/terminal-closeout/<change-id>/ only as
    digest-backed local/operator evidence. The sink is ignored by git and is
    never hosted/shared closeout proof, landing authorization, cleanup
    authorization, hosted check evidence, packet evidence, archive evidence,
    generated publication freshness evidence, mutation authority, or policy
    authority. A Change receipt may cite a sink proof only through
    terminal_current_state_proof_ref plus terminal_current_state_proof_digest
    and only when live ref validation still proves HEAD, local main,
    origin/main, and landed_ref alignment.
  correction_branch_aggregate_receipt: >-
    Branch-no-pr closeout runs that require post-primary correction branches
    must retain lifecycle-correction-branch-aggregate-receipt-v1 evidence so
    the final lifecycle history is self-contained. The aggregate receipt is
    evidence-only and never authorizes landing, cleanup, closeout, archive, or
    publication.
worktree_wrapper:
  id: "closeout-worktree"
  display_name: "Closeout Worktree"
  skill_ref: ".octon/framework/capabilities/runtime/skills/remediation/closeout-worktree/SKILL.md"
  purpose: "Decompose a dirty worktree into singular Change closeout candidates and orchestrate each safely separable candidate through closeout-change."
  default_work_unit_replacement: false
  terminal_states:
    git_clean_terminal: "No non-ignored staged, unstaged, untracked, retained-evidence, generated-effective, host-projection, state-control, release-version, or input-surface residue remains; ignored local residue may remain only with foreign or retained evidence."
    disposition_complete_with_retained_residue: "Every candidate is closed, retained, or foreign with authority-backed evidence, but Git-clean worktree state is not claimed."
    nonterminal: "Blocked, deferred, escalated, ambiguous, or unresolved delegated residue remains."
proposal_program_delivery_handoff:
  caller_role: "aggregate delivery coordinator only"
  accepted_inputs:
    - "include_paths"
    - "exclude_paths"
    - "route_hints"
    - "target_lifecycle_outcome"
    - "validation_floor"
    - "rollback_posture"
    - "profile_constraints"
    - "source_receipt_refs_and_digests"
    - "readiness_receipt_ref_and_digest"
    - "blocker_context"
  route_owner_boundaries:
    child_receipts: "child packet lifecycle routes"
    archive: "proposal packet closeout and proposal archive lifecycle"
    generated_publication: "owning generator or publisher"
    repo_hygiene_cleanup: "repo-hygiene-cleanup receipt-backed helper route"
    change_closeout: "closeout-change"
    dirty_worktree_partitioning: "closeout-worktree"
    branch_cleanup_final_sync_terminal_proof: "closeout-change and terminal proof validators"
  no_substitution_rule: >-
    Proposal-program delivery receipts, readiness projections, parent summaries,
    compact evidence indexes, runner handoff refs, generated outputs, host
    state, chat, model memory, and tool state may cite target-owned evidence by
    ref and digest only. They never satisfy child receipt, archive,
    generated-publication, cleanup, Change, branch cleanup, final sync,
    terminal proof, landed, synced, or cleaned gates.
  downgrade_rule: >-
    When closeout-change, closeout-worktree, archive, cleanup, generated
    publication, final sync, or terminal proof evidence is missing, stale,
    failing, or outside the selected route authority, delivery reports the
    highest evidence-backed outcome with a stop condition and next owning route.
closeout_defaults:
  target_lifecycle_outcome:
    unspecified_closeout_request: "cleaned"
    resolution_rule: >-
      When the operator asks to close out a Change or worktree without naming a
      narrower lifecycle target, resolve target_lifecycle_outcome to cleaned.
      For closeout-worktree, this targets git_clean_terminal when policy allows;
      singular closeout-change cleaned remains route-bound.
    explicit_narrower_lifecycle_outcomes:
      - "published-branch"
      - "branch-local-complete"
      - "landed"
      - "preserved"
      - "blocked"
    explicit_narrower_route_requests:
      - "stage-only-escalate"
    actual_outcome_rule: >-
      lifecycle_outcome remains evidence-based. If cleaned cannot be proven,
      downgrade to the highest supported route-compatible outcome and record the
      missing proof, blocker, structured stop reason, or next-route condition.
routine_closeout_autonomy:
  generic_closeout_target: "cleaned"
  operator_prompt_rule: >-
    Ask only for real ambiguity, unsafe destructive action, missing authority,
    unclear ownership, protected branches, unresolved validation, policy
    conflicts, or cleanup outside an authorized route.
  unambiguous_dirty_worktree_rule: >-
    A dirty worktree with separable path groups, branch identities, receipt
    references, validation floors, and rollback posture may be partitioned and
    routed through repeated singular closeout-change candidates without asking
    the operator to choose each partition.
  post_closeout_evidence_residue_rule: >-
    When generic worktree closeout targets cleaned and re-inventory finds only
    safely separable closeout evidence residue under retained evidence roots,
    closeout-worktree should create the next candidate and delegate it through
    singular closeout-change instead of asking for another operator cleanup
    instruction. If the wrapper cannot avoid leaving fresh repo-local evidence
    residue after the final delegated candidate, it must report
    disposition_complete_with_retained_residue rather than git_clean_terminal.
    Final recursive terminal proof snapshots should be written to
    .octon/state/evidence/local/terminal-closeout/<change-id>/ through the
    terminal local evidence helper so they remain ignored local-private
    retained evidence instead of publishable closeout residue.
  branch_no_pr_default_progression:
    when_selected_and_target_is_cleaned:
      - "create_or_select_task_branch_for_the_singular_candidate_when_branch_identity_is_absent_and_branch_isolation_is_required"
      - "stage_only_the_candidate_include_paths_and_preserve_exclude_paths"
      - "commit_candidate_scope_with_change_receipt_or_continuation_receipt"
      - "push_source_branch_to_origin"
      - "run_hosted_no_pr_preflight_and_exact_sha_checks"
      - "emit_or_reference_governed_landing_authorization"
      - "land_hosted_main_when_provider_rules_and_authorization_validate"
      - "emit_or_reference_governed_branch_cleanup_authorization"
      - "clean_safe_local_and_remote_source_refs"
      - "fetch_origin_sync_local_main_and_verify_main_alignment"
      - "record_stateful_closeout_receipt"
    stop_before_prompting_when_any:
      - "candidate_boundary_overlap"
      - "unowned_or_user_owned_paths"
      - "protected_or_active_branch"
      - "unmerged_or_open_pr_branch"
      - "missing_validation_or_rollback_evidence"
      - "provider_requires_pr"
      - "authorization_missing_stale_denied_or_mismatched"
      - "runtime_sandbox_provider_or_host_approval_denies_mutation"
  residue_authority_routing:
    branch_refs: "governed branch cleanup authorization through closeout-change"
    eligible_local_octon_run_artifact_residue: "repo-hygiene-cleanup receipt-backed helper route"
    generated_run_health_projections: "generate-run-health-read-model.sh --all-runs generator/pruning evidence"
    stale_detached_git_worktrees: "git worktree cleanup policy with explicit safety proof: detached, clean, unreferenced, non-active, and not current"
    tracked_files: "retain or route through a singular Change; never repo-hygiene cleanup"
    proposal_inputs: "retain or archive through proposal lifecycle; never cleanup authority; completed proposal-program lifecycle closeout may publish lifecycle-owned input/archive moves as non-authoritative Change material when child authority is preserved"
    durable_evidence: "retain unless a higher policy supplies explicit retention/retirement authority"
    active_control_state: "retain or escalate"
    generated_authority: "regenerate through owning publisher; never generic cleanup; completed proposal-program lifecycle closeout may publish regenerated effective outputs with publication freshness evidence"
    completed_proposal_program_lifecycle_surfaces: "wrapper-safe direct-main candidate only when lifecycle-owned inputs, generated effective outputs, proposal registry artifacts, publication evidence, and tracked extension control state are separated from local execution run residue and prove child-authority preservation"
    ignored_or_user_owned_paths: "retain or escalate"
    ambiguous_residue: "retain or block with candidate-keyed evidence"
deprecated_terms:
  - term: "work-package"
    replacement: "change-package"
    compatibility_alias_allowed: false
routes:
  - route_id: "branch-pr"
    description: "PR-backed Change for a branch-pr predicate selected up front, or for an authority-backed route transition to branch-pr after new evidence. A blocked direct-main push or blocked hosted branch-no-pr landing is not itself a branch-pr predicate."
    precedence: 10
    selected_when_any:
      - "operator explicitly requests PR, or a documented requirement requires hosted review, preview publication, or external signoff"
      - "provider ruleset requires PR for a requested PR-backed landing"
      - "release automation requires PR"
      - "work starts from an existing PR, PR review thread, release PR, Dependabot PR, or GitHub merge lane"
      - "protected or high-impact work has governing evidence that specifically requires hosted review or remote validation"
    required_evidence:
      - "change_receipt"
      - "branch_identity"
      - "pr_url_or_number"
      - "hosted_checks_when_required"
      - "review_or_solo_maintainer_exception_when_required"
      - "publishable_evidence_receipt_refs_when_closeout_claim_leaves_local_machine"
      - "rollback_handle"
      - "branch_pr_predicate"
      - "branch_pr_predicate_evidence"
      - "route_transition_authority_when_selected_after_an_initial_different_route"
    required_validation:
      - "selected_validation_floor"
      - "hosted_required_checks_when_policy_requires"
    receipt_required_fields:
      - "change_id"
      - "selected_route"
      - "branch_pr_predicate"
      - "branch_pr_predicate_evidence"
      - "lifecycle_outcome"
      - "intent"
      - "scope"
      - "validation_evidence_refs"
      - "review_evidence_refs_or_waiver"
      - "durable_history"
      - "integration_status"
      - "publication_status"
      - "cleanup_status"
      - "rollback_handle"
      - "closeout_outcome"
  - route_id: "branch-no-pr"
    description: "Branch-isolated Change without PR-backed review or publication. The route may preserve state, complete on the branch, push the branch to origin for backup or handoff, fast-forward land on hosted main without a PR when branch isolation was selected and provider rules allow route-neutral updates, and clean up only when lifecycle evidence supports that outcome."
    precedence: 30
    selected_when_any:
      - "change needs isolation, pause/resume, multiple commits, uncertain scope, or handoff, and no PR-required predicate applies"
      - "change needs branch identity but not hosted review or publication, and no PR-required predicate applies"
      - "operator wants branch-isolated work landed without PR and no PR-required predicate applies"
      - "hosted no-PR landing is intended after branch isolation is selected, no PR-required predicate applies, and provider route-neutral capability can be proven"
    required_evidence:
      - "change_receipt_or_continuation_receipt"
      - "branch_or_worktree_identity"
      - "reason_no_pr_required"
      - "target_lifecycle_outcome"
      - "local_validation_or_recorded_blocker"
      - "durable_commit_patch_or_checkpoint"
      - "origin_push_evidence_for_closeout"
      - "governed_landing_authorization_receipt_when_landed"
      - "governed_branch_cleanup_authorization_receipt_when_cleanup_mutates_refs"
      - "hosted_landing_evidence_when_landed"
      - "terminal_current_state_proof_ref_when_claiming_cleaned"
      - "correction_branch_aggregate_receipt_ref_when_post_primary_corrections_exist"
      - "publishable_evidence_receipt_refs_when_closeout_claim_leaves_local_machine"
      - "lifecycle_outcome"
      - "integration_status"
      - "publication_status"
      - "cleanup_status"
      - "rollback_or_discard_plan"
    required_validation:
      - "local_validation_at_selected_floor_or_blocker"
      - "exact_sha_route_neutral_validation_when_hosted_landing"
    forbidden_evidence:
      - "pr_url_or_number"
      - "pr_metadata"
      - "host_projection_claims_authority"
      - "hosted_landed_claim_without_origin_main_equality"
      - "local_private_raw_evidence_refs_as_hosted_or_shared_closeout_proof"
  - route_id: "direct-main"
    description: "Low-risk solo Change landed directly on current clean main and pushed to origin during closeout unless explicitly blocked or explicitly local-only."
    precedence: 20
    selected_when_all:
      - "current branch is main"
      - "main is clean and current"
      - "no unrelated working tree changes"
      - "change is low risk and locally understandable"
      - "validation can run locally at the selected floor"
      - "rollback is straightforward from the resulting commit"
      - "no policy, repository protection, documented review/signoff need, or operator instruction requires branch or PR"
    required_evidence:
      - "change_receipt"
      - "landed_commit"
      - "local_validation_evidence"
      - "origin_push_evidence"
      - "rollback_handle"
    required_validation:
      - "local_validation_at_selected_floor"
      - "origin_main_contains_landed_ref_after_push"
      - "exact_sha_route_neutral_validation_when_hosted_publication_claimed"
  - route_id: "stage-only-escalate"
    description: "Blocked or ambiguous Change that preserves state without claiming completion."
    precedence: 40
    selected_when_any:
      - "risk, validation, rollback, freshness, ownership, authority, or support posture is ambiguous"
      - "required decision, validation, rollback, auth, or review item is missing"
      - "higher policy returns stage-only or escalation instead of completion"
    required_evidence:
      - "preserved_patch_checkpoint_or_branch_state"
      - "blocker_reason"
      - "missing_item"
      - "next_route_condition"
    forbidden_claims:
      - "landed"
      - "complete"
      - "publication_ready"
route_selection_order:
  - "resolve_or_create_change_identity"
  - "fail_closed_conditions"
  - "branch-pr when a PR-required predicate applies"
  - "direct-main"
  - "branch-no-pr"
  - "stage-only-escalate"
solo_route_selection:
  rule: "Choose the fastest safe route that satisfies evidence, validation, rollback, cleanup, and protected-main controls."
  direct_main_first_when_all:
    - "clean_current_main"
    - "solo_low_risk_change"
    - "local_validation_sufficient"
    - "straightforward_commit_rollback"
    - "change_receipt_can_be_recorded"
    - "no_branch_or_pr_required_predicate"
  branch_no_pr_when:
    - "branch_isolation_needed"
    - "no_pr_required_predicate_applies"
    - "direct_main_predicates_not_all_satisfied"
  provider_route_neutral_capability: "hosted branch-no-pr landing precondition, not an independent reason to choose branch-no-pr"
  high_impact_rule: "high-impact increases caution and evidence requirements but does not by itself force branch-pr"
  branch_no_pr_preference_rule: "when direct-main is ineligible and no concrete PR predicate is proven with evidence, prefer branch-no-pr for branch-isolated work"
route_lifecycle_outcomes:
  direct-main:
    allowed_outcomes:
      - "landed"
      - "cleaned"
    full_closeout_requires:
      - "landed_commit_on_main"
      - "local_validation_evidence"
      - "route_neutral_exact_sha_check_evidence_when_hosted_publication_claimed"
      - "origin_main_contains_landed_ref_after_push"
      - "fetch_origin_after_post_push_checks"
      - "local_main_equals_origin_main_after_fetch"
      - "local_main_contains_landed_ref_after_fetch"
      - "change_receipt"
      - "stateful_closeout_evidence"
      - "rollback_handle"
      - "cleanup_status"
  branch-no-pr:
    allowed_outcomes:
      - "preserved"
      - "branch-local-complete"
      - "published-branch"
      - "landed"
      - "cleaned"
      - "deferred"
      - "blocked"
      - "escalated"
      - "denied"
    preserved_requires:
      - "patch_checkpoint_or_branch_state"
      - "continuation_or_blocker_reason"
      - "rollback_or_discard_plan"
    branch_local_complete_requires:
      - "intended_scope_committed_on_branch"
      - "target_lifecycle_outcome"
      - "local_validation_evidence"
      - "change_receipt"
      - "origin_branch_contains_change_ref_or_explicit_local_only_blocker"
      - "rollback_or_discard_plan"
    published_branch_requires:
      - "branch_commit_or_checkpoint"
      - "remote_branch_ref"
      - "no_pr_rationale"
      - "target_lifecycle_outcome"
      - "closeout_outcome_continued_or_blocked"
      - "local_validation_or_recorded_blocker"
      - "not_landed_reason_when_target_was_landed_or_cleaned"
      - "rollback_or_discard_plan"
    landed_requires:
      - "intended_scope_committed_on_branch"
      - "target_lifecycle_outcome"
      - "landing_evaluation"
      - "local_validation_evidence"
      - "provider_ruleset_allows_route_neutral_fast_forward_update"
      - "source_branch_pushed_to_remote"
      - "source_ref_current_with_origin_main"
      - "governed_landing_authorization_receipt"
      - "landing_authorization_matches_source_ref_and_origin_main_pre_ref"
      - "empty_hosted_check_set_retained_rationale_when_allowed"
      - "source_branch_changes_integrated_into_origin_main"
      - "exact_source_sha_required_checks_passed"
      - "integration_method"
      - "target_branch_ref"
      - "landed_ref"
      - "hosted_landing_evidence"
      - "publishable_evidence_receipt_refs_when_closeout_claim_leaves_local_machine"
      - "origin_main_equals_landed_ref_after_push"
      - "required_post_landing_checks_and_closeout_evidence_complete"
      - "safe_branch_cleanup_completed_or_deferred_after_origin_main_contains_landed_ref"
      - "post_landing_fetch_origin_completed"
      - "local_main_synced_to_origin_main_after_cleanup"
      - "origin_main_contains_landed_ref_after_fetch"
      - "local_main_contains_landed_ref_after_sync"
      - "local_main_origin_main_landed_ref_alignment_verified"
      - "main_alignment_receipt"
      - "stateful_closeout_evidence"
      - "rollback_handle"
      - "cleanup_status"
    cleaned_requires:
      - "landed_ref_or_explicit_non_landing_outcome"
      - "not_cleaned_reason_when_target_cleaned_but_actual_outcome_is_not_cleaned"
      - "cleanup_stop_reason_when_target_cleaned_but_actual_outcome_is_not_cleaned"
      - "governed_branch_cleanup_authorization_receipt_when_cleanup_mutates_refs"
      - "local_branch_cleanup_completed_or_not_applicable"
      - "worktree_cleanup_completed_or_not_applicable"
      - "remote_branch_cleanup_completed_or_not_applicable_when_remote_branch_existed"
      - "branch_cleanup_skips_protected_active_unmerged_open_pr_or_unretained_rollback_refs"
      - "local_main_synced_to_origin_main_after_cleanup"
      - "stateful_closeout_evidence"
      - "publishable_evidence_receipt_refs_when_cleanup_evidence_is_hosted_or_shared"
      - "digest_backed_terminal_current_state_proof_ref_when_local_terminal_sink_is_used"
  branch-pr:
    allowed_outcomes:
      - "preserved"
      - "published"
      - "ready"
      - "landed"
      - "cleaned"
      - "deferred"
      - "blocked"
      - "escalated"
      - "denied"
    published_requires:
      - "branch_pushed"
      - "pr_url_or_number"
      - "change_receipt"
    ready_requires:
      - "pr_url_or_number"
      - "high_impact_diff_policy_evidence_rollback_self_review_when_applicable"
      - "hosted_required_checks_green_or_blocker"
      - "AI Review Gate / decision passing when required"
      - "PR Quality Standards passing"
      - "Validate branch naming passing"
      - "PR Clean State Enforcer passing"
      - "Validate autonomy policy passing"
      - "review_evidence_or_solo_maintainer_exception_when_required"
      - "no_unresolved_author_action_items"
      - "no_blocking_labels"
      - "no_requested_changes"
      - "no_merge_conflicts"
      - "no_stale_head_state"
      - "Change receipt or PR closeout evidence"
    landed_requires:
      - "pr_merged"
      - "merge_ref_or_landed_ref"
      - "source_branch_changes_integrated_into_origin_main"
      - "origin_main_contains_merged_result"
      - "publishable_evidence_receipt_refs_when_closeout_claim_leaves_local_machine"
      - "required_post_landing_checks_and_closeout_evidence_complete"
      - "safe_branch_cleanup_completed_or_deferred_after_origin_main_contains_merged_result"
      - "post_landing_fetch_origin_completed"
      - "local_main_synced_to_origin_main_after_cleanup"
      - "origin_main_contains_landed_ref_after_fetch"
      - "local_main_contains_landed_ref_after_sync"
      - "local_main_origin_main_landed_ref_alignment_verified"
      - "stateful_closeout_evidence"
      - "rollback_handle"
    cleaned_requires:
      - "pr_merged_or_external_blocker"
      - "governed_branch_cleanup_authorization_receipt_when_cleanup_mutates_refs"
      - "local_branch_cleanup_completed_or_not_applicable"
      - "worktree_cleanup_completed_or_not_applicable"
      - "remote_branch_cleanup_completed_or_not_applicable"
      - "branch_cleanup_skips_protected_active_unmerged_open_pr_or_unretained_rollback_refs"
      - "local_main_synced_to_origin_main_after_cleanup"
      - "stateful_closeout_evidence"
      - "publishable_evidence_receipt_refs_when_cleanup_evidence_is_hosted_or_shared"
  stage-only-escalate:
    allowed_outcomes:
      - "preserved"
      - "deferred"
      - "blocked"
      - "escalated"
      - "denied"
pr_required_predicates:
  - "explicit_operator_pr_request"
  - "hosted_review_required"
  - "preview_publication_required"
  - "external_signoff_required"
  - "provider_ruleset_requires_pr"
  - "release_automation_requires_pr"
  - "existing_pr_or_review_thread_context"
  - "protected_or_high_impact_remote_review_required"
route_transition_authorities:
  - "explicit-operator-reroute"
  - "policy-reroute-after-new-evidence"
  - "none"
branch_pr_predicates:
  - "explicit-operator-pr-request"
  - "existing-pr-context"
  - "release-automation"
  - "preview-publication-required"
  - "hosted-review-required"
  - "external-signoff-required"
  - "protected-or-high-impact-remote-review-required"
  - "provider-ruleset-requires-pr-for-requested-pr-backed-landing"
branch_pr_predicate_evidence_requirements:
  common:
    - "predicate_matches_branch_pr_predicate"
    - "requirement_ref"
    - "evidence_refs"
    - "branch_no_pr_rejection_reason"
  explicit-operator-pr-request:
    - "operator_request_ref"
  existing-pr-context:
    - "existing_pr_or_review_ref"
  release-automation:
    - "requirement_ref_cites_release_or_automation_requirement"
  preview-publication-required:
    - "requirement_ref_cites_preview_publication_requirement"
  hosted-review-required:
    - "requirement_ref_cites_hosted_review_requirement"
  external-signoff-required:
    - "requirement_ref_cites_external_signoff_requirement"
  protected-or-high-impact-remote-review-required:
    - "scope_classification_ref"
    - "governing_review_requirement_ref"
    - "high_impact_or_protected_scope_alone_is_not_sufficient"
  provider-ruleset-requires-pr-for-requested-pr-backed-landing:
    - "provider_ruleset_ref"
    - "provider_ruleset_proves_pr_backed_landing_required"
branch_required_predicates:
  - "route_is_branch-pr"
  - "route_is_branch-no-pr"
  - "isolation_required"
  - "pause_or_handoff_required"
  - "multi_commit_or_uncertain_scope"
  - "protected_surface_requires_isolation"
direct_main_eligibility_predicates:
  - "clean_current_main"
