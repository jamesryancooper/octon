        replan_behavior: "none"
  closeout_policy:
    required_child_terminal_outcomes:
      - "archived"
      - "rejected"
    terminal_child_receipt_requirements:
      - outcome_id: "archived"
        required_receipts:
          - "implementation-run"
          - "implementation-conformance"
          - "post-implementation-drift"
          - "proposal-closeout"
        required_receipt_field_equals:
          - receipt_id: "implementation-run"
            field: "verdict"
            value: "pass"
          - receipt_id: "implementation-conformance"
            field: "verdict"
            value: "pass"
          - receipt_id: "post-implementation-drift"
            field: "verdict"
            value: "pass"
          - receipt_id: "proposal-closeout"
            field: "verdict"
            value: "pass"
          - receipt_id: "proposal-closeout"
            field: "archive_authorized"
            value: "yes"
      - outcome_id: "rejected"
        required_receipts:
          - "proposal-review"
        required_receipt_field_equals:
          - receipt_id: "proposal-review"
            field: "verdict"
            value: "rejected"
    require_child_receipts_fresh: true
    require_aggregate_evidence: true
    aggregate_terminal_blocker_evidence:
      path: ".octon/state/evidence/runs/workflows/<program-run-id>/aggregate-terminal-blockers.yml"
      schema_ref: ".octon/framework/engine/runtime/spec/program-aggregate-terminal-blockers-v1.schema.json"
      required_when: "required child is blocked from satisfying the active program closeout policy"
      authority_boundary: "parent evidence summarizes only; child manifests, receipts, validation verdicts, promotion evidence, archive metadata, closeout authorization, and lifecycle outcomes remain child-owned"
    enforce_authority_boundaries: true
  authority_boundaries:
    parent_coordinates_only: true
    child_receipts_remain_child_owned: true
    child_promotion_targets_remain_child_owned: true

lifecycle_interactions:
  emitted_profiles:
    - profile_id: "program-child-batch-handoff"
      interaction_kind: "follow_on_work_required"
      receipt_schema: "lifecycle-interaction-request-v1"
      requested_capabilities:
        - "change-closeout"
        - "closeout-worktree"
      requested_lifecycle_ids:
        - "change-closeout"
        - "closeout-worktree"
      requested_route_surfaces:
        - "closeout-change"
        - "closeout-worktree"
      requested_atomic_unit_types:
        - "change"
        - "worktree"
      requested_target_outcomes:
        - "cleaned"
        - "preserved"
        - "blocked"
      evidence_acceptance_classes:
        - "advisory-context"
        - "validation-evidence"
        - "review-evidence"
        - "rollback-context"
        - "non-authority-only"
      forbidden_transfer:
        - "git-ref-mutation"
        - "hosted-provider-authorization"
        - "branch-cleanup-authorization"
        - "worktree-cleanup-authorization"
        - "repo-hygiene-deletion"
        - "archive-authorization"
        - "promotion-authorization"
        - "scope-expansion"
      return_schema: "lifecycle-interaction-return-v1"
      expected_return_evidence:
        - "change-receipt-v1"
        - "closeout-worktree-report-v1"
      required_closeout_worktree_report_fields:
        - "proposal_program_handoff_authorization.child_id"
        - "proposal_program_handoff_authorization.route_id"
        - "proposal_program_handoff_authorization.classifier_output_ref"
        - "proposal_program_handoff_authorization.classifier_output_digest"
        - "proposal_program_handoff_authorization.authorized_foreign_fingerprint"
        - "proposal_program_handoff_authorization.authorized_paths"
        - "proposal_program_handoff_authorization.non_mutating"
        - "proposal_program_handoff_authorization.preserve_and_exclude_from_child_closeout_blocking"
        - "proposal_program_handoff_authorization.parent_summary_not_child_closeout_receipt"
        - "proposal_program_handoff_authorization.child_closeout_authority_preserved"
        - "proposal_program_handoff_authorization.forbidden_actions"
      target_gate_policy: "target-owned-independent-validation"
      non_authorizing: true
  accepted_profiles:
    - profile_id: "program-handoff-return"
      interaction_kind: "follow_on_work_required"
      receipt_schema: "lifecycle-interaction-return-v1"
      evidence_acceptance_classes:
        - "validation-evidence"
        - "review-evidence"
        - "rollback-context"
        - "non-authority-only"
      forbidden_transfer:
        - "git-ref-mutation"
        - "hosted-provider-authorization"
        - "branch-cleanup-authorization"
        - "worktree-cleanup-authorization"
        - "repo-hygiene-deletion"
        - "archive-authorization"
        - "promotion-authorization"
        - "scope-expansion"
      target_gate_policy: "target-owned-independent-validation"
      return_acceptance_rules:
        - "classifier_output_digest must match retained classifier_output_ref"
        - "authorized_foreign_fingerprint must match retained classifier output"
        - "authorized_paths must exactly match candidate boundaries.include_paths"
        - "foreign/manual retained disposition may unblock matching child hygiene preflight only; it does not satisfy child closeout receipt, child validation, archive authorization, or child lifecycle outcome gates"
        - "parent lifecycle residue disposition may unblock only parent closeout/archive gates when closeout-worktree-report-v1 is bound to program_run_id, parent_route_id, stable cleanup receipt digests, classifier ref/digest or fingerprint fallback, residue fingerprint, authorized path set, non-mutating flags, and disposition"
        - "no deletion, reset, staging, commit, push, publication, archive, branch cleanup, git ref mutation, or cleaned claim may be transferred from closeout-worktree to child closeout or parent closeout"
      non_authorizing: true

input_bindings:
  target:
    source: "lifecycle.target"
  program_packet_path:
