schema_version: "octon-extension-lifecycle-contract-v1"
lifecycle_id: "proposal-program"
owner_extension: "octon-proposal-lifecycle"
version: "1.0.0"
execution_strategy: "orchestrated-replan-loop"

# Program route inventory is resolved from this published lifecycle contract
# through the generated effective extension catalog. Skill files, prompt
# bundles, proposal-local receipts, and raw additive inputs are not scheduler
# route authority.
target:
  input: "program_packet_path"
  manifest_path: "proposal.yml"
  status_field: "status"
  allowed_statuses:
    - "draft"
    - "in-review"
    - "accepted"
    - "rejected"
    - "implemented"
    - "archived"

delivery_modes:
  - mode_id: "proposal-program-delivery"
    workflow_ref: ".octon/framework/orchestration/runtime/workflows/meta/proposal-program-delivery/workflow.yml"
    profile_schema_ref: ".octon/framework/product/contracts/proposal-program-delivery-profile-v1.schema.json"
    receipt_schema_ref: ".octon/framework/product/contracts/proposal-program-delivery-receipt-v1.schema.json"
    order_override_receipt_schema_ref: ".octon/framework/product/contracts/proposal-program-delivery-order-override-receipt-v1.schema.json"
    execution_order_policy:
      canonical_order_ref: "child-before-parent-delivery"
      non_canonical_order_requires_retained_override_receipt: true
      override_receipt_authorizes_delivery: false
    readiness_preflight:
      required_before_expensive_continuation: true
      retained_receipt_required: true
      checks:
        - "git write preflight"
        - "worktree cleanliness"
        - "source staleness"
        - "review freshness"
        - "child receipt compatibility"
        - "tooling availability"
        - "route legality"
        - "generated freshness"
    clean_worktree_route:
      dirty_or_stale_source_defaults_to_route_owned_clean_worktree: true
      include_path_classification_required_before_reconstruction_stage_commit: true
    stop_condition_taxonomy:
      - stop_id: "SC-001-authority-gap"
        machine_condition: "target-owned receipt missing for claimed transition"
        owning_route_or_validator: "target transition owner"
        blocked_outcome: "blocked:authority-gap"
      - stop_id: "SC-002-ownership-conflict"
        machine_condition: "multiple routes claim the same mutation or evidence authority"
        owning_route_or_validator: "lifecycle runner and proposal review"
        blocked_outcome: "blocked:ownership-conflict"
      - stop_id: "SC-003-unsafe-mutation"
        machine_condition: "git write preflight failed or dirty/stale source lacks include-path classification"
        owning_route_or_validator: "delivery-readiness-preflight and closeout-worktree"
        blocked_outcome: "blocked:unsafe-mutation"
      - stop_id: "SC-004-approval-required"
        machine_condition: "required approval, exception, landing, hosted, or branch authorization is missing"
        owning_route_or_validator: "closeout-change or authority engine"
        blocked_outcome: "blocked:approval-required"
      - stop_id: "SC-005-stale-evidence"
        machine_condition: "stored digest, event head, review digest, or receipt freshness mismatches current source"
        owning_route_or_validator: "proposal review gate or targeted freshness validator"
        blocked_outcome: "blocked:stale-evidence"
      - stop_id: "SC-006-generated-freshness-drift"
        machine_condition: "generated effective or publication output is stale or direct-edited"
        owning_route_or_validator: "owning publisher and freshness validators"
        blocked_outcome: "blocked:generated-freshness-drift"
      - stop_id: "SC-007-publishable-evidence-gap"
        machine_condition: "hosted/shared closeout proof cites local/private-only evidence as authority"
        owning_route_or_validator: "evidence disclosure and terminal proof validators"
        blocked_outcome: "blocked:publishable-evidence-gap"
      - stop_id: "SC-008-validation-failure"
        machine_condition: "required validator exits nonzero"
        owning_route_or_validator: "validator owner"
        blocked_outcome: "blocked:validation-failure"
      - stop_id: "SC-009-parent-summary-substitution"
        machine_condition: "parent summary, delivery receipt, readiness projection, or evidence index is used as child-owned evidence"
        owning_route_or_validator: "child receipt validator and delivery receipt validator"
        blocked_outcome: "blocked:parent-summary-substitution"
      - stop_id: "SC-010-cleaned-proof-gap"
        machine_condition: "cleaned requested but terminal proof, final sync, branch cleanup, or worktree hygiene is missing or stale"
        owning_route_or_validator: "terminal proof and closeout validators"
        blocked_outcome: "blocked:cleaned-proof-gap"
    entrypoints:
      - "/proposal-program-delivery"
      - "proposal-program-delivery"
    supported_outcomes:
      - "implemented"
      - "archive-ready"
      - "landed"
      - "synced"
      - "cleaned"
    authority_boundary:
      aggregate_receipt_only: true
      child_receipts_remain_child_owned: true
      parent_summary_satisfies_child_receipts: false
      owns_archive_relocation: false
      owns_git_mutation: false
      owns_branch_cleanup: false
      owns_residue_deletion: false
      owns_generated_publication_refresh: false
    required_handoffs:
      packet_closeout_owner: "proposal-packet-terminal-closeout"
      archive_owner: "archive-proposal"
      change_closeout_owner: "closeout-change-or-closeout-worktree"
      repo_hygiene_owner: "repo-hygiene-cleanup"
      generated_publication_owner: "owning-publisher-scripts"
      lifecycle_postmortem_owner: "lifecycle-postmortem"

postmortem_profiles:
  - profile_id: "proposal-program-delivery-evaluation"
    emitted_by: "octon lifecycle postmortem --run-id <completed-proposal-program-run-id>"
    evidence_map_field: "proposal_program_delivery_profile"
    profile_schema_version: "lifecycle-postmortem-proposal-program-delivery-profile-v1"
    applies_to_lifecycle_kind: "proposal-program"
    authority_boundary:
      profile_output_authority: false
      child_receipts_remain_child_owned: true
      parent_summary_satisfies_child_receipts: false
      generated_outputs_authority: "derived-only"
      authorizes_lifecycle_transition: false
      authorizes_child_receipt_replacement: false
      authorizes_closeout: false
      authorizes_archive: false
      authorizes_delivery: false
      authorizes_git_mutation: false
      authorizes_cleanup: false
      authorizes_cleaned_claim: false
    required_sections:
      - "evidence_binding"
      - "blocker_taxonomy"
      - "autonomy_analysis"
      - "efficiency_diagnostics"
      - "delivery_proof_chain_audit"
      - "recommendation_backlog"
      - "regression_test_plan"
      - "proposed_next_governed_routes"
    delivery_absence_behavior: "emit evidence-backed not_applicable audit records; never fabricate delivery proof"
    validator_ref: ".octon/framework/assurance/runtime/_ops/scripts/validate-lifecycle-postmortem.sh"

program:
  child_registry_path: "resources/child-packet-index.yml"
  child_lifecycle_id_default: "proposal-packet"
  supported_execution_modes:
    - "sequential"
    - "parallel-independent"
    - "gated-parallel"
    - "approval-gated"
    - "program-atomic"
  # Legacy registry/manifests may spell `gated-parallel` as
  # `sequenced-gated`. That spelling is an input alias only: validators and
  # planner code normalize it to `gated-parallel`, keep supported modes
  # canonical, and fail closed when parent `program_execution_mode` disagrees
  # with `resources/child-packet-index.yml#execution_mode` after normalization.
  # Scheduler contract: runnable child batches are ordered by declared child
  # dependencies, then by registry order for peers. `max_child_concurrency`
  # limits simultaneous executors inside the selected batch without creating
  # extra replan steps.
  planner_state:
    evidence_root: ".octon/state/evidence/runs/workflows/<program-run-id>/"
    compact_artifacts:
      planner_state: "planner-state.yml"
      program_context_capsule: "program-context-capsule.yml"
      compact_completion_capsule: "compact-completion-capsule.yml"
      blocker_ledger: "blocker-ledger.yml"
      recovery_delta_summary: "recovery-delta-summary.yml"
      route_decision_receipt: "route-decision-receipt.yml"
      model_routing_receipt: "model-routing-receipt.yml"
      action_slice_ledger: "action-slice-ledger.yml"
    default_reader_preference:
      - "read planner-state.yml, program-context-capsule.yml, and blocker-ledger.yml before full program-plan.yml"
      - "read route-decision-receipt.yml, model-routing-receipt.yml, and action-slice-ledger.yml before dispatch or recovery prompt expansion"
      - "read recovery-delta-summary.yml, blocker-ledger.yml, failing-slice-manifest.yml, and raw-log-summary.yml before stale receipt/archive history"
      - "read compact-completion-capsule.yml only for no-dispatch terminal parent runs"
      - "treat program-plan.yml as handle-only-by-default retained audit evidence"
    model_route: "deterministic-first; high-on-escalation-only"
    token_ceiling: 3000
    token_ceilings:
      final_completion: 8000
      child_dispatch_base: 12000
      architecture_exception: 40000
    compactness_requirements:
      repeated_failure_grouping_key:
        - "blocker_class"
        - "child_id_when_present"
        - "route_id"
        - "target_digest"
        - "receipt_digest"
        - "write_scope_digest"
        - "stable_digest_boundary"
        - "recovery_owner"
        - "disposition"
      targeted_refresh_diagnostic_fields:
        - "failing_path"
        - "accepted_value"
        - "stale_cause"
        - "recovery_class"
        - "minimal_repair_hint"
        - "last_mutation_class"
        - "owning_refresh_route"
        - "stable_digest_boundary"
      completed_plan_nonblocking_diagnostic_fields:
        - "path"
        - "stored_digest"
        - "current_digest"
        - "ignored_reason"
      direct_child_receipt_refs: "path-plus-digest; never parent prose"
      retry_summary_posture: "bounded deltas before raw receipt/archive history"
    action_slices:
      - "load_program_spine"
      - "evaluate_dependency_vector"
      - "select_runnable_children"
      - "dispatch_child_or_no_dispatch"
      - "summarize_terminal_blockers"
      - "validate_completion"
      - "emit_closeout_capsule"
    deterministic_preflights:
      - "freshness-readiness-projection"
      - "publication-freshness"
      - "generated-freshness"
      - "blocker-aggregation-zero-state"
      - "dependency-vector"
      - "manifest-completeness"
      - "registry-projection"
      - "raw-log-indexing"
      - "closeout-schema-validation"
      - "worktree-cleanliness"
      - "worktree-baseline-isolation"
    escalation_triggers:
      - "authority ambiguity"
      - "architecture decision"
      - "rollback conflict"
      - "support-proof interpretation"
      - "promotion evidence conflict"
      - "archive/recovery failure"
      - "unexplained test failure"
    source_ref_requirements:
      - "freshness-readiness-projection.yml"
      - "program-lifecycle-checkpoint.yml"
      - "program-events.ndjson"
      - "resources/child-packet-index.yml"
      - "program-plan.yml"
      - "scheduler-decision.yml"
      - "run-inputs.yml"
      - "summary.md"
      - "recovery-log.yml"
      - "token-budget-ledger.json"
      - "raw-log-summary.yml"
      - "failing-slice-manifest.yml"
      - "blocker-ledger.yml"
      - "recovery-delta-summary.yml"
      - "route-decision-receipt.yml"
      - "model-routing-receipt.yml"
      - "action-slice-ledger.yml"
    validation_binding:
      checkpoint_event_head: "required"
      event_log_sha256: "required"
      child_registry_digest: "required"
      source_ref_sha256: "required"
      model_visible_context_sha256: "required"
      child_terminal_evidence_summary:
        schema_ref: ".octon/framework/product/contracts/proposal-child-terminal-evidence-summary-v1.schema.json"
        emitted_at: "program-plan.yml#child_states.<child_id>.terminal_evidence_summary"
        source_ref_sha256: "required-for-present-child-owned-evidence"
        stale_behavior: "fail-closed"
        parent_summary_satisfies_child_receipts: false
        retained_evidence_authorizes_execution: false
        non_authority_classification: "diagnostic-evidence-summary-only"
      targeted_proposal_freshness:
        validator_ref: ".octon/framework/assurance/runtime/_ops/scripts/validate-proposal-lifecycle-terminal-freshness.sh --targeted"
        source_ref_sha256: "required-for-selected-proposal-and-dependency-refs"
        generated_artifact_dependency_metadata: "must-match-proposal-manifest-dependencies"
        child_file_inputs: "scoped-child-file-refs-are-validated-when-provided"
        generated_outputs_authorize_execution: false
        generated_registry_replaces_manifest: false
        parent_summary_satisfies_child_receipts: false
        final_full_registry_gate_required: true
    fail_closed_on:
      - "source-missing"
      - "source-digest-mismatch"
      - "stale-event-head"
      - "child-registry-digest-mismatch"
      - "authority-boundary-conflict"
      - "child-terminal-evidence-summary-source-missing"
      - "child-terminal-evidence-summary-source-digest-mismatch"
      - "parent-summary-substitutes-for-child-terminal-evidence"
      - "targeted-proposal-dependency-source-missing"
      - "targeted-proposal-dependency-source-digest-mismatch"
      - "targeted-proposal-generated-metadata-drift"
      - "targeted-proposal-parent-summary-substitution"
      - "blocker-fingerprint-drift-without-recorded-delta"
      - "recovery-loop-repeats-without-progress"
      - "high-route-without-escalation-trigger"
      - "token-ceiling-exceeded-without-stage-only-route"
    authority_boundary:
      replaces_source_evidence: false
      authorizes_execution: false
      freshness_readiness_projection_authorizes_dispatch: false
      freshness_readiness_projection_satisfies_child_gates: false
      freshness_readiness_projection_authorizes_closeout: false
      freshness_readiness_projection_authorizes_archive: false
      generated_output_authority: "derived-only"
      raw_evidence_retained: true
  clean_delivery_continuation:
    mode_id: "clean-delivery-continuation"
    declared_posture: "orchestrated-replan-loop"
    continuation_mode_field: "route-decision-receipt.yml#route_selection_inputs.continuation_mode"
    selected_outcome_field: "route-decision-receipt.yml#delivery_handoff.requested_target_outcome"
    route_selection_inputs:
      required_live_sources:
        - "parent proposal.yml"
        - "resources/child-packet-index.yml"
        - "child proposal manifests"
        - "child-owned support receipts"
        - "program lifecycle checkpoint"
        - "program event log"
        - "retained run evidence"
      exactly_one_route_owned_continuation_required: true
      child_routes_precede_parent_delivery: true
      no_prompt_fallback_when_unique_route_is_legal: true
      ambiguous_or_multiple_routes_stop_with_typed_blocker: true
    route_decision_evidence:
      receipt_ref: "route-decision-receipt.yml"
      required_fields:
        - "route_decision"
        - "selected_route_owner"
        - "route_selection_inputs"
        - "blocked_alternatives"
        - "retry_fingerprint_inputs"
        - "resume_source_refs"
        - "delivery_handoff"
      source_refs_required: true
      source_digests_required: true
      model_visible_context_sha256_required: true
      generated_outputs_authorize_route_selection: false
      parent_summary_satisfies_child_receipts: false
    retry_fingerprint_fields:
      - "blocker_class"
      - "child_id_when_present"
      - "route_id"
      - "target_digest"
      - "receipt_digest"
      - "write_scope_digest"
      - "stable_digest_boundary"
      - "recovery_owner"
    resume_source_refs:
      checkpoint_event_head: "required"
      event_log_sha256: "required"
      child_registry_digest: "required"
      source_ref_sha256: "required"
      model_visible_context_sha256: "required"
      unsafe_resume_behavior: "fail-closed"
    delivery_handoff:
      target_outcome_cleaned_is_request_only: true
      owner: "proposal-program-delivery"
      runner_owns_landing: false
      runner_owns_sync: false
      runner_owns_cleanup: false
      runner_owns_branch_cleanup: false
      runner_owns_terminal_proof: false
      runner_owns_cleaned_claim: false
      required_before_handoff_ready:
        - "parent review fresh"
        - "child readiness pass"
        - "child receipts fresh"
        - "parent receipts fresh"
        - "generated freshness pass"
        - "delivery-readiness preflight pass"
        - "route-decision receipt source refs verify"
      stop_before_delivery_mutation_when_missing:
        - "Change closeout"
        - "branch cleanup authorization"
        - "cleanup authorization"
        - "terminal proof"
        - "owning-route evidence"
  atomic_policy:
    eligibility: "explicit-route-opt-in"
    require_declared_write_scopes: true
  recovery_policy:
    blocker_taxonomy:
      schema_version: "octon-proposal-program-blocker-taxonomy-v1"
      authority_guards:
        child_receipts_remain_child_owned: true
        parent_summary_satisfies_child_receipt: false
        proposal_inputs_authorize_recovery: false
        generated_outputs_authorize_recovery: false
        hard_blockers_fail_closed: true
      classes:
        - class_id: "routine-autonomous"
          runner_posture: "continue-without-operator-escalation"
          escalation_required: false
          examples:
            - blocker_class: "stale-receipt"
              recovery: "rerun the selected child route after receipt freshness validation"
            - blocker_class: "missing-evidence"
              recovery: "rerun the selected child route when child-owned evidence can be regenerated"
            - blocker_class: "executor-failed"
              recovery: "retry the child route within budget after live-state replanning"
            - blocker_class: "executor-timed-out"
              recovery: "retry the child route within budget after live-state replanning"
            - blocker_class: "validation-failed"
              recovery: "route to correction prompt generation when declared write scope remains contained"
            - blocker_class: "invalid-child-registry"
              recovery: "route to correction prompt generation for registry-local repair"
        - class_id: "soft-blocker"
          runner_posture: "bounded-retry-delegation-cleanup-or-rebaseline"
          escalation_required: false
          examples:
            - blocker_class: "publication-drift"
              recovery: "refresh generated projections while preserving generated-output non-authority"
            - blocker_class: "target-drift-explained"
              recovery: "rebaseline from current child-owned drift evidence"
            - blocker_class: "noncritical-artifact-cleanup"
              recovery: "clean current-run generated residue after ownership evidence"
            - blocker_class: "lifecycle-residue-cleanup-needed"
              recovery: "delegate bounded lifecycle residue cleanup and replan"
            - blocker_class: "executor-preflight-blocked"
              recovery: "retry after local executor preflight evidence changes"
            - blocker_class: "step-budget-exhausted-continuable"
              recovery: "continue from checkpoint in a later bounded step"
            - blocker_class: "recovery-budget-override-required"
              recovery: "use only an explicitly declared safe route or run-bound rebaseline action"
            - blocker_class: "recovery-integrity-risk"
              recovery: "rebaseline from run-bound recovery evidence before retry"
        - class_id: "hard-blocker"
          runner_posture: "fail-closed-until-typed-human-exception-or-packet-revision"
          escalation_required: true
          default_for_unknown_blocker_class: true
          examples:
            - blocker_class: "authority-ambiguity"
              recovery: "operator escalation for unclear ownership, external approval, or human-only boundary"
            - blocker_class: "authority-boundary-ambiguous"
              recovery: "fail closed because runtime cannot prove the authority boundary"
            - blocker_class: "unsafe-resume"
              recovery: "fail closed because resume safety is not machine-provable"
            - blocker_class: "scope-expansion"
              recovery: "operator escalation or packet revision before any widened mutation"
            - blocker_class: "authority-zone-ambiguous"
              recovery: "fail closed because authority zone classification is ambiguous"
            - blocker_class: "self-authorization-attempt"
              recovery: "fail closed because the runtime attempted to authorize itself"
            - blocker_class: "unsupported-mode-authority"
              recovery: "fail closed because execution semantics or rollback guarantees are unsupported"
            - blocker_class: "atomic-write-scope-conflict"
              recovery: "fail closed for conflicting atomic write scopes without a safe route"
            - blocker_class: "critical-artifact-cleanup-required"
              recovery: "operator escalation before destructive or authority-sensitive cleanup"
            - blocker_class: "artifact-ownership-unclear"
              recovery: "emit a non-authorizing closeout-worktree lifecycle interaction request with classifier evidence before any cleanup, mutation, archive, or child closeout authority is claimed"
            - blocker_class: "worktree-hygiene-blocked"
              recovery: "emit a non-authorizing closeout-worktree lifecycle interaction request bound to the current child route, classifier/report digest, foreign fingerprint or exact path set, and forbidden-transfer boundary"
            - blocker_class: "parent-worktree-disposition-required"
              recovery: "await closeout-worktree-report-v1 parent disposition evidence bound only to stable cleanup, classifier, residue, path-set, and non-mutating authority fields"
            - blocker_class: "worktree-handoff-evidence-changed"
              recovery: "emit or await one fresh non-authorizing closeout-worktree lifecycle interaction return bound to the changed child classifier fingerprint"
            - blocker_class: "stale-closeout-worktree-return"
              recovery: "emit or await one fresh non-authorizing closeout-worktree lifecycle interaction return matching the current child route and classifier evidence"
            - blocker_class: "aggregate-closeout-readiness-missing"
              recovery: "operator escalation when parent evidence would substitute for missing child-owned receipts"
            - blocker_class: "protected-artifact-authority-ambiguity"
              recovery: "operator escalation before protected artifact mutation"
    max_recovery_attempts: 2
    serialize_write_scope_conflicts: true
    autonomous_recovery_envelope:
      envelope_id: "autonomous-proposal-program-recovery-envelope"
      posture: "bounded-low-risk-until-material-side-effect"
      allowed_route_families:
        - "generated-projection-refresh"
        - "review-refresh"
        - "lifecycle-residue-classification"
        - "evidence-index-materialization"
        - "diagnostics"
        - "current-run-rebaseline"
      allowed_recovery_actions:
        - "refresh-publication-projections"
        - "cleanup-current-run-artifacts"
        - "rebaseline-checkpoint"
      material_side_effect_stop_points:
        - "archive"
        - "push"
        - "landing"
        - "cleanup-deletion"
        - "branch-deletion"
        - "pr-creation-or-merge"
        - "external-publication"
        - "cleaned-claim"
      route_selection_rule: >-
        Recovery recipes may run unattended only when their route/action remains
        inside the low-risk envelope and carries authority-zone evidence plus
        post-attempt validation for the failed gate and surrounding gate set.
        Recipes that point at material side-effect routes are typed blockers,
        not autonomous dispatch authority.
      cleanup_residue_rule: >-
        cleanup-lifecycle-residue is autonomous only for non-mutating
        classification, evidence materialization, and retained disposition
        binding. Deletion, cleaned claims, branch cleanup, archive, push,
        staging, commit, merge, or external publication require a separate
        route with retained authority.
      non_transfer_boundaries:
        - "parent summaries cannot replace child-owned receipts"
        - "generated outputs remain derived-only"
        - "closeout-worktree returns cannot transfer archive authorization"
        - "closeout-worktree returns cannot transfer cleanup authorization"
        - "closeout-worktree returns cannot transfer child validation"
        - "closeout-worktree returns cannot transfer delivery, landing, branch cleanup, or lifecycle outcome authority"
    handlers:
      stale-receipt:
        max_attempts: 2
        replan_after_attempt: true
      target-drift-explained:
        max_attempts: 1
        replan_after_attempt: true
      recovery-integrity-risk:
        max_attempts: 1
        replan_after_attempt: true
        human_required: false
      validation-failed:
        recovery_route_id: "generate-program-correction-prompt"
        max_attempts: 1
        replan_after_attempt: true
        human_required: false
      invalid-child-registry:
        recovery_route_id: "generate-program-correction-prompt"
        max_attempts: 1
        replan_after_attempt: true
        human_required: false
      publication-drift:
        max_attempts: 1
        replan_after_attempt: true
      missing-evidence:
        max_attempts: 2
        replan_after_attempt: true
      executor-failed:
        max_attempts: 2
        replan_after_attempt: true
      executor-timed-out:
        max_attempts: 2
        replan_after_attempt: true
      executor-preflight-blocked:
        max_attempts: 1
        replan_after_attempt: false
        human_required: false
      unsupported-mode-config:
        max_attempts: 0
        human_required: true
      noncritical-artifact-cleanup:
        max_attempts: 1
        replan_after_attempt: true
      lifecycle-residue-cleanup-needed:
        recovery_route_id: "cleanup-lifecycle-residue"
        max_attempts: 1
        replan_after_attempt: true
        human_required: false
      authority-ambiguity:
        max_attempts: 0
        human_required: true
      artifact-ownership-unclear:
        max_attempts: 1
